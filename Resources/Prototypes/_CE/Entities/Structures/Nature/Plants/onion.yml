- type: entity
  id: CEPlantOnion
  parent: CEGatherablePlantSingleHarvestBase
  name: onion
  description: He's so cute it brings tears to my eyes to cut him up.
  components:
  - type: CEPlant
    updateFrequency: 1
  - type: CEPlantVisuals
    growthSteps: 5
    readyVariations: 2
  - type: Sprite
    layers:
    - state: liq-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      sprite: _CE/Structures/Nature/Farm/onion.rsi
      map: ["enum.PlantVisualLayers.Base"]
