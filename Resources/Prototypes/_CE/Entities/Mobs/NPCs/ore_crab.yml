#MARK: Ore spider attack

# Two jaws: they slowly open in front of the spider (telegraphy), then snap shut in the center. No lunge.
- type: entityEffectAnimation
  id: OreSpiderClaws
  movementSpeed: 0.5
  duration: 1.7
  lockRotation: true
  events:
    0:
    - !type:UsedEntityAnimation
      dummyEntity: CEOreSpiderClawEffect
      offsetAnimation:
      - time: 0.0
        offset: -0.3, -0.6
      - time: 0.7
        offset: -0.8, -0.4
        easing: QuadOut
      - time: 0.8
        offset: -0.15, -0.8
        easing: QuadIn
      - time: 1.1
        offset: -0.15, -0.8

      rotationAnimation:
      - time: 0.0
        rotation: -20
      - time: 0.7
        rotation: -70
        easing: QuadOut
      - time: 0.8
        rotation: -10
        easing: QuadIn
      - time: 1.1
        rotation: -10

      colorAnimation:
      - time: 0.0
        color: "#ffffff"
      - time: 0.9
        color: "#ffffff"
      - time: 1.1
        color: "#ffffff00"  # Fade out
        easing: QuadOut

      scaleAnimation:
      - time: 0.0
        scale: 1, 1
    - !type:UsedEntityAnimation
      dummyEntity: CEOreSpiderClawEffect
      offsetAnimation:
      - time: 0.0
        offset: 0.3, -0.6
      - time: 0.7
        offset: 0.8, -0.4
        easing: QuadOut
      - time: 0.8
        offset: 0.15, -0.8
        easing: QuadIn
      - time: 1.1
        offset: 0.15, -0.8

      rotationAnimation:
      - time: 0.0
        rotation: 20
      - time: 0.7
        rotation: 70
        easing: QuadOut
      - time: 0.8
        rotation: 10
        easing: QuadIn
      - time: 1.1
        rotation: 10

      colorAnimation:
      - time: 0.0
        color: "#ffffff"
      - time: 0.9
        color: "#ffffff"
      - time: 1.1
        color: "#ffffff00"  # Fade out
        easing: QuadOut

      scaleAnimation:
      - time: 0.0
        scale: -1, 1
    0.8:
    - !type:WeaponEffectSlot
      slot: OnHit

- type: entity
  id: CEOreSpiderClawEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CE/Effects/arcs.rsi
    state: ore_spider
    drawdepth: Effects

#MARK: Ore spider lunge

- type: entity
  id: CEActionOreSpiderLunge
  name: Ore spider lunge
  description: Lunge at the target, knocking it down and throwing it back.
  categories: [ HideSpawnMenu ]
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeWideLineAction
    width: 0.5
  - type: Action
    itemIconStyle: BigAction
    useDelay: 30
  - type: Sprite
    sprite: _CE/Mobs/orecrabspider.rsi
    layers:
    - state: base
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 2
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:CEEntityTargetActionAnimationEvent
      animation: OreSpiderLunge

# Crouches, then dashes at the target and knocks down whatever is in front of it.
- type: entityEffectAnimation
  id: OreSpiderLunge
  lockRotation: true
  movementSpeed: 0
  duration: 1.2
  events:
    0:
    - !type:PlaySound
      sound:
        path: /Audio/Items/unsheath.ogg
        params:
          variation: 0.1
          pitch: 0.5
    - !type:UserAnimation
      scaleAnimation:
      - time: 0
        scale: 1, 1
      - time: 0.4
        scale: 1.15, 0.85
      - time: 0.5
        scale: 0.9, 1.1
      - time: 0.7
        scale: 1, 1
    0.8:
    - !type:Dash
      distance: 2.5
      speed: 8
      ignoreFriction: true
    - !type:PlaySound
      positional: true
      sound:
        path: /Audio/_CE/Effects/Weapon/slash.ogg
        params:
          variation: 0.1
          pitch: 0.5
    1:
    - !type:WeaponArcAttack
      arcWidth: 190
      rangeMultiplier: 2
      effects:
      - !type:PlaySound
        positional: true
        sound:
          path: /Audio/Magic/rumble.ogg
          params:
            variation: 0.1
      - !type:SpawnEntity
        effectTarget: Target
        spawns:
        - CEDustTileEffect
      - !type:Knockdown
        dropItems: true
        duration: 2
      - !type:ThrowFrom
        distance: 1.5
        effectTarget: Target
        origin: User
        throwPower: 3
