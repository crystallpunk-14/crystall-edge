- type: entity
  parent: BaseItem
  id: CECrowbar
  categories: [ ForkFiltered ]
  name: crowbar
  description: A sturdy iron crowbar, useful for prying things open.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: CEWeapon
    range: 0.4
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 8
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 8
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
      Secondary:
      - anim: DaggerAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 20
  - type: CERotationForAnimation
    rotation: 90
  - type: Tool
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      CEIron: 7
  - type: Prying
  - type: Sprite
    sprite: _CE/Objects/Tools/crowbar.rsi
    state: icon
  - type: Clothing
    sprite: _CE/Objects/Tools/crowbar.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Item
    sprite: _CE/Objects/Tools/crowbar.rsi
    storedRotation: -90
    size: Normal
    shape:
    - 0,0,0,1
  - type: CEMagicEssenceStructure
    essences:
      Metal: { min: 1, max: 3 }
      Tool: { min: 0, max: 2 }
