- type: entity
  abstract: true
  parent: BaseSignWeak
  id: PosterBase
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/posters.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PosterBroken:
            min: 1
            max: 1
        offset: 0
  - type: Construction
    graph: PosterGraph
    node: start

- type: entity
  parent: BaseSignWeak
  id: PosterBroken
  name: broken poster
  description: "You can't make out anything from the poster's original print. It's ruined."
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Wallmounts/posters.rsi
    state: poster_broken
  - type: Construction
    graph: PosterGraph
    node: tornPoster

- type: entity
  parent: PosterBase
  id: PosterContrabandSyndicateRecruitment
  name: "Syndicate Recruitment"
  description: "See the galaxy! Shatter corrupt megacorporations! Join today!"
  components:
  - type: Sprite
    state: poster5_contraband

- type: entity
  parent: PosterBase
  id: PosterContrabandEnlistGorlex
  name: "Enlist"
  description: "Enlist with the Gorlex Marauders today! See the galaxy, kill corpos, get paid!"
  components:
    - type: Sprite
      state: poster60_contraband
