- type: constructionGraph
  id: CEConveyorStairs
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CEConveyorStairs
          steps:
            - material: CEIronSheet
              amount: 1
              doAfter: 1
            - material: CEBrassRod
              amount: 1
              doAfter: 1

    - node: CEConveyorStairs
      entity: CEConveyorStairs
      edges:
        - to: start
          steps:
            - tool: Prying
              doAfter: 1
          completed:
            - !type:SpawnPrototype
              prototype: CEIronSheet1
              amount: 1
            - !type:SpawnPrototype
              prototype: CEBrassRod1
              amount: 1
        - to: CEConveyorStairsReverse
          steps:
            - tool: Screwing
              doAfter: 1

    - node: CEConveyorStairsReverse
      entity: CEConveyorStairsReverse
      edges:
        - to: start
          steps:
            - tool: Prying
              doAfter: 1
          completed:
            - !type:SpawnPrototype
              prototype: CEIronSheet1
              amount: 1
            - !type:SpawnPrototype
              prototype: CEBrassRod1
              amount: 1
        - to: CEConveyorStairs
          steps:
            - tool: Screwing
              doAfter: 1
