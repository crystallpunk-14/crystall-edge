- type: skill
  id: RestorationRitual
  icon:
    sprite: _CE/Objects/Specific/MainQuest/light_shards.rsi
    state: shard4
  effect: !type:AddAction
    action: CEActionRestorationRitual

- type: entity
  id: CEActionRestorationRitual
  name: Restoration Ritual of the Lucson Sphere
  description: Begin the ritual on the cracked Lucson Sphere once every lightheart shard lies on the ritual pedestals. The exposed core must survive until the ritual ends.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _CE/Objects/Specific/MainQuest/light_shards.rsi
    layers:
    - state: shard4
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 2
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - CEMurkLusconSphere
    event: !type:CEEntityTargetActionAnimationEvent
      animation: CEAnimationRestorationRitual
  - type: CERestorationRitualAction

# TODO: proper ritual casting visuals
- type: entityEffectAnimation
  id: CEAnimationRestorationRitual
  movementSpeed: 0
  duration: 5
  events:
    0:
    - !type:PlaySound
      sound:
        path: /Audio/Magic/rumble.ogg
    4.9:
    - !type:StartRestorationRitual
