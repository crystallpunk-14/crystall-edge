- type: skill
  id: FeatherFall
  parent: SpellcastingSkillBase
  icon:
    sprite: _CE/Actions/Spells/feather_fall.rsi
    state: icon
  effect: !type:AddAction
    action: CEActionSpellFeatherFall

- type: entity
  id: CEActionSpellFeatherFall
  name: Feather Fall
  description: You call forth a gentle updraft that greatly weakens gravity for everyone in the area, letting them fall slowly and safely.
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeAoEZoneAction
    radius: 2.5
  - type: CEActionManaCost
    manaCost: 20
  - type: CEActionEssenceCost
    essenceCost:
      Air: 2
      Flight: 1
  - type: CEActionStaminaCost
    cost: 15
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
  - type: Sprite
    sprite: _CE/Actions/Spells/feather_fall.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 5
  - type: WorldTargetAction
    event: !type:CEWorldTargetActionAnimationEvent
      animation: AnimationFeatherFall

- type: entityEffectAnimation
  id: AnimationFeatherFall
  movementSpeed: 0.5
  duration: 0.5
  events:
    0:
    - !type:SayChat
      sentence: "Cadant leviter"
    0.45:
    - !type:AreaEffect
      affectCaster: true
      range: 2.5
      whitelist:
        components:
        - CEZPhysics
      effects:
      - !type:ApplyStatusEffect
        statusEffect: CEStatusEffectFeatherFall
        duration: 10

- type: entity
  parent: StatusEffectBase
  id: CEStatusEffectFeatherFall
  name: feather fall
  components:
  - type: Sprite
    noRot: true
    sprite: _CE/Effects/wind.rsi
    layers:
    - state: wind
      unshaded: true
      color: "#c9f2ff"
    drawdepth: Mobs
  - type: StatusEffect
    whitelist:
      components:
      - CEZPhysics
  - type: CEGravityMultiplierStatusEffect
    multiplier: 0.15
  - type: StatusEffectAlert
    alert: CEFeatherFall

- type: alert
  id: CEFeatherFall
  icons:
  - sprite: /Textures/_CE/Actions/Spells/feather_fall.rsi
    state: icon
  name: ce-alerts-featherfall-name
  description: ce-alerts-featherfall-desc
