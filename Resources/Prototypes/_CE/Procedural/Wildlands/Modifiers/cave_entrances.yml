# Cave entrances: medium holes through the floor, only above open floor of the level below and away from the city, on the surface and on the first cave level.

- type: entity
  id: CEWildlandsModifierCaveEntrances
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    effects:
    - !type:GenerationLayers
      minDepth: -1
      maxDepth: 0
      layers:
      - !type:TileNoiseDistanceLayer
        size: 280, 280
        mask:
        - !type:TileMask # needs a floor to cut through
          inverted: true
          tiles:
          - Space
        - !type:RadiusMask # no holes right next to the city
          inverted: true
          radius: 70
        - !type:NoEntityMask # nothing is left hanging over the hole
        - !type:BelowMask # the landing: a floor with no wall on it
          masks:
          - !type:TileMask
            inverted: true
            tiles:
            - Space
          - !type:WhitelistMask
            inverted: true
            whitelist:
              components:
              - Wall
        fill:
        - tile: Space
          threshold: 0.6
          noise:
            frequency: 0.035
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 2
            lacunarity: 2
            gain: 0.5
