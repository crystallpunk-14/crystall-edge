- type: constructionGraph
  id: CEMachineFurnace
  start: start
  graph:
    - node: start
      edges:
        - to: missingMetal
          conditions:
            - !type:EntityAnchored
          steps:
            - material: CEBrass
              amount: 2
              doAfter: 0.5

    - node: missingMetal
      entity: CEMachineFrameUnfinished
      actions:
        - !type:EmptyAllContainers
      edges:
        - to: machineFrame
          conditions:
            - !type:EntityAnchored
          steps:
            - material: CEIron #TODO - some parts insertion there
              amount: 1
              doAfter: 0.5
        - to: start
          completed:
            - !type:DeleteEntity
          steps:
            - tool: Screwing
              doAfter: 2

    - node: machineFrame
      entity: CEMachineFrame
      actions:
        - !type:AddContainer
          container: machine_parts
        - !type:AddContainer
          container: machine_board
        - !type:MachineFrameRegenerateProgress
      edges:
        - to: machine
          conditions:
            - !type:EntityAnchored
            - !type:MachineFrameComplete
              guideIconBoard:
                sprite: Objects/Misc/module.rsi
                state: id_mod
              guideIconParts:
                sprite: Objects/Misc/stock_parts.rsi
                state: scan_module
          steps:
            - tool: Screwing
              doAfter: 0.5

        - to: machineFrame
          conditions:
            - !type:EntityAnchored
            - !type:ContainerNotEmpty
              container: machine_board
          steps:
            - tool: Prying
              doAfter: 2
              completed:
                - !type:EmptyAllContainers
                - !type:MachineFrameRegenerateProgress

        - to: missingMetal
          conditions:
            - !type:EntityAnchored
            - !type:ContainerEmpty
              container: machine_board
          completed:
            - !type:SpawnPrototype
              prototype: CEBrassBar1
              amount: 1
          steps:
            - tool: Cutting
              doAfter: 0.5

    - node: machine
      entity: !type:BoardNodeEntity { container: machine_board }
      edges:
        - to: machineFrame
          completed:
            - !type:RaiseEvent
              event: !type:MachineDeconstructedEvent
              broadcast: false
          conditions:
            - !type:EntityAnchored
            - !type:WirePanel
          steps:
            - tool: Prying
              doAfter: 2
