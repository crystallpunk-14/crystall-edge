# Gold vein: a single rich patch of gold ore and gold cores in the walls around one self-placed point.

- type: entity
  id: CEWildlandsModifierGoldVein
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    points:
    - id: goldVein
      minDistance: 0
      area: !type:RingArea
        minRadius: 50
        maxRadius: 110
    effects:
    - !type:GenerationLayers
      layers:
      - !type:FillEntityLayer
        entity: CEWallStoneOreGold
        mask:
        - &goldVeinArea !type:RadiusMask
          point: goldVein
          radius: 25
          noiseAmplitude: 4
          noise:
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.1
            octaves: 2
        - !type:NoiseMask
          threshold: 0.35
          noise:
            seed: 531
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.08
            octaves: 3
        - !type:EntityMask
          entities:
          - CEWallStone
          - CEWallDirt
          - CEWallSnow
      - !type:FillEntityLayer
        entity: CEWallGoldCore
        mask:
        - *goldVeinArea
        - !type:NoiseMask
          threshold: 0.7
          noise:
            seed: 533
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.2
            octaves: 3
        - !type:EntityMask
          entities:
          - CEWallStone
          - CEWallDirt
          - CEWallSnow
