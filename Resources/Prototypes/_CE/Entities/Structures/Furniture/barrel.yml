- type: entity
  id: CEBaseBarrel
  parent:
  - BaseStructureDynamic
  #- CEBaseFlammable
  name: wooden barrel
  suffix: Empty
  description: The simplest design for storing liquids.
  categories: [ ForkFiltered ]
  placement:
    mode: PlaceFree
  components:
  - type: InteractionOutline
  - type: Appearance
  - type: Solution
    id: barrel
    solution:
      maxVol: 300
  - type: MixableSolution
    solution: barrel
  - type: RefillableSolution
    solution: barrel
  - type: DrawableSolution
    solution: barrel
  - type: DrainableSolution
    solution: barrel
  - type: ExaminableSolution
    solution: barrel
  - type: Edible
    edible: Drink
    destroyOnEmpty: false
    utensil: None
    solution: barrel
  - type: Openable
    sound:
      collection: bottleOpenSounds
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: CEWeatherRefillable
    solution: barrel
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {visible: false}
          False: {visible: true}
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Structures/Furniture/Barrels/barrel.rsi
    noRot: true
    layers:
      - state: barrel_open
      - state: liq1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
      - state: barrel
        map: ["enum.OpenableVisuals.Layer"]
  - type: Transform
    noRot: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 155
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: CEWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:SpillBehavior
        solution: barrel
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: SolutionContainerVisuals
    solutionName: barrel
    maxFillLevels: 5
    fillBaseName: liq
  - type: PhysicalComposition
    materialComposition:
      CEWood: 30

- type: entity
  id: CEBarrelWater
  parent: CEBaseBarrel
  suffix: Water
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 300

