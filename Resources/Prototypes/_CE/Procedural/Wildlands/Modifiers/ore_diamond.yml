# Diamond vein: a small, sparse patch of diamond ore and diamond cores in the walls around one self-placed point. Smaller and rarer than the gold vein.

- type: entity
  id: CEWildlandsModifierDiamondVein
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    points:
    - id: diamondVein
      minDistance: 0
      area: !type:RingArea
        minRadius: 50
        maxRadius: 110
    effects:
    - !type:GenerationLayers
      layers:
      - !type:FillEntityLayer
        entity: CEWallStoneOreDiamond
        mask:
        - &diamondVeinArea !type:RadiusMask
          point: diamondVein
          radius: 15
          noiseAmplitude: 3
          noise:
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.1
            octaves: 2
        - !type:NoiseMask
          threshold: 0.5
          noise:
            seed: 521
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.08
            octaves: 3
        - !type:EntityMask
          entities:
          - CEWallStone
          - CEWallDirt
          - CEWallSnow
      - !type:FillEntityLayer
        entity: CEWallDiamondCore
        mask:
        - *diamondVeinArea
        - !type:NoiseMask
          threshold: 0.8
          noise:
            seed: 523
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.2
            octaves: 3
        - !type:EntityMask
          entities:
          - CEWallStone
          - CEWallDirt
          - CEWallSnow
