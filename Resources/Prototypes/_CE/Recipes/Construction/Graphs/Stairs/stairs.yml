    # Blue roof

    - node: CEZLevelStairsRoofBlue
      entity: CEZLevelStairsRoofBlue
      edges:
        - to: CEZLevelStairsFrame
          completed:
            - !type:SpawnPrototype
              prototype: CEFloorTileRoofBlue
              amount: 2
          steps:
            - tool: CEMatterManipulation
              doAfter: 2

    - node: CEZLevelStairsRoofBlueCorner
      entity: CEZLevelStairsRoofBlueCorner
      edges:
        - to: CEZLevelStairsFrameCorner
          completed:
            - !type:SpawnPrototype
              prototype: CEFloorTileRoofBlue
              amount: 2
          steps:
