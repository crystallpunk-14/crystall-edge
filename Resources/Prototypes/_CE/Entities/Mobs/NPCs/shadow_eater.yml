- type: entity
  parent:
  - CEMobSimple
  - CEMobCombat
  - CEMobGOAPBase
  id: CEMobShadowEater
  name: shadow eater
  description: A being of darkness that feeds on the shadows of living creatures.
  categories: [ ForkFiltered ]
  components:
  - type: CEGOAP
    behaviors:
    - MeleeAttacker
    - Explorer
    targets:
      DissolvedSoul: !type:CEGOAPSelectorNearestKnown
        conditions:
        - !type:MurkDissolved
    goals:
    # Eating a dissolved soul beats everything else
    - desiredState:
        Fed: true
      priority: 2

    actions:
    # Walk up to a dissolved soul and devour it
    - !type:CEGOAPUseAction
      actionPrototype: CEActionShadowEaterDevour
      target: DissolvedSoul
      range: 1
      effects:
        Fed: true
      cost: 0.5
  - type: NpcFactionMember
    factions:
    - CEHostileEveryone
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Mobs/shadow_eater.rsi
    layers:
    - state: live
  - type: CEMurkDissolvingStatus
    soundEnabled: false
    overlayEnabled: false
    dissolved: 0.7
  - type: MovementSpeedModifier
    baseSprintSpeed: 2.5
    baseFriction: 0.5
  - type: CEWeapon
    range: 0.5
    effectSlots:
      OnHit:
      - !type:WeaponArcAttack
        arcWidth: 40
        effects:
        - !type:Damage
          damage:
            types:
              Piercing: 3
        - !type:MurkDissolve
          amount: 0.1
    animations:
      Primary:
      - anim: ShadowEaterBite
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: CEDestructionEffect
    effects:
    - !type:SpawnEntity
      effectTarget: User
      spawns:
      - CELurkerShadowStepEffect
    - !type:PlaySound
      positional: true
      sound:
        path: /Audio/_CE/Effects/heartbeat.ogg
        params:
          variation: 0.1
          pitch: 0.5

- type: entity
  id: CEActionShadowEaterDevour
  name: Devour shadow
  description: Devour a fully dissolved creature, restoring your health and birthing a new shadow eater from its remains.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 20
  - type: Sprite
    sprite: _CE/Mobs/shadow_eater.rsi
    layers:
    - state: live
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.2
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - CEMurkDissolvingStatus
    event: !type:CEEntityTargetActionAnimationEvent
      animation: AnimationShadowEaterDevour
  - type: CEActionTargetConditions
    conditions:
    - !type:MurkDissolved

- type: entityEffectAnimation
  id: AnimationShadowEaterDevour
  movementSpeed: 0
  duration: 2
  events:
    0:
    - !type:UserAnimation
      scaleAnimation:
      - time: 0
        scale: 1, 1
      - time: 0.2
        scale: 1.2, 0.8
      - time: 0.3
        scale: 1.2, 0.8
      - time: 0.4
        scale: 1, 1
    - !type:SpawnEntity
      effectTarget: User
      spawns:
      - CELurkerShadowStepEffect
    - !type:PlaySound
      positional: true
      sound:
        path: /Audio/_CE/Effects/vampire_scream_telegraphy.ogg
        params:
          variation: 0.1
    1.5:
    - !type:ConditionalEffectGroup
      conditions:
      - !type:MurkDissolved
      effects:
      - !type:PlaySound
        positional: true
        sound:
          path: /Audio/_CE/Effects/vampire_scream_cast.ogg
          params:
            variation: 0.1
      - !type:SpawnEntity
        effectTarget: Target
        spawns:
        - CELurkerFearScreamEffect
      - !type:Undress
      - !type:SpawnEntity
        spawns:
        - CEMobShadowEater
      - !type:Delete
      - !type:Rejuvenate
        effectTarget: User

- type: entity
  id: CEShadowEaterBiteEffectTelegraphy
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/arcs.rsi
    drawdepth: Effects
    layers:
    - state: disarm
      color: "#595c67"
      shader: unshaded

- type: entity
  id: CEShadowEaterBiteEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/arcs.rsi
    drawdepth: Effects
    layers:
    - state: bite
      color: "#595c67"
      shader: unshaded


- type: entityEffectAnimation
  id: ShadowEaterBite
  movementSpeed: 0.8
  duration: 0.8
  events:
    0:
    - !type:UsedEntityAnimation
      dummyEntity: CERatBiteEffectTelegraphy
      offsetAnimation:
      - time: 0.0
        offset: 0, -0.3
        easing: QuadIn
      - time: 0.2
        offset: 0, -0.2
        easing: QuadIn

      rotationAnimation:
      - time: 0.0
        rotation: 90

      colorAnimation:
      - time: 0.1
        color: "#ffffff"
      - time: 0.3
        color: "#ffffff00"  # Fade out
        easing: QuadOut
    - !type:PlaySound
      sound:
        path: /Audio/Effects/bite.ogg
        params:
          variation: 0.1
          pitch: 0.4
    0.2:
    - !type:UsedEntityAnimation
      dummyEntity: CERatBiteEffect
      offsetAnimation:
      - time: 0.0
        offset: 0, -0.2
        easing: QuadIn
      - time: 0.3
        offset: 0, -0.7
        easing: QuadIn

      rotationAnimation:
      - time: 0.0
        rotation: 90

      colorAnimation:
      - time: 0.1
        color: "#ffffff"
      - time: 0.3
        color: "#ffffff00"  # Fade out
        easing: QuadOut
    0.25:
    - !type:WeaponEffectSlot
      slot: OnHit
    - !type:Dash
      distance: 0.1
