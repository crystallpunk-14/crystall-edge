- type: constructionGraph
  id: CEBaseTombstone
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CEBaseTombstone
          steps:
            - material: CEStone
              amount: 5
              doAfter: 2
    - node: CEBaseTombstone
      entity: CEBaseTombstone
      edges:
      - to: start
        steps:
        - tool: CEHammering
          doAfter: 10
        completed:
        - !type:SpawnPrototype
          prototype: CEStoneBlock1
          amount: 5
