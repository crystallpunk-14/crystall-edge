- type: entity
  abstract: true
  parent: Clothing
  id: CEClothingMaskBase
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    state: icon
  - type: Item
    size: Normal
  - type: Clothing
    equipDelay: 0.7
    unequipDelay: 0.4
    slots: [mask]

- type: entity
  parent: CEClothingMaskBase
  id: CEClothingMaskSinner
  name: sinner's mask
  description: A mask intented to be worn by not the brightest individuals. Executioners put them on themselves and the victim before execution.
  components:
  - type: Sprite
    sprite: _CE/Clothing/Masks/sinner.rsi
  - type: Clothing
    sprite: _CE/Clothing/Masks/sinner.rsi
  - type: IdentityBlocker
  - type: IngestionBlocker

- type: entity
  parent: CEClothingMaskBase
  id: CEClothingMaskSteelMask
  name: steel mask
  description: A steel mask that protects the face from the external effects of iron.
  components:
  - type: Sprite
    sprite: _CE/Clothing/Masks/steel_mask.rsi
  - type: Clothing
    sprite: _CE/Clothing/Masks/steel_mask.rsi
  - type: IdentityBlocker
  - type: IngestionBlocker
  - type: PhysicalComposition
    materialComposition:
      CEIron: 20

