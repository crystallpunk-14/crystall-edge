# Shared unfinished frame stage for the whole stairs/roof family - wooden, stone stairs and
# red/green/blue tile roofs are all built from the same wooden scaffold, and only diverge based
# on what covering material gets nailed onto it.

- type: entity
  id: CEZLevelStairsFrameBase
  abstract: true
  categories: [ ForkFiltered ]
  parent: BaseStructure
  name: stairs frame
  description: An unfinished wooden support frame. It needs to be covered before it's safe to climb.
  placement:
      mode: SnapgridCenter
      snap:
      - Wall
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Stairs/frame.rsi
    state: straight
    drawdepth: Mobs
  - type: PlacementReplacement
    key: walls
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      hard:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,0.5,0.5,0.6"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
        hard: true
  - type: Damageable
    damageModifierSet: CEWoodStructural
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CEWoodenPlanks1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: CEZLevelStairsFrameBase
  id: CEZLevelStairsFrame
  name: stairs frame
  components:
  - type: Construction
    graph: CEZLevelStairs
    node: CEZLevelStairsFrame

- type: entity
  parent: CEZLevelStairsFrameBase
  id: CEZLevelStairsFrameCorner
  name: stairs frame
  suffix: Corner
  components:
  - type: Sprite
    state: corner
  - type: Fixtures
    fixtures:
      hard:
        shape:
          !type:PhysShapeAabb
          bounds: "0.5,0.5,0.6,0.6"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
        hard: true
  - type: Construction
    graph: CEZLevelStairs
    node: CEZLevelStairsFrameCorner

- type: entity
  parent: CEZLevelStairsFrameCorner
  id: CEZLevelStairsFrameCornerInner
  name: stairs frame
  suffix: Inner Corner
  components:
  - type: Sprite
    state: internal_corner
  - type: Construction
    graph: CEZLevelStairs
    node: CEZLevelStairsFrameCornerInner
