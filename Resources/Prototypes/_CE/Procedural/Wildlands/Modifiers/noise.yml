# Noise: ore veins shaped by noise over natural walls.

- type: entity
  id: CEWildlandsModifierOreCoalNoise
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    effects:
    - !type:GenerationLayers
      layers:
      - !type:FillEntityLayer
        entity: CEWallStoneOreCoal
        mask:
        - !type:NoiseMask
          threshold: 0.4
          noise:
            seed: 501
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.08
            octaves: 3
        - !type:EntityMask
          entities:
          - CEWallStone
          - CEWallDirt
          - CEWallSnow
      - !type:FillEntityLayer
        entity: CEWallCoalCore
        mask:
        - !type:NoiseMask
          threshold: 0.75
          noise:
            seed: 503
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.15
            octaves: 3
        - !type:EntityMask
          entities:
          - CEWallStone
          - CEWallDirt
          - CEWallSnow

