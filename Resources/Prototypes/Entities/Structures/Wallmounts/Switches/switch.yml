#todo these need a common parent

- type: entity
  parent: [ BaseWallmountMetallic, StructureHealthMachineFlimsy ]
  id: SignalButton
  name: signal button
  description: It's a button for activating something.
  components:
  - type: WallMount
    arc: 175
  - type: StationAiWhitelist
  - type: Sprite
    offset: 0, -0.25
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/switch.rsi
    layers:
    - state: base
    - state: button
    - state: button-unshaded
      shader: unshaded
  - type: UseDelay
    delay: 0.5 # prevent light-toggling auto-clickers.
  - type: SignalSwitch
    onPort: Pressed
    offPort: Pressed
    statusPort: Pressed
  - type: Rotatable
  - type: Construction
    graph: SignalButtonGraph
    node: SignalButtonNode
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSource
    ports:
      - Pressed
  - type: Transform
    anchored: false
  - type: Destructible
    thresholds:
    - trigger: &DamageMachineFlimsy
        !type:DamageTrigger
        damage: 50
      behaviors:
      - &SoundMetalBreak !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -8
