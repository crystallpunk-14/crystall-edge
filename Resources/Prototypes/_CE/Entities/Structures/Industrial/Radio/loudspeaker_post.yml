- type: entity
  id: CERadioPostSpeakerBase
  categories: [ ForkFiltered ]
  name: loudspeaker post
  abstract: true
  description: Remote radio broadcasting device
  placement:
    mode: SnapgridCenter
  components:
  - type: CEZPhysics
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Pullable
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _CE/Structures/Industrial/loudspeaker_post.rsi
    layers:
    - state: base
    noRot: true
    drawdepth: Mobs
    offset: 0,1.2
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 1000
        layer:
        - WallLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors: #excess damage, don't spawn entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          CEScrapIron1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 0.05
  - type: ExtensionCableReceiver
    receptionRange: 0
  - type: Speech
    speechVerb: CEBroadcast
    suffixSpeechVerbs: {}

- type: entity
  parent: CERadioPostSpeakerBase
  id: CERadioPostSpeaker
  suffix: Common
  components:
  - type: CERadioSpeaker
    frequencies:
    - CECommon

- type: entity
  parent: CERadioPostSpeakerBase
  id: CERadioPostSpeakerAcademy
  suffix: Common, Academy
  components:
  - type: CERadioSpeaker
    frequencies:
    - CECommon
    - CEAcademy

- type: entity
  parent: CERadioPostSpeakerBase
  id: CERadioPostSpeakerEngineering
  suffix: Common, Engineering
  components:
  - type: CERadioSpeaker
    frequencies:
    - CECommon
    - CEEngineering

- type: entity
  parent: CERadioPostSpeakerBase
  id: CERadioPostSpeakerGuard
  suffix: Common, Guard
  components:
  - type: CERadioSpeaker
    frequencies:
    - CECommon
    - CEGuard

- type: entity
  parent: CERadioPostSpeakerBase
  id: CERadioPostSpeakerTavern
  suffix: Common, Tavern
  components:
  - type: CERadioSpeaker
    frequencies:
    - CECommon
    - CETavern
