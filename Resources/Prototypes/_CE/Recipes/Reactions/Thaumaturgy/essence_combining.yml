# Combines two lower-tier essences into a higher-tier one by heating them together.
# Full aspect-combination graph mirrored from the classic Thaumcraft 4 aspect wheel.
# Each reaction spends exactly 1 drop of each source essence to spawn 2 entities of the resulting
# flying essence, one reaction at a time (quantized + maxUnitReactions: 1) instead of scaling up
# with however much essence liquid is available.

# Complex tier 1

- type: reaction
  id: CEEssenceFrost
  minTemp: 600
  quantized: true
  maxUnitReactions: 1
  reactants:
    CEEssenceFire:
      amount: 1
    CEEssenceChaos:
      amount: 1
  effects:
  - !type:SpawnEntity
    entity: CEEssenceFrost
    number: 2
    predicted: false
  - !type:AdjustSolutionTemperature
    delta: -400

