- type: entity
  id: CEPlantCabbage
  parent: CEGatherablePlantSingleHarvestBase
  name: cabbage
  description: You see a cabbage in front of you. Perhaps you were born in one.
  components:
  - type: CEPlant
    updateFrequency: 1
  - type: CEPlantVisuals
    growthSteps: 5
    readyVariations: 2
  - type: Sprite
    layers:
    - state: liq-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      sprite: _CE/Structures/Nature/Farm/cabbage.rsi
      map: ["enum.PlantVisualLayers.Base"]
