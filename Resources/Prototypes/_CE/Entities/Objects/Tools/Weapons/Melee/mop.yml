- type: entity
  abstract: true
  id: CEBaseWeaponMop
  parent: BaseItem
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Ginormous
  - type: Wieldable
  - type: Clothing
    equipDelay: 1
    unequipDelay: 1
    equipWhileMoving: true
    slots:
    - neck
  - type: CEWeapon
    range: 0.75
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 2
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 2
    animations:
      Primary:
      - anim: StaffAttackLight1
      - anim: StaffAttackLight2
      Secondary:
      - anim: StaffAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 3
      Secondary: 5
  - type: CERotationForAnimation
    rotation: -0
  - type: Spillable
    solution: absorbed
  - type: Absorbent
  - type: DrainableSolution
    solution: absorbed
  - type: Solution
    id: absorbed
    solution:
      maxVol: 50
  - type: Tag
    tags:
    - Mop
  - type: PhysicalComposition
    materialComposition:
      CEWood: 20
      CECloth: 10

- type: entity
  parent: CEBaseWeaponMop
  id: CEWeaponMop
  name: mop
  description: A simple mop for cleaning up spills and messes.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Mop/mop.rsi
    layers:
    - state: icon
    - state: icon_liq1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    solutionName: absorbed
    maxFillLevels: 2
    fillBaseName: icon_liq
    inHandsMaxFillLevels: 2
    inHandsFillBaseName: _liq
  - type: StaticPrice
    price: 5
