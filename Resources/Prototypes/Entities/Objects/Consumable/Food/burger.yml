# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_single.yml
# Bun

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodBurgerBase
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - meaty
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 30
      - ReagentId: Protein
        Quantity: 10
      - ReagentId: Vitamin
        Quantity: 10
  - type: Item
    sprite: Objects/Consumable/Food/burger.rsi
    shape:
    - 0,0,1,0

# Custom Burger Example

- type: entity
  parent: FoodBurgerBase
  id: FoodBurgerAppendix
  name: appendix burger
  description: Tastes like appendicitis.
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - grass
  - type: Sprite
    state: appendix
  - type: Tag
    tags:
    - Meat
  - type: Item
    inhandVisuals:
      left:
      - state: bun-inhand-left
      - state: alpha-patty-inhand-left
        color: "#382010"
      - state: alpha-filling-inhand-left
        color: "#bd9451"
      right:
      - state: bun-inhand-right
      - state: alpha-patty-inhand-right
        color: "#382010"
      - state: alpha-filling-inhand-right
        color: "#bd9451"
# Tastes like bun, grass.

- type: entity
  parent: FoodBurgerBase
  id: FoodBurgerEmpowered
  name: empowered burger
  description: It's shockingly good, if you live off of electricity that is.
  components:
  - type: Item
    storedOffset: -2,1
    inhandVisuals:
      left:
      - state: plasma-inhand-left
      right:
      - state: plasma-inhand-right
  - type: Sprite
    state: empowered
  - type: FlavorProfile
    flavors:
      - bun
      - shocking
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Plasma
        Quantity: 20
      - ReagentId: Licoxide
        Quantity: 10
# Tastes like bun, pure electricity.

- type: entity
  parent: FoodBurgerBase
  id: FoodBurgerCarp
  name: fillet-o-carp burger
  description: Almost like a carp is yelling somewhere...
  components:
  - type: Item
    storedOffset: 0,1
    inhandVisuals:
      left:
      - state: bun-inhand-left
      - state: alpha-filling-inhand-left
        color: "#feffba"
      - state: alpha-patty-inhand-left
        color: "#f4bb53"
      right:
      - state: bun-inhand-right
      - state: alpha-filling-inhand-right
        color: "#feffba"
      - state: alpha-patty-inhand-right
        color: "#f4bb53"
  - type: FlavorProfile
    flavors:
      - bun
      - fishy
  - type: Sprite
    state: fish
  - type: Tag
    tags:
    - Meat
# Tastes like bun, fish.

- type: entity
  parent: FoodBurgerBase
  id: FoodBurgerGhost
  name: ghost burger
  description: Too spooky!
  components:
  - type: Item
    size: Normal # Just annoying to store not actually that big :)
    shape:
    storedOffset: 0,3
    inhandVisuals:
      left:
      - state: alpha-bun-inhand-left
        color: "#cededa"
      - state: alpha-filling-inhand-left
        color: "#6a6281"
      - state: alpha-patty-inhand-left
        color: "#95a79f"
      right:
      - state: alpha-bun-inhand-right
        color: "#cededa"
      - state: alpha-filling-inhand-right
        color: "#6a6281"
      - state: alpha-patty-inhand-right
        color: "#95a79f"
  - type: FlavorProfile
    flavors:
      - bun
      - spooky
  - type: Sprite
    state: ghost
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Vitamin
        Quantity: 10
      - ReagentId: Fresium
        Quantity: 15
  - type: Tag
    tags:
      - ClothMade
      - Meat
# Tastes like bun, ectoplasm.
