
- type: entity
  id: CEEffectManaDrain
  parent: CEEffectAreaHealingTelegraphy
  name: mana drain impact
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: _CE/Effects/mana_drain.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#6b19af"
    radius: 1.5

- type: entity
  id: CEEffectManaRestore
  parent: CEEffectAreaHealingTelegraphy
  name: mana restore impact
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: _CE/Effects/mana_restore.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#2b9adf"
    radius: 1.5

- type: entity
  id: CEEffectAreaManaConsume
  categories: [ ForkFiltered ]
  save: false
  name: mana consume burst
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: _CE/Effects/AreaEffects/mana_consume.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#9e46c1"
    radius: 6
    energy: 5
  - type: LightBehaviour
    behaviours:
      - !type:PulseBehaviour
        interpolate: Linear
        maxDuration: 2.5
        startValue: 0
        endValue: 5.0
        property: Energy
        isLooped: false
        enabled: true
  - type: TimedDespawn
    lifetime: 2.5
  - type: CEEntityEffectSpawner
    firstDelay: 0.2
    frequency: 999
    effects:
    - !type:PlaySound
      sound:
        path: /Audio/Effects/teleport_departure.ogg
        params:
          pitch: 0.6
          variation: 0.05
    - !type:AreaEffect
      range: 6
      checkLOS: false
      effects:
      - !type:ChangeMana
        amount: -20

- type: entity
  id: CEEffectAreaManaRestore
  categories: [ ForkFiltered ]
  save: false
  name: mana restore burst
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: _CE/Effects/AreaEffects/mana_restore.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#2b9adf"
    radius: 6
    energy: 5
  - type: LightBehaviour
    behaviours:
      - !type:PulseBehaviour
        interpolate: Linear
