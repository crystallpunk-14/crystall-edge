- type: entity
  id: CEActionEnergyScannerMode
  name: Switch scanner mode
  description: Cycle which energy pipes the glasses show - current and lower level, current level only, current and upper level, or nothing.
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    sprite: _CE/Clothing/Eyes/Engineering/energy_scanner.rsi
    layers:
    - state: up
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CEEnergyScannerCycleModeEvent
