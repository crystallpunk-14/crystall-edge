- type: entity
  id: CEGauze
  parent: BaseItem
  name: gauze
  description: Dense cloth gauze, to prevent valuable blood from leaking out of the body.
  suffix: 5
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Consumable/medical.rsi
    state: bandage_3
    layers:
      - state: bandage_3
        map: ["base"]
  - type: Appearance
  - type: Construction
    graph: CEGauze
    node: cegauze
  - type: Healing
    damageContainers:
      - CEBiological
    damage:
      types:
        Slash: -10
        Piercing: -10
        Blunt: -10
    bloodlossModifier: -10
    delay: 2
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: CEGauze
    count: 5
    baseLayer: base
    layerStates:
    - bandage
    - bandage_2
    - bandage_3
  - type: StackPrice
    price: 2
  - type: CEMagicEssenceStructure
    essences:
      Life: { min: 1, max: 3 }
      Cloth: { min: 0, max: 2 }

