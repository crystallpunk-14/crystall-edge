- type: secretRole
  id: Priest
  name: ce-secret-role-name-priest
  description: ce-secret-role-description-priest
  icon: CESecretRoleIconPriest
  skills:
  - CureWounds
  - Resurrection
  objectives: !type:AllSelector
    children:
    - id: CEObjectivePriestSurvive
    - id: CEObjectivePriestProtect
    - id: CEObjectivePriestProtect

- type: entity
  id: CEObjectivePriestSurvive
  name: Survive
  description: There are creatures in this city who crave my death.
  components:
  - type: Sprite
    sprite: _CE/Interface/Icons/SecretRoles/city.rsi
    state: priest
  - type: CEObjective
  - type: CETargetObjective
  - type: CETargetHolderObjective
  - type: CETargetSurviveCondition
    defaultProgress: 1

- type: entity
  id: CEObjectivePriestProtect
  name: Keep someone alive
  description: You swore an oath to protect the innocent from death, and you will keep it.
  components:
  - type: Sprite
    sprite: _CE/Actions/Spells/resurrection.rsi
    state: icon
  - type: CEObjective
  - type: CETargetObjective
    title: ce-priest-protect-objective-title
  - type: CETargetPlayersObjective
  - type: CETargetSecretDepartmentBlacklist
    departments:
    - Nightmares
  - type: CETargetSecretRoleBlacklist
    secretRoleBlacklist:
    - DarkVessel # its body is meant to die
  - type: CETargetSurviveCondition
    defaultProgress: 1
