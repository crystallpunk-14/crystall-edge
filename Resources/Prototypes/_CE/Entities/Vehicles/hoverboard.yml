
- type: entity
  id: CEVehicleHoverboard
  parent:
  - CEBaseVehicleStrap
  - BaseFoldable
  - BaseItem
  name: hoverboard
  description: Floating personal transport device
  components:
  - type: Sprite
    sprite: Objects/Vehicles/wheelchair.rsi
    layers:
    - state: vehicle
      map: ["unfoldedLayer"]
    - state: vehicle_folded
      map: ["foldedLayer"]
      visible: false
  - type: Appearance
  - type: Item
    size: Ginormous
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: MovementSpeedModifier
    baseAcceleration: 2
    baseFriction: 2
    baseWalkSpeed: 5
    baseSprintSpeed: 7
  - type: Strap
    buckleOffset: "0,-0.05"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 360
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - TableLayer
  - type: StaticPrice
    price: 70
  - type: AmbientSound
    enabled: false
    volume: 2
    range: 5
    sound:
      path: /Audio/_CE/Ambience/hoverboard.ogg
  - type: CEZFlyer
    flightVfx: CEOverchargeSmallVFX
  - type: CEVehicleFlyer
  - type: CEZFlyerBattery
    energyDraw: 1
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: ExaminableBattery
