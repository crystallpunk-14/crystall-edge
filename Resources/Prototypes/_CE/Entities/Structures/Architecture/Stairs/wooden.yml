- type: entity
  id: CEZLevelStairsWoodenBase
  abstract: true
  name: wooden stairs
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Stairs/wooden.rsi
  - type: Damageable
    damageModifierSet: CEWoodStructural
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CEWoodenPlanks1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent:
  - CEZLevelStairsBase
  - CEZLevelStairsWoodenBase
  id: CEZLevelStairsWooden
  name: wooden stairs
  components:
  - type: Construction
    graph: CEZLevelStairs
    node: CEZLevelStairsWooden

- type: entity
  parent:
  - CEZLevelStairsCornerBase
  - CEZLevelStairsWoodenBase
  id: CEZLevelStairsWoodenCorner
  name: wooden stairs
  suffix: Corner
  components:
  - type: Construction
    graph: CEZLevelStairs
    node: CEZLevelStairsWoodenCorner

- type: entity
  parent:
  - CEZLevelStairsCornerInnerBase
  - CEZLevelStairsWoodenBase
  id: CEZLevelStairsWoodenCornerInner
  name: wooden stairs
  suffix: Inner Corner
  components:
  - type: Construction
    graph: CEZLevelStairs
    node: CEZLevelStairsWoodenCornerInner
