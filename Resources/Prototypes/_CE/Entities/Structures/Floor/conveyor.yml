- type: entity
  id: CEConveyorBelt
  name: conveyor belt
  parent: ConveyorBelt
  description: TODO
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: walls
  - type: Sprite
    sprite: _CE/Structures/Floor/conveyor.rsi
    state: base
  - type: Fixtures
    fixtures:
      conveyor:
        shape: !type:PolygonShape
          vertices:
          - -0.40,-0.80
          - 0.40,-0.80
          - 0.40,0.80
          - -0.40,0.80
        layer:
        - ConveyorMask
        hard: False
  - type: GenericVisualizer
    visuals:
      enum.ConveyorVisuals.State:
        enum.ConveyorState.Off:
          Off: { state: base }
          Forward: { state: moving_forward }
          Reverse: { state: moving_backward }

- type: entity
  id: CEConveyorLadder
  name: conveyor ladder
  parent: ConveyorBelt
  description: TODO
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: walls
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Structures/Floor/conveyor_ladder.rsi
    state: base
  - type: CEZLevelHighground
    stick: true
    heightCurve:
    - 1.05
    - 1.05
    - 0.1
    - 0.1
  - type: GenericVisualizer
    visuals:
      enum.ConveyorVisuals.State:
        enum.ConveyorState.Off:
          Off: { state: base }
          Forward: { state: base }
          Reverse: { state: base }
