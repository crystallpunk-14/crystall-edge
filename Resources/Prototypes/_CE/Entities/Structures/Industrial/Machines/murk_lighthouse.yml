- type: entity
  id: CEMurkLighthouse
  parent: CEBaseMachinePowered
  name: murk lighthouse
  description: This beacon uses sapphron energy to dispel the murk around it. If its supply is cut, the sphere of clear air slowly collapses inwards.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _CE/Structures/Power/lighthouse.rsi
    layers:
    - state: base
  - type: AmbientSound
    enabled: false
    sound:
      path: /Audio/Machines/scan_loop.ogg
    range: 5
    volume: -8
  - type: ApcPowerReceiver
    powerLoad: 10
  - type: AmbientOnPowered
  - type: LitOnPowered
  - type: PointLight
    radius: 3.5
    energy: 2
    color: "#2d8ad6"
  - type: CEMurkSource
    intensity: 0
  - type: CEMurkGenerator
    disabledIntensity: 0
    enabledIntensity: -10
  - type: CEPvsOverride
  - type: PlacementReplacement
    key: walls
  - type: Occluder
    boundingBox: -0.5, -0.5, 0.5, 1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.2,0.5,0.8"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
