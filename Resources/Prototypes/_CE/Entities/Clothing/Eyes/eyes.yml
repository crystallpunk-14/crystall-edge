- type: entity
  abstract: true
  parent: Clothing
  id: CEClothingEyesBase
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    state: icon
  - type: Item
    size: Normal
  - type: Clothing
    equipDelay: 0.4
    unequipDelay: 0
    slots: [eyes]

- type: entity
  parent: CEClothingEyesBase
  id: CEClothingEyesMonocle
  name: monocle
  description: Aristocratic, fancy.
  components:
  - type: Sprite
    sprite: _CE/Clothing/Eyes/monocle.rsi
  - type: Clothing
    sprite: _CE/Clothing/Eyes/monocle.rsi
  - type: VisionCorrection

- type: entity
  parent: CEClothingEyesBase
  id: CEClothingEyesGlasses
  name: glasses
  description: Aristocratic, fancy.
  components:
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-flip-verb
    foldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped
    foldedHeldPrefix: flipped
  - type: Sprite
    sprite: _CE/Clothing/Eyes/glasses.rsi
  - type: Clothing
    sprite: _CE/Clothing/Eyes/glasses.rsi
  - type: VisionCorrection

- type: entity
  parent: CEClothingEyesBase
  id: CEClothingEyesAlchemyGlasses
  name: alchemy glasses
  description: Special magic infused glasses that allow you to clearly see the composition of any mixtures.
  components:
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-flip-verb
    foldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped
    foldedHeldPrefix: flipped
  - type: Sprite
    sprite: _CE/Clothing/Eyes/alchemy_glasses.rsi
  - type: Clothing
    sprite: _CE/Clothing/Eyes/alchemy_glasses.rsi
  - type: SolutionScanner
  - type: StaticPrice
    price: 30
  - type: VisionCorrection

- type: entity
  parent: CEClothingEyesBase
