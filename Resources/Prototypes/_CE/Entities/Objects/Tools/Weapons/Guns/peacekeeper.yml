- type: entity
  id: CEWeaponGunPeacekeeper
  parent:
  - BaseLaserRifle
  - BaseGunWieldable
  name: Peacekeeper
  description: A low-charge energy rifle that fires a powerful repulsive beam of concentrated mana.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Guns/peacekeeper.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _CE/Objects/Tools/Weapons/Guns/peacekeeper.rsi
    equipDelay: 1
    unequipDelay: 1.5
    equipWhileMoving: true
    slots:
    - neck
  - type: Item
    size: Ginormous
    shape:
    - 0, 0, 4, 1 # 2x5
  - type: BatteryAmmoProvider
    proto: CEPeaceKeeperHitscan
    fireCost: 10
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: Gun
    fireRate: 0.8
    angleDecay: 10
    angleIncrease: 2
    maxAngle: 36
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
      params:
        variation: 0.2
  - type: StaticPrice
    price: 350
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Metal: { min: 1, max: 4 }
      Energia: { min: 0, max: 2 }

- type: entity
  parent: BasicHitscan
  id: CEPeaceKeeperHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Shock: 30
  - type: CEHitscanEntityEffect
    effects:
    - !type:SpawnEntity
      effectTarget: Target
      spawns:
      - CEOverchargeVFX
    - !type:ThrowFrom
      distance: 0.75
    - !type:Irradiate
      charge: 5
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_blue
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_blue
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_blue

