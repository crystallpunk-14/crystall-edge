- type: entity
  categories: [ ForkFiltered ]
  name: screwdriver
  parent: BaseItem
  id: CEScrewdriver
  description: Industrial grade torque in a small screwdriving package.
  components:
  - type: CELockEditor
  - type: UseDelay
    delay: 1.0
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/screwdriver_drop.ogg
  - type: Tag
    tags:
    - Screwdriver
  - type: Sprite
    sprite: _CE/Objects/Tools/screwdriver.rsi
    state: icon
  - type: Item
    sprite: _CE/Objects/Tools/screwdriver.rsi
    storedRotation: -90
  - type: CEWeapon
    range: 0.4
    hitSound:
      path: "/Audio/Weapons/bladeslice.ogg"
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Piercing: 2
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Piercing: 2
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
      Secondary:
      - anim: DaggerAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 20
  - type: CERotationForAnimation
    rotation: 90
  - type: Tool
    qualities:
      - Screwing
    useSound:
      collection: Screwdriver
  - type: PhysicalComposition
    materialComposition:
      CEIron: 5
      CEWood: 10
  - type: CEMagicEssenceStructure
    essences:
      Metal: { min: 1, max: 3 }
      Tool: { min: 0, max: 2 }
