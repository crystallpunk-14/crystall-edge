- type: entity
  id: CEConveyorBelt
  name: conveyor belt
  description: TODO
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: walls
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _CE/Structures/Industrial/Conveyor/floor.rsi
    state: base
    drawdepth: WallTops
  - type: Physics
    bodyType: Static
  - type: Anchorable
    canAnchorOnOccupied: true
  - type: Pullable
  - type: Fixtures
    fixtures:
      conveyor:
        shape: !type:PolygonShape
          vertices:
          - -0.40,-0.80
          - 0.40,-0.80
          - 0.40,0.80
          - -0.40,0.80
        layer:
        - ConveyorMask
        hard: False
  - type: Conveyor
  - type: CEConveyor
  - type: CEFunnelActivator
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConveyorVisuals.State:
        enum.ConveyorState.Off:
          Off: { state: base }
          Forward: { state: moving_forward }
          Reverse: { state: moving_backward }
  - type: ApcPowerReceiver
    powerLoad: 0.1
  - type: ExtensionCableReceiver
    receptionRange: 0
  - type: Construction
    graph: CEConveyorBelt
    node: CEConveyorBelt
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: CEConveyorStairs
  name: conveyor stairs
  parent: CEConveyorBelt
  description: TODO
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: walls
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Structures/Industrial/Conveyor/stairs.rsi
  - type: CEZLevelHighGround
    stick: true
    heightCurve:
    - 1.05
    - 1.05
    - 0.1
    - 0.1
  - type: Conveyor
    speed: 3 # needed for stairs so that objects don't get stuck at the top, on the map above
  - type: Construction
    graph: CEConveyorStairs
    node: CEConveyorStairs

- type: entity
  id: CEConveyorStairsReverse
  parent: CEConveyorStairs
  suffix: Reverse
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _CE/Structures/Industrial/Conveyor/stairs_inversed.rsi
  - type: CEZLevelHighGround
    stick: true
    heightCurve:
    - 0.1
    - 0.1
    - 1.05
    - 1.05
  - type: Construction
    graph: CEConveyorStairs
    node: CEConveyorStairsReverse
