- type: skill
  id: Recruitment
  icon:
    sprite: _CE/Achievements/brotherhood.rsi
    state: flag
  effect: !type:AddAction
    action: CEActionRecruit

- type: entity
  id: CEActionRecruit
  name: Recruitment
  description: Invite someone nearby to join the Brotherhood. They can refuse.
  categories: [ HideSpawnMenu ]
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeAoEZoneAction
    radius: 0.5
  - type: Action
    useDelay: 600
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _CE/Achievements/brotherhood.rsi
    layers:
    - state: flag
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:CERecruitActionEvent
  - type: CERecruitmentAction
    role: Recruit
