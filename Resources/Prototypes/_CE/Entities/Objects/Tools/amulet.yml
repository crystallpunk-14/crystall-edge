- type: entity
  id: CESafeFallingAmulet
  parent: BaseItem
  name: Emergency Levitation Amulet
  description: An essential piece of everyday equipment for residents of the flying islands, protecting them from accidental falls from the island. Put it on your belt, and if you accidentally fall from the island, you will have a chance to save yourself.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Tools/amulets.rsi
    layers:
    - state: safe_faling
    - state: unshaded
      shader: unshaded
      color: "#f9f28d"
  - type: CESafeFallClothing
  - type: Clothing
    equipDelay: 0.25
    unequipDelay: 0.25
    quickEquip: false
    equipWhileMoving: true
    slots:
    - BELT
  - type: StaticPrice
    price: 75

- type: entity
  id: CEVoiceDistortionAmulet
  parent: BaseItem
  name: voice distortion amulet
  description: A shadowy trinket from the Murk. Worn on the belt, it distorts the wearer's voice beyond recognition.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Tools/amulets.rsi
    layers:
    - state: focus
    - state: unshaded
      shader: unshaded
      color: purple
  - type: CEVoiceDistortionClothing
  - type: Clothing
    equipDelay: 0.25
    unequipDelay: 0.25
    quickEquip: false
    equipWhileMoving: true
    slots:
    - BELT
  - type: StaticPrice
    price: 75
