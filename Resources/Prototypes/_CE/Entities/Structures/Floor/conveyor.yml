- type: entity
  id: CEConveyorBelt
  name: conveyor belt
  description: TODO
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: walls
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _CE/Structures/Floor/conveyor.rsi
    state: base
    drawdepth: HighFloorObjects
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      conveyor:
        shape: !type:PolygonShape
          vertices:
          - -0.40,-0.80
          - 0.40,-0.80
          - 0.40,0.80
          - -0.40,0.80
        layer:
        - ConveyorMask
        hard: False
  - type: Conveyor
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConveyorVisuals.State:
        enum.ConveyorState.Off:
          Off: { state: base }
          Forward: { state: moving_forward }
          Reverse: { state: moving_backward }
  - type: PowerConsumer
    voltage: Medium
    drawRate: 0.5
  - type: NodeContainer
    nodes:
      power:
        !type:CableDeviceNode
        nodeGroupID: MVPower

- type: entity
  id: CEConveyorLadder
  name: conveyor ladder
  parent: CEConveyorBelt
  description: TODO
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: walls
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Structures/Floor/conveyor_ladder.rsi
  - type: CEZLevelHighground
    stick: true
    heightCurve:
    - 1.05
    - 1.05
    - 0.1
    - 0.1
