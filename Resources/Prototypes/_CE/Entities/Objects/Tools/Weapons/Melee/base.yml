- type: entity
  abstract: true
  id: CEBaseWeaponChemical
  categories: [ ForkFiltered ]
  components:
  - type: Solution
    id: melee
    solution:
      maxVol: 10
  - type: CEWeaponInjector
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: ExaminableSolution
    solution: melee
    exactVolume: true
  - type: Spillable
    solution: melee
    spillWhenThrown: false
  - type: SolutionInjectOnEmbed
    transferAmount: 5
    solution: melee

- type: entity
  abstract: true
  id: CEBaseWeaponThrowable
  categories: [ ForkFiltered ]
  components:
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 10
  - type: DamageOnLand
    damage:
      types:
        Piercing: 10
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.40,-0.30
            - -0.30,-0.40
            - 0.40,0.30
            - 0.30,0.40
        density: 10
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

- type: entity
  abstract: true
  id: CEBaseWeaponLight
  categories: [ ForkFiltered ]
  components:
  - type: CEWeapon

- type: entity
  abstract: true
  id: CEBaseWeaponShort
  categories: [ ForkFiltered ]
  components:
  - type: MeleeWeapon
    range: 1.0 # 1.5 standart
    animationOffset: 0.75

- type: entity
  abstract: true
  id: CEBaseWeaponSharp
  categories: [ HideSpawnMenu, ForkFiltered ]
  components:
  - type: CEWallpaperRemover
  - type: Tag
    tags:
    - CESharp
  - type: UseDelay
  - type: Tool
    qualities:
      - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg
  - type: Utensil
    types:
      - Knife
  - type: Execution
