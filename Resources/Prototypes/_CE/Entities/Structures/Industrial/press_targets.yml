- type: entity
  id: CEPressTargetBase
  abstract: true
  parent:
  - CEConstructibleMachine
  - CEBaseMachinePowered
  - BaseMachine
  categories: [ ForkFiltered ]
  components:
  - type: CEPressTarget
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        density: 1000
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.0,0.3,0.35"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: WallTops
    offset: 0, 0.45
    noRot: true

- type: entity
  id: CEPressTargetAnvil
  parent: CEPressTargetBase
  name: industrial anvil
  description: A solid anvil for an industrial press. It is used to flatten objects into flatter shapes.
  components:
  - type: Sprite
    sprite: _CE/Structures/Industrial/press.rsi
    layers:
    - state: platform

- type: entity
  id: CEPressTargetThaumaturgySplitter
  parent: CEPressTargetBase
  name: thaumaturgical splitter
  description: An enchanted platform for the press that allows objects to be broken down into their primordial essences.
  components:
  - type: Machine
    board: CEMachineCorePressTargetThaumaturgySplitter
  - type: CEThaumaturgySplitter
  - type: Sprite
    sprite: _CE/Structures/Industrial/press.rsi
    layers:
    - state: platform_thaumaturgy
