#MARK: Basic mobs

- type: entity
  parent:
  - BaseMob
  - CEMobDamageable
  id: CEMobSimple
  save: false
  abstract: true
  components:
  - type: Climbing
  - type: CanMoveInAir
  - type: CEAnimationController
  - type: CEIdleAnimation
    animation:
      scaleAnimation:
      - time: 0
        scale: 1.01, 0.99
      - time: 2
        scale: 0.99, 1.01
      - time: 4
        scale: 1.01, 0.99
      offsetAnimation:
      - time: 0
        offset: 0, 0
      - time: 2
        offset: 0, 0.01
      - time: 4
        offset: 0, 0
  - type: CEWalkingAnimation
    animation:
      scaleAnimation:
      - time: 0
        scale: 1.02, 0.98
      - time: 0.2
        scale: 0.98, 1.02
      - time: 0.3
        scale: 1.02, 0.98
      offsetAnimation:
      - time: 0
        offset: 0, 0
      - time: 0.2
        offset: 0, 0.02
      - time: 0.3
        offset: 0, 0


#MARK: basic parts

- type: entity
  save: false
  id: CEMobDamageable
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: CEBiological
  - type: DamageOverlay
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          CEAsh1:
            min: 2
            max: 3
      - !type:BurnBodyBehavior { }
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
  - type: Stamina
  - type: StunVisuals
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: Deathgasp
  - type: HealthExaminable
    examinableTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Shock
    - Cold
    - Caustic
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: Pullable

- type: entity
  save: false
  id: CEMobMurkDissolving
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: CEMurkDissolvingSlowdown
  - type: CEMurkDissolvingAccent
  - type: CEMurkDissolving
    conversionRemoveComponents:
    - type: Damageable
    - type: SSDIndicator
    - type: MobCollision
    - type: CEMurkDissolvingAccent
    conversionComponents:
    - type: CEGOAP
      behaviors:
      - MurkSoulChatter
      - Explorer
    - type: CEGOAPEyesPerceptor
      visionRadius: 8
      components:
      - type: NpcFactionMember
      - type: CEMurkedSoulSpeech
    - type: ActiveListener
      range: 12
    - type: CEMurkedSoulSpeech
    - type: CEMurkedSoulSpeechAccent

- type: entity
  id: CEMobCombat
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: CombatMode
  - type: CEWeapon
    range: 0.4
    effectSlots:
      OnHit:
      - !type:WeaponArcAttack
        arcWidth: 40
        effects:
        - !type:Damage
          damage:
            types:
              Blunt: 4
    animations:
      Primary:
      - anim: Punch1
      - anim: Punch2
      Secondary:
      - anim: Kick
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 20

- type: entity
  id: CEMobMagical
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: RadiationReceiver
  - type: CEEnergyRadiationRegeneration
  - type: CEEnergyOverchargeDamage
  - type: CEEnergyDeficitDamage
