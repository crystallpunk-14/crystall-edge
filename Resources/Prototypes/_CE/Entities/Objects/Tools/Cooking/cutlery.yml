- type: entity
  parent: BaseItem
  id: CEFork
  name: fork
  description: Thousands of years of progress, and there it is, the fork.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/cutlery.rsi
    state: fork
  - type: Item
    sprite: _CE/Objects/Tools/cutlery.rsi
    heldPrefix: fork
  - type: Utensil
    types:
    - Fork
  - type: CEWeapon
    range: 0.4
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Piercing: 2
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Piercing: 2
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
      Secondary:
      - anim: DaggerAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 20
  - type: CERotationForAnimation
    rotation: 180
  - type: PhysicalComposition
    materialComposition:
      CEIron: 5
  - type: CEMagicEssenceStructure
    essences:
      Metal:
        min: 1
        max: 3

- type: entity
  parent: BaseItem
  id: CESpoon
  name: spoon
  description: It is considered the first tool for eating, not counting the hands.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/cutlery.rsi
    state: spoon
  - type: Item
    sprite: _CE/Objects/Tools/cutlery.rsi
    heldPrefix: spoon
  - type: Utensil
    types:
    - Spoon
  - type: CEWeapon
    range: 0.4
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 1
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 1
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
      Secondary:
      - anim: DaggerAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 20
  - type: CERotationForAnimation
    rotation: 180
  - type: ReactionMixer
    mixMessage: "spoon-mixing-success"
    timeToMix: 0.5
    reactionTypes:
    - Stir
  - type: PhysicalComposition
    materialComposition:
      CEIron: 5
  - type: CEMagicEssenceStructure
    essences:
      Metal:
        min: 1
        max: 3
