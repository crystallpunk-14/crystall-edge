#MARK: Ore crab

# Small and skittish: runs from any enemy, bites only when cornered.
# A stone body: the pickaxe is the right tool both to kill it and to mine its corpse.
- type: entity
  parent:
  - CEMobSimple
  - CEMobCombat
  - CEMobGOAPBase
  id: CEMobOreCrabBase
  abstract: true
  name: ore crab
  description: A small, skittish crab with a shell of living stone, overgrown with ore.
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: Damageable
    damageModifierSet: CERockStructural
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: CEGOAP
    behaviors:
    - Coward
    - Explorer
  - type: NpcFactionMember
    factions:
    - CEStoneCrabs
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Mobs/orecrab.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: gold
  - type: MovementSpeedModifier
    baseSprintSpeed: 4
  - type: CEWeapon
    range: 0.5
    effectSlots:
      OnHit:
      - !type:WeaponArcAttack
        arcWidth: 40
        effects:
        - !type:Damage
          damage:
            types:
              Piercing: 3
              Structural: 15
    animations:
      Primary:
      - anim: RatBite
  - type: CESpawnAnimation
    animation: OreCreatureDigOut

- type: entity
  parent: CEMobOreCrabBase
  id: CEMobOreCrabGold
  name: gold ore crab
  categories: [ ForkFiltered ]
  components:
  - type: DamageStateVisuals
    states:
      Alive:
        Base: gold
      Dead:
        Base: dead_gold
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/picaxe2.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          CEStoneBlock1:
            min: 1
            max: 2
          CEGoldOre1:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: CEInnateSkills
    skills:
    - NightVision

#MARK: Ore spider

# Big and aggressive: hunts every enemy it sees.
- type: entity
  parent:
  - CEMobSimple
  - CEMobCombat
  - CEMobGOAPBase
  id: CEMobOreSpiderBase
  abstract: true
  name: ore spider
  description: A huge spider of living stone, its back overgrown with ore.
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
  - type: Damageable
    damageModifierSet: CERockStructural
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: CEGOAP
    behaviors:
    - MeleeAttacker
    - Explorer
    actions:
    # Cheaper than a plain bite, so it is used whenever off cooldown
    - !type:CEGOAPUseAction
      actionPrototype: CEActionOreSpiderLunge
      target: Enemy
      range: 2
      preconditions:
        Rested: true
      effects:
        EnemyDead: true
      cost: 0.5
  - type: NpcFactionMember
    factions:
    - CEStoneCrabs
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Mobs/orecrabspider.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
    - map: ["enum.DamageStateVisualLayers.BaseUnshaded"]
      state: gold
  - type: MovementSpeedModifier
    baseSprintSpeed: 3.4
  # Stone tapping, audible from afar and through walls
  - type: Tag
    tags:
    - FootstepSound
  - type: MobMover
    stepSoundMoveDistanceRunning: 1.4
    stepSoundMoveDistanceWalking: 1.4
  - type: FootstepModifier
    footstepSoundCollection:
      collection: CEStepOreSpider
      params:
        maxDistance: 20
  - type: CEWeapon
    range: 0.5
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Dash
        distance: -1
      - !type:WeaponArcAttack
        arcWidth: 80
        effects:
        - !type:Damage
          damage:
            types:
              Piercing: 8
              Structural: 20
    animations:
      Primary:
      - anim: OreSpiderClaws
  - type: CEInnateSkills
    skills:
    - NightVision
  - type: CESpawnAnimation
    animation: OreCreatureDigOut

#MARK: Dig out

# Rises out of the ground while fading in, rocking side to side and kicking up dust
- type: entityEffectAnimation
  id: OreCreatureDigOut
  movementSpeed: 0
  duration: 2
  events:
    0:
    - !type:UserAnimation
      offsetAnimation:
      - time: 0
        offset: 0, -0.5
      - time: 1.8
        offset: 0, 0
        easing: QuadOut
      colorAnimation:
      - time: 0
        color: "#ffffff00"
      - time: 1.2
        color: "#ffffff"
      rotationAnimation:
      - time: 0
        rotation: 0
      - time: 0.25
        rotation: 20
        easing: QuadOut
      - time: 0.55
        rotation: -20
        easing: QuadInOut
      - time: 0.85
        rotation: 16
        easing: QuadInOut
      - time: 1.15
        rotation: -12
        easing: QuadInOut
      - time: 1.45
        rotation: 8
        easing: QuadInOut
      - time: 1.7
        rotation: -4
        easing: QuadInOut
      - time: 1.9
        rotation: 0
        easing: QuadOut
    - !type:PlaySound
      positional: true
      sound:
        path: /Audio/Effects/break_stone.ogg
        params:
          variation: 0.1
          volume: -6
    - !type:SpawnEntity
      effectTarget: User
      spawns:
      - CEDustTileEffect
    0.6:
    - !type:SpawnEntity
      effectTarget: User
      offset: 0.3, 0.1
      spawns:
      - CEDustTileEffect
    - !type:PlaySound
      positional: true
      sound:
        path: /Audio/Effects/break_stone.ogg
        params:
          variation: 0.1
          volume: -6
    1.2:
    - !type:SpawnEntity
      effectTarget: User
      offset: -0.3, 0.1
      spawns:
      - CEDustTileEffect
    - !type:PlaySound
      positional: true
      sound:
        path: /Audio/Effects/break_stone.ogg
        params:
          variation: 0.1
          volume: -6

- type: entity
  parent: CEMobOreSpiderBase
  id: CEMobOreSpiderCoal
  name: coal ore spider
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
    - map: ["enum.DamageStateVisualLayers.BaseUnshaded"]
      state: coal
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
        BaseUnshaded: coal
      Dead:
        Base: dead
        BaseUnshaded: dead_coal
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/picaxe2.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          CEStoneBlock1:
            min: 3
            max: 5
          CECoal1:
            min: 8
            max: 16
          CEStoneHeart:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: CEMobOreSpiderBase
  id: CEMobOreSpiderGold
  name: gold ore spider
  categories: [ ForkFiltered ]
  components:
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
        BaseUnshaded: gold
      Dead:
        Base: dead
        BaseUnshaded: dead_gold
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/picaxe2.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          CEStoneBlock1:
            min: 3
            max: 5
