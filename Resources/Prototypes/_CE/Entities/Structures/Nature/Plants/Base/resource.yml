- type: entity
  id: CEPlantBaseMetabolizer
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: liq-1
      sprite: _CE/Structures/Nature/Farm/watered.rsi
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: CEPlantMetabolizer
    solution: plant
  - type: Solution
    id: plant
    solution:
      maxVol: 50
  - type: CEWeatherRefillable
    solution: plant
  - type: RefillableSolution
    solution: plant
    maxRefill: 50
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: liq-
    solutionName: plant

- type: entity
  parent: CEPlantBaseMetabolizer
  id: CEPlantBaseMetabolizerFast
  abstract: true
  components:
  - type: CEPlantMetabolizer
    solutionPerUpdate: 20 # CrystallEdge: matches CEPlantBaseGrowingFast pace - fully dry in ~2.5 minutes

- type: entity
  parent: CEPlantBaseMetabolizer
  id: CEPlantBaseMetabolizerMedium
  abstract: true
  components:
  - type: CEPlantMetabolizer
    solutionPerUpdate: 12 # CrystallEdge: matches CEPlantBaseGrowingMedium pace - fully dry in ~4.2 minutes

- type: entity
  parent: CEPlantBaseMetabolizer
  id: CEPlantBaseMetabolizerSlow
  abstract: true
  components:
  - type: CEPlantMetabolizer
    solutionPerUpdate: 8 # CrystallEdge: matches CEPlantBaseGrowingSlow pace - fully dry in ~6.25 minutes

- type: entity
  id: CEPlantBaseMetabolizerWater
  abstract: true
  components:
  - type: CEPlantMetabolizer
    metabolization:
      Water:
        - !type:AffectPlantResource
          amount: 1
