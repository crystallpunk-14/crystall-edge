- type: markingsGroup
  id: CEDwarf
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
      default: [ CEHumanHair_part ]
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false

- type: entity
  parent: CEBaseSpeciesAppearance
  id: CEAppearanceDwarf
  categories: [ ForkFiltered, HideSpawnMenu ]
  components:
  - type: Inventory
    templateId: CEHuman
    displacements:
      shoes:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Dwarf/displacement.rsi
            state: shoes
      pants:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Dwarf/displacement.rsi
            state: pants
      neck:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: male_neck
          48:
            sprite: _CE/Mobs/Species/Human/displacement48.rsi
            state: male_neck
  - type: InitialBody
    organs:
      Torso: CEOrganDwarfTorso
      Head: CEOrganDwarfHead
      ArmLeft: CEOrganDwarfArmLeft
      ArmRight: CEOrganDwarfArmRight
      HandRight: CEOrganDwarfHandRight
      HandLeft: CEOrganDwarfHandLeft
      LegLeft: CEOrganDwarfLegLeft
      LegRight: CEOrganDwarfLegRight
      FootLeft: CEOrganDwarfFootLeft
      FootRight: CEOrganDwarfFootRight
      Brain: OrganHumanBrain
      Eyes: CEOrganDwarfEyes
      Heart: OrganHumanHeart
      Lungs: OrganHumanLungs
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: CEDwarf

- type: entity
  parent:
  - CEAppearanceDwarf
  - CEBaseSpeciesMobOrganic
  id: CEMobDwarf
  name: Mr. Dwarf
  components:
  - type: Icon
    sprite: _CE/Mobs/Species/Dwarf/parts.rsi
    state: full

- type: entity
  parent: OrganBase
  id: CEOrganDwarf
  categories: [ ForkFiltered ]
  abstract: true
  suffix: dwarf

- type: entity
  parent: CEOrganDwarf
  id: CEOrganDwarfExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _CE/Mobs/Species/Dwarf/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _CE/Mobs/Species/Dwarf/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: CEDwarf

- type: entity
  parent: [ CEOrganBaseTorsoSexed, OrganBaseTorso, CEOrganDwarfExternal ]
  id: CEOrganDwarfTorso

- type: entity
  parent: [ CEOrganBaseHeadSexed, OrganBaseHead, CEOrganDwarfExternal ]
  id: CEOrganDwarfHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

- type: entity
  parent: [ CEOrganBaseArmLeftNonSexed, OrganBaseArmLeft, CEOrganDwarfExternal ]
  id: CEOrganDwarfArmLeft

- type: entity
  parent: [ CEOrganBaseArmRightNonSexed, OrganBaseArmRight, CEOrganDwarfExternal ]
  id: CEOrganDwarfArmRight

- type: entity
  parent: [ CEOrganBaseHandLeftNonSexed, OrganBaseHandLeft, CEOrganDwarfExternal ]
  id: CEOrganDwarfHandLeft

- type: entity
  parent: [ CEOrganBaseHandRightNonSexed, OrganBaseHandRight, CEOrganDwarfExternal ]
  id: CEOrganDwarfHandRight

- type: entity
  parent: [ CEOrganBaseLegLeftNonSexed, OrganBaseLegLeft, CEOrganDwarfExternal ]
  id: CEOrganDwarfLegLeft

- type: entity
  parent: [ CEOrganBaseLegRightNonSexed, OrganBaseLegRight, CEOrganDwarfExternal ]
  id: CEOrganDwarfLegRight

- type: entity
  parent: [ CEOrganBaseFootLeftNonSexed, OrganBaseFootLeft, CEOrganDwarfExternal ]
  id: CEOrganDwarfFootLeft

- type: entity
  parent: [ CEOrganBaseFootRightNonSexed, OrganBaseFootRight, CEOrganDwarfExternal ]
  id: CEOrganDwarfFootRight

- type: entity
  parent: [ OrganBaseEyes, OrganHumanInternal, CEOrganDwarfExternal ]
  id: CEOrganDwarfEyes
  components:
  - type: VisualOrgan
    data:
      sprite: _CE/Mobs/Customization/eyes.rsi
