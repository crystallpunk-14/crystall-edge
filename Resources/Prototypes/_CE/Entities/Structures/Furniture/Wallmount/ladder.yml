- type: entity
  id: CEBaseLadder
  parent: CEBaseWallmount
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    drawdepth: Mobs
    offset: 0, 0.6
  - type: Physics
    bodyType: Static
    canCollide: true
  # Grip zone: the wall-side part of the tile. In local space the wall is to the north (+Y).
  - type: Fixtures
    fixtures:
      ladder:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,0.1,0.4,0.5"
        hard: false
        layer:
        - SlipLayer
  - type: CELadder

- type: entity
  id: CEWoodenLadder
  parent: CEBaseLadder
  name: wooden ladder
  description: A wooden ladder nailed to the wall. Walk into the wall to climb, walk slowly to hold on.
  components:
  - type: Sprite
    sprite: _CE/Structures/Furniture/ladder.rsi
    state: wooden
  - type: Damageable
    damageModifierSet: CEWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CEWoodenPlanks1:
            min: 1
            max: 1
  - type: Construction
    graph: CEWoodenLadder
    node: CEWoodenLadder
