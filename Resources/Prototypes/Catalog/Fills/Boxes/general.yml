- type: entity
  parent: BoxBase
  id: BoxCardboard
  name: cardboard box
  description: A cardboard box for storing things.
  components:
  - type: Construction
    graph: BoxCardboard
    node: boxcardboard
    containers:
      - storagebase
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 100
  - type: Sprite
    state: box
  - type: Tag
    tags:
    - BoxCardboard

- type: entity
  parent: BoxBaseSmall
  id: BoxCardboardSmall
  name: small cardboard box
  description: A small cardboard box for storing things.
  components:
  - type: Construction
    graph: BoxCardboardSmall # Half the material cost of the "regular" cardboardbox
    node: boxcardboardsmall
    containers:
      - storagebase
  - type: PhysicalComposition # Half of the "regular" cardboard box
    materialComposition:
      Cardboard: 50
  - type: Sprite
    state: box
  - type: Tag
    tags:
    - BoxCardboard

- type: entity
  name: lightbulb box
  parent: BoxCardboard
  id: BoxLightbulb
  description: This box is shaped on the inside so that only light tubes and bulbs fit.
  components:
  - type: Sprite
    layers:
      - state: box
      - state: light
  - type: Storage
    grid:
    - 0,0,5,3
    whitelist:
      components:
      - LightBulb
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: LightBulb
        amount: 12

- type: entity
  name: lighttube box
  parent: BoxLightbulb
  id: BoxLighttube
  components:
  - type: Sprite
    layers:
      - state: box
      - state: lighttube
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: LightTube
        amount: 12

- type: entity
  name: mixed lights box
  parent: BoxLightbulb
  id: BoxLightMixed
  components:
  - type: Sprite
    layers:
      - state: box
      - state: lightmixed
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: LightTube
          amount: 6
        - id: LightBulb
          amount: 6

- type: entity
  name: inflatable wall box
  parent: BoxCardboard
  id: BoxInflatable
  description: Inflatable walls are not to be used as floatation devices.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
          - id: InflatableWallStack
            amount: 2
          - id: InflatableDoorStack
            amount: 2
  - type: Sprite
    layers:
      - state: box
      - state: inflatable

- type: entity
  name: hatsune miku day bag
  parent: ClothingBackpackDuffel
  id: BoxPerformer
  description: Happy Hatsune Miku Day!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingShoesBootsPerformer
        - id: ClothingUniformJumpskirtPerformer
        - id: ClothingHeadPerformerWig
        - id: FoodMealMemoryleek
          amount: 2

- type: entity
  name: candle box
  parent: BoxCardboard
  id: BoxCandle
  description: This box is specifically moulded to only carry candles.
  components:
  - type: Sprite
    layers:
      - state: box
      - state: candle
  - type: Storage
    grid:
    - 0,0,5,3
    whitelist: # TODO cardboard boxes shouldn't have whitelisting
      tags:
      - Candle
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Candle
          amount: 4
        - id: CandleBlue
          amount: 2
        - id: CandleRed
          amount: 2
        - id: CandleGreen
          amount: 2
        - id: CandlePurple
          amount: 2

- type: entity
  name: small candle box
  parent: BoxCandle
  id: BoxCandleSmall
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: CandleSmall
          amount: 8
        - id: CandleBlueSmall
          amount: 4
        - id: CandleRedSmall
          amount: 4
        - id: CandleGreenSmall
          amount: 4
        - id: CandlePurpleSmall
          amount: 4

- type: entity
  parent: BoxCardboard
  id: BoxDarts
  name: darts box
  description: A box filled with colorful darts.
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Storage
    maxItemSize: Tiny
  - type: Sprite
    layers:
      - state: box
      - state: darts
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Dart
          amount: 2
        - id: DartBlue
          amount: 2
        - id: DartPurple
          amount: 2
        - id: DartYellow
          amount: 2

- type: entity
  name: envelope box
  parent: BoxCardboard
  id: BoxEnvelope
  description: A box filled with envelopes.
  components:
  - type: Sprite
    layers:
      - state: box
      - state: envelope
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Envelope
        amount: 9
