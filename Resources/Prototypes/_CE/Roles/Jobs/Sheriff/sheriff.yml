- type: job
  id: CESheriff
  setPreference: true
  name: ce-job-name-sheriff
  description: ce-job-desc-sheriff
  playTimeTracker: CEJobSheriff
  startingGear: CESheriffGear
  icon: CEJobIconSheriff
  supervisors: ce-job-supervisors-empire
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 1h
  special:
    - !type:CELearnSkillsSpecial
      skills:
      - MilitaryTraining

- type: startingGear
  id: CESheriffGear
  equipment:
    belt: CEKeyRingSheriff
    pocket1: CEWalletFilledSheriff
  storage:
    back:
    - CEWeaponGunJustice

- type: entity
  id: CEWalletFilledSheriff
  parent: CEWallet
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents: #100cp total
    - id: CECoinSilver5
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinCopper10

- type: entity
  id: CEKeyRingSheriff
  parent: CEBaseKeyRing
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents:
    - id: CEKeySheriffHall
    - id: CEKeySheriffStaff

- type: entity
  id: CEBedsideTableFilledSheriff
  parent: CEBedsideTableWooden
  suffix: Filled, Sheriff
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        rolls: !type:RangeNumberSelector
          range: 2, 3
        children:
        - id: CEClothingCloakSheriff
        - id: CEClothingHeadHelmetSheriff
        - id: CEClothingHeadHelmetSheriffCorinthian
        - id: CEClothingHeadCapSheriff
        - id: CEClothingHeadFedoraSheriff
        - id: CEClothingHeadTriangularSheriff
        - id: CEClothingShirtSheriff
        - id: CEClothingShirtSyurkoSheriff
        - id: CEClothingPantsSheriff

- type: entity
  id: CEChestFilledSheriff
  parent: CEWoodenChest
  suffix: Filled, Sheriff
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CEWeaponGunJustice
        - id: CERope
        - id: CERope
        - id: CERope
