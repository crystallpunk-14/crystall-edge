- type: entity
  id: CEWrench
  categories: [ ForkFiltered ]
  parent:
  - BaseItem
  name: wrench
  description: 'A common tool for assembly and disassembly. Remember: lefty latchy, righty removey.'
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/wrench_drop.ogg
  - type: Tag
    tags:
    - Wrench
  - type: Sprite
    sprite: _CE/Objects/Tools/wrench.rsi
    state: icon
  - type: Item
    sprite: _CE/Objects/Tools/wrench.rsi
    storedRotation: -90
  - type: CEWeapon
    range: 0.4
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 2
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 2
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
      Secondary:
      - anim: DaggerAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 20
  - type: CERotationForAnimation
    rotation: 90
  - type: Tool
    qualities:
      - Anchoring
    useSound:
      path: /Audio/Items/ratchet.ogg
  - type: PhysicalComposition
    materialComposition:
      CEIron: 7
  - type: CEMagicEssenceStructure
    essences:
      Metal:
        min: 1
        max: 3
      Tool:
        min: 0
        max: 2
