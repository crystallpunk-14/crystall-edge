- type: entity
  parent: BaseItem
  id: CELightShardBase
  abstract: true
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _CE/Objects/Specific/MainQuest/light_shards.rsi
    layers:
    - state: shard1
      shader: unshaded
  - type: PointLight
    color: "#8ebab9"
    energy: 1
    radius: 2
  - type: CEMagicEssenceStructure
    essences:
      Light: { min: 1, max: 3 }
      Crystal: { min: 1, max: 2 }

- type: entity
  parent: CELightShardBase
  id: CELightShard1
  name: first lightheart shard
  description: The first of the four shards needed to restore the Lucson Sphere.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    layers:
    - state: shard1
      shader: unshaded
  - type: CEQuestItem
    index: 1

