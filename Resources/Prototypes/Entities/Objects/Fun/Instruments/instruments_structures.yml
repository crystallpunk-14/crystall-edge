- type: entity
  name: vibraphone
  id: VibraphoneInstrument
  parent: BasePlaceableInstrumentRotatable
  description: Good vibes all around.
  components:
  - type: Instrument
    program: 11
  - type: Sprite
    state: vibraphone
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds: &ThresholdsFurnitureStrongRods
    - trigger: &DamageFurnitureStrong
        !type:DamageTrigger
        damage: 80
      behaviors:
      - &SoundMetalBreak !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 2
            max: 4

- type: entity
  name: tuba
  parent: BasePlaceableInstrument
  id: TubaInstrument
  description: The big daddy of the brass family. Standing next to its majesty makes you feel insecure.
  components:
  - type: Instrument
    program: 58
  - type: Sprite
    state: tuba
  - type: Damageable
    damageModifierSet: BrassMod
  - type: Destructible
    thresholds: &ThresholdsFurnitureStrongBrass
    - trigger: *DamageFurnitureStrong
      behaviors:
      - *SoundMetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetBrass1:
            min: 2
            max: 4

- type: entity
  id: HarpInstrument
  parent: BasePlaceableInstrument
  name: harp
  description: Plucking at the strings cuts your fingers, but at least the music is pretty.
  components:
  - type: Instrument
    program: 46
  - type: Sprite
    state: harp
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds: &ThresholdsFurnitureStrongWood
    - trigger: 
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -3
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 2
            max: 4

- type: entity
  parent: [ BasePlaceableInstrumentRotatable, ConstructibleMachine]
  id: DawInstrument
  name: digital audio workstation
  description: Cutting edge music technology, straight from the 90s.
  components:
  - type: Sprite
    layers:
    - state: daw-base
    - state: daw-display
      shader: unshaded
    - state: daw-panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: WiresVisuals
  - type: WiresPanel
  - type: Machine
    board: DawInstrumentMachineCircuitboard
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
  - type: Destructible
    thresholds:
    - trigger: *DamageFurnitureStrong
      behaviors:
      - *SoundMetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
