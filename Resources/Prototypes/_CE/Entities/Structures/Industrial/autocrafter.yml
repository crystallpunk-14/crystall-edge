# Example prototype for AutoCrafter
# This file demonstrates how to use the CEWorkbenchAutoCrafter component
# You can customize this based on your needs

- type: entity
  parent:
  - BaseMachine
  - CEBaseMachinePowered
  id: CEBaseAutoCrafter
  categories: [ ForkFiltered ]
  abstract: true
  name: automatic workbench
  description: An automated crafting station that continuously produces the selected recipe.
  components:
  - type: Sprite
    snapCardinals: true
    sprite: _CE/Structures/Furniture/Tables/workbench.rsi
    state: filler
  - type: Icon
    sprite: _CE/Structures/Furniture/Tables/workbench.rsi
    state: filler
  - type: ActivatableUI
    key: enum.CEWorkbenchUiKey.Key
    requiresComplex: true
    singleUser: true
  - type: Climbable
  - type: Clickable
  - type: CEWorkbenchAutoCrafter
  - type: CEWorkbenchContainerProvider
    containerName: storagebase
  - type: CEWorkbench
    craftSpeed: 1
  - type: InteractionOutline
  - type: UserInterface
    interfaces:
      enum.CEWorkbenchUiKey.Key:
        type: CEAutoCrafterBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Storage
    grid:
    - 0,0,7,7
    openOnActivate: false
    maxItemSize: Ginormous
    storageOpenSound: /Audio/Effects/closetopen.ogg
    storageCloseSound: /Audio/Effects/closetclose.ogg
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CEWood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CEWoodenPlanks1:
            min: 1
            max: 2
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask: # tables should collide with other tables
        - TableMask
        layer:
        - TableLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false
  - type: DoAfter
  - type: ApcPowerReceiver
    powerLoad: 2

- type: entity
  parent:
  - CEBaseAutoCrafter
  id: CEWorkbenchAutoMeltingFurnace
  name: melting furnace
  components:
  - type: Sprite
    state: workbench
  - type: Icon
    state: workbench
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood
  - type: CEWorkbench
    recipeTags:
    - CERecipeMeltingFurnace
