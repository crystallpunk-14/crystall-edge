- type: job
  id: CEInvestigator
  setPreference: true
  name: ce-job-name-investigator
  description: ce-job-desc-investigator
  playTimeTracker: CEJobInvestigator
  startingGear: CEInvestigatorGear
  icon: CEJobIconInvestigator
  supervisors: ce-job-supervisors-guard-commander
  requirements:
    - !type:DepartmentTimeRequirement
      department: CEGuard
      time: 1h
    # The investigator mask is mandatory, these species have no mask slot
    - !type:SpeciesRequirement
      inverted: true
      species:
      - CECarrin
  special:
    - !type:CELearnSkillsSpecial
      skills:
      - MilitaryTraining

- type: startingGear
  id: CEInvestigatorGear
  equipment:
    belt: CEKeyRingInvestigator
    pocket1: CEWalletFilledInvestigator


- type: entity
  id: CEWalletFilledInvestigator
  parent: CEWallet
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents: #100cp total
    - id: CECoinSilver5
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinCopper10

- type: entity
  id: CEKeyRingInvestigator
  parent: CEBaseKeyRing
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents:
    - id: CEKeyGuardHall
    - id: CEKeyGuardStaff
