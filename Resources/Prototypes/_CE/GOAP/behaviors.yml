# Wanders around when there is nothing better to do.
- type: GOAPBehavior
  id: Explorer
  goals:
  - desiredState:
      Exploring: true
    priority: 0
  actions:
  - !type:CEGOAPExploreAction
    effects:
      Exploring: true
    cost: 1
    exploreRadius: 8

# Walks up to the nearest conscious enemy and attacks it in melee.
- type: GOAPBehavior
  id: MeleeAttacker
  targets:
    Enemy: !type:CEGOAPSelectorNearestKnown
      conditions:
      - !type:InEnemyFaction
      - !type:Incapacitated
        inverted: true
  goals:
  - desiredState:
      EnemyDead: true
    priority: 1
  actions:
  - !type:CEGOAPMeleeAttackAction
    target: Enemy
    range: 1
    effects:
      EnemyDead: true
    cost: 1
    useType: Primary
    angleVariation: 5

# Opens the shop by day and closes it at night: fills empty table slots while it's day,
# takes the offers back off the tables once night falls.
- type: GOAPBehavior
  id: ShadowTrader
  targets:
    EmptyTradeTable: !type:CEGOAPSelectorNearestKnown
      conditions:
      - !type:TradeTableHasFreeSlot
    StockedTradeTable: !type:CEGOAPSelectorNearestKnown
      conditions:
      - !type:TradeTableHasOffer
  sensors:
  - !type:CEGOAPIsNightSensorEntry
    conditionKey: IsNight
  goals:
  - desiredState:
      TradeTablesStocked: true
    preconditions:
      IsNight: false
    priority: 1
  - desiredState:
      TradeTablesCleared: true
    preconditions:
      IsNight: true
    priority: 1
  actions:
  - !type:CEGOAPUseAction
    actionPrototype: CEActionRestockTradeTable
    target: EmptyTradeTable
    range: 2
    effects:
      TradeTablesStocked: true
    cost: 1
  - !type:CEGOAPUseAction
    actionPrototype: CEActionClearTradeTable
    target: StockedTradeTable
    range: 2
    effects:
      TradeTablesCleared: true
    cost: 1

# Strikes up conversations with nearby souls and players now and then, and keeps
# standing and answering while a conversation goes on.
- type: GOAPBehavior
  id: MurkSoulChatter
  targets:
    Self: !type:CEGOAPSelectorSelf
    Interlocutor: !type:CEGOAPSelectorNearestKnown
      conditions:
      - !type:HasComponents
        any: true
        components:
        - type: CEMurkedSoulSpeech
        - type: Actor
      - !type:HasComponents
        inverted: true
        components:
        - type: CEMurkConversation
      - !type:Incapacitated
        inverted: true
  sensors:
  - !type:CEGOAPHasComponentSensorEntry
    conditionKey: InConversation
    target: Self
    components:
    - type: CEMurkConversation
  - !type:CEGOAPHasComponentSensorEntry
    conditionKey: ConversationTurn
    target: Self
    components:
    - type: CEMurkConversationTurn
  goals:
  - desiredState:
      ConversationStarted: true
    preconditions:
      InConversation: false
    priority: 0.5
  - desiredState:
      ConversationContinued: true
    preconditions:
      InConversation: true
    priority: 1.5
  actions:
  - !type:CEGOAPUseAction
    actionPrototype: CEActionMurkStartConversation
    target: Interlocutor
    range: 2
    effects:
      ConversationStarted: true
    cost: 1
  - !type:CEGOAPUseAction
    actionPrototype: CEActionMurkConversationReply
    preconditions:
      ConversationTurn: true
    effects:
      ConversationContinued: true
    cost: 1
  - !type:CEGOAPIdleAction
    preconditions:
      ConversationTurn: false
    effects:
      ConversationContinued: true
    cost: 1
