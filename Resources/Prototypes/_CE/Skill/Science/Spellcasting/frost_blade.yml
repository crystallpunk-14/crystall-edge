- type: skill
  id: FrostBladeTheory
  parent: SpellcastingSkillBase
  icon:
    sprite: _CE/Objects/Weapons/Sword/ice_temporary.rsi
    state: icon

- type: skill
  id: FrostBladeMastery
  parent: SpellcastingMasterySkillBase
  icon:
    sprite: _CE/Objects/Weapons/Sword/ice_temporary.rsi
    state: icon
  effect: !type:AddAction
    action: CEActionFrostBlade

- type: entity
  id: CEActionFrostBlade
  name: Frost blade
  description: You create a powerful temporary weapon made of ice that deals high damage.
  components:
  - type: CEActionManaCost
    manaCost: 25
  - type: CEActionEssenceCost
    essenceCost:
      Weapon: 1
      Frost: 2
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
    icon:
      sprite: _CE/Objects/Weapons/Sword/ice_temporary.rsi
      state: icon
  - type: InstantAction
    event: !type:CEInstantActionAnimationEvent
      animation: AnimationFrostBlade

- type: entityEffectAnimation
  id: AnimationFrostBlade
  movementSpeed: 0.3
  duration: 1.5
  lockRotation: true
  events:
    0:
    - !type:SpawnEntity
      reparent: true
      effectTarget: User
      spawns:
      - CEEffectFrostConsume
    - !type:PlaySound
      sound:
        path: /Audio/_CE/Effects/ice_burst.ogg
        params:
          pitch: 1.6
    - !type:UsedEntityAnimation
      dummyEntity: CEWeaponSwordFrostTemporary
      offsetAnimation:
      - time: 0
        offset: -0, -0.3
        easing: QuadIn
      - time: 0.4
        offset: -0.5, -0.2
        easing: QuadOut
      - time: 0.8
        offset: -0.5, 0.1
        easing: QuadOut
      rotationAnimation:
      - time: 0
        rotation: 0
        easing: QuadIn
      - time: 0.4
        rotation: -30
      - time: 0.8
        rotation: -90
        easing: QuadOut
      colorAnimation:
        - time: 0.9
          color: "#ffffff"
        - time: 1
          color: "#ffffff01"
    0.6:
    - !type:SpawnInHandEntity
      spawns:
      - CEWeaponSwordFrostTemporary

- type: entity
  id: CEWeaponSwordFrostTemporary
  parent: BaseItem
  categories: [ ForkFiltered ]
  name: frost blade
  suffix: 120 seconds
  description: A magical weapon woven from ice, which will soon melt away.
  components:
  - type: Item
    size: Large
    shape:
    - 0, 0, 3, 0
  - type: Sprite
    sprite: _CE/Objects/Weapons/Sword/ice_temporary.rsi
    layers:
    - state: icon
      shader: unshaded
  - type: CERotationForAnimation
    rotation: -90
  - type: CEWeapon
    range: 0.7
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Slash: 9
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Slash: 9
    animations:
      Primary:
      - anim: SwordAttackLight1
      - anim: SwordAttackLight2
      Secondary:
      - anim: SwordAttackHeavy1
        speed: 1.2
      - anim: SwordAttackHeavy2
        speed: 1.2
  - type: CEWeaponStaminaCost
    costs:
      Primary: 7
      Secondary: 7
  - type: TimedDespawn
    lifetime: 120
  - type: PointLight
    color: "#159fee"
    radius: 2.5
    energy: 2
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 1 }
      Frost: { min: 2, max: 2 }
