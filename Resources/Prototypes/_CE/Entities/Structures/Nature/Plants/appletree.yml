- type: entity
  id: CEPlantAppleTree
  parent:
  - CEGatherablePlantMultiHarvestBase
  - CEBaseTree
  name: apple tree
  description: A sturdy tree that bears delicious apples.
  components:
  - type: CEPlant
    updateFrequency: 1
  - type: CEPlantVisuals
    growthSteps: 4
    readyVariations: 2
    produceVisualStates:
      CEFoodAppleFalling: 2
  - type: Physics
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 1000
        layer:
        - WallLayer
  - type: Sprite
    noRot: true
    offset: 0, 0.9
    drawdepth: Mobs
    layers:
    - state: liq-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      sprite: _CE/Structures/Nature/Farm/apple_tree.rsi
      map: ["enum.PlantVisualLayers.Base"]
    - state: produce-CEFoodAppleFalling-var1-state1
      sprite: _CE/Structures/Nature/Farm/apple_tree.rsi
      visible: false
      map: ["Produce-CEFoodAppleFalling"]
  - type: CEPlantProducing
    gatherOffset: 2
    produce:
      CEFoodAppleFalling:
        maxProduce: 10
        resourceCost: 1
        energyCost: 0.5
  - type: CEPlantGatherOnInteract
    produce:
    - CEFoodAppleFalling
    toolWhitelist:
      components:
      - Sharp
  - type: CEPlantAdditionalProduceOnDestruct
    produce:
      CEWoodLog: 3
  - type: CEWaveShader
    speed: 3
    dis: 4
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/chop.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 50
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/tree_fell.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
