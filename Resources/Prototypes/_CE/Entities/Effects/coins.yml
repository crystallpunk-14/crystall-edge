- type: entity
  id: CEEffectShinyBase
  categories: [ ForkFiltered ]
  abstract: true
  name: shine sparkle
  suffix: VFX
  save: false
  components:
  - type: Sprite
    sprite: _CE/Effects/sparkle_coin.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: effect
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: Tag
    tags:
    - HideContextMenu
  - type: PointLight
    radius: 1.5
    netsync: false
    castShadows: false
  - type: LightBehaviour
    behaviours:
    - !type:PulseBehaviour
      interpolate: Linear
      maxDuration: 1.5
      startValue: 0
      endValue: 5.0
      property: Energy
      isLooped: false
      enabled: true
  - type: TimedDespawn
    lifetime: 1.5

- type: entity
  id: CEEffectShinyPlatinum
  parent: CEEffectShinyBase
  categories: [ ForkFiltered ]
  suffix: Platinum
  save: false
  components:
  - type: Sprite
    color: "#e5e4e2"
  - type: PointLight
    color: "#e5e4e2"

