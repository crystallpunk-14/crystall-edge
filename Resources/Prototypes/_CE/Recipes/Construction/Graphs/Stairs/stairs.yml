# One shared graph for the whole stairs/roof family. Every shape (straight/corner/inner corner)
# starts as the same wooden CEZLevelStairsFrame*, and branches into wood, stone, or a
# red/green/blue tile roof depending on what covering material gets nailed onto it.

- type: constructionGraph
  id: CEZLevelStairs
  start: start
  graph:
    - node: start
      edges:
        - to: CEZLevelStairsFrame
          completed:
            - !type:SnapToGrid
          steps:
            - material: CEWood
              amount: 2
              doAfter: 2

    - node: CEZLevelStairsFrame
      entity: CEZLevelStairsFrame
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CEWoodenPlanks1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 2
        - to: CEZLevelStairsFrameCorner
          steps:
            - tool: Screwing
              doAfter: 1
        - to: CEZLevelStairsWooden
          steps:
            - material: CEWood
              amount: 1
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsStone
          steps:
            - material: CEStone
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsRoofRed
          steps:
            - material: CEFloorTileRoofRed
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsRoofGreen
          steps:
            - material: CEFloorTileRoofGreen
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsRoofBlue
          steps:
            - material: CEFloorTileRoofBlue
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1

    - node: CEZLevelStairsFrameCorner
      entity: CEZLevelStairsFrameCorner
      edges:
        - to: CEZLevelStairsFrame
          steps:
            - tool: Screwing
              doAfter: 1
        - to: CEZLevelStairsFrameCornerInner
          steps:
            - tool: Screwing
              doAfter: 1
        - to: CEZLevelStairsWoodenCorner
          steps:
            - material: CEWood
              amount: 1
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsStoneCorner
          steps:
            - material: CEStone
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsRoofRedCorner
          steps:
            - material: CEFloorTileRoofRed
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsRoofGreenCorner
          steps:
            - material: CEFloorTileRoofGreen
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsRoofBlueCorner
          steps:
            - material: CEFloorTileRoofBlue
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1

    - node: CEZLevelStairsFrameCornerInner
      entity: CEZLevelStairsFrameCornerInner
      edges:
        - to: CEZLevelStairsFrameCorner
          steps:
            - tool: Screwing
              doAfter: 1
        - to: CEZLevelStairsWoodenCornerInner
          steps:
            - material: CEWood
              amount: 1
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsStoneCornerInner
          steps:
            - material: CEStone
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsRoofRedCornerInner
          steps:
            - material: CEFloorTileRoofRed
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsRoofGreenCornerInner
          steps:
            - material: CEFloorTileRoofGreen
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelStairsRoofBlueCornerInner
          steps:
            - material: CEFloorTileRoofBlue
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
