- type: entity
  id: CEMurkShield
  parent: BaseItem
  categories: [ ForkFiltered ]
  name: murk shield
  description: A floating orb of light, kindled by the murk shield generator at dawn. Dispels the murk, but fades through the day and dies out at sunset.
  components:
  - type: Item
    size: Ginormous
    inhandVisuals: # no inhand sprites, the orb itself floats above the carrier's head
      left:
      - sprite: _CE/Effects/sphere_of_light.rsi
        state: effect
        shader: unshaded
        offset: 0, 0.8
      right:
      - sprite: _CE/Effects/sphere_of_light.rsi
        state: effect
        shader: unshaded
        offset: 0, 0.8
  - type: Sprite
    drawdepth: Effects
    sprite: _CE/Effects/sphere_of_light.rsi
    noRot: true
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    radius: 7.0
    energy: 1
    color: "#eef2f5"
  - type: CEMagicEssenceStructure
    essences:
      Light: { min: 4, max: 6 }
  - type: CEMurkSource
    intensity: -7
  - type: CEMurkShield
  - type: CESpawnAnimation
    animation: CEAnimationMurkShieldSpawn

- type: entityEffectAnimation
  id: CEAnimationMurkShieldSpawn
  movementSpeed: 0
  duration: 1
  events:
    0:
    - !type:SpawnEntity
      effectTarget: User
      spawns:
      - CEMurkShieldSpawnEffect
    - !type:UserAnimation
      colorAnimation:
      - time: 0.0
        color: "#ffffff01"
      - time: 0.9
        color: "#ffffff"

- type: entity
  id: CEMurkShieldSpawnEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CE/Effects/murk_shield_spawn.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: effect
      unshaded: true
      color: "#eef2f5"
  - type: TimedDespawn
    lifetime: 2
  - type: Tag
    tags:
      - HideContextMenu
  - type: PointLight
    color: "#eef2f5"
    enabled: true
    radius: 8
    energy: 8
    netsync: false
  - type: LightFade
    duration: 1.5
