- type: entity
  parent: BaseItem
  id: CEBell
  name: bell
  description: A regular bell with a handle to attract attention.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Decorations/bell.rsi
    state: icon
  - type: Tag
    tags:
      - Payload
  - type: StaticPrice
    price: 5
  - type: InteractionPopup
    successChance: 1
    interactSuccessSound:
      path: /Audio/_CE/Effects/bell.ogg
      params:
        variation: 0.03
        volume: 3
    onActivate: true
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_CE/Effects/bell.ogg
      params:
          variation: 0.03
          volume: 3
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_CE/Effects/bell.ogg
      params:
          variation: 0.03
          volume: 3
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_CE/Effects/bell_short.ogg
      params:
          variation: 0.03
          volume: 3
  - type: UseDelay
    delay: 1.5
  - type: CEWeapon
    range: 0.4
    hitSound:
      path: /Audio/_CE/Effects/bell_short.ogg
      params:
          variation: 0.03
          volume: 3
    effectSlots:
      OnHit:
      - !type:WeaponArcAttack
        arcWidth: 40
        effects:
        - !type:Damage
          damage:
            types:
              Blunt: 4
    animations:
      Primary:
      - anim: Punch1
      - anim: Punch2
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
