              prototype: CEBrassBar1
              amount: 2

    - node: CEPipeBrassBigBroken
      entity: CEPipeBrassBigBroken
      edges:
        - to: CEPipeBrassBig
          steps:
            - material: CEBrass
              amount: 1
              doAfter: 1
