- type: entity
  parent: BaseStructure
  id: CETradeStandBase
  abstract: true
  components:
  - type: PlacementReplacement
    key: floorTile
  - type: Physics
    canCollide: false
  - type: Fixtures
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _CE/Structures/Furniture/Carpets/murk.rsi
    drawdepth: FloorTiles
    color: "#ffffffd1"
  - type: CETradeTable
  - type: GuideHelp
    guides:
    - CETradeGuideEN
    - CETradeGuideRU

- type: entity
  parent: CETradeStandBase
  id: CETradeCarpetBase
  abstract: true
  name: murk trade carpet
  description: Traders post their items for sale here
  components:
  - type: Icon
    sprite: _CE/Structures/Furniture/Carpets/murk.rsi
    state: full
  - type: IconSmooth
    base: carpet_
  - type: Tag
    tags:
    - Carpet
    - ForceFixRotations
  - type: CETradeTable
    slots:
    - -0.22, 0.22
    - 0.22, 0.22
    - -0.22, -0.22
    - 0.22, -0.22

- type: entity
  parent: CETradeStandBase
  id: CETradePostamentBase
  abstract: true
  name: murk trade postament
  description: Traders showcase their special goods here
  components:
  - type: Sprite
    state: postament
  - type: Icon
    sprite: _CE/Structures/Furniture/Carpets/murk.rsi
    state: postament
  - type: Tag
    tags:
    - ForceFixRotations
  - type: CETradeTable
    slots:
    - 0, 0

- type: entity
  parent: CETradeCarpetBase
  id: CETradeTableHorticulture
  suffix: horticulture
  categories: [ ForkFiltered ]
  components:
  - type: IconSmooth
