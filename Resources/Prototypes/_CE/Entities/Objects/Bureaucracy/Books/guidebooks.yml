- type: entity
  id: CEGuidebookImperialLaws
  parent: CEGuidebookBase
  name: imperial laws
  description: A book about Imperial Laws.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#ce7f3e"
    - state: decor_frame
      color: "#2589db"
    - state: icon_plate
      color: "#5591e0"
    - state: bookmark_short
    - state: icon_religion
  - type: GuideHelp
    guides:
    - CEImperialLawsRU
    - CEImperialLawsEN

- type: entity
  id: CEGuidebookFarmingGuide
  parent: CEGuidebookBase
  name: farmer's guide
  description: A guide to plant care and maintenance. The author is, of course, Silva.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#3d9cdb"
    - state: decor_frame
      color: "#90ee90"
    - state: bookmark_short
    - state: icon_magic
      color: "#19fe19"
  - type: GuideHelp
    guides:
    - CEFarmingGuideRU
    - CEFarmingGuideEN
  - type: CEMagicEssenceStructure
    essences:
      Order: { min: 2, max: 6 }
      Plant: { min: 0, max: 2 }

- type: entity
  id: CEGuidebookCookingRecipes
  parent: CEGuidebookBase
  name: cookbook
  description: "1000 and 1 recipes - as written on the cover. This is a blatant lie."
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#ff8c00"
    - state: decor_frame
      color: "#ffa500"
    - state: icon_plate
      color: "#ff6347"
    - state: bookmark_short
    - state: icon_plate
    - state: icon_moon
      color: "#ff6347"
  - type: GuideHelp
    guides:
    - CECookingRecipesRU
    - CECookingRecipesEN
  - type: CEMagicEssenceStructure
    essences:
      Order: { min: 2, max: 6 }
      Life: { min: 0, max: 1 }

- type: entity
  id: CEGuidebookThaumaturgy
  parent: CEGuidebookBase
  name: thaumamicon
  description: A tome bound in essence-stained leather, cataloguing the aspects of thaumaturgy and how to derive them.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#3d1a52"
    - state: decor_frame
      color: "#a970ff"
    - state: icon_plate
      color: "#6c1384"
    - state: bookmark_short
    - state: icon_thaum
  - type: GuideHelp
    guides:
    - CEThaumaturgyRU
    - CEThaumaturgyEN
  - type: CEMagicEssenceStructure
    essences:
      Order: { min: 2, max: 6 }
      Magic: { min: 0, max: 2 }
