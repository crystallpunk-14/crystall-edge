      Lungs: OrganAnimalLungs
      Stomach: OrganAnimalStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganAnimalKidneys
  - type: HumanoidProfile
    species: CECarcat

- type: entity
  parent:
  - CEAppearanceCarcat
  - CEBaseSpeciesMobOrganic
  id: CEMobCarcat
  name: Mr. Cat
  components:
  - type: FireVisuals
    sprite: _CE/Mobs/Effects/onfire.rsi
    normalState: Small_burning
    alternateState: Carcat_burning
  - type: Icon
    sprite: _CE/Mobs/Species/Carcat/parts.rsi
    state: full
  - type: Vocal
    emoteSounds: CEUnisexCarcat
  - type: Speech
    speechSounds: CECarcat
  - type: MessyDrinker
    spillChance: 0.3
  - type: Wagging
  - type: CEWeapon
    range: 0.4
    hitSound:
      collection: AlienClaw
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Slash: 5 # 5 slash
    animations:
      Primary:
      - anim: ClawAttack1
      - anim: ClawAttack2
      - anim: ClawAttack3
  - type: CEWeaponStaminaCost
    costs:
      Primary: 5
  - type: NightVision #Night vision
    enabled: false
    prioritized: false
    relayOverlay: false
    action: ActionToggleNightVision
    lightingColor: '#FFFFFF15'
  - type: FootstepModifier
    footstepSoundCollection: null # Silent footstep
  - type: CESoftPaws #Soft paws. Awwww
    maxSpeedLimit: 7 # 2 floors safe fall
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CEBloodCarcat
        Quantity: 300

- type: entity
  parent: OrganBase
