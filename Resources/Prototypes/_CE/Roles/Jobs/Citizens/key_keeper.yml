- type: job
  id: CEKeyKeeper
  setPreference: true
  name: ce-job-name-key-keeper
  description: ce-job-desc-key-keeper
  playTimeTracker: CEJobKeyKeeper
  startingGear: CEKeyKeeperGear
  icon: CEJobIconKeyKeeper
  supervisors: ce-job-supervisors-empire

- type: startingGear
  id: CEKeyKeeperGear
  equipment:
    pocket1: CEWalletFilledKeyKeeper
    pocket2: CEKeyFile

- type: entity
  id: CEWalletFilledKeyKeeper
  parent: CEWallet
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents: #50cp total
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinCopper10
    - id: CECoinCopper10

- type: entity
  id: CEChestFilledKeyKeeper
  parent: CEWoodenChest
  suffix: Filled, Key Keeper
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CEKeyIronBlank
          amount: !type:ConstantNumberSelector
            value: 5
        - id: CELockIron
          amount: !type:ConstantNumberSelector
            value: 3
