#MARK: Buckler stance
- type: entityEffectAnimation
  id: BucklerStance
  duration: 1
  events:
    0:
    - !type:ApplyAnimationStatusEffect
      statusEffect: CEStatusEffectBucklerStance
    - !type:UsedEntityAnimation
      offsetAnimation:
      - time: 0.0
        offset: 0, -0.2
        easing: QuadOut
      - time: 0.1
        offset: 0, -0.5
      - time: 0.9
        offset: 0, -0.5
      - time: 1.0
        offset: 0, -0.2
        easing: QuadIn
      colorAnimation:
      - time: 0.0
        color: "#ffffff"
      - time: 0.9
        color: "#ffffff"
      - time: 1.0
        color: "#ffffff00"
        easing: QuadIn

#MARK: Shield stance
- type: entityEffectAnimation
  id: ShieldStance
  movementSpeed: 0.5
  duration: 2
  events:
    0:
    - !type:ApplyAnimationStatusEffect
      statusEffect: CEStatusEffectShieldStance
    - !type:UsedEntityAnimation
      offsetAnimation:
      - time: 0.0
        offset: 0, -0.2
        easing: QuadOut
      - time: 0.15
        offset: 0, -0.5
      - time: 1.85
        offset: 0, -0.5
      - time: 2.0
        offset: 0, -0.2
        easing: QuadIn
      colorAnimation:
      - time: 0.0
        color: "#ffffff"
      - time: 1.85
        color: "#ffffff"
      - time: 2.0
        color: "#ffffff00"
        easing: QuadIn

