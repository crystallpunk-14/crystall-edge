- type: entity
  parent: BaseStructure
  id: CETradeCarpetBase
  abstract: true
  name: murk trade carpet
  description: Traders post their items for sale here
  components:
  - type: PlacementReplacement
    key: floorTile
  - type: Physics
    canCollide: false
  - type: Fixtures
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _CE/Structures/Furniture/Carpets/murk.rsi
    drawdepth: FloorTiles
    color: "#ffffffd1"
  - type: Icon
    sprite: _CE/Structures/Furniture/Carpets/murk.rsi
    state: full
  - type: IconSmooth
    key: carpet
    base: carpet_
  - type: Tag
    tags:
    - Carpet
    - ForceFixRotations

- type: entity
  parent: CETradeCarpetBase
  id: CETradeTableHorticulture
  suffix: horticulture
  categories: [ ForkFiltered ]
  components:
  - type: CETradeTable
