- type: entity
  id: CECloth1
  parent: BaseItem
  categories: [ ForkFiltered ]
  name: cloth
  suffix: 1
  description: White cloth roll
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Materials/cloth.rsi
    layers:
      - state: cloth_1
        map: ["base"]
  - type: CEConsumable
    delay: 3
    repeat: true
    whitelist:
      components:
      - MobState
    failPopup: ce-consumable-nothing-to-heal
    beginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    endSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
    conditions:
    - !type:DamageContainer
      containers:
      - CEBiological
    - !type:AnyOf
      conditions:
      - !type:HasDamage
        types:
        - Slash
        - Piercing
      - !type:IsBleeding
    effects:
    - !type:Heal
      types:
        Slash: 3
        Piercing: 3
    - !type:ModifyBleeding
      amount: -8
  - type: Appearance
  - type: Stack
    stackType: CECloth
    count: 1
    baseLayer: base
    layerStates:
    - cloth_1
    - cloth_2
    - cloth_3
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CECloth: 10

- type: entity
  id: CECloth5
  parent: CECloth1
  suffix: 5
  components:
  - type: Stack
    count: 5

- type: entity
  id: CECloth10
  parent: CECloth1
  suffix: 10
  components:
  - type: Stack
    count: 10
