- type: entity
  parent: BaseAction
  id: DndActionBardBase
  abstract: true
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _CE/Objects/Tools/Instruments/lute.rsi
    layers:
    - state: icon
  - type: TargetAction
    checkCanAccess: true

- type: entity
  parent: DndActionBardBase
  id: DndActionBardicInspiration
  name: Bardic Inspiration
  description: Bonus action. Give a creature within 60 feet your inspiration die. The number is how many uses you have left.
  components:
  - type: Action
    useDelay: 3
  - type: LimitedCharges
    maxCharges: 1
    lastCharges: 1
    onFailPopup: dnd-inspiration-spent
  - type: TargetAction
    range: 12
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:DndInspireEvent

- type: entity
  parent: DndActionBardBase
  id: DndActionDancingLights
  name: Dancing Lights
  description: Cantrip. A mote of light appears beside the target for ten minutes.
  components:
  - type: Action
    useDelay: 6
  - type: TargetAction
    range: 24
  - type: EntityTargetAction
    canTargetSelf: true
    event: !type:DndCastSpellEvent
      spell: DancingLights

