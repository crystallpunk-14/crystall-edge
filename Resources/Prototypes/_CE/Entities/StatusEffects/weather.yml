- type: entity
  parent: WeatherBase
  id: CEWeatherRain
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_CE/Effects/Weather/rain.rsi
      state: base
    sound:
      collection: Rain
      params:
        loop: true
        volume: -6
  - type: CEWeatherSolutionFill
    frequency: 10s
    reagents:
    - ReagentId: Water
      Quantity: 5

- type: entity
  parent: WeatherBase
  id: CEWeatherStorm
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_CE/Effects/Weather/storm.rsi
      state: base
    sound:
      path: /Audio/Effects/Weather/rain.ogg
      params:
        loop: true
        volume: -6
  - type: CEWeatherSolutionFill
    frequency: 10s
    reagents:
    - ReagentId: Water
      Quantity: 5
  - type: CEWeatherTileEffects
    minEffectFrequency: 60s
    maxEffectFrequency: 180s
  - type: CEWeatherTileEntityEffect
    effects:
    - !type:SpawnEntity
      spawns:
      - CESkyLightning

- type: entity
  parent: WeatherBase
  id: CEWeatherSnowLight
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_CE/Effects/Weather/snow.rsi
      state: base

- type: entity
  parent: WeatherBase
  id: CEWeatherSnowMedium
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_CE/Effects/weather.rsi
      state: snowfall_med
    sound:
      path: /Audio/Effects/Weather/snowstorm.ogg
      params:
        loop: true
        volume: -10

- type: entity
  parent: WeatherBase
  id: CEWeatherSnowHeavy
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_CE/Effects/weather.rsi
      state: snowfall_heavy
    sound:
      path: /Audio/Effects/Weather/snowstorm.ogg
      params:
        loop: true
        volume: -6

- type: entity
  parent: WeatherBase
  id: CEWeatherSnowSolid
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_CE/Effects/weather.rsi
      state: snowfall_solid
    sound:
      path: /Audio/Effects/Weather/snowstorm.ogg
      params:
        loop: true
        volume: -6

#MARK: Murk storm

# Set by the ritual siege for its calm phases: black rain with rare lightning around the Lucson Sphere.
- type: entity
  parent: WeatherBase
  id: CEWeatherMurkStorm
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_CE/Effects/Weather/rain.rsi
      state: base
    color: "#000000"
    sound:
      collection: Rain
      params:
        loop: true
        volume: -6
  - type: CEWeatherSphereStrikes
    minFrequency: 20s
    maxFrequency: 40s
  - type: CEWeatherTileEntityEffect
    effects:
    - !type:SpawnEntity
      spawns:
      - CESkyLightning

# Set by the ritual siege for its danger phases: black storm with more frequent lightning.
- type: entity
  parent: CEWeatherMurkStorm
  id: CEWeatherMurkStormStrong
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_CE/Effects/Weather/storm.rsi
      state: base
    color: "#000000"
    sound:
      path: /Audio/Effects/Weather/rain.ogg
      params:
        loop: true
        volume: -6
  - type: CEWeatherSphereStrikes
    minFrequency: 8s
    maxFrequency: 15s
