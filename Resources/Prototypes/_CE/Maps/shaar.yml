- type: gameMap
  id: Shaar
  mapName: Shaar
  minPlayers: 20
  maxPlayers: 40
  mapPath: /Maps/_CE/Shaar/Shaar0.yml
  stations:
    Shaar:
      stationProto: CEStandardImperialFloatingIsland
      components:
        - type: StationNameSetup
          mapNameTemplate: "Shaar"
        - type: StationJobs
          availableJobs:
            #Engineering
            CEBrigadier: [ 1, 1 ]
            CETechnician: [ 3, 4 ]
            #Tavern
            CETavernmaster: [ 1, 1 ]
            CEChef: [ 3, 3 ]
            #Guild
            CEGuildmaster: [ 1, 1 ]
            CEAdventurer: [ 4, 5 ]
            #Citizens
            CEBard: [ 2, 2 ]
            #CEKeyKeeper: [ 1, 1 ]
            CESheriff: [ 1, 1 ]
            CETownfolk: [ -1, -1 ]
        - type: CEStationWildlands
          config: Shaar
        - type: CEStationWeather
          nodes:
            clear:
              roundStart: true
              minDuration: 10m
              maxDuration: 30m
              transitions:
                rain: 1
            rain:
              weather: CEWeatherRain
              minDuration: 5m
              maxDuration: 15m
              transitions:
                clear: 1
                storm: 0.5
            storm:
              weather: CEWeatherStorm
              minDuration: 3m
              maxDuration: 8m
              transitions:
                rain: 1
        - type: CEStationZLevels
          mapsBelow:
          - /Maps/_CE/Shaar/Shaar-2.yml
          - /Maps/_CE/Shaar/Shaar-1.yml
          mapsAbove:
          - /Maps/_CE/Shaar/Shaar1.yml
          - /Maps/_CE/Shaar/Shaar2.yml
          - /Maps/_CE/Shaar/Shaar3.yml
          zLevelsComponentOverrides:
            - type: Parallax
              parallax: CESky
            - type: MapLight #BEFORE Light Cycle
              ambientLightColor: "#adcfd8"
            - type: LightCycle #BEFORE Sun shadow cycle!
            - type: CELightCycle
              colors:
                0: "#1c1c27"
                0.125: "#2e2f42"
                0.25: "#465269"
                0.375: "#d8ffff"
                0.625: "#d8ffff"
                0.75: "#334347"
                0.875: "#323347"
            - type: SunShadowCycle
            - type: CEZLevelRoof
            - type: SunShadow
            - type: CECloudsOverlay
              seed: 490
              frequency: 0.2
              octaves: 4
              lacunarity: 2.0
              gain: 0.5
              windVelocity: -1, 0.3
              evolutionSpeed: 0.1
              coverage: 0.6
              shadowStrength: 0.6
              shadowColor: "#000000"
            #- type: CEGridStability
            - type: CEZLevelChasm
            - type: CEMurkedMap

- type: wildlandsConfig
  id: Shaar
  center: -16, -3 # Lucson sphere position
  points:
  - id: snowIsland
    area: !type:RingArea
      minRadius: 70
      maxRadius: 100
  - id: voidHole
    count:
      min: 2
      max: 3
    minDistance: 100 # clear of the snow island's halo and of each other
    area: !type:RingArea
      minRadius: 50
      maxRadius: 100
  cityModifiers: !type:AllSelector
    children:
    # Ore veins
    - id: CEWildlandsModifierOreCoalRatio10
    - id: CEWildlandsModifierOreIronRatio10
    - id: CEWildlandsModifierOreDiamondConstant10
    - id: CEWildlandsModifierDamagedWoodenWallsRatio50
    # Cores
    - id: CEWildlandsModifierCoreIronRatio30
    - id: CEWildlandsModifierCoreCoalRatio30
    - id: CEWildlandsModifierCoreCrystalRatio30
    - id: CEWildlandsModifierCoreDiamondConstant1
    - id: CEWildlandsModifierLumishroomsConstant3
  wildlandsModifiers: !type:AllSelector
    children:
    - id: CEWildlandsModifierOreCoalNoise
    - id: CEWildlandsModifierOreIronNoise
    - id: CEWildlandsModifierOreCrystalNoise
    - id: CEWildlandsModifierDiamondVein
    - id: CEWildlandsModifierBrassRuins
    - id: CEWildlandsModifierDamagedWoodenWallsRatio50
    - id: CEWildlandsModifierBoneyard
    - id: CEWildlandsModifierGoldVein
    - id: CEWildlandsModifierCaveEntrances
    - id: CEWildlandsModifierMushroomGrove
    - id: CEWildlandsModifierShadowEaters
    - id: CEWildlandsModifierLumishrooms
  # Flat floating islands: the autumn archipelago is flat with caves underneath; only the ice island has caves on the surface and hills above.
  layersByDepth:
  #MARK: 0 Surface
    0:
    - !type:TileNoiseDistanceLayer # island footprint, the widest level
      size: &size 280, 280 # CEMurkLucsonSphere35 boundary diameter
      distanceConfig: &distance !type:EuclideanSquaredDistance
        blendWeight: 0.55
      fill:
      - tile: CEGrassAutumnTall
        threshold: 0.4
        noise: &islandNoise
          frequency: 0.03
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 3
          lacunarity: 2
          gain: 0.5
    - !type:TileNoiseDistanceLayer # island centers, forest grows here
      size: *size
      distanceConfig: *distance
      fill:
      - tile: CEStone
        threshold: 0.6
        noise: *islandNoise
    - !type:AtPointLayer
      point: snowIsland
      layers:
      - !type:TileNoiseDistanceLayer # snow island: new land, painted over void and grass
        size: &snowIslandSize 80, 80
        distanceConfig: *distance
        fill:
        - tile: CEIce
          threshold: 0.5
          noise: &snowIslandNoise
            frequency: 0.04
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 3
            lacunarity: 2
            gain: 0.5
        - tile: CESnow
          threshold: 0.45
          noise: *snowIslandNoise
      - !type:TileNoiseDistanceLayer # halo: freezes the landscape's small islands around it
        size: &snowHaloSize 110, 110
        distanceConfig: &snowHaloDistance !type:EuclideanSquaredDistance
          blendWeight: 0.8
        mask:
        - !type:TileMask
          tiles:
          - CEGrassAutumnTall
          - CEStone
        fill:
        - tile: CESnow
          threshold: 0.4
          noise: &snowHaloNoise
            frequency: 0.05
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 3
            lacunarity: 2
            gain: 0.5
    - !type:AtPointLayer # void hole: punches a gap through the archipelago on every level
      point: voidHole
      layers: &voidHoleLayers
      - !type:TileNoiseDistanceLayer
        size: 90, 90
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.8
        fill:
        - tile: Space
          threshold: 0.4
          noise:
            frequency: 0.06
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 3
            lacunarity: 2
            gain: 0.5
    - !type:FillBiomeLayer # must run before the ice caves: it never outputs CEIce, while the caves output CESnow
      biome: CESnowland
      seed: 4
      mask:
      - !type:TileMask
        tiles:
        - CESnow
    - !type:FillBiomeLayer # the ice island keeps its caves in the center
      biome: CEIceCavesGeneric
      seed: 4
      mask:
      - !type:TileMask
        tiles:
        - CEIce
    - !type:FillBiomeLayer # autumn archipelago is flat, caves are only underneath. Rim = meadow, must run before the forest: it never outputs CEStone
      biome: CEGrasslandAutumn
      mask:
      - !type:TileMask
        tiles:
        - CEGrassAutumnTall
    - !type:FillBiomeLayer # center = forest
      biome: CEGrasslandAutumnForest
      seed: 1
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: 1 Ice island hills
    1:
    - !type:AtPointLayer # only the ice island has hills, same contour as its surface
      point: snowIsland
      layers:
      - !type:TileNoiseDistanceLayer
        size: *snowIslandSize
        distanceConfig: *distance
        fill:
        - tile: CEIce
          threshold: 0.6
          noise: *snowIslandNoise
        - tile: CESnow
          threshold: 0.45
          noise: *snowIslandNoise
    - !type:AtPointLayer
      point: voidHole
      layers: *voidHoleLayers
    - !type:FillBiomeLayer # snow rim = meadow. Must run before the forest: it never outputs CEIce
      biome: CESnowland
      seed: 4
      mask:
      - !type:TileMask
        tiles:
        - CESnow
    - !type:FillBiomeLayer # ice core = forest
      biome: CESnowlandForest
      seed: 4
      mask:
      - !type:TileMask
        tiles:
        - CEIce
  #MARK: -1 Caves
    -1:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: *distance
      fill:
      - tile: CEStone
        threshold: 0.4 # same footprint as the surface
        noise: *islandNoise
    - !type:AtPointLayer
      point: snowIsland
      layers:
      - !type:TileNoiseDistanceLayer
        size: *snowIslandSize
        distanceConfig: *distance
        fill:
        - tile: CEIce
          threshold: 0.4 # same footprint as the surface
          noise: *snowIslandNoise
      - !type:TileNoiseDistanceLayer
        size: *snowHaloSize
        distanceConfig: *snowHaloDistance
        mask:
        - !type:TileMask
          tiles:
          - CEStone
        fill:
        - tile: CEIce
          threshold: 0.4
          noise: *snowHaloNoise
    - !type:AtPointLayer
      point: voidHole
      layers: *voidHoleLayers
    - !type:FillBiomeLayer
      biome: CEIceCavesGeneric
      seed: 5
      mask:
      - !type:TileMask
        tiles:
        - CEIce
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 2
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: -2 Caves
    -2:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: *distance
      fill:
      - tile: CEStone
        threshold: 0.59
        noise: *islandNoise
    - !type:AtPointLayer
      point: snowIsland
      layers:
      - !type:TileNoiseDistanceLayer
        size: *snowIslandSize
        distanceConfig: *distance
        fill:
        - tile: CEIce
          threshold: 0.59
          noise: *snowIslandNoise
      - !type:TileNoiseDistanceLayer
        size: *snowHaloSize
        distanceConfig: *snowHaloDistance
        mask:
        - !type:TileMask
          tiles:
          - CEStone
        fill:
        - tile: CEIce
          threshold: 0.4
          noise: *snowHaloNoise
    - !type:AtPointLayer
      point: voidHole
      layers: *voidHoleLayers
    - !type:FillBiomeLayer
      biome: CEIceCavesGeneric
      seed: 6
      mask:
      - !type:TileMask
        tiles:
        - CEIce
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 3
      mask:
      - !type:TileMask
        tiles:
        - CEStone
