- type: entity
  parent: BaseItem
  id: CEBaseLock
  abstract: true
  categories: [ ForkFiltered ]
  name: lock
  description: A small device customized only for a specific key shape. Attach it to doors or chests that have no lock and feel the spirit of security.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CE/Objects/Tools/lock.rsi
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/welder_drop.ogg
      params:
        variation: 0.05
  - type: CELock
    canEmbedded: true
  - type: GuideHelp
    guides:
    - CELocksKeysGuideRU

- type: entity
  parent: CEBaseLock
  id: CELockIron
  name: iron lock
  components:
  - type: Sprite
    state: lock_iron
  - type: CELock
    shape:
    - 5
    - 5
    - 5
    - 5
    - 5
  - type: PhysicalComposition
    materialComposition:
      CEIron: 10
