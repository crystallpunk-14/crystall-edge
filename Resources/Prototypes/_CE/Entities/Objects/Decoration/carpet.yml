- type: entity
  parent: BaseItem
  id: CEFloorTileItemBase
  name: carpet
  description: Rolled up carpet for easy transport.
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Item
    size: Normal
  - type: Stack
    count: 1
  - type: Sprite
    state: icon
  - type: StackPrice
    price: 0.5
  - type: SpawnAfterInteract
    doAfter: 0.5
    removeOnInteract: true
  #- type: PhysicalComposition
  #  materialComposition:
  #    CECloth: 15
  - type: CEMagicEssenceStructure
    essences:
      Cloth: { min: 1, max: 1 }
  - type: CEEntityGroupMember
    groups:
      Carpet: 1

