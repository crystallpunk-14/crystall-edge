- type: entity
  parent: CEClothingMaskIdentityBlockerBase
  id: CEClothingMaskSteelMask
  name: steel mask
  description: A steel mask that protects the face from the external effects of iron.
  components:
  - type: Sprite
    sprite: _CE/Clothing/Masks/Generic/steel_mask.rsi
  - type: Clothing
    sprite: _CE/Clothing/Masks/Generic/steel_mask.rsi
  - type: PhysicalComposition
    materialComposition:
      CEIron: 20
  - type: CEMagicEssenceStructure
    essences:
      Metal: { min: 1, max: 3 }

