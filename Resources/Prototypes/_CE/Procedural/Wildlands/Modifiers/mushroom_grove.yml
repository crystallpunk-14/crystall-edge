# Mushroom grove: a mycelium patch in the caves, with fly agarics and chanterelles growing around its point.

- type: entity
  id: CEWildlandsModifierMushroomGrove
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    points:
    - id: grove
      minDistance: 0
      area: !type:RingArea
        minRadius: 40
        maxRadius: 100
    effects:
    - !type:GenerationLayers
      minDepth: -2 # caves only: the mushrooms feed on darkness
      maxDepth: -1
      layers:
      - !type:AtPointLayer
        point: grove
        layers:
        - !type:TileNoiseDistanceLayer # mycelium patch over any existing floor
          size: &groveSize 100, 100
          distanceConfig: &groveDistance !type:EuclideanSquaredDistance
            blendWeight: 0.7
          mask: &groveFloor
          - !type:NoEntityMask
          - !type:TileMask
            inverted: true
            tiles:
            - Space
          fill:
          - tile: CEMycelium
            threshold: 0.7
            noise: &groveNoise
              frequency: 0.08
              noiseType: OpenSimplex2
              fractalType: FBm
              octaves: 3
        - !type:TileNoiseDistanceLayer # same noise, higher threshold: richer mycelium in the middle
          size: *groveSize
          distanceConfig: *groveDistance
          mask: *groveFloor
          fill:
          - tile: CEMyceliumLight
            threshold: 0.8
            noise: *groveNoise
      # Mushrooms ignore the tiles: whatever strays off the mycelium just gets no soil resource.
      - !type:FillEntityLayer # rarer fly agarics first, so the chanterelles don't crowd them out
        entity: CEPlantAgaricGrown
        mask:
        - &groveArea !type:RadiusMask
          point: grove
          radius: 45
          noiseAmplitude: 6
          noise:
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.1
            octaves: 2
        - !type:NoiseMask
          seed: 101
          threshold: 0.6
          noise:
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.12
            octaves: 2
        - !type:NoEntityMask
      - !type:FillEntityLayer
        entity: CEPlantChanterelleGrown
        mask:
        - *groveArea
        - !type:NoiseMask
          seed: 202
          threshold: 0.45
          noise:
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.12
            octaves: 2
        - !type:NoEntityMask
