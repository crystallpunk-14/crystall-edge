- type: entity
  id: CESpellcastingStaffBase
  abstract: true
  parent: BaseItem
  categories: [ ForkFiltered ]
  components:
  - type: Clothing
    equipDelay: 1
    unequipDelay: 1
    quickEquip: false
    equipWhileMoving: true
    slots:
    - neck
  - type: Item
    size: Ginormous
  - type: CEMagicFocusInhand
  - type: CEMagicFocus
  - type: Wieldable
  - type: CEWeapon
    range: 0.75
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 4
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 4
    animations:
      Primary:
      - anim: StaffAttackLight1
      - anim: StaffAttackLight2
      Secondary:
      - anim: StaffAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 5
      Secondary: 8
  - type: CERotationForAnimation
    rotation: 135

