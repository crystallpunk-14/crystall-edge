# CrystallEdge: rough copy of infusion_altar.yml, adapted so a buckled player takes the place of the
# catalyst item - not yet cleaned up/unified. Reuses the existing infusion altar pedestal entity,
# danger visuals and mishap prototypes as-is.

- type: entity
  parent:
  - CEBaseMachinePowered
  - BaseMachine
  id: CESpellMasteryAltar
  categories: [ ForkFiltered ]
  name: spell mastery altar
  description: TODO
  components:
  - type: StaticPrice
    price: 180
  - type: InteractionOutline
  - type: GuideHelp
    guides:
    - CEThaumaturgySpellcastingRU
    - CEThaumaturgySpellcastingEN
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Objects
    noRot: true
    sprite: _CE/Structures/Specific/Thaumaturgy/infusion_altar.rsi
    layers:
    - state: bed
    - state: bed_powered
      map: [ "power" ]
      visible: false
      shader: unshaded
    - sprite: _CE/Structures/Specific/Thaumaturgy/Effects/infusion_altar_chaos.rsi
      state: calm
      map: [ "chaosEffect" ]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: _CE/Structures/Specific/Thaumaturgy/infusion_altar.rsi
    state: bed
  - type: CESpellMasteryAltar
    possiblePedestalsPositions:
    - 3,0
    - -3,0
    - 0,3
    - 0,-3
    - 2, 2
    - -2, 2
    - 2, -2
    - -2, -2
    unstableMishaps:
    - CEInfusionAltarMishapManaConsume
    - CEInfusionAltarMishapManaRestore
    - CEInfusionAltarMishapPulse
    criticalMishaps:
    - CEInfusionAltarMishapExplosion
  - type: Strap
    position: Down
    rotation: -90
  - type: PlacementReplacement
    key: walls
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 190
        mask: # blocks players/mobs, same as tables
        - TableMask
        layer:
        - TableLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        hard: false # essence should fly in, not bounce off
        mask:
        - Impassable
        layer:
        - Impassable
  - type: Solution
    id: essence
    solution:
      maxVol: 50
  - type: CEUnpoweredEssenceLeak
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        power:
          True: { visible: true }
          False: { visible: false }
      enum.CEInfusionAltarDangerVisuals.Level:
        chaosEffect:
          Calm: { state: calm }
          Unstable: { state: unstable }
          Critical: { state: critical }
      enum.CEInfusionAltarDangerVisuals.Active:
        chaosEffect:
          True: { visible: true }
          False: { visible: false }
  - type: AmbientOnPowered
  - type: AmbientSound
    enabled: false
    range: 6
    volume: 3
    sound:
      path: /Audio/Ambience/Objects/gravity_gen_hum.ogg
  - type: CEMagicEssenceAttractor
    solution: essence
  - type: LitOnPowered
  - type: CEInfusionAltarDangerVisuals
  - type: PointLight
    enabled: false
    color: "#9335b8"
    radius: 5
  - type: LightBehaviour
    behaviours:
    - !type:RandomizeBehaviour
      interpolate: Nearest
      minDuration: 0.02
      maxDuration: 0.06
      startValue: 0.0
      endValue: 3.0
      property: Energy
      isLooped: true
      enabled: false
