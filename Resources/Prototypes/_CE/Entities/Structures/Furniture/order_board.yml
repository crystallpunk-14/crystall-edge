- type: entity
  id: CEOrderBoard
  parent: BaseStructure
  name: orders board
  description: Is there a job for a witcher?
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _CE/Structures/Furniture/order_board.rsi
    layers:
      - state: base
      - state: paper-0
      - map: [ "enum.StorageFillLayers.Fill" ]
  - type: StorageFillVisualizer
    maxFillLevels: 4
    fillBaseName: paper
  - type: Appearance
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
    damageModifierSet: CEWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CEWoodenPlanks1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Storage
    grid:
    - 0,0,4,3
    maxItemSize: Small
    whitelist:
      tags:
        - Document
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Construction
    graph: CEOrderBoard
    node: CEOrderBoard

- type: entity
  parent: CEOrderBoard
  id: CEOrderBoardBlue
  suffix: Blue flag
  components:
  - type: Sprite
    layers:
      - state: base
      - state: paper-0
      - map: [ "enum.StorageFillLayers.Fill" ]
      - state: flag_blue

