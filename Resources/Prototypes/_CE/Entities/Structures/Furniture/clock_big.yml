- type: entity
  id: CEClockBig
  categories: [ ForkFiltered ]
  parent:
  - BaseStructure
  name: grandfather clock
  description: A tall wooden clock with a swinging pendulum.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Structures/Furniture/clock_big.rsi
    layers:
    - state: base
    - state: anim
  - type: AmbientSound
    range: 6
    volume: -3
    sound:
      path: /Audio/_CE/Ambience/Loops/clock.ogg
  - type: CEClock
  - type: InteractionOutline
  - type: Clickable
  - type: Anchorable
  - type: Rotatable
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.3,0.25,0.1"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: CEWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          CEWoodenPlanks1:
            min: 2
            max: 4
