- type: entity
  id: CEPlantTomatoes
  parent:
  - CEPlantBase
  - CEPlantBaseSolarEnergy
  - CEPlantBaseFloralDelicateType
  - CEPlantBaseGrowingSlow
  - CEPlantBaseMetabolizerFast
  - CEPlantBaseMetabolizerWater
  name: tomatoes
  description: On the one hand, it's a delicious fruit. But why eat it when it's much more fun to use tomatoes as a throwing projectile?
  components:
  - type: CEPlantVisuals
    growthSteps: 4
    readyVariations: 2
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/tomatoes.rsi
    layers:
    - state: liq-1
      sprite: _CE/Structures/Nature/Farm/watered.rsi
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      map: ["enum.PlantVisualLayers.Base"]
    - state: produce-tomato-var1-state1
      visible: false
      map: ["Produce-tomato"]
  - type: CEPlantProducing
    gatherKeys:
      tomato:
        result: CEFoodTomatoes
        maxProduce: 3
        visualStateCount: 2
        growthPerUpdate: 0.5 # CrystallEdge: new tomato batch every 2 minutes
  - type: CEPlantGatherOnInteract
    gatherKeys:
    - tomato
    toolWhitelist:
      tags:
      - CESharp
  - type: CEPlantDying
    deadEntity: CEPlantTomatoesDead

- type: entity
  parent: CEPlantDeadBase
  id: CEPlantTomatoesDead
  name: dead tomatoes
  components:
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/tomatoes.rsi
    state: death
