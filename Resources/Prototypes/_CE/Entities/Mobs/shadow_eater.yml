- type: entity
  parent:
  - CEMobSimple
  - CEMobCombat
  - CEMobGOAPBase
  id: CEMobShadowEater
  name: shadow eater
  description: A being of darkness that feeds on the shadows of living creatures.
  categories: [ ForkFiltered ]
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: CEGOAP
    goals:
    # Single stupid goal - kill enemies
    - desiredState:
        EnemyDead: true
      priority: 1

    actions:
    # Move to target
    - !type:CEGOAPMoveToTargetAction
      selector: !type:CEGOAPSelectorNearestEnemy
      preconditions:
        EnemyVisible: true
      effects:
        EnemyInMeleeRange: true
    # Attack target
    - !type:CEGOAPMeleeAttackAction
      selector: !type:CEGOAPSelectorNearestEnemy
      preconditions:
        EnemyInMeleeRange: true
      effects:
        EnemyDead: true
      cost: 1
      useType: Primary
      angleVariation: 5
    # Explore
    - !type:CEGOAPExploreAction
      effects:
        EnemyVisible: true
      cost: 1
      exploreRadius: 8
  - type: NpcFactionMember
    factions:
    - CEHostileEveryone
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Mobs/shadow_eater.rsi
    layers:
    - state: live
  - type: CEMurkDissolvingStatus
    soundEnabled: false
    overlayEnabled: false
    dissolved: 0.7
  - type: MovementSpeedModifier
    baseSprintSpeed: 2.5
    baseFriction: 0.5
  - type: CEWeapon
    range: 0.5
    effectSlots:
      OnHit:
      - !type:WeaponArcAttack
        arcWidth: 40
        effects:
        - !type:Damage
          damage:
            types:
              Piercing: 3
        - !type:MurkDissolve
          amount: 0.1
    animations:
      Primary:
      - anim: ShadowEaterBite
  - type: CEMurkSphereChargingBlocker

- type: entity
  id: CEShadowEaterBiteEffectTelegraphy
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/arcs.rsi
    drawdepth: Effects
    layers:
    - state: disarm
      color: "#595c67"
      shader: unshaded

- type: entity
  id: CEShadowEaterBiteEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/arcs.rsi
    drawdepth: Effects
    layers:
    - state: bite
      color: "#595c67"
      shader: unshaded


- type: entityEffectAnimation
  id: ShadowEaterBite
  movementSpeed: 0.8
  duration: 0.8
  events:
    0:
    - !type:UsedEntityAnimation
      dummyEntity: CERatBiteEffectTelegraphy
      offsetAnimation:
      - time: 0.0
        offset: 0, -0.3
        easing: QuadIn
      - time: 0.2
        offset: 0, -0.2
        easing: QuadIn

      rotationAnimation:
      - time: 0.0
        rotation: 90

      colorAnimation:
      - time: 0.1
        color: "#ffffff"
      - time: 0.3
        color: "#ffffff00"  # Fade out
        easing: QuadOut
    - !type:PlaySound
      sound:
        path: /Audio/Effects/bite.ogg
        params:
          variation: 0.1
          pitch: 0.4
    0.2:
    - !type:UsedEntityAnimation
      dummyEntity: CERatBiteEffect
      offsetAnimation:
      - time: 0.0
        offset: 0, -0.2
        easing: QuadIn
      - time: 0.3
        offset: 0, -0.7
        easing: QuadIn

      rotationAnimation:
      - time: 0.0
        rotation: 90

      colorAnimation:
      - time: 0.1
        color: "#ffffff"
      - time: 0.3
        color: "#ffffff00"  # Fade out
        easing: QuadOut
    0.25:
    - !type:WeaponEffectSlot
      slot: OnHit
    - !type:Dash
      distance: 0.1
