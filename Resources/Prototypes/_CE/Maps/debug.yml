- type: gameMap
  id: Empty
  mapName: Empty
  mapPath: /Maps/Test/empty.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Empty"
        - type: StationJobs
          availableJobs:
            CETownfolk: [ -1, -1 ]

- type: gameMap
  id: Dev
  mapName: Dev
  mapPath: /Maps/_CE/Dev/Dev0.yml
  minPlayers: 0
  stations:
    Dev:
      stationProto: CEStandardImperialFloatingIsland
      components:
        - type: StationNameSetup
          mapNameTemplate: "Dev"
        - type: StationJobs
          availableJobs:
            CETownfolk: [ -1, -1 ]
            CEGuardCommander: [ 1, 1 ]
            CETavernmaster: [ 1, 1 ]
            CEAcademyRector: [ 1, 1 ]
        - type: CEStationZLevels
          mapsBelow:
          - /Maps/_CE/Dev/Dev-1.yml
          mapsAbove:
          - /Maps/_CE/Dev/Dev1.yml
          - /Maps/_CE/Dev/Dev2.yml
          - /Maps/_CE/Dev/Dev3.yml
          zLevelsComponentOverrides:
            - type: CEGridStability
            - type: MapAtmosphere
              space: False
              mixture:
                volume: 2500
                immutable: True
                temperature: 293.15
                moles:
                  Oxygen: 21.824879
                  Nitrogen: 82.10312
            - type: Parallax
              parallax: CESky
            - type: LightCycle #BEFORE Sun shadow cycle!
              offset: 100
              duration: 300
              originalColor: "#75e3ff"
            - type: SunShadowCycle
              offset: 100
              duration: 300
            - type: CEZLevelRoof
            - type: SunShadow
            - type: MapLight
              ambientLightColor: "#75e3ff"
            - type: CECloudsOverlay
              seed: 490
              frequency: 0.2
              octaves: 4
              lacunarity: 2.0
              gain: 0.5
              windVelocity: -1, 0.3
              evolutionSpeed: 0.1
              coverage: 0.6
              shadowStrength: 0.6
              shadowColor: "#000000"

- type: zMap
  id: Empty
  maps:
  - /Maps/_CE/Empty.yml
  - /Maps/_CE/Empty.yml
  - /Maps/_CE/Empty.yml
  - /Maps/_CE/Empty.yml
  - /Maps/_CE/Empty.yml
  - /Maps/_CE/Empty.yml
  components:
    - type: MapAtmosphere
      space: False
      mixture:
        volume: 2500
        immutable: True
        temperature: 293.15
        moles:
          Oxygen: 21.824879
          Nitrogen: 82.10312
    - type: Parallax
      parallax: CESky
    - type: SunShadowCycle
      offset: 490
    - type: LightCycle
      offset: 490
      originalColor: "#c8fdff"
    - type: CEZLevelRoof
    - type: SunShadow
    - type: MapLight
      ambientLightColor: "#c8fdff"
