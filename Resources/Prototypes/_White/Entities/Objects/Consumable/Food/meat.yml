# Lamb Meat
- type: entity
  id: WhiteFoodMeatLamb
  parent: CEFoodMeatBase
  name: raw lamb
  description: Succulent lamb steak
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Food/meat.rsi
    state: sheepmeat
  - type: SliceableFood
    count: 4
    slice: WhiteFoodMeatLambSlice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 24
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: UncookedAnimalProteins
          Quantity: 6
        - ReagentId: Fat
          Quantity: 8
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
  - type: CETemperatureTransformation
    entries:
    - temperatureRange: 400, 500
      transformTo: WhiteFoodMeatLambCooked
  - type: CEFoodTag
    tags:
    - CEMeat

- type: entity
  id: WhiteFoodMeatLambCooked
  parent: WhiteFoodMeatLamb
  name: cooked lamb steak
  components:
  - type: Sprite
    state: sheepmeat_cooked
  - type: SliceableFood
    count: 4
    slice: WhiteFoodMeatLambCookedSlice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 24
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: Protein
          Quantity: 6
        - ReagentId: Fat
          Quantity: 8
  - type: CETemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: CEAsh1
  - type: CEFoodTag
    tags:
    - CEMeat

- type: entity
  id: WhiteFoodMeatLambSlice
  parent: CEFoodMeatSliceBase
  name: meat pieces
  description: Succulent lamb steak
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CE/Objects/Consumable/Food/meat.rsi
    layers:
    - state: sheepmeat_slice
      map: [ "random" ]
  - type: RandomSprite
    available:
    - random:
        sheepmeat_slice: ""
        sheepmeat_slice2: ""
        sheepmeat_slice3: ""
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: UncookedAnimalProteins
          Quantity: 1.5
        - ReagentId: Fat
          Quantity: 2
  - type: CETemperatureTransformation
    entries:
    - temperatureRange: 400, 500
      transformTo: WhiteFoodMeatLambCookedSlice
  - type: CEFoodTag
    tags:
    - CEMeat
    - CEMeatSlice

- type: entity
  id: WhiteFoodMeatLambCookedSlice
  parent: CEFoodMeatLambSlice
  name: cooked meat pieces
  components:
  - type: Sprite
    layers:
    - state: sheepmeat_slice_cooked
      map: [ "random" ]
  - type: RandomSprite
    available:
    - random:
        sheepmeat_slice_cooked: ""
        sheepmeat_slice2_cooked: ""
        sheepmeat_slice3_cooked: ""
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Protein
          Quantity: 1.5
        - ReagentId: Fat
          Quantity: 2
  - type: CETemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: CEAsh1
  - type: CEFoodTag
    tags:
    - CEMeat
    - CEMeatSlice

- type: entity
  id: WhiteFoodMeatLambCutlet
  parent: CEFoodMeatSliceBase
  name: lamb cutlet
  description: The result of mixing sliced lamb and egg - a raw round cutlet.
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Food/meat.rsi
    state: cutlet
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: UncookedAnimalProteins
          Quantity: 3
        - ReagentId: Protein
          Quantity: 2
        - ReagentId: Fat
          Quantity: 4
        - ReagentId: Egg
          Quantity: 6
  - type: CETemperatureTransformation
    entries:
    - temperatureRange: 400, 500
      transformTo: WhiteFoodMeatLambCutletCooked
  - type: CEFoodTag
    tags:
    - CEMeat
    - CEMeatCutlet

- type: entity
  id: WhiteFoodMeatLambCutletCooked
  parent: WhiteFoodMeatLambCutlet
  name: cooked lamb cutlet
  description: Yammi!
  components:
  - type: Sprite
    state: cutlet_cooked
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Protein
          Quantity: 5
        - ReagentId: Fat
          Quantity: 4
        - ReagentId: EggCooked
          Quantity: 6
  - type: CETemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: CEAsh1
  - type: CEFoodTag
    tags:
    - CEMeat
    - CEMeatCutlet
