# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_snack.yml
# Base

- type: entity
  parent: [SolutionTiny, FoodBaseTrash]
  id: FoodSnackBase
  abstract: true
  components:
  - type: Tag
    tags:
      - FoodSnack
  - type: Sprite
    sprite: Objects/Consumable/Food/snacks.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
  - type: Item
    sprite: Objects/Consumable/Food/snacks.rsi
    heldPrefix: packet
    size: Tiny
# Snacks

# "Snacks" means food in a packet. Down the line this stuff can have multiple
# reagents and shit for healing or different effects.

- type: entity
  name: C&Ds
  parent: FoodSnackBase
  id: FoodSnackCnDs
  description: Legally, we cannot say that these won't melt in your hands.
  components:
  - type: FlavorProfile
    flavors:
      - chocolate
  - type: Sprite
    state: cnds
  - type: Item
    heldPrefix: cnds
  - type: Edible
    trash:
    - FoodPacketCnDsTrash

- type: entity
  parent: BaseItem
  id: FoodSnackChocolate
  name: chocolate bar
  description: Tastes like cardboard.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/snacks.rsi
    state: chocolatebar
  - type: Item
    heldPrefix: chocolatebar
    size: Tiny
    storedOffset: 1,-1
  - type: Tag
    tags:
      - FoodSnack
  - type: SpawnItemsOnUse
    items:
      - id: FoodPacketChocolateTrash
      - id: FoodSnackChocolateBar
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: FoodSnackBase
  id: FoodSnackChocolateBar
  name: chocolate bar
  description: Tastes like cardboard.
  components:
  - type: FlavorProfile
    flavors:
      - chocolate
  - type: Sprite
    state: chocolatebar-open
  - type: Item
    heldPrefix: chocolatebar-open
    storedOffset: 1,-2
  - type: Tag
    tags:
      - FoodSnack
      - ReptilianFood
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Theobromine
        Quantity: 3
      - ReagentId: CocoaPowder
        Quantity: 2

- type: entity
  parent: FoodSnackBase
  id: FoodSnackPistachios
  name: Sweetie's pistachios
  description: Sweeties's name-brand pistachios. Probably won't give you diseases. Probably.
  components:
  - type: FlavorProfile
    flavors:
      - salty
      - nutty
  - type: Sprite
    state: pistachio
  - type: Item
    heldPrefix: pistachio
    storedOffset: 1,0
  - type: Edible
    trash:
    - FoodPacketPistachioTrash
  - type: Tag
    tags:
    - Fruit # Seed of a fruit, you can yell at me
    - Pistachios # Added tag due to CrateServiceGetMore interaction with BountyFruit.

