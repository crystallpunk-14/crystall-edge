# If you spawn any of these, they should probably be made cleanable as well.

- type: decal
  id: Dirt
  tags: ["station", "dirty"]
  defaultCleanable: true
  sprite:
    sprite: Decals/dirty.rsi
    state: dirt

- type: decal
  id: DirtLight
  tags: ["station", "dirty"]
  defaultCleanable: true
  sprite:
    sprite: Decals/dirty.rsi
    state: dirtlight

- type: decal
  id: DirtMedium
  tags: ["station", "dirty"]
  defaultCleanable: true
  sprite:
    sprite: Decals/dirty.rsi
    state: dirtmedium

- type: decal
  id: DirtHeavy
  tags: ["station", "dirty"]
  defaultCleanable: true
  sprite:
    sprite: Decals/dirty.rsi
    state: dirtheavy

- type: decal
  id: DirtHeavyMonotile
  tags: ["station", "dirty"]
  defaultCleanable: true
  sprite:
    sprite: Decals/dirty.rsi
    state: dirtheavy-mono
