- type: entity
  id: CEGauze
  parent: BaseItem
  name: gauze
  description: Dense cloth gauze, to prevent valuable blood from leaking out of the body.
  suffix: 5
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
    heldPrefix: bandage
  - type: Sprite
    sprite: _CE/Objects/Consumable/medical.rsi
    state: bandage_3
    layers:
      - state: bandage_3
        map: ["base"]
  - type: Appearance
  - type: Construction
    graph: CEGauze
    node: cegauze
  - type: CEConsumable
    delay: 2
    repeat: true
    whitelist:
      components:
      - MobState
    failPopup: ce-consumable-nothing-to-heal
    beginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    endSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
    conditions:
    - !type:DamageContainer
      containers:
      - CEBiological
    - !type:AnyOf
      conditions:
      - !type:HasDamage
        types:
        - Slash
        - Piercing
        - Blunt
      - !type:IsBleeding
    effects:
    - !type:Heal
      types:
        Slash: 10
        Piercing: 10
        Blunt: 10
    - !type:ModifyBleeding
      amount: -10
  - type: Stack
    stackType: CEGauze
    count: 5
    baseLayer: base
    layerStates:
    - bandage
    - bandage_2
    - bandage_3
  - type: StackPrice
    price: 2

- type: entity
  id: CEGauze1
  parent: CEGauze
  suffix: 1
  components:
  - type: Sprite
    state: bandage
  - type: Stack
    count: 1
