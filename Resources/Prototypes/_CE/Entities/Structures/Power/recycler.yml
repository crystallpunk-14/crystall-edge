- type: entity
  id: CERecycler
  parent:
  - BaseMachine
  name: recycler
  description: A large destructive machine used to extract energy from magical items by destroying them. It can also be used as a way to recycle items into basic materials.
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 5
    sound:
      # TODO: https://freesound.org/people/derjuli/sounds/448133/ CC-NC-
      path: /Audio/Ambience/Objects/circular_saw.ogg
  - type: Fixtures
    fixtures:
      brrt:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        hard: false
        layer:
        - FullTileLayer
      collision:
        density: 800
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        hard: true
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    drawdepth: OverMobs
    offset: 0, 0
    sprite: _CE/Structures/Power/grinder.rsi
    layers:
    - state: base
    - state: blades_off
      map: [ "blades" ]
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      power:
        !type:CableNode
        nodeGroupID: HVPower
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CEPowerConsumerVisuals.Active:
        blades:
          True: {state: blades_on}
          False: {state: blades_off}
  - type: CERecycler
  - type: Rotatable
  - type: PowerConsumer
    voltage: High
    drawRate: 5
