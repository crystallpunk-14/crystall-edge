- type: entity
  id: CEMurkLucsonSphere
  name: Lucson Sphere
  description: Your last hope for survival. A barrier against the murk, a ray of light in the realm of darkness.
  abstract: true
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: walls
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _CE/Structures/LucsonSphere/core.rsi
    layers:
    - state: full
      map: [ "glass" ]
    - sprite: _CE/Structures/Specific/Thaumaturgy/Node/big_node.rsi
      state: base
      shader: unshaded
      offset: 0.05, 0.02
    - sprite: _CE/Structures/Specific/Thaumaturgy/Node/medium_node.rsi
      state: base
      shader: unshaded
      offset: 0.05, 0.06
    - sprite: _CE/Structures/Specific/Thaumaturgy/Node/smol_node.rsi
      state: base
      shader: unshaded
      offset: -0.05, 0.06
    - sprite: _CE/Structures/LucsonSphere/active_effect.rsi
      state: effect
      shader: unshaded
      offset: -0.05, -0.1
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CEMurkSphereState.Stable:
        glass:
          Stable: { state: full }
          Cracked: { state: cracked }
          Collapsing: { state: cracked }
  - type: AmbientSound
    volume: 5
    range: 10
    sound:
      path: /Audio/_CE/Ambience/Loops/magic_pulse.ogg
  - type: PointLight
    radius: 10
    energy: 4
    color: "#eef2f5"
  - type: LightBehaviour
    behaviours:
      - !type:PulseBehaviour
        interpolate: Cubic
        maxDuration: 5
        startValue: 1.1
        endValue: 4.0
        property: Energy
        isLooped: true
        enabled: true
  - type: CEPvsOverride
  - type: CEMurkLusconSphere
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: CEAutoFloatingVisuals

# Different intensity for different map sizes

- type: entity
  parent: CEMurkLucsonSphere
  id: CEMurkLucsonSphere25
  suffix: One per Map, 25 radius
  components:
  - type: CEMurkSource
    intensity: -25

- type: entity
  parent: CEMurkLucsonSphere
  id: CEMurkLucsonSphere50
  suffix: One per Map, 50 radius
  components:
  - type: CEMurkSource
    intensity: -50

- type: entity
  parent: CEMurkLucsonSphere
  id: CEMurkLucsonSphere75
  suffix: One per Map, 75 radius
  components:
  - type: CEMurkSource
    intensity: -75

- type: entity
  parent: CEMurkLucsonSphere
  id: CEMurkLucsonSphere100
  suffix: One per Map, 100 radius
  components:
  - type: CEMurkSource
    intensity: -100
