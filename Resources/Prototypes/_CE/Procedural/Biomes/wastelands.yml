      threshold: 0.4
      noise:
        seed: 4
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CEDirt
      entities:
        - CEFloraTreeDead
        - CEFloraTreeDeadSmall
    - !type:BiomeEntityLayer # Walls
      allowedTiles:
        - CEDirt
      threshold: 0.5
      noise:
        seed: 12
        noiseType: OpenSimplex2
        frequency: 0.03
        lacunarity: 2
        fractalType: Ridged
        octaves: 1
