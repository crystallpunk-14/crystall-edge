- type: entity
  id: CEZLevelStairsStoneBase
  abstract: true
  name: stone stairs
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Stairs/stone.rsi
  - type: Damageable
    damageModifierSet: CERockStructural
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          CEStoneBlock1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent:
  - CEZLevelStairsBase
  - CEZLevelStairsStoneBase
  id: CEZLevelStairsStone
  name: stone stairs
  components:
  - type: Construction
    graph: CEZLevelStairs
    node: CEZLevelStairsStone

- type: entity
  parent:
  - CEZLevelStairsCornerBase
  - CEZLevelStairsStoneBase
  id: CEZLevelStairsStoneCorner
  name: stone stairs
  suffix: Corner
  components:
  - type: Construction
    graph: CEZLevelStairs
    node: CEZLevelStairsStoneCorner

- type: entity
  parent:
  - CEZLevelStairsCornerInnerBase
  - CEZLevelStairsStoneBase
  id: CEZLevelStairsStoneCornerInner
  name: stone stairs
  suffix: Inner Corner
  components:
  - type: Construction
    graph: CEZLevelStairs
    node: CEZLevelStairsStoneCornerInner
