# Snout Markings

- type: marking
  id: VulpSnout
  bodyPart: Snout
  groupWhitelist: [ Vulpkanin ]
  sprites:
    - sprite: Mobs/Customization/Vulpkanin/snout_markings.rsi
      state: snout
  coloring:
    default:
      type:
        !type:SkinColoring

- type: marking
  id: VulpSnoutNose
  bodyPart: SnoutCover
  groupWhitelist: [ Vulpkanin ]
  sprites:
    - sprite: Mobs/Customization/Vulpkanin/snout_markings.rsi
      state: snout-nose
