# Placed from CEConveyorBeltItem; a screwdriver cycles belt -> stairs -> reverse stairs -> belt,
# a crowbar takes any variant back into the item.
- type: constructionGraph
  id: CEConveyorBelt
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}

    - node: CEConveyorBelt
      entity: CEConveyorBelt
      edges:
        - to: CEConveyorStairs
          steps:
            - tool: Screwing
              doAfter: 1
        - to: start
          steps:
            - tool: Prying
              doAfter: 0.5
          completed:
            - !type:SpawnPrototype
              prototype: CEConveyorBeltItem
              amount: 1

    - node: CEConveyorStairs
      entity: CEConveyorStairs
      edges:
        - to: CEConveyorStairsReverse
          steps:
            - tool: Screwing
              doAfter: 1
        - to: start
          steps:
            - tool: Prying
              doAfter: 0.5
          completed:
            - !type:SpawnPrototype
              prototype: CEConveyorBeltItem
              amount: 1

    - node: CEConveyorStairsReverse
      entity: CEConveyorStairsReverse
      edges:
        - to: CEConveyorBelt
          steps:
            - tool: Screwing
              doAfter: 1
        - to: start
          steps:
            - tool: Prying
              doAfter: 0.5
          completed:
            - !type:SpawnPrototype
              prototype: CEConveyorBeltItem
              amount: 1
