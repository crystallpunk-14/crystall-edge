- type: entity
  id: CEScissors
  name: scissors
  description: A tool for shredding wool, hair, clothing, and, if not handled carefully, even fingers.
  categories: [ ForkFiltered ]
  parent: BaseItem
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CE/Objects/Tools/scissors.rsi
    state: icon
  - type: MagicMirror
    organs:
    - Head
    layers:
    - Hair
    - FacialHair
  - type: ActivatableUI
    key: enum.MagicMirrorUiKey.Key
    inHandsOnly: true
    requireActiveHand: true
  - type: UserInterface
    interfaces:
      enum.MagicMirrorUiKey.Key:
        type: MagicMirrorBoundUserInterface
  - type: CEWeapon
    range: 0.4
    hitSound:
      path: /Audio/Weapons/bladeslice.ogg
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Piercing: 4
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Piercing: 4
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
      Secondary:
      - anim: DaggerAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 20
  - type: CERotationForAnimation
    rotation: -135
  - type: Tag
    tags:
    - CEScissors
  - type: PhysicalComposition
    materialComposition:
      CEIron: 5
  - type: CEMagicEssenceStructure
    essences:
      Metal:
        min: 1
        max: 3
      Tool:
        min: 0
        max: 1
