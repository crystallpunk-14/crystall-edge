- type: entity
  id: WhiteActionSpellLightningStrike
  parent: CEActionSpellBase
  name: Lightning strike
  description: You charge a powerful lightning bolt that burns a large amount of stamina from the target.
  components:
  - type: CEActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CEActionManaCost
    manaCost: 20
  - type: CEActionSpeaking
    startSpeech: "A fulgur percutiens... "
    endSpeech: "erit ledo vobis!"
  - type: CEActionDoAfterVisuals
    proto: WhiteRuneLightningStrike
  - type: CEActionDangerous
  - type: Action
    useDelay: 10
    icon:
      sprite: _White/Actions/Spells/electromancy.rsi
      state: lightning_strike
  - type: TargetAction
    range: 5
  - type: DoAfterArgs
    delay: 2
    breakOnDamage: true
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:CEEntityTargetModularEffectEvent
      effects:
      - !type:CESpellSpawnEntityOnTarget
        spawns:
        - WhiteElectrifiedEffect
      - !type:SpellCreateBeam
        beamProto: WhiteLightningStrikeBeam
      - !type:CESpellApplyEntityEffect
        effects:
        - !type:HealthChange
          ignoreResistances: false
          damage:
            types:
              Shock: 12
        - !type:Jitter
        - !type:WhiteStaminaChange
          staminaDelta: -80
      - !type:CESpellThrowFromUser
        throwPower: 4
        distance: 1

- type: entity
  name: lightning
  id: WhiteLightningStrikeBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _White/Effects/Beams/lightning.rsi
    drawdepth: Effects
    layers:
    - state: lightning
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: PointLight
    enabled: true
    color: "#e8ff4c"
    radius: 1.5
    softness: 1
    autoRot: true
    castShadows: false
  - type: Beam
    sound: /Audio/Effects/Lightning/lightningshock.ogg
  - type: TimedDespawn
    lifetime: 1.5
  - type: LightFade
    duration: 1.5
  - type: Tag
    tags:
    - HideContextMenu
  - type: WhiteSpellEffectOnCollide
    effects:
    - !type:CESpellSpawnEntityOnTarget
      spawns:
      - WhiteElectrifiedEffect
    - !type:CESpellApplyEntityEffect
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Shock: 10
      - !type:Jitter
      - !type:WhiteStaminaChange
        staminaDelta: -30

- type: entity
  id: WhiteRuneLightningStrike
  parent: CEBaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#e8ff4c"
  - type: Sprite
    layers:
    - state: medium_circle
      color: "#e8ff4c"
      shader: unshaded
