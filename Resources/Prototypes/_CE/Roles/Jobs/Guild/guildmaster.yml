- type: job
  id: CEGuildmaster
  setPreference: true
  name: ce-job-name-guildmaster
  description: ce-job-desc-guildmaster
  playTimeTracker: CEJobGuildmaster
  startingGear: CEGuildmasterGear
  icon: CEJobIconGuildmaster
  supervisors: ce-job-supervisors-empire
  requireAdminNotify: true
  joinNotifyCrew: true
  requirements:
    - !type:CEAchievementRequirement
      achievement: RoundsFinishedAliveGuild2

- type: startingGear
  id: CEGuildmasterGear
  equipment:
    belt: CEKeyRingGuildmaster
    pocket1: CEWalletFilledGuildmaster

- type: entity
  id: CEWalletFilledGuildmaster
  parent: CEWallet
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents: #200cp total
    - id: CECoinGold1
    - id: CECoinSilver5
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinCopper10

- type: entity
  id: CEChestFilledGuildmaster
  parent: CEGoldChest
  suffix: Filled, Guildmaster
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CERubberStampApproved
        - id: CERubberStampDenied
        - id: CERubberStampGuildmaster

- type: entity
  id: CEBedsideTableFilledGuildmaster
  parent: CEBedsideTableWooden
  suffix: Filled, Guildmaster
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        rolls: !type:RangeNumberSelector
          range: 2, 3
        children:
        - id: CEClothingCloakGuildmaster
        - id: CEClothingHeadFedoraGuildmaster

- type: entity
  id: CEKeyRingGuildmaster
  parent: CEBaseKeyRing
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents:
    - id: CEKeyGuildLobby
    - id: CEKeyGuildInner
    - id: CEKeyGuildStorage
    - id: CEKeyGuildmasterRoom
