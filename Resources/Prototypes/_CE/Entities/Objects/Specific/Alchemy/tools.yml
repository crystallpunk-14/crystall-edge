## Injector modes (fine dosage, matching the original CP14 transfer amounts)

- type: injectorMode
  abstract: true
  id: CEAlchemyDropperMode
  transferAmounts:
  - 0.25
  - 0.5
  - 1

- type: injectorMode
  parent: [ CEAlchemyDropperMode, BaseInjectMode ]
  id: CEAlchemyDropperInjectMode

- type: injectorMode
  parent: [ CEAlchemyDropperMode, BaseDrawMode ]
  id: CEAlchemyDropperDrawMode

- type: injectorMode
  abstract: true
  id: CEAlchemySyringeMode
  transferAmounts:
  - 5
  - 10

- type: injectorMode
  parent: [ CEAlchemySyringeMode, BaseInjectMode ]
  id: CEAlchemySyringeInjectMode

- type: injectorMode
  parent: [ CEAlchemySyringeMode, BaseDrawMode ]
  id: CEAlchemySyringeDrawMode

## Entities

- type: entity
  parent: BaseItem
  id: CEDropper
  name: dropper
  description: Small dropper for managing very small values of liquids
  categories: [ ForkFiltered ]
  components:
  - type: MixableSolution
    solution: vial
  - type: FitsInDispenser
    solution: vial
  - type: RefillableSolution
    solution: vial
  - type: DrainableSolution
    solution: vial
  - type: ExaminableSolution
    solution: vial
  - type: DrawableSolution
    solution: vial
  - type: InjectableSolution
    solution: vial
  - type: SolutionItemStatus
    solution: vial
  - type: Solution
    id: vial
    solution:
      maxVol: 2
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Appearance
  - type: Injector
    solutionName: vial
    ignoreMobs: true
    ignoreClosed: false
    activeModeProtoId: CEAlchemyDropperDrawMode
    allowedModes:
    - CEAlchemyDropperDrawMode
    - CEAlchemyDropperInjectMode
  - type: Sprite
    sprite: _CE/Objects/Specific/Alchemy/dropper.rsi
    layers:
      - state: dropper
      - state: liq-1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: liq-
  - type: Item
    size: Tiny
    sprite: _CE/Objects/Specific/Alchemy/dropper.rsi
  - type: Tag
    tags:
    - Dropper

- type: entity
  id: CESyringe
  parent: BaseItem
  name: syringe
  description: Used to draw blood samples from mobs, or to inject them with reagents.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Specific/Alchemy/syringe.rsi
    layers:
      - state: syringe1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
      - state: base
        map: ["enum.SolutionContainerLayers.Base"]
  - type: Icon
    sprite: _CE/Objects/Specific/Alchemy/syringe.rsi
    state: base
  - type: Item
    size: Tiny
    sprite: _CE/Objects/Specific/Alchemy/syringe.rsi
  - type: Solution
    id: injector
    solution:
      maxVol: 10
  - type: Injector
    activeModeProtoId: CEAlchemySyringeDrawMode
    allowedModes:
    - CEAlchemySyringeDrawMode
    - CEAlchemySyringeInjectMode
  - type: ExaminableSolution
    solution: injector
  - type: Spillable
    solution: injector
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: syringe
  - type: Tag
    tags:
    - Syringe
  - type: PhysicalComposition
    materialComposition:
      Glass: 10
      Steel: 10
