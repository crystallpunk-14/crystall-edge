- type: entity
  abstract: true
  id: CEBaseWeaponSword
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  - CEBaseWeaponSharp
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
  - type: Tag
    tags:
    - CEWeaponSword
  - type: CEWeapon
    range: 0.7
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Slash: 8
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Slash: 10
    animations:
      Primary:
      - anim: SwordAttackLight1
      - anim: SwordAttackLight2
      Secondary:
      - anim: SwordAttackHeavy1
        speed: 1.2
      - anim: SwordAttackHeavy2
        speed: 1.2
  - type: CEDualWield
    animationSets:
    - tag: CEWeaponSword
      useType: Secondary
      animations:
      - anim: SwordAttackDualWield1
      - anim: SwordAttackDualWield2
      - anim: SwordAttackDualWield3
  - type: CEWeaponStaminaCost
    costs:
      Primary: 5
      Secondary: 5
  - type: CERotationForAnimation
    rotation: -90
  - type: Clothing
    slots:
    - neck
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Metal: { min: 1, max: 3 }
  - type: StaticPrice
    price: 50

- type: entity
  parent: CEBaseWeaponSword
  id: CEWeaponSwordIron
  name: iron sword
  description: A finely crafted sword favored by imperial officers. Its blade gleams with authority and tradition.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Sword/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 10
      CEIron: 10
