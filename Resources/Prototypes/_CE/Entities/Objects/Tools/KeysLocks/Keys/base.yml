- type: entity
  parent: BaseItem
  id: CEBaseKey
  abstract: true
  categories: [ ForkFiltered ]
  name: key
  description: A small, intricate piece of metal that opens some locks. Don't give it to anyone!
  components:
  - type: Tag
    tags:
    - CEKey
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CE/Objects/Tools/key.rsi
  - type: CEKey
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_CE/Effects/key_drop.ogg
      params:
        variation: 0.05

- type: entity
  parent: CEBaseKey
  id: CEKeyIronBlank
  components:
  - type: Sprite
    state: key_iron
  - type: CEKey
    shape:
    - 5
    - 5
    - 5
    - 5
    - 5
  - type: PhysicalComposition
    materialComposition:
      CEIron: 5
