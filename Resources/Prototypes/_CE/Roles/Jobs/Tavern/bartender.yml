- type: job
  id: CEBartender
  setPreference: true
  name: ce-job-name-bartender
  description: ce-job-desc-bartender
  playTimeTracker: CEJobBartender
  startingGear: CEBartenderGear
  icon: CEJobIconBartender
  supervisors: ce-job-supervisors-empire

- type: startingGear
  id: CEBartenderGear
  equipment:
    belt: CEKeyRingBartender
    pocket1: CEWalletFilledBartender


- type: entity
  id: CEWalletFilledBartender
  parent: CEWallet
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents: #100cp total
    - id: CECoinSilver5
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinCopper10

- type: entity
  id: CEChestFilledBartender
  parent: CEWoodenChest
  suffix: Filled, Bartender
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CECoinCopper1

- type: entity
  id: CEBedsideTableFilledBartender
  parent: CEBedsideTableWooden
  suffix: Filled, Bartender
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        rolls: !type:RangeNumberSelector
          range: 2, 3
        children:
        - id: CEClothingShirtWhiteCollar
        - id: CEClothingShirtOpenRed
        - id: CEClothingPantsBrown
        - id: CEClothingCloakCapeFur
        - id: CEClothingShoesSandals

- type: entity
  id: CEKeyRingBartender
  parent: CEBaseKeyRing
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents:
    - id: CEKeyTavernHall
    - id: CEKeyTavernStaff
