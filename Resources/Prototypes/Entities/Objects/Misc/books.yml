- type: entity
  name: book
  parent: BaseItem
  id: BookBase
  description: A hardcover book.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_base
      color: "#332d27"
      map: [ "cover" ]
    - state: decor_wingette
      color: "#453f3a"
      map: [ "decor" ]
    - state: icon_text
      map: [ "icon" ]
    - state: overlay_null
      map: [ "overlay" ]
  - type: Paper
    contentSize: 12000
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
  - type: Tag
    tags:
    - Book
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_book.svg.96dpi.png"
    backgroundPatchMargin: 23.0, 15.0, 14.0, 16.0
    contentMargin: 20.0, 20.0, 20.0, 20.0
  - type: MeleeWeapon  # This was originally a feature exclusive to the law book but maintainers decided it should apply to all books for consistency. I frankly disagree but :P
    soundHit:
      collection: Punch
    damage:
      types:
        Blunt: 1
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 1

- type: entity
  parent: BaseItem
  id: BaseGuidebook
  abstract: true
  suffix: guidebook
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
  - type: Tag
    tags:
    - Book
  - type: MeleeWeapon  # Should write it again since BaseGuidebook doesn't inherit BookBase
    soundHit:
      collection: Punch
    damage:
      types:
        Blunt: 1
  - type: DamageOtherOnHit
    damage:
      types: {}

- type: entity
  id: BookEngineersHandbook
  parent: BaseGuidebook
  name: engineer's handbook
  description: A handbook about engineering written by Nanotrasen.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#6c4718"
    - state: decor_wingette
      color: "#b5913c"
    - state: icon_wrench
    - state: icon_corner
      color: gold

- type: entity
  id: BookScientistsGuidebook
  parent: BaseGuidebook
  name: scientist's guidebook
  description: A guidebook about science written by Nanotrasen.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#542485"
    - state: decor_wingette_circle
      color: "#be69f0"
    - state: icon_dna

- type: entity
  id: BookSecurity
  parent: BaseGuidebook
  name: security 101
  description: A book about security written by Nanotrasen. The book is stained with blood. It seems to have been used more as a weapon than reading material.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#ab1515"
    - state: decor_wingette
      color: "#e05334"
    - state: icon_stunbaton
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 6

- type: entity
  id: BookMedicalReferenceBook
  parent: BaseGuidebook
  name: medical reference book
  description: A reference book about medical written by an old doctor. The handwriting is barely comprehensible.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#cccccc"
    - state: decor_wingette
      color: "#f7f7f7"
    - state: icon_medical
      color: "#58abcc"

- type: entity
  id: BookSpaceLaw
  parent: BaseGuidebook
  name: space law
  description: A set of Nanotrasen guidelines for keeping law and order on their space stations.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_strong
      color: "#87011c"
    - state: icon_law
      color: "#f7d61a"

