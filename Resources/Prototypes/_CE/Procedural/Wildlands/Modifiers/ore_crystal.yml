# Crystal ore: veins and cores shaped by noise over natural walls.

- type: entity
  id: CEWildlandsModifierOreCrystalNoise
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    effects:
    - !type:GenerationLayers
      layers:
      - !type:FillEntityLayer
        entity: CEWallCrystalCore
        mask:
        - !type:NoiseMask
          threshold: 0.75
          noise:
            seed: 503
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.15
            octaves: 3
        - !type:EntityMask
          entities:
          - CEWallStone
          - CEWallDirt
          - CEWallSnow
      - !type:FillEntityLayer
        entity: CEFloorCrystal
        mask:
        - !type:NoiseMask
          threshold: 0.6
          noise:
            seed: 563
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.05
            octaves: 3
        - !type:NoEntityMask
