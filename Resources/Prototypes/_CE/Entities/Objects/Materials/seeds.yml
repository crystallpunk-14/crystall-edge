- type: entity
  id: CEBaseSeed
  parent: BaseItem
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CE/Objects/Materials/seeds.rsi
  - type: CESeed
  - type: Tag
    tags:
    - CEFarmSeed
  - type: StaticPrice
    price: 1

- type: entity
  id: CESeedWheat
  name: wheat seeds
  description: Small wheat seeds. What will you do with them? Grind them into flour, or plant them again?
  parent: CEBaseSeed
  components:
  - type: Sprite
    layers:
    - state: wheat
  - type: CESeed
    plantProto: CEPlantWheat

