# Shadow eaters: a hazard layer scattering lone shadow eaters over every level of the wildlands.
# They sleep until a player comes near, so a full map of them costs nothing while unvisited.

- type: entity
  id: CEWildlandsModifierShadowEaters
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    effects:
    - !type:SpawnEntities
      entity: CEMobShadowEater
      count:
        min: 150
        max: 150
      mask:
      - !type:NoEntityMask
      - !type:TileMask
        inverted: true
        tiles:
        - Space
