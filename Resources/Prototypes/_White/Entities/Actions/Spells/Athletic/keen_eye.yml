- type: entity
  id: WhiteActionToggleKeenEye
  name: Keen Eye
  parent: BaseMentalAction
  description: You gaze into the distance, which allows you to see things that are farther away.
  components:
  - type: Action
    useDelay: 5 # Spamming prevention
    icon:
      sprite: _White/Actions/Spells/athletic.rsi
      state: keen_eye
    checkCanInteract: false
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:EyeOffsetToggleActionEvent
