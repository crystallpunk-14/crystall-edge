- type: job
  id: CEChef
  setPreference: true
  name: ce-job-name-chef
  description: ce-job-desc-chef
  playTimeTracker: CEJobChef
  startingGear: CEChefGear
  icon: CEJobIconChef
  supervisors: ce-job-supervisors-empire

- type: startingGear
  id: CEChefGear
  equipment:
    belt: CEKeyRingChef
    pocket1: CEWalletFilledChef


- type: entity
  id: CEWalletFilledChef
  parent: CEWallet
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents: #100cp total
    - id: CECoinSilver5
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinCopper10

- type: entity
  id: CEChestFilledChef
  parent: CEWoodenChest
  suffix: Filled, Chef
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CECoinCopper1

- type: entity
  id: CEBedsideTableFilledChef
  parent: CEBedsideTableWooden
  suffix: Filled, Chef
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        rolls: !type:RangeNumberSelector
          range: 2, 3
        children:
        - id: CEClothingHeadBeretGuildGreen

- type: entity
  id: CEKeyRingChef
  parent: CEBaseKeyRing
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents:
    - id: CEKeyTavernHall
    - id: CEKeyTavernStaff
