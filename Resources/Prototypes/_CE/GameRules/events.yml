- type: entity
  id: CERampingStationEventScheduler
  parent: CEBaseGameRule
  components:
  - type: RampingStationEventScheduler
    averageEndTime: 120
    scheduledGameRules: !type:NestedSelector
      tableId: CEEventsTable

- type: entityTable
  id: CEEventsTable
  table: !type:AllSelector
    children:
    - id: CERandomPipeBreak
    - id: CERandomHungryNodeSpawn

- type: entity
  parent: CEBaseGameRule
  id: CERandomPipeBreak
  components:
  - type: StationEvent
    startAnnouncement: ce-station-event-pipe-break
    startAnnouncementColor: "#18abf5"
    startAudio:
      path: /Audio/_CE/Announce/broken_pipe_far.ogg
      params:
        volume: 10
    duration: 1
    minimumPlayers: 0
  - type: CEPipeBreakageRule
    replacementMap:
      CEPipeBrassMedium: CEPipeBrassMediumBroken
      CEPipeBrassBig: CEPipeBrassBigBroken
    centerPrototype: CEPipeBrassBig
    radius: 3
    breakChance: 0.8
    centerVfx: CEShockWaveStrongVFX
    breakSound:
      collection: MetalBreak

- type: entity
  parent: CEBaseGameRule
  id: CERandomHungryNodeSpawn
  components:
  - type: StationEvent
    weight: 5
    minimumPlayers: 0
  - type: CEInLucsonSphereSpawnRule
    prototype: CEMagicEssenceHungryNode
