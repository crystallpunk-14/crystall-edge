- type: entity
  id: CEWoodenLadderItem
  parent: BaseItem
  name: wooden ladder
  description: A folded wooden ladder. Mount it on a wall, or hang it down from an open edge next to you to the level below.
  categories: [ ForkFiltered ]
  suffix: 1
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Materials/ladder.rsi
    layers:
      - state: wooden1
        map: ["base"]
  - type: Appearance
  - type: Construction
    graph: CEWoodenLadderItem
    node: CEWoodenLadderItem
  - type: Stack
    stackType: CEWoodenLadder
    count: 1
    baseLayer: base
    layerStates:
    - wooden1
    - wooden2
    - wooden3
  - type: CEPlaceable
    prototype: CEWoodenLadder
    allowPlaceBelow: true
    conditions:
    - !type:TileNotBlocked
    - !type:WallBehind
    - !type:NoWallmount

- type: entity
  id: CEWoodenLadderItem5
  parent: CEWoodenLadderItem
  suffix: 5
  components:
  - type: Stack
    count: 5

- type: entity
  id: CEWoodenLadderItem10
  parent: CEWoodenLadderItem
  suffix: 10
  components:
  - type: Stack
    count: 10
