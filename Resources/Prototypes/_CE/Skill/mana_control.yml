- type: skill
  id: ManaControl
  name: ce-skill-mana-control-name
  desc: ce-skill-mana-control-desc
  icon:
    sprite: _CE/Interface/Skills/mana_control.rsi
    state: toggle
  effect: !type:AddAction
    action: CEActionManaControl

- type: entity
  id: CEActionManaControl
  name: Mana control
  description: Switch between restoring and spending your mana.
  components:
  - type: Action
    itemIconStyle: BigAction
    checkCanInteract: false
  - type: Sprite
    sprite: _CE/Interface/Skills/mana_control.rsi
    layers:
    - state: restore
      map: ["enum.ActionVisuals.Icon"]
    - state: consume
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:CEToggleStatusEffectsActionEvent
      disabled: CEStatusEffectManaRegen
      enabled: CEStatusEffectManaDrain

- type: entity
  parent: StatusEffectBase
  id: CEStatusEffectManaRegen
  name: mana regeneration
  description: Your mana is constantly being restored.
  components:
  - type: StatusEffect
    whitelist:
      components:
      - Battery
  - type: CEBatteryRechargeStatusEffect
    rate: 2

- type: entity
  parent: StatusEffectBase
  id: CEStatusEffectManaDrain
  name: mana drain
  description: Your mana is constantly being spent.
  components:
  - type: StatusEffect
    whitelist:
      components:
      - Battery
  - type: CEBatteryRechargeStatusEffect
    rate: -2
