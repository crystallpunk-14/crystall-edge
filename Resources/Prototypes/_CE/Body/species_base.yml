- type: entity
  id: CEBaseSpeciesAppearance
  parent: BaseSpeciesAppearance
  abstract: true
  save: false
  components:
  - type: Sprite
    layers:
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LFoot" ]
    - map: [ "enum.HumanoidVisualLayers.RFoot" ]
    - map: [ "pants" ]
    - map: [ "shoes" ]
    - map: [ "shirt" ]
    - map: [ "enum.HumanoidVisualLayers.LHand" ]
    - map: [ "enum.HumanoidVisualLayers.RHand" ]
    - map: [ "gloves" ]
    - map: [ "ears" ]
    - map: [ "outerClothing" ]
    - map: [ "cloak" ]
    - map: [ "belt" ]
    - map: [ "belt2" ]
    - map: [ "neck" ]
    - map: [ "back" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "eyes" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false

- type: entity
  save: false
  parent:
  - BaseMob
  - CEMobDamageable
  - CEMobMagical
  - CEMobTemperature
  - MobPolymorphable
  - CEBaseSpeciesAppearance
  id: CEBaseSpeciesMob
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: DamageVisuals
    thresholds: [ 10, 20, 30, 50, 70, 100 ]
    targetLayers:
    - "enum.HumanoidVisualLayers.Chest"
    - "enum.HumanoidVisualLayers.Head"
    - "enum.HumanoidVisualLayers.LArm"
    - "enum.HumanoidVisualLayers.LLeg"
    - "enum.HumanoidVisualLayers.RArm"
    - "enum.HumanoidVisualLayers.RLeg"
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#FF0000"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: GenericVisualizer
    visuals:
      enum.CreamPiedVisuals.Creamed:
        clownedon: # Not 'creampied' bc I can already see Skyrat complaining about conflicts.
          True: {visible: true}
          False: {visible: false}
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: ContentEye
    maxZoom: 0.8, 0.8
    targetZoom: 0.8, 0.8
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      70: 0.6
      80: 0.5
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 185
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FloorOcclusion
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MeatBulletImpact
    soundTypes:
      Heat:
        collection:
          MeatLaserImpact
  - type: CanMoveInAir
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [Touch, Ingestion]
  - type: StatusEffects
    allowed:
    - Electrocution
    - RatvarianLanguage
    - PressureImmunity
    - Muted
    - TemporaryBlindness
    - Pacified
    - StaminaModifier
    - Flashed
    - RadiationProtection
    - Adrenaline
  - type: Crawler
  - type: Identity
  - type: Climbing
  - type: Cuffable
  - type: Ensnareable
    sprite: Objects/Misc/ensnare.rsi
    state: icon
  - type: AnimationPlayer
  - type: Buckle
  - type: CombatMode
    canDisarm: true
  - type: CEWeapon
    range: 0.4
    hitSound:
      collection: Punch
    effectSlots:
      OnHit:
      - !type:WeaponArcAttack
        arcWidth: 40
        effects:
        - !type:Damage
          damage:
            types:
              Blunt: 3
    animations:
      Primary:
      - anim: Punch1
      - anim: Punch2
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
  - type: SleepEmitSound
  - type: SSDIndicator
  - type: StandingState
  - type: MindContainer
  - type: MindExaminable
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: NpcFactionMember
    factions:
    - CEImperial
  - type: Stripping
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.CEAmbitionsUIKey.Key:
        type: CEAmbitionsBoundUserInterface
  - type: Puller
  - type: Speech
    speechSounds: Alto
  - type: CEBarkSpeech
    barkSpeech: Ed
  - type: DamageForceSay
  - type: Vocal
    emoteSounds: MaleHuman
  - type: Emoting
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: Grammar
    attributes:
      proper: true
  - type: Tag
    tags:
    - FootstepSound
  - type: MovementAlwaysTouching
  - type: MovementSpeedModifier
    weightlessAcceleration: 0.8 # Slow swimming
    weightlessFriction: 2
    weightlessModifier: 0.6
  - type: CEBlinker
  - type: CESkillStorage
  - type: Hunger
  - type: Thirst
  - type: CEAnimationController
  - type: CEIdleAnimation
    animation:
      scaleAnimation:
      - time: 0
        scale: 1.01, 0.99
      - time: 2
        scale: 0.99, 1.01
      - time: 4
        scale: 1.01, 0.99
      offsetAnimation:
      - time: 0
        offset: 0, 0
      - time: 2
        offset: 0, 0.01
      - time: 4
        offset: 0, 0
  - type: CEWalkingAnimation
    animation:
      scaleAnimation:
      - time: 0
        scale: 1.02, 0.98
      - time: 0.2
        scale: 0.98, 1.02
      - time: 0.3
        scale: 1.02, 0.98
      offsetAnimation:
      - time: 0
        offset: 0, 0
      - time: 0.2
        offset: 0, 0.02
      - time: 0.3
        offset: 0, 0

- type: entity
  parent:
  - MobBloodstream
  - MobFlammable
  - CEBaseSpeciesMob
  - CEMobRespirator
  id: CEBaseSpeciesMobOrganic
  save: false
  abstract: true
  components:
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Stutter
    - SeeingRainbows
    - Electrocution
    - ForcedSleep
    - TemporaryBlindness
    - Drunk
    - SlurredSpeech
    - RatvarianLanguage
    - PressureImmunity
    - Muted
    - Pacified
    - StaminaModifier
    - Flashed
    - RadiationProtection
    - Drowsiness
    - Adrenaline
  - type: Blindable
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CEBlood
        Quantity: 300
  - type: FireVisuals
    sprite: _CE/Mobs/Effects/onfire.rsi
    normalState: Small_burning
    alternateState: Humanoid_burning
  - type: CEAmbitionsSetup
