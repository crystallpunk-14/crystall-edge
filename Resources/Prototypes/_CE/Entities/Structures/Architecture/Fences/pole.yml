- type: entity
  parent: BaseStructure
  id: CEBasePole
  abstract: true
  categories: [ ForkFiltered ]
  name: pole
  description: A simple wooden pole. Perfect for reinforcing fence sections and creating corner joints.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    drawdepth: Mobs
    offset: -0.4,-0.4
    state: icon
  - type: Icon
    state: icon
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/boxingpunch1.ogg"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,-0.375,-0.375"
        density: 1000
        layer:
        - LowImpassable
        - MidImpassable
  - type: Climbable
    delay: 1.5

- type: entity
  parent:
  - CEBasePole
  id: CEPoleWooden
  suffix: Wooden
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Fences/poles.rsi
  - type: Icon
    sprite: _CE/Structures/Architecture/Fences/poles.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CEWoodenPlanks1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CEPoleWooden
    node: CEPoleWooden