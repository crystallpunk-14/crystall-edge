#MARK: Claw 1
- type: entityEffectAnimation
  id: ClawAttack1
  movementSpeed: 0.3
  duration: 0.35
  events:
    0:
    - !type:PlaySound
      sound:
        path: /Audio/_CE/Effects/Weapon/slash.ogg
    - !type:UsedEntityAnimation
      dummyEntity: CEClawEffect
      offsetAnimation:
      - time: 0.0
        offset: 0.8, -0.1
      - time: 0.3
        offset: 0, -0.8
        easing: QuadOut

      rotationAnimation:
      - time: 0.0
        rotation: 40
      - time: 0.3
        rotation: -40
        easing: QuadOut

      colorAnimation:
      - time: 0.0
        color: "#ffffff00"  # Fade out
        easing: QuadIn
      - time: 0.2
        color: "#ffffff"
        easing: QuadOut
      - time: 0.3
        color: "#ffffff00"  # Fade out
    0.08:
    - !type:WeaponArcAttack
      arcWidth: 40
      effects:
      - !type:WeaponEffectSlot
        slot: OnHit

