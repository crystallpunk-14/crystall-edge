- type: entity
  id: CEWallLightItemBase
  parent: BaseItem
  abstract: true
  categories: [ ForkFiltered ]
  name: wall lamp
  description: A light fixture. Can be mounted on a wall, where it draws power and produces light.
  suffix: Item
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _CE/Objects/Decorations/wall_lamp.rsi
  - type: Stack
    count: 1
  - type: StackPrice
    price: 3.25
  - type: CEPlaceable
    conditions:
    - !type:TileNotBlocked
    - !type:WallBehind
    - !type:NoWallmount

- type: entity
  parent: CEWallLightItemBase
  id: CEWallLightOrangeItem
  suffix: Orange
  components:
  - type: Sprite
    layers:
    - state: base
    - state: lamp
      color: "#f8ab58"
  - type: Stack
    stackType: CEWallLightOrange
  - type: CEPlaceable
    prototype: CEWallLightOrange

