- type: entity
  id: CEObjectiveLoverAssist
  name: Help your beloved
  description: Do whatever it takes to help the person you secretly love complete every one of their personal objectives this shift.
  components:
  - type: Sprite
    sprite: _CE/Actions/misc.rsi
    state: todo
  - type: CEObjective
  - type: CETargetObjective
    title: ce-lover-assist-objective-title
  - type: CETargetPlayersObjective
  - type: CETargetCompleteOwnedObjective
    objectiveBlacklist:
      components: # avoid an infinite loop if this ever targets another lover
      - CETargetCompleteOwnedObjective

- type: entity
  id: CEObjectiveLoverSurvive
  name: Keep your beloved alive
  description: The person you secretly love must survive this shift.
  components:
  - type: Sprite
    sprite: _CE/Actions/misc.rsi
    state: todo
  - type: CEObjective
  - type: CETargetObjective
    title: ce-lover-survive-objective-title
  - type: CEShareTargetObjective
    objectiveWhitelist:
      components:
      - CETargetCompleteOwnedObjective
  - type: CETargetSurviveCondition
