- type: job
  id: CEInvestigator
  setPreference: true
  name: ce-job-name-investigator
  description: ce-job-desc-investigator
  playTimeTracker: CEJobInvestigator
  startingGear: CEInvestigatorGear
  icon: CEJobIconInvestigator
  supervisors: ce-job-supervisors-empire
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 1h
    # The investigator mask is mandatory, these species have no mask slot
    - !type:SpeciesRequirement
      inverted: true
      species:
      - CECarrin
  special:
    - !type:CELearnSkillsSpecial
      skills:
      - MilitaryTraining

- type: startingGear
  id: CEInvestigatorGear
  equipment:
    belt: CEKeyRingInvestigator
    pocket1: CEWalletFilledInvestigator
  storage:
    back:
    - CEWeaponGunJustice

- type: entity
  id: CEWalletFilledInvestigator
  parent: CEWallet
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents: #100cp total
    - id: CECoinSilver5
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinCopper10

- type: entity
  id: CEKeyRingInvestigator
  parent: CEBaseKeyRing
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents:
    - id: CEKeyInvestigatorHall
    - id: CEKeyInvestigatorStaff

- type: entity
  id: CEBedsideTableFilledInvestigator
  parent: CEBedsideTableWooden
  suffix: Filled, Investigator
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        rolls: !type:RangeNumberSelector
          range: 2, 3
        children:
        - id: CEClothingCloakMantleInvestigator
        - id: CEClothingMaskInvestigator
        - id: CEClothingShirtGuard
        - id: CEClothingShirtSyurkoGuard
        - id: CEClothingPantsGuard

- type: entity
  id: CEChestFilledInvestigator
  parent: CEWoodenChest
  suffix: Filled, Investigator
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CEWeaponGunJustice
        - id: CERope
        - id: CERope
        - id: CERope
