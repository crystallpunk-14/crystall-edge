- type: entity
  id: CEZLevelStairsDirtCliffBase
  abstract: true
  name: dirt cliff
  description: TODO
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Stairs/dirt_cliff.rsi
  - type: Damageable
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          CEDirtBlock1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent:
  - CEZLevelStairsBase
