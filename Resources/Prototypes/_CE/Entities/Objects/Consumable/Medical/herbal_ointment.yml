- type: entity
  id: CEHerbalOintment
  parent: BaseItem
  name: herbal ointment
  description: A thick salve of crushed herbs. Soothes burns and draws out poison.
  suffix: 5
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
    heldPrefix: herbbandage
  - type: Sprite
    sprite: _CE/Objects/Consumable/medical.rsi
    state: herbbandage_3
    layers:
      - state: herbbandage_3
        map: ["base"]
  - type: Appearance
  - type: Construction
    graph: CEHerbalOintment
    node: ceherbalointment
  - type: CEConsumable
    delay: 2.5
    repeat: true
    whitelist:
      components:
      - MobState
    failPopup: ce-consumable-nothing-to-heal
    beginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    endSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
    conditions:
    - !type:DamageContainer
      containers:
      - CEBiological
    - !type:AnyOf
      conditions:
      - !type:HasDamage
        types:
        - Heat
        - Cold
        - Caustic
        - Shock
        - Poison
        - Radiation
      - !type:IsBleeding
    effects:
    - !type:Heal
      types:
        Heat: 10
        Cold: 10
        Caustic: 10
        Shock: 10
        Poison: 10
        Radiation: 10
    - !type:ModifyBleeding
      amount: -2
  - type: Stack
    stackType: CEHerbalOintment
    count: 5
    baseLayer: base
    layerStates:
    - herbbandage
    - herbbandage_2
    - herbbandage_3
  - type: StackPrice
    price: 2

- type: entity
  id: CEHerbalOintment1
  parent: CEHerbalOintment
  suffix: 1
  components:
  - type: Sprite
    state: herbbandage
  - type: Stack
    count: 1
