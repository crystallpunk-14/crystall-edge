- type: entity
  id: WhiteMobSheep
  parent: WhiteSimpleMobBase
  name: sheep
  description: White and fluffy as a cloud sheep.
  categories: [ ForkFiltered ]
  components:
  - type: HTN
    rootTask:
      task: RuminantCompound
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      sprite: _White/Mobs/Animals/sheep.rsi
      state: sheep
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Tag
    tags:
    - WhiteSheep
  - type: Reproductive
    partnerWhitelist:
      tags:
      - WhiteSheep
    offspring:
    - id: WhiteMobSheep
      maxAmount: 1
  - type: ReproductivePartner
  - type: Speech
    speechSounds: Goat
    speechVerb: Goat
  - type: Vocal
    sounds:
      Female: Goat
      Male: Goat
      Unsexed: Goat
  - type: Appearance
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: CombatMode
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 5
  - type: MovementSpeedModifier
    baseWalkSpeed : 4
    baseSprintSpeed : 4
  - type: DamageStateVisuals
    states:
      Alive:
        Base: sheep
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: WhiteFoodMeatLamb
      amount: 4
    # - id: CEString # As long as there are no mechanics to shearing wool, the only way to get string.
    #   amount: 4
    #   maxAmount: 16
    # - id: CEThinLeather1
    #   amount: 2
    #   maxAmount: 5
    # - id: CEScrapLeather
    #   amount: 1
    #   maxAmount: 5
    #   prob: 0.3
    - id: CEBone1
      amount: 1
      maxAmount: 2
  - type: Bloodstream
    bloodMaxVolume: 150
    bloodReagent: CEBloodAnimal
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-goat
    interactFailureString: petting-failure-goat
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/goat_bah.ogg
