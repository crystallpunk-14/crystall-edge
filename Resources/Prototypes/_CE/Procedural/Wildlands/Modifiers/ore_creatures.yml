# Ore crabs and ore spiders: living stone under any roof of the wildlands, mostly the caves.
# They sleep until a player comes near, so a full map of them costs nothing while unvisited.
# One modifier per creature: effects of a single modifier share its seed, so with the same mask
# they would shuffle the tiles identically and stack every creature on the same spots.

- type: entity
  id: CEWildlandsModifierOreCrabsGold
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    effects:
    - !type:SpawnEntitiesPerTiles
      entity: CEMobOreCrabGold
      tilesPerSpawn: 70
      tilesPerSpawnStdDev: 10
      mask:
      - !type:RoofedMask
      - !type:NoEntityMask
      - !type:TileMask
        inverted: true
        tiles:
        - Space

- type: entity
  id: CEWildlandsModifierOreSpidersCoal
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    effects:
    - !type:SpawnEntitiesPerTiles
      entity: CEMobOreSpiderCoal
      tilesPerSpawn: 150
      tilesPerSpawnStdDev: 10
      mask:
      - !type:RoofedMask
      - !type:NoEntityMask
      - !type:TileMask
        inverted: true
        tiles:
        - Space

- type: entity
  id: CEWildlandsModifierOreSpidersGold
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    effects:
    - !type:SpawnEntitiesPerTiles
      entity: CEMobOreSpiderGold
      tilesPerSpawn: 150
      tilesPerSpawnStdDev: 10
      mask:
      - !type:RoofedMask
      - !type:NoEntityMask
      - !type:TileMask
        inverted: true
        tiles:
        - Space
