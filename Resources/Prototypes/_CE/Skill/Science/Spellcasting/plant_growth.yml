- type: skill
  id: PlantGrowth
  parent: SpellcastingSkillBase
  icon:
    sprite: _CE/Actions/Spells/plant_growth.rsi
    state: icon
  effect: !type:AddAction
    action: CEActionSpellPlantGrowth

- type: entity
  id: CEActionSpellPlantGrowth
  name: Plant Growth
  description: You channel vital essence into the area, feeding nearby plants energy and resources and nudging their growth forward, while also mending the wounds of any creatures caught in the bloom.
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeAoEZoneAction
    radius: 1.5
  - type: CEActionManaCost
    manaCost: 15
  - type: CEActionEssenceCost
    essenceCost:
      Plant: 2
      Life: 1
  - type: CEActionStaminaCost
    cost: 10
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
  - type: Sprite
    sprite: _CE/Actions/Spells/plant_growth.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 5
  - type: WorldTargetAction
    event: !type:CEWorldTargetActionAnimationEvent
      animation: AnimationPlantGrowth

- type: entityEffectAnimation
  id: AnimationPlantGrowth
  movementSpeed: 0.5
  duration: 0.5
  events:
    0:
    - !type:SayChat
      sentence: "Crescite"
    - !type:SpawnEntity
      spawns:
      - CEEffectAreaHealingTelegraphyPlantGrowth
    0.45:
    - !type:AreaEffect
      range: 1.5
      whitelist:
        components:
        - CEPlant
      effects:
      - !type:AffectPlantEnergy
        amount: 3
      - !type:AffectPlantResource
        amount: 3
      - !type:AffectPlantGrowth
        amount: 0.1
      - !type:HealEvenly
        groups:
          Brute: 10
      - !type:SpawnEntity
        spawns:
        - CEEffectHealingGenericGreen

- type: entity
  parent: CEEffectHealingGeneric
  id: CEEffectHealingGenericGreen
  name: verdant impact
  components:
  - type: Sprite
    layers:
    - state: effect
      shader: unshaded
      color: "#4ee06e"
  - type: PointLight
    color: "#4ee06e"

- type: entity
  parent: CEEffectAreaHealingTelegraphy
  id: CEEffectAreaHealingTelegraphyPlantGrowth
  name: verdant area impact
  components:
  - type: Sprite
    layers:
    - state: area
      shader: unshaded
      color: "#4ee06e"
  - type: PointLight
    color: "#4ee06e"
