- type: entity
  name: rubber stamp
  parent: BaseItem
  id: CERubberStampBase
  categories: [ ForkFiltered ]
  description: A rubber stamp for stamping important documents.
  abstract: true
  components:
  - type: Stamp
    stampedName: ce-stamp-component-stamped-name-default
    stampState: "paper_stamp-generic"
    stampedColor: "#a23e3e"
    sound:
      path: /Audio/Items/Stamp/thick_stamp_sub.ogg
      params:
        volume: -2
        maxDistance: 5
  - type: Sprite
    sprite: _CE/Objects/Bureaucracy/stamp.rsi
  - type: Item
    size: Tiny

- type: entity
  name: "\"APPROVED\" stamp"
  parent: CERubberStampBase
  id: CERubberStampApproved
  components:
  - type: Stamp
    stampedName: ce-stamp-component-stamped-name-approved
    stampedColor: "#1e8f2e"
    stampState: "approved_on_paper"
  - type: Sprite
    state: approved

- type: entity
  name: "\"DENIED\" stamp"
  parent: CERubberStampBase
