- type: entity
  id: CEPlantPepper
  parent: CEGatherablePlantMultiHarvestBase
  name: pepper
  description: Russian roulette. Are you hot, or are you sweet peppers?
  components:
  - type: CEPlant
    updateFrequency: 1
  - type: CEPlantVisuals
    growthSteps: 4
    readyVariations: 2
  - type: Sprite
    layers:
    - state: liq-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      sprite: _CE/Structures/Nature/Farm/pepper.rsi
      map: ["enum.PlantVisualLayers.Base"]
  - type: CEPlantGatherable
    loot:
      All: !type:AllSelector
        children:
        - id: CEFoodPepper
          rolls: !type:RangeNumberSelector
            range: 4, 6

