- type: entity
  parent: BaseItem
  abstract: true
  id: CECandleBase
  categories: [ ForkFiltered ]
  components:
  - type: Tag
    tags:
    - Candle
  - type: Appearance
  - type: PointLight
    color: "#FFA500"
    radius: 2
    energy: 2
  - type: StaticPrice
    price: 3

- type: entity
  id: CECandle
  parent: CECandleBase
  name: candle
  description: A thin wick threaded through fat.
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _CE/Objects/Decorations/candles.rsi
    layers:
      - state: small1
        map: ["random"]
      - state: small_fire
        shader: unshaded
  - type: RandomSprite
    available:
    - random:
        small1: ""
        small2: ""
        small3: ""
  - type: Item
    size: Small
  #- type: ToggleableLightVisuals #TODO inhands
  #  spriteLayer: null
  #  inhandVisuals:
  #    left:
  #    - state: inhand-left-flame
  #      shader: unshaded
  #    right:
  #    - state: inhand-right-flame
  #      shader: unshaded
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

#Candelabra

- type: entity
  id: CECandelabra
  parent: CECandleBase
  name: candelabra
  description: Several candles, beautifully placed on a metal support.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    noRot: true
    offset: 0,0.2
    drawdepth: Mobs
    sprite: _CE/Objects/Decorations/candelabra.rsi
    layers:
      - state: triple
      - state: triple_fire
        shader: unshaded
  - type: Item
    size: Normal
  - type: PointLight
    color: "#FFA500"
    radius: 3
    energy: 2
  - type: Damageable
    damageModifierSet: CEMetallic
  - type: Injurable
  #- type: ToggleableLightVisuals #TODO inhands
  #  spriteLayer: null
  #  inhandVisuals:
  #    left:
  #    - state: inhand-left-flame
  #      shader: unshaded
  #    right:
  #    - state: inhand-right-flame
  #      shader: unshaded
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          CEScrapIron1: { min: 1, max: 1 }
  - type: PhysicalComposition
    materialComposition:
      CEIron: 10 # 1 iron bar

- type: entity
  parent: CECandelabra
  id: CECandelabraBlood
  suffix: Vampire, DO NOT MAP
  categories: [ ForkFiltered, DoNotMap ]
  name: candelabra of crimson candles
  components:
  - type: Sprite
    layers:
      - state: blood
      - state: blood_fire
        shader: unshaded
  - type: PointLight
    color: "#ff1100"

- type: entity
  parent: CECandle
  id: CECandleBlood
  suffix: Vampire, DO NOT MAP
  categories: [ ForkFiltered, DoNotMap ]
  name: crimson candle
  components:
  - type: Sprite
    layers:
      - state: blood1
        map: ["random"]
      - state: blood_fire
        shader: unshaded
  - type: PointLight
    color: "#ff1100"
  - type: RandomSprite
    available:
    - random:
        blood1: ""
        blood2: ""
        blood3: ""
