- type: entity
  abstract: true
  id: CEBaseWeaponSpear
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  components:
  - type: Item
    size: Ginormous
  - type: CEWeapon
    range: 1.26
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Piercing: 10
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Piercing: 22
    animations:
      Primary:
      - anim: SpearAttackLight
        speed: 0.6
      Secondary:
      - anim: SpearAttackHeavy
        speed: 0.6
      - anim: SpearAttackHeavy2
        speed: 0.6
  - type: CEWieldedWeapon
    animations:
      Primary:
      - anim: SpearAttackLight
      Secondary:
      - anim: SpearAttackHeavy
      - anim: SpearAttackHeavy2
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 10
  - type: CERotationForAnimation
    rotation: -90
  - type: Wieldable
  - type: Clothing
    slots:
    - neck
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Metal: { min: 1, max: 4 }
  - type: StaticPrice
    price: 50

- type: entity
  parent: CEBaseWeaponSpear
  id: CEWeaponSpearIron
  name: iron spear
  description: A long iron-tipped spear. Excellent reach keeps enemies at bay.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Spear/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 20
      CEIron: 10
