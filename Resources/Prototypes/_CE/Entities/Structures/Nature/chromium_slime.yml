- type: entity
  id: CEGatherableChromiumSlime
  parent: BaseStructure
  categories: [ ForkFiltered ]
  name: chromium slime
  description: This rare thick substance can be found in a stream of water as if it has a mind of its own. When trying to change the slime itself - the slime changes the reagent it interacts with.
  suffix: Gatherable
  components:
  - type: Sprite
    snapCardinals: true
    drawdepth: FloorTiles
    sprite: _CE/Structures/Nature/chromium_slime.rsi
    layers:
    - state: world1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        world1: ""
        world2: ""
        world3: ""
  - type: InteractionOutline
  - type: Physics
    canCollide: false
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        layer:
        - MidImpassable
        - LowImpassable
  - type: Gatherable
    toolWhitelist:
      components:
      - Hands
    loot:
      All: !type:EntSelector
        id: CEChromiumSlime
  - type: SoundOnGather
    sound:
      collection: FootstepSlime
  - type: Damageable
  - type: Injurable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
