- type: entity
  parent:
  - CEConstructibleMachine
  - CEBaseMachinePowered
  - BaseMachine
  id: CESolutionNormalizer
  categories: [ ForkFiltered ]
  name: solution normalizer
  description: An alchemical device that destroys the reagent that is least present in a solution poured into it, gradually normalizing mixtures down to their dominant reagents. Requires power to operate.
  components:
  - type: Machine
    board: CEMachineCoreSolutionNormalizer
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Items
    noRot: true
    offset: 0, 0.2
    sprite: _CE/Structures/Specific/Thaumaturgy/solution_normalizer.rsi
    layers:
    - state: rotate_back_stop
      map: [ "poweredBack" ]
    - state: liq-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
    - state: base
    - state: rotate_front_stop
      map: [ "poweredFront" ]
  - type: Icon
    sprite: _CE/Structures/Specific/Thaumaturgy/solution_normalizer.rsi
    state: base
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        poweredFront:
          True: { state: rotate_front }
          False: { state: rotate_front_stop }
        poweredBack:
          True: { state: rotate_back }
          False: { state: rotate_back_stop }
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 125
        mask:
        - TabletopMachineMask
  - type: Solution
    id: normalizer
    solution:
      maxVol: 50
  - type: DrainableSolution
    solution: normalizer
  - type: ExaminableSolution
    solution: normalizer
  - type: MixableSolution
    solution: normalizer
  - type: RefillableSolution
    solution: normalizer
  - type: DrawableSolution
    solution: normalizer
  - type: DumpableSolution
    solution: normalizer
  - type: CESolutionNormalizer
    solutionName: normalizer
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: liq-
  - type: AmbientOnPowered
  - type: AmbientSound
    enabled: false
    range: 6
    volume: -3
    sound:
      path: /Audio/_CE/Ambience/normalizer_working.ogg
