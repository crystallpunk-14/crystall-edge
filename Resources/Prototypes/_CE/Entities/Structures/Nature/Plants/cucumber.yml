- type: entity
  id: CEPlantCucumber
  parent: CEGatherablePlantMultiHarvestBase
  name: cucumber
  description: Don't trust people who know how to turn into pickles.
  components:
  - type: CEPlant
    updateFrequency: 1
  - type: CEPlantVisuals
    growthSteps: 5
    readyVariations: 2
  - type: Sprite
    layers:
    - state: liq-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      sprite: _CE/Structures/Nature/Farm/cucumber.rsi
      map: ["enum.PlantVisualLayers.Base"]
