- type: gameMap
  id: Pharus
  mapName: Pharus
  minPlayers: 0
  maxPlayers: 20
  mapPath: /Maps/_CE/Pharus/Pharus0.yml
  stations:
    Pharus:
      stationProto: CEStandardImperialFloatingIsland
      components:
        - type: StationNameSetup
          mapNameTemplate: "Pharus"
        - type: StationJobs
          availableJobs:
            #Engineering
            CEBrigadier: [ 1, 1 ]
            CETechnician: [ 2, 2 ]
            #Tavern
            CETavernmaster: [ 1, 1 ]
            CEChef: [ 2, 2 ]
            #Guild
            CEGuildmaster: [ 1, 1 ]
            CEAdventurer: [ 3, 4 ]
            #Citizens
            CEBard: [ 1, 1 ]
            CESheriff: [ 1, 1 ]
            CETownfolk: [ -1, -1 ]
        - type: CEStationWildlands
          config: Pharus
        - type: CEStationZLevels
          mapsBelow:
          - /Maps/_CE/Pharus/Pharus-2.yml
          - /Maps/_CE/Pharus/Pharus-1.yml
          mapsAbove:
          - /Maps/_CE/Pharus/Pharus1.yml
          - /Maps/_CE/Pharus/Pharus2.yml
          - /Maps/_CE/Pharus/Pharus3.yml
          zLevelsComponentOverrides:
            - type: MapAtmosphere
              space: False
              mixture:
                volume: 2500
                immutable: True
                temperature: 293.15
                moles:
                  Oxygen: 21.824879
                  Nitrogen: 82.10312
            - type: Parallax
              parallax: CEBedrock
            - type: MapLight #BEFORE Light Cycle
              ambientLightColor: "#adcfd8"
            - type: LightCycle #BEFORE Sun shadow cycle!
            - type: CELightCycle
              colors:
                0: "#1c1c27"
                0.125: "#3c3c40"
                0.25: "#63656b"
                0.375: "#d8e4ff"
                0.625: "#d8e4ff"
                0.75: "#424347"
                0.875: "#3a3a42"
            - type: SunShadowCycle
            - type: CEZLevelRoof
            - type: SunShadow
            - type: CECloudsOverlay
              seed: 490
              frequency: 0.2
              octaves: 4
              lacunarity: 2.0
              gain: 0.5
              windVelocity: -1, 0.3
              evolutionSpeed: 0.1
              coverage: 0.6
              shadowStrength: 0.6
              shadowColor: "#000000"
            - type: CEGridStability
              supportLowestLevel: True
            - type: CEMurkedMap

- type: wildlandsConfig
  id: Pharus
  center: 14, -28 # Lucson sphere position
  points:
  - id: snowIsland
    area: !type:RingArea
      minRadius: 70
      maxRadius: 100
  cityModifiers: !type:AllSelector
    children:
    # Ore veins
    - id: CEWildlandsModifierOreCoalRatio10
    - id: CEWildlandsModifierOreIronRatio10
    - id: CEWildlandsModifierOreDiamondConstant10
    - id: CEWildlandsModifierDamagedWoodenWallsRatio50
    # Cores
    - id: CEWildlandsModifierCoreIronRatio30
    - id: CEWildlandsModifierCoreCoalRatio30
    - id: CEWildlandsModifierCoreCrystalRatio30
    - id: CEWildlandsModifierCoreDiamondConstant1
  wildlandsModifiers: !type:AllSelector
    children:
    - id: CEWildlandsModifierOreCoalNoise
    - id: CEWildlandsModifierOreIronNoise
    - id: CEWildlandsModifierOreCrystalNoise
    - id: CEWildlandsModifierDiamondVein
    - id: CEWildlandsModifierBrassRuins
    - id: CEWildlandsModifierDamagedWoodenWallsRatio50
    - id: CEWildlandsModifierBoneyard
    - id: CEWildlandsModifierGoldVein
    - id: CEWildlandsModifierCaveEntrances
    - id: CEWildlandsModifierMushroomGrove
    - id: CEWildlandsModifierShadowEaters
    - id: CEWildlandsModifierLumishrooms
  layersByDepth:
  #MARK: 2 Hills top
    2:
    - !type:TileNoiseDistanceLayer
      size: &size 340, 340
      # Mountains ring the city instead of crowding it, thinning out again toward the shore.
      distanceConfig: &mountainRing !type:RingDistance
        radius: 0.7
        width: 0.6
        blendWeight: 0.6
      mask:
      - !type:BelowMask # only over land; a tile whitelist here would cut holes wherever the biome below repainted the floor
        masks: &onLand
        - !type:TileMask
          inverted: true
          tiles:
          - Space
      fill:
      - tile: CESnow
        threshold: 0.7
        noise: &islandNoise
          frequency: 0.030
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 5
          lacunarity: 2
          gain: 0.5
    #Biome fill
    - !type:FillBiomeLayer # forest patches; the same noise lines them up across levels
      biome: CESnowlandForest
      seed: 6
      mask:
      - !type:TileMask
        tiles:
        - CESnow
      - !type:NoiseMask
        seed: 711
        threshold: 0.1
        noise: &forestNoise
          noiseType: OpenSimplex2
          fractalType: FBm
          frequency: 0.03
          octaves: 3
    - !type:FillBiomeLayer # meadow = the inverted forest noise
      biome: CESnowland
      seed: 6
      mask:
      - !type:TileMask
        tiles:
        - CESnow
      - !type:NoiseMask
        seed: 711
        threshold: 0.1
        noise: *forestNoise
        inverted: true
  #MARK: 1 Hills
    1:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: *mountainRing
      mask:
      - !type:BelowMask
        masks: *onLand
      fill:
      - tile: CESnow
        threshold: 0.6
        noise: *islandNoise
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: *mountainRing
      mask:
      - !type:BelowMask
        masks: *onLand
      fill:
      - tile: CEStone
        threshold: 0.7
        noise: *islandNoise
    #Biome fill
    - !type:FillBiomeLayer # forest patches; the same noise lines them up across levels
      biome: CESnowlandForest
      seed: 3
      mask:
      - !type:TileMask
        tiles:
        - CESnow
      - !type:NoiseMask
        seed: 711
        threshold: 0.1
        noise: *forestNoise
    - !type:FillBiomeLayer # meadow = the inverted forest noise
      biome: CESnowland
      seed: 3
      mask:
      - !type:TileMask
        tiles:
        - CESnow
      - !type:NoiseMask
        seed: 711
        threshold: 0.1
        noise: *forestNoise
        inverted: true
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 2
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: 0 Surface
    0:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.95
      fill:
      - tile: CESnow
        threshold: 0.5
        noise: &shapeNoise
          seed: 1
          noiseType: OpenSimplex2
          frequency: 0.05
          lacunarity: 1.50
          fractalType: Ridged
          octaves: 1
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.5
      fill:
      - tile: Space
        threshold: 0.6
        noise:
          frequency: 0.04
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 5
          lacunarity: 2
          gain: 0.5
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: *mountainRing
      mask:
      - !type:TileMask
        tiles:
        - CESnow
      fill:
      - tile: CEStone
        threshold: 0.6
        noise: *islandNoise
    #Biome fill
    - !type:FillBiomeLayer # forest patches; the same noise lines them up across levels
      biome: CESnowlandForest
      mask:
      - !type:TileMask
        tiles:
        - CESnow
      - !type:NoiseMask
        seed: 711
        threshold: 0.1
        noise: *forestNoise
    - !type:FillBiomeLayer # meadow = the inverted forest noise
      biome: CESnowland
      mask:
      - !type:TileMask
        tiles:
        - CESnow
      - !type:NoiseMask
        seed: 711
        threshold: 0.1
        noise: *forestNoise
        inverted: true
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 1
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: -1 Caves
    -1:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.95
      fill:
      - tile: CEStone
        threshold: 0.45
        noise: *shapeNoise
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.5
      fill:
      - tile: CESnow
        threshold: 0.6
        noise: &caveHolesNoise
          frequency: 0.04
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 5
          lacunarity: 2
          gain: 0.5
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.5
      fill:
      - tile: Space
        threshold: 0.7
        noise: *caveHolesNoise
    #Biome fill
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 368
      mask:
      - !type:TileMask
        tiles:
        - CEStone
    - !type:FillBiomeLayer
      biome: CECavesFloor
      seed: 362
      mask:
      - !type:TileMask
        tiles:
        - CESnow
  #MARK: -2 Caves
    -2:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.95
      fill:
      - tile: CEStone
        threshold: 0.4
        noise: *shapeNoise
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.5
      fill:
      - tile: CESnow
        threshold: 0.7
        noise: *caveHolesNoise
    #Biome fill
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 87
      mask:
      - !type:TileMask
        tiles:
        - CEStone
    - !type:FillBiomeLayer
      biome: CECavesFloor
      seed: 362
      mask:
      - !type:TileMask
        tiles:
        - CESnow
