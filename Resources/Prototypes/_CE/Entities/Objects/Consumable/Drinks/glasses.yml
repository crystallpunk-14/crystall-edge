- type: entity
  parent: BaseItem
  id: CEDrinkBaseGlass
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Solution
    id: drink
    solution:
      maxVol: 25
  - type: Item
    size: Small
  - type: Sprite
    noRot: true
    layers:
    - state: icon-back
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: icon
  - type: Appearance
  - type: SolutionContainerVisuals
    solutionName: drink
    maxFillLevels: 5
    fillBaseName: fill-
  - type: Edible
    edible: Drink
    solution: drink
    destroyOnEmpty: false
    utensil: None # spoons don't fit in glasses, also conflicts with bar spoon stirring
  - type: Spillable
    solution: drink
  - type: MixableSolution
    solution: drink
  - type: DrawableSolution
    solution: drink
  - type: RefillableSolution
    solution: drink
  - type: DrainableSolution
    solution: drink
  - type: InjectableSolution
    solution: drink
  - type: ExaminableSolution
    solution: drink
  - type: SolutionItemStatus
    solution: drink
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: CEWeatherRefillable
    solution: drink
  - type: DnaSubstanceTrace
  - type: Damageable
    damageModifierSet: FlimsyGlass
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior { }
      - !type:SpawnEntitiesBehavior
        spawn:
          CEGlassShard: { min: 1, max: 1 }
        transferForensics: true
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5 # so fragile it smashes when thrown
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: PhysicalComposition
    materialComposition:
      CEGlass: 5

- type: entity
  parent: CEDrinkBaseGlass
  id: CEDrinkGlass
  name: glass
  description: A simple glass for any drink.
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Drinks/Glasses/glass.rsi

- type: entity
  parent: CEDrinkBaseGlass
  id: CEDrinkGlassWine
  name: wine glass
  description: A glass on a long stem, made to show off the color and aroma of wine.
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Drinks/Glasses/wine.rsi

- type: entity
  parent: CEDrinkBaseGlass
  id: CEDrinkGlassRock
  name: rocks glass
  description: A short, heavy-bottomed glass for strong spirits.
  components:
  - type: Solution
    solution:
      maxVol: 20
  - type: SolutionContainerVisuals
    maxFillLevels: 4
  - type: Sprite
    sprite: _CE/Objects/Consumable/Drinks/Glasses/rock.rsi

- type: entity
  parent: CEDrinkBaseGlass
  id: CEDrinkGlassMartini
  name: martini glass
  description: A cone-shaped glass for those who like their drinks served with style.
  components:
  - type: Solution
    solution:
      maxVol: 15
  - type: SolutionContainerVisuals
    maxFillLevels: 3
  - type: Sprite
    sprite: _CE/Objects/Consumable/Drinks/Glasses/martini.rsi

- type: entity
  parent: CEDrinkBaseGlass
  id: CEDrinkGlassShot
  name: shot glass
  description: A tiny glass for a single swallow.
  components:
  - type: Solution
    solution:
      maxVol: 5
  - type: Item
    size: Tiny
  - type: SolutionContainerVisuals
    maxFillLevels: 1
  - type: Sprite
    sprite: _CE/Objects/Consumable/Drinks/Glasses/shot.rsi
