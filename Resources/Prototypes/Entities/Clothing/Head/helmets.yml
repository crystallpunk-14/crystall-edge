#These are intentionally all very mediocre as locational damage does not exist yet. Without it, armor values will stack in a way that makes it really god damn hard to determine how effective something is, along with making players extremely tanky.
#When it DOES exist, the values here should be totally reworked - probably just port them from SS13.

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHelmetBase
  abstract: true
  components:
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: HideLayerClothing
    layers:
      HeadTop : HEAD
      HeadSide : HEAD

- type: entity
  parent: ClothingHeadHelmetBase
  id: ClothingHeadHelmetArmoredBase
  abstract: true
  components:
  - type: Armor #Values seem to let the user survive one extra hit if attacked consistently.
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9

#Security Helmet
- type: entity
  parent: [ClothingHeadHelmetArmoredBase, BaseFoldable, BaseSecurityContraband]
  id: ClothingHeadHelmetBasic
  name: security helmet
  description: Standard security gear. Protects the head from impacts, and comes with a visor which can be lowered to protect the eyes.
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/security.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-visor
      map: [ "foldedLayer" ]
      visible: false
  - type: Clothing
    sprite: Clothing/Head/Helmets/security.rsi
  - type: Tag
    tags:
    - WhitelistChameleon
    - SecurityHelmet
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-raise-visor-verb
    foldVerbText: fold-lower-visor-verb
  - type: FoldableClothing
    foldedEquippedPrefix: visor
    foldedHeldPrefix: visor
  - type: HideLayerClothing
    layers:
      Hair: HEAD

#Light Riot Helmet
- type: entity
  parent: [ClothingHeadHelmetBase, BaseFoldable, BaseSecurityContraband]
  id: ClothingHeadHelmetRiot
  name: light riot helmet
  description: It's a helmet specifically designed to protect against close range attacks, it has a foldable visor.
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/light_riot.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: visor-icon
      map: [ "foldedLayer" ]
      visible: false
  - type: Clothing
    sprite: Clothing/Head/Helmets/light_riot.rsi
  - type: IngestionBlocker
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.95
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-lower-visor-verb
    foldVerbText: fold-raise-visor-verb
  - type: FoldableClothing
    foldedEquippedPrefix: visor
    foldedHeldPrefix: visor
  - type: Tag
    tags:
    - WhitelistChameleon
    - SecurityHelmet
  - type: HideLayerClothing
    layers:
      Hair: HEAD

#Bombsuit Helmet
- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHelmetBombSuit
  name: bombsuit helmet
  description: A heavy helmet designed to withstand the pressure generated by a bomb and any fragments the bomb may produce.
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/bombsuit.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/bombsuit.rsi
  - type: IngestionBlocker
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
  - type: HideLayerClothing
    layers:
      Hair: HEAD
      Snout: HEAD

#Space Ninja Helmet
