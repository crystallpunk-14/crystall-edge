# File for the metamorphic glass and pre-filled drinks
# TODO Autogenerate prototypes so this file isn't 1000s of lines
# When adding new drinks also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\drinks_glass.yml
# Note these glasses are smaller than non metamorphic glasses that way bartenders can make more drinks

# Transformable container - normal glass
- type: entity
  parent: [DrinkBaseMaterialGlass, SolutionTiny, DrinkBaseCup, DrinkVisualsFillOverlay]
  id: DrinkGlass
  name: metamorphic glass
  description: A metamorphic glass that automagically turns into a glass appropriate for the drink within. There's a sanded off patent number on the bottom.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Consumable/Drinks/glass_clear.rsi
  - type: TransformableContainer
  - type: SolutionContainerVisuals
    maxFillLevels: 9
    metamorphic: true
    metamorphicDefaultSprite:
      sprite: Objects/Consumable/Drinks/glass_clear.rsi
      state: icon
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
        transferForensics: true

- type: entity
  parent: DrinkGlass
  id: DrinkLemonadeGlass
  suffix: lemonade
  components:
  - type: Solution
    solution:
        reagents:
        - ReagentId: Lemonade
          Quantity: 30
  - type: Icon
    sprite: Objects/Consumable/Drinks/lemonadeglass.rsi
    state: icon

- type: entity
  parent: DrinkGlass
  id: DrinkNothing
  suffix: nothing
  components:
  - type: Solution
    solution:
        reagents:
        - ReagentId: Nothing
          Quantity: 30
  - type: Icon
    sprite: Objects/Consumable/Drinks/nothing.rsi
    state: icon
