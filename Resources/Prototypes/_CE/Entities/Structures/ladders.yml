- type: entity
  id: CEZLevelLadderBase
  abstract: true
  categories: [ ForkFiltered ]
  parent: BaseStructure
  name: stairs
  description: Be careful, the higher you ascend, the more painful the fall.
  placement:
      mode: SnapgridCenter
      snap:
      - Wall
  components:
  - type: PlacementReplacement
    key: walls
  - type: Sprite
    drawdepth: BelowMobs
    sprite: _CE/Structures/ladders_up.rsi
  - type: Transform
    anchored: True
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,0.6,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
        hard: true
  #- type: Portal
  #  canTeleportToOtherMaps: true
  #  randomTeleport: false
  #  arrivalSound: /Audio/_CE/Effects/ladder_up.ogg
  #  departureSound: /Audio/_CE/Effects/ladder_down.ogg
  - type: CEZLevelHighground
    stick: true
    heightCurve:
    - 1.1
    - 1.1
    - 0.5
    - 0.1

- type: entity
  parent: CEZLevelLadderBase
  id: CEZLevelLadderWooden
  suffix: Wooden
  components:
  - type: Sprite
    state: wood

- type: entity
  parent: CEZLevelLadderBase
  id: CEZLevelLadderStone
  suffix: Stone
  components:
  - type: Sprite
    state: stone
