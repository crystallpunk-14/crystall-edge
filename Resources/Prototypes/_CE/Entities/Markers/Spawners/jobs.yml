- type: entity
  id: CESpawnPointJobBase
  parent: SpawnPointJobBase
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Markers/jobs.rsi
    snapCardinals: true

# Sheriff

- type: entity
  id: CESpawnPointInvestigator
  parent: CESpawnPointJobBase
  name: sheriff
  categories:
  - Spawner
  components:
  - type: SpawnPoint
    job_id: CEInvestigator
  - type: Sprite
    layers:
      - state: green
      - state: investigator

