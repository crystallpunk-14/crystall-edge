- type: gameMap
  id: Empty
  mapName: Empty
  mapPath: /Maps/Test/empty.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Empty"
        - type: StationJobs
          availableJobs:
            CETownfolk: [ -1, -1 ]

- type: gameMap
  id: Dev
  mapName: Dev
  mapPath: /Maps/_CE/Dev0.yml
  minPlayers: 0
  stations:
    Dev:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Dev"
        - type: StationJobs
          availableJobs:
            CETownfolk: [ -1, -1 ]
        - type: CEStationZLevels
          mapsComponents:
          - type: MapAtmosphere
            space: False
            mixture:
              volume: 2500
              immutable: True
              temperature: 293.15
              moles:
                Oxygen: 21.824879
                Nitrogen: 82.10312
          - type: SunShadowCycle
          - type: Parallax
            parallax: Sky
          - type: LightCycle
            originalColor: '#75BCFFFF'
          - type: SunShadow
          - type: MapLight
            ambientLightColor: '#75BCFFFF'
          defaultMapLevel: 0
          levels:
            -1:
              path: /Maps/_CE/Dev-1.yml
            1:
              path: /Maps/_CE/Dev1.yml
            2:
              path: /Maps/_CE/Empty.yml
            3:
              path: /Maps/_CE/Empty.yml
        - type: CEStationSpawnerDistribution
          spawns:
            CECoin: !type:AllSelector
              children:
              - id: CECoinCopper1
                amount: 5
              - id: CECoinSilver1
                amount: 1
            CEKey: !type:AllSelector
              children:
              - id: CEKeyIronBlank
                amount: 5
              - id: CEBaseLockpick
                amount: 1
