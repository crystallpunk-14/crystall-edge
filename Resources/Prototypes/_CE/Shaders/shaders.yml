- type: shader
  id: CEWave
  kind: source
  path: "/Textures/_CE/Shaders/wave.swsl"

- type: shader
  id: CEPostProcess
  kind: source
  path: "/Textures/_CE/Shaders/post_process.swsl"
  params:
    CircleRadius: 420.0
    CircleMinDist: 0.0
    CirclePow: 1.0
    CircleMax: 4.0
    CircleMult: 0.25
    FalloffClampMin: 0.075
    FalloffClampMax: 1.0
    FalloffStrength: 0.75
    FalloffPow: 3.0
    HDR: 1.5

- type: shader
  id: CEZBlur
  kind: source
  path: "/Textures/_CE/Shaders/zblur.swsl"

- type: shader
  id: CEShockWave
  kind: source
  path: "/Textures/_CE/Shaders/shock_wave.swsl"

- type: shader
  id: CECloudShadow
  kind: source
  path: "/Textures/_CE/Shaders/cloud_shadow.swsl"

# additive shader used by z-level light overlay to blend light from upper z-levels
- type: shader
  id: CEZLightAdditive
  kind: canvas
  light_mode: unshaded
  blend_mode: Add
