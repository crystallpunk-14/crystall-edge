- type: biomeTemplate
  id: CECavesEmpty
  layers:
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: CEStone
    - !type:BiomeTileLayer
      tile: CECobblestone
      threshold: 0.3
      noise:
        seed: 14
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.2
    - !type:BiomeTileLayer
      tile: CEDirt
      threshold: 0.3
      noise:
        seed: 18
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.1

- type: biomeTemplate
  id: CECavesFloor
  layers:
    - !type:BiomeMetaLayer
      template: CECavesEmpty
    #Entity
    - !type:BiomeEntityLayer
      threshold: 0.4
      noise:
        seed: 1
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CEStone
        - CEDirt
        - CECobblestone
      entities:
        - CERockSmall

- type: biomeTemplate
  id: CECavesGeneric
  layers:
    - !type:BiomeMetaLayer
      template: CECavesFloor
    #Walls
    - !type:BiomeEntityLayer
      threshold: -0.75
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.05
        gain: 0.5
      allowedTiles:
        - CEStone
        - CECobblestone
      entities:
        - CEWallStone
    - !type:BiomeEntityLayer
      threshold: -0.79
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.05
        gain: 0.5
      allowedTiles:
        - CEDirt
      entities:
        - CEWallDirt
