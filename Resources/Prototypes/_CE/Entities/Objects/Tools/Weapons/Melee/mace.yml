- type: entity
  abstract: true
  id: CEBaseWeaponTwoHandedMace
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  components:
  - type: Item
    size: Ginormous
  - type: MeleeWeapon
    attackRate: 0.6
    range: 1.6
    angle: 140
    wideAnimationRotation: -90
    damage:
      types:
        Slash: 7
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 13
  - type: Wieldable
  - type: Clothing
    slots:
    - neck
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1.5

- type: entity
  parent: CEBaseWeaponTwoHandedMace
  id: CEWeaponTwoHandedMaceGuardrail
  name: guardrail mace
  description: TODO
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/mace/guardrail.rsi
    layers:
    - state: icon
    - state: charge
      visible: false
      map: [ "charge" ]
    state: icon
  - type: Battery
    startingCharge: 50
    maxCharge: 50
  - type: UseDelay
    delays:
      charging:
        length: 5
  - type: CEMeleeEnergyEffect
    effects:
    - !type:CESpellThrowFromUser
      distance: 3
    - !type:CESpellSpawnEntityOnTarget
      spawns:
      - CEOverchargeVFX
    - !type:CESpellStaminaDamage
      damage: 40
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CEMeleeEnergyState.Active:
        charge:
          True: { visible: true }
          False: { visible: false }

