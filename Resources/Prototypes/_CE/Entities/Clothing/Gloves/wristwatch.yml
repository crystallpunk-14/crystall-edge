- type: entity
  parent: CEClothingGlovesBase
  id: CEClothingWristwatch
  name: brass wristwatch
  description: A small brass watch worn on the wrist. Shows how much time is left until dawn or sunset.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/wristwatch.rsi
    state: brass
  - type: Clothing
    sprite: _CE/Objects/Tools/wristwatch.rsi
  - type: Item
    shape:
    - 0, 0, 0, 1
  - type: CEClock
  - type: StaticPrice
    price: 40
  - type: PhysicalComposition
    materialComposition:
      CEBrass: 10
  - type: CEMagicEssenceStructure
    essences:
      Metal: { min: 2, max: 3 }

- type: entity
  parent: CEClothingWristwatch
  id: CEClothingWristwatchGold
  name: gold wristwatch
  description: An expensive gilded watch worn on the wrist. Shows how much time is left until dawn or sunset.
  components:
  - type: Sprite
    state: gold
  - type: StaticPrice
    price: 300
  - type: CEMagicEssenceStructure
    essences:
      Metal: { min: 2, max: 3 }
      Greed: { min: 3, max: 4 }
