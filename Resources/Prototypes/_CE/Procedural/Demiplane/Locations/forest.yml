- type: demiplaneLocation
  id: Forest
  name: ce-demiplane-location-forest
  difficulty:
    min: 0
    max: 2
  components:
  - type: Parallax
    parallax: CESky
  - type: MapLight
    ambientLightColor: "#75e3ff"
  generator: !type:LayeredWorldGenerator
    modifierBudget:
      Light: 1
      Ore: 1
    layersByHeight:
    #MARK: 2 Hills top
      2:
      - !type:TileNoiseDistanceLayer
        size: &size 130, 130
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEGrassTall
          threshold: 0.7
          noise: &islandNoise
            frequency: 0.030
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 5
            lacunarity: 2
            gain: 0.5
      #Biome fill
      - !type:FillBiomeLayer
        biome: CEGrassland
        seed: 6
        mask:
        - !type:TileMask
          tiles:
          - CEGrassTall
    #MARK: 1 Hills
      1:
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEGrassTall
          threshold: 0.6
          noise: *islandNoise
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.7
          noise: *islandNoise
      #Biome fill
      - !type:FillBiomeLayer
        biome: CEGrassland
        seed: 3
        mask:
        - !type:TileMask
          tiles:
          - CEGrassTall
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 2
        mask:
        - !type:TileMask
          tiles:
          - CEStone
    #MARK: 0 Surface
      0:
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 1
        fill:
        - tile: CEGrassTall
          threshold: 0.5
          noise: *islandNoise
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: Space
          threshold: 0.6
          noise:
            frequency: 0.04
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 5
            lacunarity: 2
            gain: 0.5
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.6
          noise: *islandNoise
      #Biome fill
      - !type:FillBiomeLayer
        biome: CEGrassland
        mask:
        - !type:TileMask
          tiles:
          - CEGrassTall
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 1
        mask:
        - !type:TileMask
          tiles:
          - CEStone
    #MARK: -1 Caves
      -1:
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 1
        fill:
        - tile: CEStone
          threshold: 0.5
          noise: *islandNoise
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: CEGrassTall
          threshold: 0.6
          noise: &caveHolesNoise
            frequency: 0.04
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 5
            lacunarity: 2
            gain: 0.5
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: Space
          threshold: 0.7
          noise: *caveHolesNoise
      #Biome fill
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 368
        mask:
        - !type:TileMask
          tiles:
          - CEStone
      - !type:FillBiomeLayer
        biome: CECavesFloor
        seed: 362
        mask:
        - !type:TileMask
          tiles:
          - CEGrassTall
    #MARK: -2 Caves
      -2:
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 1
        fill:
        - tile: CEStone
          threshold: 0.5
          noise: *islandNoise
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: CEGrassTall
          threshold: 0.7
          noise: *caveHolesNoise
      #Biome fill
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 87
        mask:
        - !type:TileMask
          tiles:
          - CEStone
      - !type:FillBiomeLayer
        biome: CECavesFloor
        seed: 362
        mask:
        - !type:TileMask
          tiles:
          - CEGrassTall