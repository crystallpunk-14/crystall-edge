- type: constructionGraph
  id: CEArmchairFrame
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CEArmchairFrame
          steps:
            - material: CEWood
              amount: 3
            - material: CECloth
              amount: 2
              doAfter: 2
    - node: CEArmchairFrame
      entity: CEArmchairFrame

