- type: entity
  id: CEBasePaintingItem
  parent: BaseItem
  abstract: true
  categories: [ ForkFiltered ]
  suffix: Item
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Decorations/paintings.rsi
  - type: CEPlaceable
    conditions:
    - !type:TileNotBlocked
    - !type:WallBehind
    - !type:NoWallmount

- type: entity
  id: CEPaintingSkullItem
  parent: CEBasePaintingItem
  name: skull painting
  description: A bizarre skull painting. Depressing. Can be hung on a wall.
  components:
  - type: Sprite
    state: skull
  - type: CEPlaceable
    prototype: CEWallmountPaintingSkull

