- type: entity
  id: CEChickenStarterCrate
  parent: CrateLivestock
  name: chicken starter crate
  description: Contains a white hen, a brown hen, and a rooster.
  categories: [ ForkFiltered ]
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CEMobChickenHenWhite
        - id: CEMobChickenHenBrown
        - id: CEMobChickenRooster
  - type: StaticPrice
    price: 2500
