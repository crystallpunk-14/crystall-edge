- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialCardboard, SolutionSmall, DrinkBase, DrinkBaseOpenable, DrinkVisualsOpenable, DrinkBaseEmptyTrash ]
  id: DrinkCartonBase
  components:
  - type: Openable
    sound:
      collection: bottleOpenSounds #Could use a new sound someday ¯\_(ツ)_/¯
    closeable: true
    closeSound:
      collection: bottleCloseSounds

- type: entity
  abstract: true
  parent: DrinkCartonBase
  id: DrinkCartonBaseFull
  suffix: Full
  components:
  - type: Tag
    tags: []

- type: entity
  abstract: true
  parent: [SolutionNormal, DrinkCartonBase ]
  id: DrinkCartonNormalBase
  components:
  - type: Item
    size: Normal

- type: entity
  parent: [DrinkBaseMaterialPlastic, DrinkCartonBase]
  id: DrinkCartonLime
  name: lime juice
  description: Sweet-sour goodness.
