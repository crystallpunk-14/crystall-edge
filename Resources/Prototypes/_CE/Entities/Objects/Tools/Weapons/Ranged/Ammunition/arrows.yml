- type: entity
  parent: BaseArrow
  id: CEArrowIron
  name: arrow
  description: A sharp arrow made of wood and metal.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Ranged/Projectiles/arrows.rsi
    layers:
    - state: rod
    - state: solution1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Item
    storedRotation: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 5
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: EmbeddableProjectile
    removalTime: 1
  - type: Tag
    tags:
    - CEArrow
  - type: Projectile
    damage:
      types:
        Piercing: 35
  - type: Damageable
  - type: DamageOnLand
    damage:
      types:
        Blunt: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      CEWood: 5
      CEIron: 2
