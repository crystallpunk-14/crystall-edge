- type: job
  id: CEGuardCommander
  setPreference: true
  name: ce-job-name-guard-commander
  description: ce-job-desc-guard-commander
  playTimeTracker: CEJobGuardCommander
  startingGear: CEGuardCommanderGear
  icon: CEJobIconGuardCommander
  requireAdminNotify: true
  joinNotifyCrew: true
  supervisors: ce-job-supervisors-empire
  requirements:
    - !type:DepartmentTimeRequirement
      department: CEGuard
      time: 4h
  special:
    - !type:AddComponentSpecial
      components:
      - type: CESalaryCounter
        salary: 200

- type: startingGear
  id: CEGuardCommanderGear
  equipment:
    belt: CEKeyRingGuardCommander
    pocket1: CEWalletFilledGuardCommander
  storage:
    back:
    - CEGuidebookImperialLaws
    - CEGunJustice

- type: entity
  id: CEWalletFilledGuardCommander
  parent: CEWallet
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents: #200cp total
    - id: CECoinGold1
    - id: CECoinSilver5
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinCopper10

- type: entity
  id: CEChestFilledGuardCommander
  parent: CEGoldChest
  suffix: Filled, Guard Commander
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CEGunPeacekeeperGolden
        - id: CERope
        - id: CERope
        - id: CERope
        - id: CERubberStampApproved
        - id: CERubberStampDenied
        - id: CERubberStampGuard

- type: entity
  id: CEBedsideTableFilledGuardCommander
  parent: CEBedsideTableWooden
  suffix: Filled, Guard Commander
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        rolls: !type:RangeNumberSelector
          range: 2, 3
        children:
        - id: CEClothingCloakGuardCommander
        - id: CEClothingHeadHelmetGuard
        - id: CEClothingHeadHelmetGuardCorinthian
        - id: CEClothingHeadCapGuard
        - id: CEClothingHeadFedoraGuard
        - id: CEClothingShirtGuard
        - id: CEClothingShirtSyurkoGuard
        - id: CEClothingPantsGuard

- type: entity
  id: CEKeyRingGuardCommander
  parent: CEBaseKeyRing
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents:
    - id: CEKeyGuardArmory
    - id: CEKeyGuardHeadRoom
    - id: CEKeyGuardHall
    - id: CEKeyGuardStaff
