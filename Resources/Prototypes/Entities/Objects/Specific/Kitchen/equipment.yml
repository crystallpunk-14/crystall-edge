- type: entity
  abstract: true
  parent: [SolutionToolSmall, BaseItem]
  id: BaseHandheldGrinder
  components:
  - type: SolutionTransfer
  - type: DrawableSolution
    solution: solution
  - type: RefillableSolution
    solution: solution
  - type: DrainableSolution
    solution: solution
  - type: Edible
    edible: Drink
    solution: solution
    destroyOnEmpty: false
    utensil: Spoon
  - type: MixableSolution
    solution: solution
  - type: ExaminableSolution
    solution: solution
    exactVolume: true
  - type: SolutionItemStatus
    solution: solution
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: fill-
  - type: DnaSubstanceTrace
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Spillable
    solution: solution
  - type: Appearance
  - type: HandheldGrinder

# Mortars
- type: entity
  parent: BaseHandheldGrinder
  id: MortarAndPestle
  name: mortar and pestle
  description: Used for grinding small amounts of objects.
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/mortar_and_pestle.rsi
    layers:
    - state: icon
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
  - type: HandheldGrinder
    finishedPopup: handheld-grinder-grinded

# Juicers
- type: entity
  parent: BaseHandheldGrinder
  id: HandheldJuicer
  name: handheld juicer
  description: Used for juicing small amounts of objects.
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/handheld_juicer.rsi
    layers:
    - state: juicer_base
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
    - state: cap
  - type: HandheldGrinder
    finishedPopup: handheld-grinder-juiced
    sound: !type:SoundPathSpecifier
      path: /Audio/Items/Culinary/juicer_juicing.ogg # Pasta mixing sound. Close enough.
      params:
        loop: true
    program: Juice
