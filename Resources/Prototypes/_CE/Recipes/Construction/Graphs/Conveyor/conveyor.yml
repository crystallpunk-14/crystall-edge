# Placed from CEConveyorBeltItem; a wrench takes any variant back into the item.
- type: constructionGraph
  id: CEConveyorBelt
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}

    - node: CEConveyorBelt
      entity: CEConveyorBelt
      edges:
        - to: start
          steps:
            - tool: Anchoring
              doAfter: 0.5
          completed:
            - !type:SpawnPrototype
              prototype: CEConveyorBeltItem
              amount: 1

    - node: CEConveyorStairs
      entity: CEConveyorStairs
      edges:
        - to: start
          steps:
            - tool: Anchoring
              doAfter: 0.5
          completed:
            - !type:SpawnPrototype
              prototype: CEConveyorBeltItem
              amount: 1

    - node: CEConveyorStairsReverse
      entity: CEConveyorStairsReverse
      edges:
        - to: start
          steps:
            - tool: Anchoring
              doAfter: 0.5
          completed:
            - !type:SpawnPrototype
              prototype: CEConveyorBeltItem
              amount: 1
