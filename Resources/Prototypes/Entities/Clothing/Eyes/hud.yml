- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesHudBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: StealTarget
    stealGroup: ClothingEyesHuds

- type: entity
  id: ShowSecurityIcons
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: ShowContrabandDetails

- type: entity
  id: ShowMedicalIcons
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: ShowHealthBars
