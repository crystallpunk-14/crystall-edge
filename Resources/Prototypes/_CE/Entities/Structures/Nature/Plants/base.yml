- type: entity
  id: CEGatherableBase
  parent: BaseStructure
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: PlacementReplacement
    key: CEPlant
  - type: Sprite
    snapCardinals: true
    drawdepth: FloorTiles
  - type: Transform
  - type: InteractionOutline
  - type: Physics
    canCollide: false
    bodyType: Static
  - type: Damageable
    damageContainer: Biological
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: CEGrassGathering
        params:
          variation: 0.03
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 25
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTypeTrigger
          damageType: Cellular
          damage: 1
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - HalfWallLayer
        layer:
        - MidImpassable
        - LowImpassable
      fix2: #For melee or laser
        hard: true
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        mask:
        - FullTileMask
        layer:
        - Opaque
  #- type: CEPlantGatherable
  #  toolWhitelist:
  #    components:
  #      - Sharp
  - type: Appearance

- type: entity
  id: CEGatherablePlantBase
  parent: CEGatherableBase
  abstract: true
  components:
  - type: CEPlant
    resource: 30
    energy: 30
    growthLevel: 0
    solution: plant
    soilTile:
    - CEGrass
    - CEGrassLight
    - CEGrassTall
    - CEDirt
    - CEDirtSeedbed
  - type: SolutionContainerManager
    solutions:
      plant:
        maxVol: 200
      food:
        maxVol: 50
        reagents:
        - ReagentId: Nutriment
          Quantity: 25
  #- type: CEWeatherRefillable
  #  solution: plant
  - type: RefillableSolution
    solution: plant
    maxRefill: 50
  - type: ExaminableSolution
    solution: plant
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: liq-
    solutionName: plant
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger #Overkill
          damage: 45
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTypeTrigger #Heat
          damageType: Heat
          damage: 20
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:SpawnEntitiesBehavior
            spawn:
              CEAsh1:
                min: 0
                max: 2
      - trigger:
          !type:DamageGroupTrigger #Brute
          damageGroup: Brute
          damage: 15
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          #- !type:SpawnEntitiesBehavior
          #  spawn:
          #    CEFloraMaterial1:
          #      min: 2
          #      max: 3

- type: entity
  id: CEGatherablePlantSingleHarvestBase
  parent:
  #- CEBaseFlammableSpreading
  - CEGatherablePlantBase
  abstract: true
  components:
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/watered.rsi
  - type: CEPlantMetabolizer
    metabolizerId: Base
  - type: CEPlantEnergyFromLight
    energy: 0.5
    daytime: true
  - type: CEPlantGrowing
    energyCost: 0.25
    resourceCost: 0.25
    growthPerUpdate: 0.12 # 20 minute to full grow
  - type: FireVisuals
    #sprite: _CE/Effects/fire.rsi
    #normalState: full
    #alternateState: full2
  #- type: CEPlantGatherable
  #  deleteAfterHarvest: true

- type: entity
  id: CEGatherablePlantMultiHarvestBase
  parent: CEGatherablePlantSingleHarvestBase
  abstract: true
  components:
  - type: CEPlantGrowing
    growthPerUpdate: 0.06
