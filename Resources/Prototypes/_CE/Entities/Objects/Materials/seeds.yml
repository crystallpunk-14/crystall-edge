- type: entity
  id: CEBaseSeed
  parent: BaseItem
  abstract: true
  categories: [ ForkFiltered ]
  suffix: 1
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    state: seeds
  - type: CESeed
  - type: CEPlaceable
    delay: 1
    rotatable: false
    placeSound:
      collection: CEDigging
      params:
        variation: 0.03
        volume: 2
    conditions:
    - !type:PlantSoil
    - !type:PlantSpace
  - type: StackPrice
    price: 0.5
  - type: Stack
    count: 1
  - type: GuideHelp
    guides:
    - CEFarmingGuideEN
    - CEFarmingGuideRU

- type: entity
  id: CESeedWheat
  name: wheat seeds
  description: Small wheat seeds. What will you do with them? Grind them into flour, or plant them again?
  parent: CEBaseSeed
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Food/wheat.rsi
  - type: CEPlaceable
    prototype: CEPlantWheat
  - type: Stack
    stackType: CESeedWheat

- type: entity
  id: CESeedWheat10
  parent: CESeedWheat
  suffix: 10
  components:
  - type: Stack
    stackType: CESeedWheat
    count: 10

