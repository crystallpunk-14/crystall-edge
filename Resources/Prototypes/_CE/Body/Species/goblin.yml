- type: markingsGroup
  id: CEGoblin
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
      onlyGroupWhitelisted: true
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      onlyGroupWhitelisted: true
      default: [ CEGoblinNose ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      onlyGroupWhitelisted: true
      default: [ CEGoblinEars ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
      onlyGroupWhitelisted: true
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
      onlyGroupWhitelisted: true
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
      onlyGroupWhitelisted: true
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
      onlyGroupWhitelisted: true
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
      onlyGroupWhitelisted: true
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false
  appearances:
    enum.HumanoidVisualLayers.Snout:
      matchSkin: true
    enum.HumanoidVisualLayers.HeadTop:
      matchSkin: true
    enum.HumanoidVisualLayers.Head:
      matchSkin: true
    enum.HumanoidVisualLayers.Chest:
      matchSkin: true

- type: entity
  parent: CEBaseSpeciesAppearance
  id: CEAppearanceGoblin
  categories: [ ForkFiltered, HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - shader: StencilClear
      sprite: _CE/Mobs/Species/Human/parts.rsi
      state: l_leg_m
    - shader: StencilMask
      map: [ "enum.HumanoidVisualLayers.StencilMask" ]
      sprite: Mobs/Customization/masking_helpers.rsi
      state: unisex_full
      visible: false
    - map: [ "enum.HumanoidVisualLayers.LFoot" ]
    - map: [ "enum.HumanoidVisualLayers.RFoot" ]
    - map: [ "pants" ]
    - map: [ "shoes" ]
    - map: [ "shirt" ]
    - map: [ "enum.HumanoidVisualLayers.LHand" ]
    - map: [ "enum.HumanoidVisualLayers.RHand" ]
    - map: [ "gloves" ]
    - map: [ "ears" ]
    - map: [ "outerClothing" ]
    - map: [ "cloak" ]
    - map: [ "belt" ]
    - map: [ "belt2" ]
    - map: [ "neck" ]
    - map: [ "back" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "eyes" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "vampire_fangs" ]
      sprite: _CE/Mobs/Species/Vampire/fangs.rsi
      state: goblin # Goblin fangs state
      visible: false
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
  - type: Inventory
    templateId: CEHuman
    speciesId: goblin
    displacements:
      belt:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Goblin/displacement.rsi
            state: belt
      cloak:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Goblin/displacement.rsi
            state: cloak
      outerClothing:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Goblin/displacement.rsi
            state: cloak
      eyes:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Goblin/displacement.rsi
            state: eyes
      gloves:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Goblin/displacement.rsi
            state: gloves
      head:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Goblin/displacement.rsi
            state: head
          48:
            sprite: _CE/Mobs/Species/Goblin/displacement48.rsi
            state: head
      mask:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Goblin/displacement.rsi
            state: mask
      pants:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Goblin/displacement.rsi
            state: pants
      shirt:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Goblin/displacement.rsi
            state: shirt
      shoes:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Goblin/displacement.rsi
            state: shoes
      neck:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Goblin/displacement.rsi
            state: neck
          48:
            sprite: _CE/Mobs/Species/Goblin/displacement48.rsi
            state: neck
  - type: InitialBody
    organs:
      Torso: CEOrganGoblinTorso
      Head: CEOrganGoblinHead
      ArmLeft: CEOrganGoblinArmLeft
      ArmRight: CEOrganGoblinArmRight
      HandRight: CEOrganGoblinHandRight
      HandLeft: CEOrganGoblinHandLeft
      LegLeft: CEOrganGoblinLegLeft
      LegRight: CEOrganGoblinLegRight
      FootLeft: CEOrganGoblinFootLeft
      FootRight: CEOrganGoblinFootRight
      Brain: OrganHumanBrain
      Eyes: CEOrganGoblinEyes
      Heart: OrganHumanHeart
      Lungs: OrganHumanLungs
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: CEGoblin

- type: entity
  parent:
  - CEAppearanceGoblin
  - CEBaseSpeciesMobOrganic
  id: CEMobGoblin
  name: Mr. Goblin
  components:
  - type: FireVisuals
    sprite: _CE/Mobs/Effects/onfire.rsi
    normalState: Small_burning
    alternateState: Goblin_burning
  - type: Icon
    sprite: _CE/Mobs/Species/Goblin/parts.rsi
    state: full
  - type: Vocal
    sounds:
      Male: CEUnisexGoblin
      Female: CEUnisexGoblin
      Unsexed: CEUnisexGoblin
  - type: Speech
    speechSounds: CEGoblin
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CEBloodGoblin
        Quantity: 300
  - type: Fixtures
    fixtures: # Smaller hitbox & less weight
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 185
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Hands
    handDisplacement:
      sizeMaps:
        32:
          sprite: _CE/Mobs/Species/Goblin/displacement.rsi
          state: hands

- type: entity
  parent: OrganBase
  id: CEOrganGoblin
  categories: [ ForkFiltered ]
  abstract: true
  suffix: goblin

- type: entity
  parent: CEOrganGoblin
  id: CEOrganGoblinExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _CE/Mobs/Species/Goblin/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _CE/Mobs/Species/Goblin/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: CEGoblin
  - type: CEMagicEssenceStructure
    essences:
      Beast:
        min: 1
        max: 3
      Life:
        min: 0
        max: 2

- type: entity
  parent: [ CEOrganBaseTorsoSexed, OrganBaseTorso, CEOrganGoblinExternal ]
  id: CEOrganGoblinTorso

- type: entity
  parent: [ CEOrganBaseHeadSexed, OrganBaseHead, CEOrganGoblinExternal ]
