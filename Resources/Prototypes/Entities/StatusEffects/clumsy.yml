# All clumsy status effects in one convenient package
- type: entity
  parent: StatusEffectBase
  id: StatusEffectClumsyAll
  name: clumsy
  components:
  - type: ClumsyCatchStatusEffect
    failDamage:
      types:
        Blunt: 1
  - type: ClumsyDefibStatusEffect
  - type: ClumsyGunStatusEffect
    failDamage:
      types: # Arbitrary values from old ClumsyComponent
        Blunt: 5
        Piercing: 4
        Heat: 3
  - type: ClumsyInjectorStatusEffect
  - type: ClumsyVaultStatusEffect

#region Permanent Statuses

# Monkeys are small clowns
- type: entity
  parent: [ StatusEffectClumsyAll, MobStatusEffectBase ]
  id: StatusEffectClumsyMonkey
  components:
  - type: ClumsyCatchStatusEffect
    clumsySound: &SoundMonkeyScream
      path: /Audio/Animals/monkey_scream.ogg
  - type: ClumsyDefibStatusEffect
    clumsySound: *SoundMonkeyScream
  - type: ClumsyGunStatusEffect
    clumsySound: *SoundMonkeyScream
  - type: ClumsyInjectorStatusEffect
    clumsySound: *SoundMonkeyScream
  - type: ClumsyVaultStatusEffect
    clumsyChance: 0.25 # Climbing proficiency
    clumsySound: *SoundMonkeyScream

# Kobolds are naked monkeys
- type: entity
  parent: [ StatusEffectClumsyAll, MobStatusEffectBase ]
  id: StatusEffectClumsyKobold
  components:
  - type: ClumsyCatchStatusEffect
    clumsySound: &SoundReptileScream
      path: /Audio/Voice/Reptilian/reptilian_scream.ogg
  - type: ClumsyDefibStatusEffect
    clumsySound: *SoundReptileScream
  - type: ClumsyGunStatusEffect
    clumsySound: *SoundReptileScream
  - type: ClumsyInjectorStatusEffect
    clumsySound: *SoundReptileScream
  - type: ClumsyVaultStatusEffect
    clumsySound: *SoundReptileScream

#endregion
#region Debuffs

# =^_^= nya!
- type: entity
  parent: [ StatusEffectClumsyAll, MobStatusEffectDebuff ]
  id: StatusEffectClumsyMaid
  components:
  - type: ClumsyCatchStatusEffect
    clumsySound: &SoundCatMeow
      collection: CatMeows
  - type: ClumsyDefibStatusEffect
    clumsySound: *SoundCatMeow
  - type: ClumsyGunStatusEffect
    clumsySound: *SoundCatMeow
  - type: ClumsyInjectorStatusEffect
    clumsySound: *SoundCatMeow
  - type: ClumsyVaultStatusEffect
    clumsySound: *SoundCatMeow

# Wahey!
- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectClumsyDrunk
  components:
  - type: ClumsyCatchStatusEffect
    clumsyChance: &ChanceDrunk 0.25 # Ideally scaled by how drunk they are.
    clumsySound: &SoundGlug
      path: /Audio/Effects/Fluids/glug.ogg
  - type: ClumsyInjectorStatusEffect
    clumsyChance: *ChanceDrunk
    clumsySound: *SoundGlug
  - type: ClumsyVaultStatusEffect
    clumsyChance: *ChanceDrunk
    clumsySound: *SoundGlug

#endregion
