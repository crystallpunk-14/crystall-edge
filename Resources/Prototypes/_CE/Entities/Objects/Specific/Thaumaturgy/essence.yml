# Physical essence orb entities.
# Each mirrors one reagent of Resources/Prototypes/_CE/Reagents/magic_essence.yml
# and one type of Resources/Prototypes/_CE/MagicEssence/essence_types.yml (matching IDs).

- type: entity
  abstract: true
  id: CEBaseEssence
  categories: [ ForkFiltered ]
  name: magic essence
  description: Particles of magical energy polarised into a particular type of magic. Will be gone soon, so try to collect them as soon as possible!
  components:
  - type: Clickable
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _CE/Objects/Specific/Thaumaturgy/essence.rsi
    layers:
    - state: small
      shader: unshaded
  - type: TimedDespawn
    lifetime: 60
  - type: CETimedDespawnFadeout
  - type: RandomWalk
    minSpeed: 0.25
    maxSpeed: 0.75
  - type: ChasingWalk
    maxChaseRadius: 5
    minSpeed: 0.5
    maxSpeed: 1
    chasingComponent:
    - type: CEMagicEssenceAttracting
  - type: Physics
    bodyType: Dynamic
    bodyStatus: InAir
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - Impassable
        restitution: 1.0
        friction: 0
  - type: Solution
    id: essence
  - type: GuideHelp
    guides:
    - CEThaumaturgyAspectsRU
    - CEThaumaturgyAspectsEN

