- type: entity
  id: CEMagicEssenceNode
  categories: [ ForkFiltered ]
  name: magic essence node
  description: TODO
  components:
  - type: CEMagicEssenceNode
  - type: Solution
    id: essence
    solution:
      maxVol: 50
  - type: InteractionOutline
  - type: TimedDespawn
    lifetime: 600
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    bodyStatus: InAir
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Sprite
    noRot: true
    drawdepth: Effects
    layers:
    - map: [ "essenceA" ]
      sprite: _CE/Structures/Specific/Thaumaturgy/Node/big_node.rsi
      state: base
      shader: unshaded
      offset: 0.05, 0.02
    - map: [ "essenceB" ]
      sprite: _CE/Structures/Specific/Thaumaturgy/Node/medium_node.rsi
      state: base
      shader: unshaded
      offset: 0.05, 0.06
    - map: [ "essenceC" ]
      sprite: _CE/Structures/Specific/Thaumaturgy/Node/smol_node.rsi
      state: base
      shader: unshaded
      offset: -0.05, 0.06
  - type: PointLight
    netsync: false
    color: "#97c579"
  - type: Clickable
  - type: Appearance
  - type: AnimationPlayer
  - type: Visibility
    layer: 16 #magic vision only

- type: entity
  parent: CEBaseMachinePowered
  id: CENodeStabilizerSphere
  name: node stabilizer sphere
  categories: [ ForkFiltered ]
  description: A large glass sphere ringed with brass. Anchored and powered on a magic essence node, it stops the node from aging, preserving it indefinitely while it keeps generating essence.
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _CE/Structures/Specific/Thaumaturgy/node_stabilizator.rsi
    layers:
    - state: base
    - state: lines_back
    - state: glass
    - state: active
      map: [ "power" ]
      visible: false
      shader: unshaded
      color: "#ffffff79"
    - state: lines_front
  - type: Icon
    sprite: _CE/Structures/Specific/Thaumaturgy/node_stabilizator.rsi
    state: base
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        power:
          True: { visible: true }
          False: { visible: false }
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CEGlassShard:
            min: 2
            max: 4
          CEBrassRod1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: CEMagicEssenceNodeStabilizer
  - type: StaticPrice
    price: 250
