
- type: skill
  id: CureWounds
  icon:
    sprite: _CE/Actions/Spells/cure_wounds.rsi
    state: icon
  effect: !type:AddAction
    action: CEActionSpellCureWounds

- type: entity
  id: CEActionSpellCureWounds
  name: Cure wounds
  description: You restore health to the creature you touch.
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeAoEZoneAction
    radius: 0.5
  - type: CEActionManaCost
    manaCost: 15
  - type: CEActionStaminaCost
    cost: 20
  - type: Action
    useDelay: 5
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
  - type: Sprite
    sprite: _CE/Actions/Spells/cure_wounds.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:CEEntityTargetActionAnimationEvent
      animation: CureWounds

- type: entityEffectAnimation
  id: CureWounds
  movementSpeed: 0.5
  duration: 2
  events:
    0:
    - !type:SpawnEntity
      spawns:
      - CEEffectHealingGeneric
    - !type:SayChat
      sentence: "Et curabuntur"
    0.5:
    - !type:SpawnEntity
      spawns:
      - CEEffectHealingGeneric
    1.0:
    - !type:SpawnEntity
      spawns:
      - CEEffectHealingGeneric
    1.5:
    - !type:SpawnEntity
      spawns:
      - CEEffectHealingGeneric
    - !type:HealEvenly
      groups:
        Brute: 15
        Burn: 15
        Airloss: 15
        Toxin: 15
        Genetic: 15
    - !type:SayChat
      sentence: "vulnera tua"
