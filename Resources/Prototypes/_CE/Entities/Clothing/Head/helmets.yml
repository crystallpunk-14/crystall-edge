- type: entity
  parent: CEClothingHeadBase
  id: CEClothingHeadHelmetSheriff
  name: sheriff's helmet
  description: A sturdy helmet worn by the sheriff for protection in dangerous situations.
  components:
  - type: Sprite
    sprite: _CE/Clothing/Head/Sheriff/Helmets/basic.rsi
  - type: Clothing
    sprite: _CE/Clothing/Head/Sheriff/Helmets/basic.rsi

- type: entity
  parent: CEClothingHeadBase
  id: CEClothingHeadHelmetSheriffCorinthian
  name: sheriff's corinthian helmet
  description: An ornate corinthian-style helmet worn by the sheriff. Its classical design commands respect and authority.
  components:
  - type: Sprite
    sprite: _CE/Clothing/Head/Sheriff/Helmets/corinthian.rsi
  - type: Clothing
    sprite: _CE/Clothing/Head/Sheriff/Helmets/corinthian.rsi
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide

- type: entity
  parent: CEClothingHeadBase
  id: CEClothingHeadMetalHeadband
  name: metal headband
  description: A simple but effective metal headband that provides minimal protection while keeping hair out of the way.
  components:
  - type: Sprite
    sprite: _CE/Clothing/Head/Generic/metalheadband.rsi
  - type: Clothing
    sprite: _CE/Clothing/Head/Generic/metalheadband.rsi

- type: entity
  parent: CEClothingHeadBase
  id: CEClothingHeadHelmetBrassInsulator
  name: brass insulator
  description: A simple but effective magical energy insulator for the head. Not the most robust protection, but it works great for shielding against excess magical energy.
  components:
  - type: Sprite
    sprite: _CE/Clothing/Head/Generic/brass_insulator.rsi
  - type: Clothing
    sprite: _CE/Clothing/Head/Generic/brass_insulator.rsi
  - type: CEEnergyRadiationArmor
    armor: 0.25
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide
  - type: Armor
    modifiers:
      coefficients:
        Shock: 0.9
  - type: StaticPrice
    price: 100
