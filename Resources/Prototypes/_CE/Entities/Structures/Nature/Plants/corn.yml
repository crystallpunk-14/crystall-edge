- type: entity
  id: CEPlantCorn
  parent:
  - CEPlantBase
  - CEPlantBaseSolarEnergy
  - CEPlantBaseSingleHarvest
  - CEPlantBaseFloralDelicateType
  - CEPlantBaseGrowingMedium
  - CEPlantBaseMetabolizerMedium
  - CEPlantBaseMetabolizerWater
  name: corn
  description: There are rumors that lurkers can be found inside cornfields.
  components:
  - type: CEPlantVisuals
    growthSteps: 4
    readyVariations: 1
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/corn.rsi
    layers:
    - state: liq-1
      sprite: _CE/Structures/Nature/Farm/watered.rsi
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      map: ["enum.PlantVisualLayers.Base"]
  - type: CEWaveShader
    speed: 2.8
    dis: 4
  - type: CEPlantAdditionalProduceOnInteract
    produce:
      CEFoodCorn: 4
  - type: CEPlantDying
    deadEntity: CEPlantCornDead

- type: entity
  parent: CEPlantDeadBase
  id: CEPlantCornDead
  suffix: SPRITE TODO
  name: dead corn
  components:
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/cabbage.rsi
    state: death
    color: red
