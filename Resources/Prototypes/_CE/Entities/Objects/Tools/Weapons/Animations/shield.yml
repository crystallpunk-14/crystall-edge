#MARK: Tower shield bash
- type: entityEffectAnimation
  id: TowerShieldBash
  movementSpeed: 0.3
  duration: 0.7
  events:
    0:
    - !type:UsedEntityAnimation
      offsetAnimation:
      - time: 0.0
        offset: 0, -0.3
        easing: QuadIn
      - time: 0.4
        offset: 0, -0.1
        easing: QuadOut
      - time: 0.5
        offset: 0, -0.8
        easing: QuadOut
      - time: 0.65
        offset: 0, -0.5
      colorAnimation:
      - time: 0.0
        color: "#ffffff"
      - time: 0.6
        color: "#ffffff"
        easing: QuadOut
      - time: 0.69
        color: "#ffffff00"
    0.5:
    - !type:WeaponArcAttack
      arcWidth: 60
      effects:
      - !type:WeaponEffectSlot
        slot: OnHit
