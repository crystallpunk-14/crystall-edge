- type: gameMap
  id: Shaar
  mapName: Shaar
  minPlayers: 1
  maxPlayers: 20
  mapPath: /Maps/_CE/Shaar/Shaar0.yml
  stations:
    Shaar:
      stationProto: CEStandardImperialFloatingIsland
      components:
        - type: StationNameSetup
          mapNameTemplate: "Shaar"
        - type: StationJobs
          availableJobs:
            #Guard (6)
            CEGuardCommander: [ 1, 1 ]
            CEInvestigator: [ 2, 2 ]
            CEGuard: [ 3, 3 ]
            #Engineering (4)
            CEBrigadier: [ 1, 1 ]
            CETechnician: [ 3, 4 ]
            #Tavern (4)
            CETavernmaster: [ 1, 1 ]
            CEChef: [ 3, 3 ]
            #Academy
            CEAcademyRector: [ 1, 1 ]
            CEAcademyProfessor: [ 2, 2 ]
            CEAcademyStudent: [ 2, 3 ]
            #Citizens
            CEBard: [ 2, 2 ]
            CETownfolk: [ -1, -1 ]
        - type: CEStationWildlands
          config: Shaar
        - type: CEStationZLevels
          mapsBelow:
          - /Maps/_CE/Shaar/Shaar-2.yml
          - /Maps/_CE/Shaar/Shaar-1.yml
          mapsAbove:
          - /Maps/_CE/Shaar/Shaar1.yml
          - /Maps/_CE/Shaar/Shaar2.yml
          - /Maps/_CE/Shaar/Shaar3.yml
          zLevelsComponentOverrides:
            - type: MapAtmosphere
              space: False
              mixture:
                volume: 2500
                immutable: True
                temperature: 293.15
                moles:
                  Oxygen: 21.824879
                  Nitrogen: 82.10312
            - type: Parallax
              parallax: CESky
            - type: MapLight #BEFORE Light Cycle
              ambientLightColor: "#adcfd8"
            - type: LightCycle #BEFORE Sun shadow cycle!
            - type: CELightCycle
              colors:
                0: "#1c1c27"
                0.125: "#2e2f42"
                0.25: "#465269"
                0.375: "#d8ffff"
                0.625: "#d8ffff"
                0.75: "#334347"
                0.875: "#323347"
            - type: SunShadowCycle
            - type: CEZLevelRoof
            - type: SunShadow
            - type: CECloudsOverlay
              seed: 490
              frequency: 0.2
              octaves: 4
              lacunarity: 2.0
              gain: 0.5
              windVelocity: -1, 0.3
              evolutionSpeed: 0.1
              coverage: 0.6
              shadowStrength: 0.6
              shadowColor: "#000000"
            #- type: CEGridStability
            - type: CEZLevelChasm
            - type: CEMurkedMap

- type: wildlandsConfig
  id: Shaar
  center: -16, -3 # Lucson sphere position
  cityModifiers: !type:AllSelector
    children:
    # Ore veins
    - id: CEWildlandsModifierOreCoalRatio10
    - id: CEWildlandsModifierOreIronRatio10
    - id: CEWildlandsModifierOreDiamondConstant10
    - id: CEWildlandsModifierDamagedWoodenWallsRatio50
    # Cores
    - id: CEWildlandsModifierCoreIronConstant15
    - id: CEWildlandsModifierCoreCoalConstant15
    - id: CEWildlandsModifierCoreCrystalConstant15
    - id: CEWildlandsModifierCoreDiamondConstant1
  wildlandsModifiers: !type:AllSelector
    children:
    - id: CEWildlandsModifierOreCoalNoise
      prob: 0.75
    - id: CEWildlandsModifierOreIronNoise
      prob: 0.75
    - id: CEWildlandsModifierOreCrystalNoise
      prob: 0.5
  # Every level samples the same blended value (shared noise, size and distance), so a level's footprint
  # only depends on its threshold: deeper levels use higher thresholds and can never outgrow the surface.
  layersByDepth:
  #MARK: 1 Hills top
    1:
    - !type:TileNoiseDistanceLayer # hills footprint
      size: &size 280, 280 # CEMurkLucsonSphere35 boundary diameter
      distanceConfig: &distance !type:EuclideanSquaredDistance
        blendWeight: 0.55
      fill:
      - tile: CEGrassAutumnTall
        threshold: 0.58
        noise: &islandNoise
          frequency: 0.0375
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 5
          lacunarity: 2
          gain: 0.5
    - !type:TileNoiseDistanceLayer # forested hill cores
      size: *size
      distanceConfig: *distance
      fill:
      - tile: CEStone
        threshold: 0.66
        noise: *islandNoise
    - !type:FillBiomeLayer # rim = meadow. Must run before the forest: it never outputs CEStone, so the forest mask stays clean.
      biome: CEGrasslandAutumn
      mask:
      - !type:TileMask
        tiles:
        - CEGrassAutumnTall
    - !type:FillBiomeLayer # center = forest
      biome: CEGrasslandAutumnForest
      seed: 2
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: 0 Surface
    0:
    - !type:TileNoiseDistanceLayer # island footprint, the widest level
      size: *size
      distanceConfig: *distance
      fill:
      - tile: CEGrassAutumnTall
        threshold: 0.45
        noise: *islandNoise
    - !type:TileNoiseDistanceLayer # rocky island cores
      size: *size
      distanceConfig: *distance
      fill:
      - tile: CEStone
        threshold: 0.6
        noise: *islandNoise
    - !type:FillBiomeLayer
      biome: CEGrasslandAutumnForest
      seed: 1
      mask:
      - !type:TileMask
        tiles:
        - CEGrassAutumnTall
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 1
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: -1 Caves
    -1:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: *distance
      fill:
      - tile: CEStone
        threshold: 0.45 # same footprint as the surface
        noise: *islandNoise
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 2
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: -2 Caves
    -2:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: *distance
      fill:
      - tile: CEStone
        threshold: 0.59
        noise: *islandNoise
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 3
      mask:
      - !type:TileMask
        tiles:
        - CEStone
