- type: entity
  id: CEPipeBase
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Sprite
    noRot: true
  - type: Clickable
  - type: Transform
    anchored: true
    noRot: true
    # TODO: Remove both of these, same with CollideOnAnchor
  - type: Physics
    bodyType: Static
  - type: Appearance
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: CableVis
    node: power

- type: entity
  id: CEPipeBrassBig
  name: wide brass pipe
  description: Insulated brass pipe with iron supports. A standardized method of transmitting arcane energy over long distances. However, any holes or cracks can lead to energy leakage and harm to surrounding creatures susceptible to magic.
  parent:
  - BaseStructure
  - CEPipeBase
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: pipe_big
  - type: Sprite
    sprite: _CE/Structures/Power/Pipes/big.rsi
    state: pipe_15 
    drawdepth: Mobs
    offset: 0, 0.01
  - type: Icon
    sprite: _CE/Structures/Power/Pipes/big.rsi
    state: pipe_15
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Climbable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CEScrapBrass:
            min: 1
            max: 1
      #- !type:PlaySoundBehavior
      #  sound:
      #    path: /Audio/Effects/tree_fell.ogg
      #    params:
      #      volume: 5
      #      variation: 0.05
      - !type:ChangeConstructionNodeBehavior
        node: CEPipeBrassBigBroken
  - type: CableVisualizer
    statePrefix: pipe_
  - type: NodeContainer
    nodes:
      power:
        !type:CableNode
        nodeGroupID: HVPower
  - type: Construction
    graph: CEPipeBrassBig
    node: CEPipeBrassBig

- type: entity
  parent: CEPipeBrassBig
  id: CEPipeBrassBigBroken
  description: Damaged brass pipe. The arcane energy flowing through them will flow here and may pose a serious danger to creatures susceptible to magic.
  suffix: Broken, Energy leak
  components:
  - type: Sprite
    color: cyan
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CEScrapBrass:
            min: 1
            max: 1
      #- !type:PlaySoundBehavior
      #  sound:
      #    path: /Audio/Effects/tree_fell.ogg
      #    params:
      #      volume: 5
      #      variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PowerConsumer
    voltage: High
    drawRate: 10
  - type: RadiationSource
    intensity: 0
  - type: CEEnergyLeak
  - type: Construction
    graph: CEPipeBrassBig
    node: CEPipeBrassBigBroken
    defaultTarget: CEPipeBrassBig

- type: entity
  id: CEPipeBrassMedium
  name: smol brass pipe
  description: TODO
  parent:
  - CEPipeBase
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: pipe_medium
  - type: Sprite
    sprite: _CE/Structures/Power/Pipes/medium.rsi
    state: pipe_15
    drawdepth: ThinWire
    offset: 0, 0.01
  - type: Icon
    sprite: _CE/Structures/Power/Pipes/medium.rsi
    state: pipe_15
  - type: NodeContainer
    nodes:
      power:
        !type:CableNode
        nodeGroupID: MVPower
  - type: Physics
    canCollide: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: CableVisualizer
    statePrefix: pipe_
