- type: entity
  abstract: true
  id: CEBaseWeaponStaff
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
  - type: CEWeapon
    range: 0.6
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 6
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 8
    animations:
      Primary:
      - anim: StaffAttackLight1
      - anim: StaffAttackLight2
      Secondary:
      - anim: StaffAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 5
      Secondary: 5
  - type: CERotationForAnimation
    rotation: -90
  - type: Clothing
    slots:
    - neck
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Metal: { min: 0, max: 2 }
  - type: StaticPrice
    price: 25

- type: entity
  parent: CEBaseWeaponStaff
  id: CEWeaponStaffWooden
  name: wooden staff
  description: A long wooden stick with an iron tip.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Staff/wooden.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 25
      CEIron: 5
