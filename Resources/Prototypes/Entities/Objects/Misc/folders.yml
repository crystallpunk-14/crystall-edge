- type: entity
  parent: BoxBase
  id: BoxFolderBaseEmpty
  name: folder
  description: A folder filled with top secret paperwork.
  components:
  - type: Sprite
    sprite: Objects/Misc/folders.rsi
    layers:
    - state: folder-colormap
    - state: folder-base
# RandomSpriteColor requires netsync which is currently incompatible with ItemMapper
#  - type: RandomSpriteColor
#    sprite: Objects/Misc/folders.rsi
#    state: folder-colormap
#    colors:
#      red: "#cc2323"
#      blue: "#355d99"
#      yellow: "#b38e3c"
#      white: "#e6e6e6"
#      grey: "#999999"
#      black: "#3f3f3f"
#      green: "#43bc38"
  - type: Item
    sprite: Objects/Misc/folders.rsi
    size: Small
    shape: null
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,4,3
    whitelist:
      tags:
      - Document
  - type: ItemMapper
    mapLayers:
      folder-overlay-paper:
        whitelist:
          tags:
          - Document
  - type: PhysicalComposition
    materialComposition:
      Paper: 50
  - type: StaticPrice
    price: 15 # Weirdly this is more expensive than cardboard boxes. But if I have this any lower then I get an arbitrage testfail because the raw materials are worth ~$14.
  - type: Appearance
  - type: Tag
    tags:
    - Folder

- type: entity
  abstract: true
  id: BoxFolderFillThreePapers # Like BoxFolderFill, but always has exactly three sheets of standard paper; use for things that should always be consistent, e.g roundstart items
  suffix: 3 papers
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Paper
        amount: 3

- type: entity
  parent: [BoxFolderBaseEmpty, BoxFolderFillThreePapers]
  id: BoxFolderBaseThreePapers

- type: entity
  parent: BoxFolderBaseEmpty
  id: BoxFolderRedEmpty
  suffix: Red
  components:
  - type: Sprite
    layers:
    - state: folder-colormap
      color: "#cc2323"
    - state: folder-base
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#cc2323"
      right:
      - state: inhand-right
        color: "#cc2323"

- type: entity
  parent: BoxFolderBaseEmpty
  id: BoxFolderBlueEmpty
  suffix: Blue
  components:
  - type: Sprite
    layers:
    - state: folder-colormap
      color: "#355d99"
    - state: folder-base
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#355d99"
      right:
      - state: inhand-right
        color: "#355d99"

- type: entity
  parent: BoxFolderBaseEmpty
  id: BoxFolderYellowEmpty
  suffix: Yellow
  components:
  - type: Sprite
    layers:
    - state: folder-colormap
      color: "#b38e3c"
    - state: folder-base
  - type: Item
    inhandVisuals:
      left:
