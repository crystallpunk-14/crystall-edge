- type: entity
  parent: WeatherBase
  id: CEWeatherRain
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_CE/Effects/Weather/rain.rsi
      state: base
    groundSprite:
      sprite: /Textures/_CE/Effects/Weather/rain.rsi
      state: ground
    sound:
      collection: Rain
      params:
        loop: true
        volume: -6
  - type: CEWeatherSolutionFill
    frequency: 10s
    reagents:
    - ReagentId: Water
      Quantity: 5

- type: entity
  parent: WeatherBase
  id: CEWeatherStorm
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_CE/Effects/Weather/storm.rsi
      state: base
    groundSprite:
      sprite: /Textures/_CE/Effects/Weather/storm.rsi
      state: ground
    sound:
      path: /Audio/Effects/Weather/rain.ogg
      params:
        loop: true
        volume: -6
  - type: CEWeatherSolutionFill
    frequency: 10s
    reagents:
    - ReagentId: Water
      Quantity: 5
  - type: CEWeatherTileEffects
    minEffectFrequency: 60s
    maxEffectFrequency: 180s
  - type: CEWeatherTileEntityEffect
    effects:
    - !type:SpawnEntity
      spawns:
      - CESkyLightning

- type: entity
  parent: WeatherBase
  id: CEWeatherSnowLight
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_CE/Effects/Weather/snow.rsi
      state: base

- type: entity
  parent: WeatherBase
  id: CEWeatherSnowMedium
  components:
