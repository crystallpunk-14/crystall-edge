- type: skill
  id: LurkerJump
  icon:
    sprite: _CE/Actions/lurker.rsi
    state: jump
  effect: !type:AddAction
    action: CEActionLurkerJump

- type: entity
  id: CEActionLurkerJump
  name: Jump
  description: You perform a powerful leap that can raise you by one level.
  components:
  - type: CEActionStaminaCost
    cost: 33
  - type: Action
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
    useDelay: 8
  - type: Sprite
    sprite: _CE/Actions/lurker.rsi
    layers:
    - state: jump
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CEInstantActionAnimationEvent
      animation: AnimationJump

- type: entityEffectAnimation
  id: AnimationJump
  movementSpeed: 1
  duration: 0.4
  events:
    0:
    - !type:UserAnimation
      scaleAnimation:
      - time: 0
        scale: 1, 1
      - time: 0.2
        scale: 1.2, 0.8
      - time: 0.3
        scale: 1.2, 0.8
      - time: 0.4
        scale: 1, 1
    0.3:
    - !type:ModifyStealthVisibility
      effectTarget: User
      amount: 2
    - !type:AddZVelocity
      effectTarget: User
      speed: 5.5
      requiresGround: true
    - !type:SpawnEntity
      effectTarget: User
      spawns:
      - CEDustTileEffect
