- type: entity
  parent: BaseItem
  id: CEPlushieBase
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Sprite
    sprite: _CE/Objects/Decorations/plushies.rsi
  - type: Item
    size: Normal
  - type: EmitSoundOnUse
    sound:
      collection: ToySqueak
  - type: EmitSoundOnActivate
    sound:
      collection: ToySqueak
  - type: EmitSoundOnCollide
    sound:
      collection: ToySqueak
  - type: EmitSoundOnLand
    sound:
      collection: ToyFall
  - type: EmitSoundOnTrigger
    sound:
      collection: ToySqueak
  - type: UseDelay
    delay: 1.0
  - type: CEWeapon
    range: 0.4
    hitSound:
      path: /Audio/Weapons/bladeslice.ogg
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Piercing: 4
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Piercing: 4
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
      Secondary:
      - anim: DaggerAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
  - type: StaticPrice
    price: 5
  - type: PhysicalComposition
    materialComposition:
      CECloth: 20
  - type: CEMagicEssenceStructure
    essences:
      Beast: { min: 1, max: 3 }
      Cloth: { min: 0, max: 2 }

#MARK: Species plushies

- type: entity
  parent: CEPlushieBase
  id: CEPlushieHuman
  name: human plushie
  description: The most basic one doesn't mean the worst one!
  components:
  - type: Sprite
    state: human

- type: entity
  parent: CEPlushieBase
  id: CEPlushieDwarf
  name: dwarf plushie
  description: A very short, but sturdy lad... A good one to drink with, or from. Rock and stone!
  components:
  - type: Sprite
    state: dwarf

- type: entity
  parent: CEPlushieBase
  id: CEPlushieElf
  name: elf plushie
  description: It is unclear, if that thing is a man or a woman... But it can hold a bit of mana!
  components:
  - type: Sprite
    state: elf

- type: entity
  parent: [ CEPlushieBase, BaseStorageItem ]
  id: CEPlushieGoblin
  name: goblin plushie
  description: A sneaky one, for sure... It seems like you can put a coin in it, but it's not clear if you can get it back!
  components:
  - type: Sprite
    state: goblin

- type: entity
  parent: [ CEPlushieBase, BaseStorageItem ]
  id: CEPlushieSilva
  name: silva plushie
  description: A little cute bush! You can put some seeds in it, but sadly, they won't grow...
  components:
  - type: Sprite
    state: silva

- type: entity
  parent: CEPlushieBase
  id: CEPlushieTiefling
  name: tiefling plushie
  description: Be careful, don't stab your finger on the horn! So hot...
  components:
  - type: Sprite
    state: tiefling

- type: entity
  parent: CEPlushieBase
  id: CEPlushieCarcat
  name: carcat plushie
  description: Look at this adorable snout! Likes to be petted, sharpen its claws, and butcher dead bodies...
  components:
  - type: Sprite
    state: carcat

#MARK: Misc plushies

- type: entity
  parent: CEPlushieBase
  id: CEPlushieFrog
  name: frog plushie
  description: Croak-croak.
  components:
  - type: Sprite
    state: frog

- type: entity
  parent: CEPlushieBase
  id: CEPlushieSkeleton
  name: skeleton plushie
  description: These skeletons are meowing... Weird...
  components:
  - type: Sprite
    state: skeleton

- type: entity
  parent: CEPlushieBase
  id: CEPlushieAgaric
  name: myconide plushie
  description: The mushrooms are alive! I swear!
  components:
  - type: Sprite
    state: agaric

- type: entity
  parent: CEPlushieBase
  id: CEPlushieZombie
  name: zombie plushie
  description: Braaaains... in plushie form!
  components:
  - type: Sprite
    state: zombie

- type: entity
  parent: CEPlushieBase
  id: CEPlushieLumi
  name: lumishroom plushie
  description: A glowing plushie mushroom! With mouth!
  components:
  - type: Sprite
    state: lumi

- type: entity
  parent: CEPlushieBase
  id: CEPlushieFlem
  name: flem plushie
  description: There are no fish that walk on two legs. this is a myth.
  components:
  - type: Sprite
    state: flem

- type: entity
  parent: CEPlushieBase
  id: CEPlushieCarrin
  name: carrin plushie
  description: Caw? CAW! CAW!
  components:
  - type: Sprite
    state: carrin

#MARK: Golden species

- type: entity
  parent: CEPlushieBase
