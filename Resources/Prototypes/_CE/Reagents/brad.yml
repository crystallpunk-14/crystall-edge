# Brad's mixtures: shop-bought single reagents, roughly a brewed mixture of strength 0.25 (zone numbers x 0.25)
# with a side effect that always fires. They are not alchemy mixtures and have no alchemy effects.

- type: reagent
  id: CEBradHealingMixture
  name: ce-reagent-name-brad-healing
  group: Medicine
  desc: ce-reagent-desc-brad-healing
  physicalDesc: reagent-physical-desc-opaque
  color: "#a8605a"
  pricePerUnit: 0.325
  metabolisms:
    Bloodstream:
      metabolismRate: 0.5
      ceEffects:
      - !type:Heal
        groups:
          Brute: 2.5
      - !type:ModifyBleeding
        amount: -0.5
      - !type:ApplyStatusEffect
        statusEffect: StatusEffectDrowsiness
        duration: 20

