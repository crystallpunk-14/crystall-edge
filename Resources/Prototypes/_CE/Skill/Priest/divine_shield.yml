- type: skill
  id: CEDivineShield
  icon:
    sprite: _CE/Actions/Spells/divine_shield.rsi
    state: icon
  effect: !type:AddAction
    action: CEActionSpellDivineShield

- type: entity
  id: CEActionSpellDivineShield
  name: Divine shield
  description: You shield the creature you touch, halving all damage it takes for 30 seconds.
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeAoEZoneAction
    radius: 0.5
  - type: CEActionManaCost
    manaCost: 30
  - type: Action
    useDelay: 90
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
  - type: Sprite
    sprite: _CE/Actions/Spells/divine_shield.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:CEEntityTargetActionAnimationEvent
      animation: AnimationDivineShield

- type: entityEffectAnimation
  id: AnimationDivineShield
  movementSpeed: 0.5
  duration: 1.5
  events:
    0:
    - !type:SayChat
      sentence: "Et in necessitate"
    0.2:
    - !type:SayChat
      sentence: "vos protegant"
    - !type:ApplyStatusEffect
      statusEffect: CEStatusEffectDivineShield
      duration: 30

- type: entity
  parent: StatusEffectDamageModifierBase
  id: CEStatusEffectDivineShield
  name: divine shield
  components:
  - type: DamageModifierStatusEffect
    modifiers:
      coefficients:
        Asphyxiation: 0.5
        Bloodloss: 0.5
        Blunt: 0.5
        Caustic: 0.5
        Cellular: 0.5
        Cold: 0.5
        Heat: 0.5
        Holy: 0.5
        Piercing: 0.5
        Poison: 0.5
        Radiation: 0.5
        Shock: 0.5
        Slash: 0.5
        Structural: 0.5
  - type: StatusEffectAlert
    alert: CEDivineShield
  - type: CERemovedVFXStatusEffect
    vfx: CEEffectBreakDivineShield
    sound:
      path: /Audio/_CE/Effects/divine_shield_break.ogg
      params:
        variation: 0.1
  - type: Sprite
    drawdepth: Effects
    sprite: _CE/Effects/divine_shield.rsi
    noRot: true
    layers:
    - state: divine_shield
      shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 1
    color: "#3d93d9"

- type: alert
  id: CEDivineShield
  icons:
  - sprite: /Textures/_CE/Actions/Spells/divine_shield.rsi
    state: icon
  name: ce-alerts-divine-shield-name
  description: ce-alerts-divine-shield-desc

- type: entity
  id: CEEffectBreakDivineShield
  categories: [ ForkFiltered ]
  name: divine shield break
  suffix: VFX
  save: false
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: _CE/Effects/divine_shield_break.rsi
    noRot: true
    layers:
    - state: break
      shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 1
    color: "#3d93d9"
  - type: LightFade
    duration: 2
  - type: TimedDespawn
    lifetime: 2
  - type: Tag
    tags:
    - HideContextMenu
