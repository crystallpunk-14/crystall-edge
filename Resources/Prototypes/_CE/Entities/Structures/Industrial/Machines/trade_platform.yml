
- type: entity
  parent:
  - CEConstructibleMachine
  - CEBaseMachinePowered
  - BaseMachine
  id: CESalaryPlatform
  name: salary platform
  description: Allows you to quickly receive the salary you are entitled to (if, of course, you are supposed to receive a salary from the empire)
  categories: [ ForkFiltered ]
  components:
  - type: Machine
    board: CEMachineCoreSalaryPlatform
  - type: PlacementReplacement
    key: walls
  - type: Sprite
    drawdepth: FloorTiles
    snapCardinals: true
    sprite: _CE/Structures/Industrial/buy_platform.rsi
    layers:
    - state: base
    - state: salary
  - type: Clickable
  - type: InteractionOutline
  - type: CESalaryPayroll
  - type: PlaceableSurface
  - type: ItemPlacer
    maxEntities: 0
    whitelist:
      tags:
      - CECoin
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false
  - type: ApcPowerReceiver
    powerLoad: 0.1

- type: entity
  id: CECashImpact
  categories: [ ForkFiltered ]
  name: cash impact
  suffix: VFX
  save: false
  components:
  - type: Sprite
    snapCardinals: true
    sprite: _CE/Structures/Industrial/buy_platform.rsi
    layers:
    - state: impact
      shader: unshaded
      color: "#69279f"
    drawdepth: Effects
  - type: TimedDespawn
    lifetime: 2
  - type: Tag
    tags:
      - HideContextMenu
  - type: PointLight
    color: "#69279f"
    enabled: true
    radius: 8
    energy: 8
    netsync: false
  - type: LightFade
    duration: 2
