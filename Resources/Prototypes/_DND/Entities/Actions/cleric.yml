- type: entity
  parent: BaseAction
  id: DndActionClericBase
  abstract: true
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    layers:
    - state: icon
  - type: TargetAction
    checkCanAccess: true

- type: entity
  parent: DndActionClericBase
  id: DndActionGuidance
  name: Guidance
  description: Cantrip. The next attack or save within one minute adds 1d4.
  components:
  - type: Action
    useDelay: 6
  - type: TargetAction
    range: 1.5
  - type: EntityTargetAction
    canTargetSelf: true
    event: !type:DndCastSpellEvent
      spell: Guidance

