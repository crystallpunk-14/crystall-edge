- type: skill
  id: Resurrection
  icon:
    sprite: _CE/Actions/Spells/resurrection.rsi
    state: icon
  effect: !type:AddAction
    action: CEActionSpellResurrection

- type: entity
  id: CEActionSpellResurrection
  name: Resurrection
  description: You return the soul of the dead creature you touch back into its body, fully healing its wounds. Fails if the soul has left the body for good.
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeAoEZoneAction
    radius: 0.5
  - type: CEActionManaCost
    manaCost: 50
  - type: Action
    useDelay: 300
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
  - type: Sprite
    sprite: _CE/Actions/Spells/resurrection.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:CEEntityTargetActionAnimationEvent
      animation: AnimationResurrection
  - type: CEActionTargetConditions
    conditions:
    - !type:Revivable

- type: entityEffectAnimation
  id: AnimationResurrection
  movementSpeed: 0.5
  duration: 5
  events:
    0:
    - !type:SpawnEntity
      spawns:
      - CEEffectHealingGeneric
    - !type:SayChat
      sentence: "Anima errans"
    1.5:
    - !type:SpawnEntity
      spawns:
      - CEEffectHealingGeneric
    - !type:SayChat
      sentence: "audi vocem meam"
    3.0:
    - !type:SpawnEntity
      spawns:
      - CEEffectHealingGeneric
    - !type:SayChat
      sentence: "et redi in corpus tuum"
    4.5:
    - !type:SpawnEntity
      spawns:
      - CEEffectHealingGeneric
    - !type:Revive
