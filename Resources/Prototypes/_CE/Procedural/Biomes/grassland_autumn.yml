# Subbiomes

# Forest

- type: biomeTemplate
  id: CEGrasslandAutumnForest # Осенний лес
  layers:
    - !type:BiomeMetaLayer
      template: CEGrasslandAutumn
    - !type:BiomeEntityLayer # More Trees
      threshold: 0.2
      noise:
        seed: 4
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CEGrassAutumn
        - CEGrassAutumnLight
        - CEGrassAutumnTall
      entities:
        - CEFloraTreeSpruceSmall
        - CEFloraTreeSpruceSmall
        - CEFloraTreeSpruceMedium
        - CEFloraTreeAutumn
        - CEFloraTreeAutumn
        - CEFloraTreeAutumn
        - CEFloraTreeAutumn
        - CEFloraTreeAutumnLarge
        - CEFloraTreeDead
        - CEFloraTreeDeadSmall

# Hills

- type: biomeTemplate
  id: CEGrasslandAutumnHills # Осенние холмы
  layers:
    - !type:BiomeMetaLayer
      template: CEGrasslandAutumnForest
    - !type:BiomeTileLayer
      tile: CEStone
      invert: true
      threshold: 0.5
      noise:
        seed: 6
        noiseType: OpenSimplex2
        frequency: 0.03
        lacunarity: 2
        fractalType: Ridged
        octaves: 1
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance
        cellularJitterModifier: 0.7
        domainWarpType: OpenSimplex2Reduced
        domainWarpAmp: 285
    - !type:BiomeEntityLayer # Walls
      allowedTiles:
        - CEStone
      threshold: -1.0
      entities:
        - CEWallDirt
