- type: entity
  id: CEInfusionAltarMishapManaConsume
  categories: [ ForkFiltered ]
  save: false
  name: infusion altar mana consume mishap
  description: TODO
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: _CE/Effects/AreaEffects/mana_consume.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#9e46c1"
    radius: 6
    energy: 5
  - type: LightBehaviour
    behaviours:
      - !type:PulseBehaviour
        interpolate: Linear
        maxDuration: 2.5
        startValue: 0
        endValue: 5.0
        property: Energy
        isLooped: false
        enabled: true
  - type: TimedDespawn
    lifetime: 2.5
  - type: CEEntityEffectSpawner
    firstDelay: 0.2
    frequency: 999
    effects:
    - !type:PlaySound
      sound:
        path: /Audio/Effects/teleport_departure.ogg
        params:
          pitch: 0.6
          variation: 0.05
    - !type:AreaEffect
      range: 6
      checkLOS: false
      effects:
      - !type:ChangeMana
        amount: -20

