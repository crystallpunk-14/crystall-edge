#MARK: Basic mobs

- type: entity
  parent:
  - BaseMob
  - CEMobDamageable
  - CEMobTemperature
  id: CEMobSimple
  save: false
  abstract: true
  components:
  - type: CanMoveInAir
  - type: CEAnimationController
  - type: CEIdleAnimation
    animation:
      scaleAnimation:
      - time: 0
        scale: 1.01, 0.99
      - time: 2
        scale: 0.99, 1.01
      - time: 4
        scale: 1.01, 0.99
      offsetAnimation:
      - time: 0
        offset: 0, 0
      - time: 2
        offset: 0, 0.01
      - time: 4
        offset: 0, 0
  - type: CEWalkingAnimation
    animation:
      scaleAnimation:
      - time: 0
        scale: 1.02, 0.98
      - time: 0.2
        scale: 0.98, 1.02
      - time: 0.3
        scale: 1.02, 0.98
      offsetAnimation:
      - time: 0
        offset: 0, 0
      - time: 0.2
        offset: 0, 0.02
      - time: 0.3
        offset: 0, 0


#MARK: basic parts

- type: entity
  save: false
  id: CEMobDamageable
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: CEBiological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          CEAsh1:
            min: 2
            max: 3
      - !type:BurnBodyBehavior { }
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
  - type: Stamina
  - type: StunVisuals
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: Deathgasp
  - type: HealthExaminable
    examinableTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Shock
    - Cold
    - Caustic
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: Pullable

# Used for mobs that need to breathe
- type: entity
  save: false
  id: CEMobRespirator
  abstract: true
  components:
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0

- type: entity
  id: CEMobMagical
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: BatterySelfRecharger
    autoRechargeRate: 1
    autoRechargePauseTime: 1
  - type: RadiationReceiver
  - type: CEEnergyRadiationRegeneration
  - type: CEEnergyOverchargeDamage
  - type: CEEnergyDeficitDamage

- type: entity
  id: CEMobTemperature
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 250
    sweatHeatRegulation: 500
    shiveringHeatRegulation: 500
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    coldDamage:
      types:
        Cold: 1 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 1.5 #per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      293: 0.8
      280: 0.6
      260: 0.4
