- type: entity
  id: CEFunnel
  parent:
  - CEConstructibleMachine
  - BaseMachine
  name: funnel
  description: A device for placing items inside storage facilities or removing items from them. A conveyor belt running away from the storage makes it extract items, running across makes it grab items from the belt. Put sample items inside to filter what it lets through.
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Machine
    board: CEMachineCoreFunnel
  - type: Fixtures
    fixtures:
      collect:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,0.45,0.3,0.5"
        hard: true
        layer:
        - FullTileLayer
        - ItemMask
      side:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: false
        layer:
        - FullTileLayer
        - ItemMask
      collision:
        density: 100
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,0.1,0.4,0.4"
        hard: true
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    drawdepth: Mobs
    offset: 0, 0
    sprite: _CE/Structures/Industrial/funnel.rsi
    layers:
    - state: base
  - type: CEFunnel
  - type: Rotatable
  # Filter samples
  - type: Storage
    grid:
    - 0,0,3,3
    storageOpenSound: /Audio/Effects/closetopen.ogg
    storageCloseSound: /Audio/Effects/closetclose.ogg
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
      machine_board: !type:Container
      machine_parts: !type:Container
