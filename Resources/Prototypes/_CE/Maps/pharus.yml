- type: gameMap
  id: Pharus
  mapName: Pharus
  minPlayers: 1
  maxPlayers: 20
  mapPath: /Maps/_CE/Pharus/Pharus0.yml
  stations:
    Pharus:
      stationProto: CEStandardImperialFloatingIsland
      components:
        - type: StationNameSetup
          mapNameTemplate: "Pharus"
        - type: StationJobs
          availableJobs:
            #Guard (5)
            #CEGuardCommander: [ 1, 1 ]
            #CEGuard: [ 4, 4 ]
            ##Engineering (4)
            #CEBrigadier: [ 1, 1 ]
            #CETechnician: [ 3, 4 ]
            ##Tavern (4)
            #CETavernmaster: [ 1, 1 ]
            #CEChef: [ 3, 3 ]
            ##Guild
            #CEGuildmaster: [ 1, 1 ]
            #CEAdventurer: [ 3, 4 ]
            ##Academy
            #CEAcademyRector: [ 1, 1 ]
            #CEAcademyProfessor: [ 2, 2 ]
            #CEAcademyStudent: [ 2, 3 ]
            ##Citizens
            #CEBard: [ 2, 2 ]
            CETownfolk: [ -1, -1 ]
        - type: CEStationWildlands
          config: Pharus
        - type: CEStationZLevels
          mapsBelow:
          - /Maps/_CE/Pharus/Pharus-2.yml
          - /Maps/_CE/Pharus/Pharus-1.yml
          mapsAbove:
          - /Maps/_CE/Pharus/Pharus1.yml
          - /Maps/_CE/Pharus/Pharus2.yml
          - /Maps/_CE/Pharus/Pharus3.yml
          zLevelsComponentOverrides:
            - type: MapAtmosphere
              space: False
              mixture:
                volume: 2500
                immutable: True
                temperature: 293.15
                moles:
                  Oxygen: 21.824879
                  Nitrogen: 82.10312
            - type: Parallax
              parallax: CEBedrock
            - type: MapLight #BEFORE Light Cycle
              ambientLightColor: "#adcfd8"
            - type: LightCycle #BEFORE Sun shadow cycle!
            - type: CELightCycle
              colors:
                0: "#1c1c27"
                0.125: "#3c3c40"
                0.25: "#63656b"
                0.375: "#d8e4ff"
                0.625: "#d8e4ff"
                0.75: "#424347"
                0.875: "#3a3a42"
            - type: SunShadowCycle
            - type: CEZLevelRoof
            - type: SunShadow
            - type: CECloudsOverlay
              seed: 490
              frequency: 0.2
              octaves: 4
              lacunarity: 2.0
              gain: 0.5
              windVelocity: -1, 0.3
              evolutionSpeed: 0.1
              coverage: 0.6
              shadowStrength: 0.6
              shadowColor: "#000000"
            #- type: CEGridStability
              supportLowestLevel: True
            - type: CEMurkedMap

- type: wildlandsConfig
  id: Pharus
  center: 12, -23 # Lucson sphere position
  cityModifiers: !type:AllSelector
    children:
    # Ore veins
    - id: CEWildlandsModifierOreCoalRatio10
    - id: CEWildlandsModifierOreIronRatio10
    - id: CEWildlandsModifierOreDiamondConstant10
    - id: CEWildlandsModifierDamagedWoodenWallsRatio50
    # Cores
    - id: CEWildlandsModifierCoreIronConstant15
    - id: CEWildlandsModifierCoreCoalConstant15
    - id: CEWildlandsModifierCoreCrystalConstant15
    - id: CEWildlandsModifierCoreDiamondConstant1
  wildlandsModifiers: !type:AllSelector
    children:
    - id: CEWildlandsModifierOreCoalNoise
      prob: 0.75
    - id: CEWildlandsModifierOreIronNoise
      prob: 0.75
    - id: CEWildlandsModifierOreCrystalNoise
      prob: 0.5
  layersByDepth:
  #MARK: 2 Hills top
    2:
    - !type:TileNoiseDistanceLayer
      size: &size 200, 200 # CEMurkLucsonSphere25 boundary diameter
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.6
      fill:
      - tile: CESnow
        threshold: 0.7
        noise: &islandNoise
          frequency: 0.030
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 5
          lacunarity: 2
          gain: 0.5
    #Biome fill
    - !type:FillBiomeLayer
      biome: CESnowland
      seed: 6
      mask:
      - !type:TileMask
        tiles:
        - CESnow
  #MARK: 1 Hills
    1:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.6
      fill:
      - tile: CESnow
        threshold: 0.6
        noise: *islandNoise
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.6
      fill:
      - tile: CEStone
        threshold: 0.7
        noise: *islandNoise
    #Biome fill
    - !type:FillBiomeLayer
      biome: CESnowland
      seed: 3
      mask:
      - !type:TileMask
        tiles:
        - CESnow
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 2
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: 0 Surface
    0:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.95
      fill:
      - tile: CESnow
        threshold: 0.5
        noise: &shapeNoise
          seed: 1
          noiseType: OpenSimplex2
          frequency: 0.05
          lacunarity: 1.50
          fractalType: Ridged
          octaves: 1
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.5
      fill:
      - tile: Space
        threshold: 0.6
        noise:
          frequency: 0.04
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 5
          lacunarity: 2
          gain: 0.5
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.6
      fill:
      - tile: CEStone
        threshold: 0.6
        noise: *islandNoise
    #Biome fill
    - !type:FillBiomeLayer
      biome: CESnowland
      mask:
      - !type:TileMask
        tiles:
        - CESnow
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 1
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: -1 Caves
    -1:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.95
      fill:
      - tile: CEStone
        threshold: 0.45
        noise: *shapeNoise
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.5
      fill:
      - tile: CESnow
        threshold: 0.6
        noise: &caveHolesNoise
          frequency: 0.04
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 5
          lacunarity: 2
          gain: 0.5
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.5
      fill:
      - tile: Space
        threshold: 0.7
        noise: *caveHolesNoise
    #Biome fill
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 368
      mask:
      - !type:TileMask
        tiles:
        - CEStone
    - !type:FillBiomeLayer
      biome: CECavesFloor
      seed: 362
      mask:
      - !type:TileMask
        tiles:
        - CESnow
  #MARK: -2 Caves
    -2:
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.95
      fill:
      - tile: CEStone
        threshold: 0.4
        noise: *shapeNoise
    - !type:TileNoiseDistanceLayer
      size: *size
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.5
      fill:
      - tile: CESnow
        threshold: 0.7
        noise: *caveHolesNoise
    #Biome fill
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 87
      mask:
      - !type:TileMask
        tiles:
        - CEStone
    - !type:FillBiomeLayer
      biome: CECavesFloor
      seed: 362
      mask:
      - !type:TileMask
        tiles:
        - CESnow
