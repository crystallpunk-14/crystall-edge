- type: entity
  parent: CEClothingEyesBase
  id: CEClothingEyesMonocle
  name: monocle
  description: Aristocratic, fancy.
  components:
  - type: Sprite
    sprite: _CE/Clothing/Eyes/Generic/monocle.rsi
  - type: Clothing
    sprite: _CE/Clothing/Eyes/Generic/monocle.rsi
  - type: VisionCorrection

- type: entity
  parent: CEClothingEyesBase
  id: CEClothingEyesAlchemyMonocle
  name: alchemy monocle
  description: Special magic infused monocle that allows you to clearly see the composition of any mixtures.
  components:
  - type: Sprite
    sprite: _CE/Clothing/Eyes/Generic/alchemy_monocle.rsi
  - type: Clothing
    sprite: _CE/Clothing/Eyes/Generic/alchemy_monocle.rsi
  - type: SolutionScanner
  - type: StaticPrice
    price: 30
  - type: VisionCorrection
  - type: CEMagicEssenceStructure
    essences:
      Crystal: { min: 1, max: 3 }
      Magic: { min: 1, max: 2 }

- type: entity
  parent: CEClothingEyesBase
  id: CEClothingEyesMerchantMonocle
  suffix: Theft target
  name: merchant's monocle
  description: High-quality magnifying monocle infused with magic to help you determine the exact price of any item.
  components:
  - type: Sprite
    sprite: _CE/Clothing/Eyes/Townfolk/merchant_monocle.rsi
  - type: Clothing
    sprite: _CE/Clothing/Eyes/Townfolk/merchant_monocle.rsi
  - type: CEPriceScanner
  - type: StaticPrice
    price: 30
  - type: VisionCorrection
  - type: CETheftValue
  - type: CEMagicEssenceStructure
    essences:
      Crystal: { min: 1, max: 3 }
      Greed: { min: 1, max: 3 }

- type: entity
  parent: CEClothingEyesBase
  id: CEClothingEyesEyePatch
  name: eye patch
  description: Hides the mutilation of the eyes.
  components:
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-flip-verb
    foldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped
    foldedHeldPrefix: flipped
  - type: Sprite
    sprite: _CE/Clothing/Eyes/Generic/eye_patch.rsi
  - type: Clothing
    sprite: _CE/Clothing/Eyes/Generic/eye_patch.rsi
  - type: CEMagicEssenceStructure
    essences:
      Cloth: { min: 1, max: 2 }
