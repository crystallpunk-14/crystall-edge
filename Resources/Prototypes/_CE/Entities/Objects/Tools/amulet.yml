- type: entity
  id: CESafeFallingAmulet
  parent: BaseItem
  name: Emergency Levitation Amulet
  description: An essential piece of everyday equipment for residents of the flying islands. Worn on the belt, it spends a quarter of its charge to soften a dangerous fall or catch you above the abyss. Recharge it on a charging platform.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: inhand-left
      - state: unshaded-inhand-left
        shader: unshaded
        color: "#f9f28d"
      right:
      - state: inhand-right
      - state: unshaded-inhand-right
        shader: unshaded
        color: "#f9f28d"
  - type: Sprite
    sprite: _CE/Objects/Tools/amulets.rsi
    layers:
    - state: safe_faling
    - state: unshaded
      shader: unshaded
      color: "#f9f28d"
  - type: CESafeFallClothing
    velocityThreshold: 4
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: ExaminableBattery
  - type: Clothing
    equipDelay: 0.25
    unequipDelay: 0.25
    quickEquip: false
    equipWhileMoving: true
    slots:
    - BELT
  - type: StaticPrice
    price: 50

- type: entity
  id: CEVoiceDistortionAmulet
  parent: BaseItem
  name: voice distortion amulet
  description: A shadowy trinket from the Murk. Worn on the belt, it distorts the wearer's voice beyond recognition.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: inhand-left
      - state: unshaded-inhand-left
        shader: unshaded
        color: purple
      right:
      - state: inhand-right
      - state: unshaded-inhand-right
        shader: unshaded
        color: purple
  - type: Sprite
    sprite: _CE/Objects/Tools/amulets.rsi
    layers:
    - state: focus
    - state: unshaded
      shader: unshaded
      color: purple
  - type: CEVoiceDistortionClothing
  - type: Clothing
    equipDelay: 0.25
    unequipDelay: 0.25
    quickEquip: false
    equipWhileMoving: true
    slots:
    - BELT
  - type: StaticPrice
    price: 75

- type: entity
  id: CEPulseAmulet
  parent: BaseItem
  name: pulse amulet
  description: Reports to every pulse projector where you are and whether you still breathe.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Tools/pulse_amulet.rsi
    layers:
    - state: icon
    - state: unshaded
      shader: unshaded
      map: ["glow"]
  - type: CEPulseAmulet
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: ExaminableBattery
  - type: BatteryVisuals
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        glow:
          Empty: {visible: false}
          Neither: {visible: true}
          Full: {visible: true}
  - type: Clothing
    equipDelay: 0.25
    unequipDelay: 0.25
    quickEquip: false
    equipWhileMoving: true
    slots:
    - BELT
  - type: StaticPrice
    price: 50
