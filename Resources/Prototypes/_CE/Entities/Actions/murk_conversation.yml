- type: entity
  id: CEActionMurkStartConversation
  name: strike up a conversation
  description: Says something to someone nearby and waits for an answer.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
  - type: CEActionRandomCooldown
    min: 40
    max: 90
  - type: TargetAction
    range: 3
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:CEEntityTargetActionAnimationEvent
      animation: CEAnimationMurkStartConversation

- type: entityEffectAnimation
  id: CEAnimationMurkStartConversation
  movementSpeed: 0
  duration: 0.3
  events:
    0:
    - !type:StartMurkConversation
    - !type:SayGeneratedPhrase
      range: HideChat

- type: entity
  id: CEActionMurkConversationReply
  name: answer
  description: Says the next line of the conversation.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.5
  - type: InstantAction
    event: !type:CEInstantActionAnimationEvent
      animation: CEAnimationMurkConversationReply

- type: entityEffectAnimation
  id: CEAnimationMurkConversationReply
  movementSpeed: 0
  duration: 0.3
  events:
    0:
    - !type:PassMurkConversationTurn
    - !type:SayGeneratedPhrase
      range: HideChat
