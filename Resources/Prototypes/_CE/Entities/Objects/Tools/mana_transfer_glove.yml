- type: entity
  parent:
  - BaseItem
  - CEBaseWeaponThrowable
  - CEBaseWeaponLight
  id: CEManaTransferGlove
  name: mana transfer glove
  description: A glove that allows transferring mana to and from mana-storing entities.
  categories: [ ForkFiltered, DoNotMap ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/mana_glove.rsi
    state: icon
  - type: Item
    size: Normal
    shape:
    - 0,0,1,0
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: CEWeapon
    range: 0.4
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 7
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 7
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
      Secondary:
      - anim: DaggerAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 20
  - type: CERotationForAnimation
    rotation: -90
  - type: CEEnergyTransferGlove
  - type: UseDelay
    delay: 0.5
  - type: Clothing
    quickEquip: false
    slots:
    - gloves
  #- type: PhysicalComposition
  #  materialComposition:
  #    CEWood: 10
  #    CEIron: 10
  - type: StaticPrice
    price: 75
  - type: CEMagicEssenceStructure
    essences:
      Energia: { min: 1, max: 3 }
      Magic: { min: 0, max: 2 }
