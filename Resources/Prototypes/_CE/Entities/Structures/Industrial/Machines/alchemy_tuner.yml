- type: entity
  parent:
  - CEBaseMachinePowered
  - BaseMachine
  id: CEAlchemyTuner
  categories: [ ForkFiltered ]
  name: alchemy tuner
  description: A powered device that slowly tunes the alchemical mixture poured into it. Its mode is switched through the context menu, to concentrate the effect or to stretch it in time.
  components:
  - type: StaticPrice
    price: 65
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Items
    noRot: true
    offset: 0, 0.2
    sprite: _CE/Structures/Specific/Thaumaturgy/solution_normalizer.rsi
    layers:
    - state: rotate_back_stop
      map: [ "poweredBack" ]
    - state: liq-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
    - state: base
    - state: rotate_front_stop
      map: [ "poweredFront" ]
  - type: Icon
    sprite: _CE/Structures/Specific/Thaumaturgy/solution_normalizer.rsi
    state: base
  - type: GenericVisualizer
    visuals:
      enum.CEAlchemyTunerVisuals.Working:
        poweredFront:
          True: { state: rotate_front }
          False: { state: rotate_front_stop }
        poweredBack:
          True: { state: rotate_back }
          False: { state: rotate_back_stop }
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 125
        mask:
        - TabletopMachineMask
  - type: Solution
    id: tuner
    solution:
      maxVol: 50
  - type: DrainableSolution
    solution: tuner
  - type: ExaminableSolution
    solution: tuner
  - type: MixableSolution
    solution: tuner
  - type: RefillableSolution
    solution: tuner
  - type: DrawableSolution
    solution: tuner
  - type: DumpableSolution
    solution: tuner
  - type: CEAlchemyTuner
    solutionName: tuner
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: liq-
  - type: AmbientSound
    enabled: false
    range: 6
    volume: -3
    sound:
      path: /Audio/_CE/Ambience/normalizer_working.ogg
