- type: entity
  parent:
  - CEMobSimple
  - CEMobCombat
  - CEMobGOAPBase
  id: CEMobRat
  name: rat
  description: A small, unpleasant rodent.
  categories: [ ForkFiltered ]
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      25: Dead
  - type: CEGOAP
    behaviors:
    - MeleeAttacker
    - Explorer
  - type: NpcFactionMember
    factions:
    - CEHostileEveryone
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Mobs/rat.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: rat
  - type: DamageStateVisuals
    states:
      Alive:
        Base: rat
      Dead:
        Base: dead
  - type: MovementSpeedModifier
    baseSprintSpeed: 2.5
  - type: CEWeapon
    range: 0.5
    effectSlots:
      OnHit:
      - !type:WeaponArcAttack
        arcWidth: 40
        effects:
        - !type:Damage
          damage:
            types:
              Piercing: 3
    animations:
      Primary:
      - anim: RatBite

- type: entity
  id: CERatBiteEffectTelegraphy
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/arcs.rsi
    state: disarm
    drawdepth: Effects

- type: entity
  id: CERatBiteEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/arcs.rsi
    state: bite
    drawdepth: Effects

- type: entityEffectAnimation
  id: RatBite
  movementSpeed: 0.8
  duration: 0.8
  events:
    0:
    - !type:UsedEntityAnimation
      dummyEntity: CERatBiteEffectTelegraphy
      offsetAnimation:
      - time: 0.0
        offset: 0, -0.3
        easing: QuadIn
      - time: 0.2
        offset: 0, -0.2
        easing: QuadIn

      rotationAnimation:
      - time: 0.0
        rotation: 90

      colorAnimation:
      - time: 0.1
        color: "#ffffff"
      - time: 0.3
        color: "#ffffff00"  # Fade out
        easing: QuadOut
    0.2:
    - !type:UsedEntityAnimation
      dummyEntity: CERatBiteEffect
      offsetAnimation:
      - time: 0.0
        offset: 0, -0.2
        easing: QuadIn
      - time: 0.3
        offset: 0, -0.7
        easing: QuadIn

      rotationAnimation:
      - time: 0.0
        rotation: 90

      colorAnimation:
      - time: 0.1
        color: "#ffffff"
      - time: 0.3
        color: "#ffffff00"  # Fade out
        easing: QuadOut
    - !type:PlaySound
      sound:
        path: /Audio/Effects/bite.ogg
        params:
          variation: 0.1
    0.25:
    - !type:WeaponEffectSlot
      slot: OnHit
    - !type:Dash
      distance: 0.1
