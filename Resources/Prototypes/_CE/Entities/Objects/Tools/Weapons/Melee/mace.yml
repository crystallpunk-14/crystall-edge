- type: entity
  abstract: true
  id: CEBaseWeaponMaceTwoHanded
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  components:
  - type: Item
    size: Ginormous
    shape:
    - 0, 0, 4, 2 # 3x5
  - type: CEWeapon
    range: 0.84
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 20
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 20
    animations:
      Primary:
      - anim: WarAxeAttackLight
        speed: 0.6
      - anim: WarAxeAttackLight2
        speed: 0.6
      Secondary:
      - anim: WarAxeAttackHeavy1
        speed: 0.6
      - anim: WarAxeAttackHeavy2
        speed: 0.6
  - type: CEWieldedWeapon
    animations:
      Primary:
      - anim: WarAxeAttackLight
      - anim: WarAxeAttackLight2
      Secondary:
      - anim: WarAxeAttackHeavy1
      - anim: WarAxeAttackHeavy2
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 10
  - type: CERotationForAnimation
    rotation: -90
  - type: Wieldable
  - type: Clothing
    slots:
    - neck
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1.5
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Metal: { min: 1, max: 4 }
      Energia: { min: 0, max: 2 }

- type: entity
  parent: CEBaseWeaponMaceTwoHanded
  id: CEWeaponMaceTwoHandedGuardrail
  name: guardrail mace
  description: A mana-powered heavy mace used by guards. When activated, it delivers a powerful blow that knocks back targets and drains their stamina.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Mace/guardrail.rsi
    layers:
    - state: icon
    - state: charge
      visible: false
      map: [ "charge" ]
    state: icon
  - type: Battery
    startingCharge: 50
    maxCharge: 50
  - type: UseDelay
    delay: 5
  - type: CEMeleeEnergyEffect
    effects:
    - !type:CESpellThrowFromUser
      distance: 3
    - !type:CESpellSpawnEntityOnTarget
      spawns:
      - CEOverchargeVFX
    - !type:CESpellStaminaDamage
      damage: 40
  - type: Clothing
    quickEquip: false
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: charge
    inhandVisuals:
      left:
      - state: inhand-left-charge
        shader: unshaded
      right:
      - state: inhand-right-charge
        shader: unshaded
  - type: StaticPrice
    price: 100


