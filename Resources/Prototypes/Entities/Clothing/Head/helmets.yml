#Bone Helmet
#No need to hide the hair on this one
- type: entity
  parent: [ ClothingHeadHelmetArmoredBase, BaseMinorContraband ]
  id: ClothingHeadHelmetBone
  name: bone helmet
  description: Cool-looking helmet made of skull of your enemies.
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/bone_helmet.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/bone_helmet.rsi
  - type: Construction
    graph: BoneHelmet
