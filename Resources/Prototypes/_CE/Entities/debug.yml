- type: entity
  parent: HandheldHealthAnalyzer
  id: BaselineHealthAnalyzer
  categories: [ ForkFiltered, DoNotMap ]

- type: entity
  parent: FloorWaterEntity
  id: CEWaterFloorEntity
  categories: [ ForkFiltered ]
  components:
  - type: PlacementReplacement
    key: walls
  - type: Solution
    id: pool
    solution:
      maxVol: 9999999 #.inf seems to break the whole yaml file, but would definitely be preferable.
      reagents:
      - ReagentId: CEWater
        Quantity: 9999999
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: CEWater
        Quantity: 100
  - type: Edible
    solution: pool
    edible: Drink
