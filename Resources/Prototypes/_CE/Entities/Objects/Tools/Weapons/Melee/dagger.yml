- type: entity
  abstract: true
  id: CEBaseWeaponDagger
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  - CEBaseWeaponThrowable
  - CEBaseWeaponLight
  - CEBaseWeaponSharp
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,0
  - type: EmbeddableProjectile
    offset: -0.15,-0.15
    removalTime: 1.5
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 4
        Piercing: 8
  - type: CEWeapon
    range: 0.4
    hitSound:
      path: /Audio/Weapons/bladeslice.ogg
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Slash: 2
            Piercing: 3
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Slash: 2
            Piercing: 3
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
      Secondary:
      - anim: DaggerAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 5
      Secondary: 10
  - type: CERotationForAnimation
    rotation: -90
  - type: Clothing
    slots:
    - belt
    equipWhileMoving: true
    equipDelay: 0.5
    unequipDelay: 0.5
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Metal: { min: 1, max: 3 }

- type: entity
  parent: CEBaseWeaponDagger
  id: CEWeaponDaggerIron
  name: iron dagger
  description: A standard dagger made of iron.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Dagger/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 10
      CEIron: 10

- type: entity
  parent: CEBaseWeaponDagger
  id: CEWeaponDaggerHatchet
  name: hatchet
  description: A small hatchet, commonly used as a kitchen utensil for preparing food.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Dagger/hatchet.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 10
      CEIron: 10

- type: entity
  parent: CEBaseWeaponDagger
  id: CEWeaponDaggerSickle
  name: sickle
  description: A curved blade used for harvesting crops, but can be deadly in skilled hands.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Dagger/sickle.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 10
      CEIron: 10
