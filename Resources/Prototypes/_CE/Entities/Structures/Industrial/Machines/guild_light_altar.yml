- type: entity
  parent:
  - CEConstructibleMachine
  - CEBaseMachinePowered
  - BaseMachine
  id: CEGuildLightAltar
  categories: [ ForkFiltered ]
  name: guild light altar
  description: Kindles the guild light at every dawn, if it has power. Only one light burns at a time, no matter how many altars there are.
  components:
  - type: Machine
    board: CEMachineCoreGuildLightAltar
  - type: LitOnPowered
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite # TODO: placeholder sprite
    snapCardinals: true
    sprite: _CE/Structures/Industrial/charger.rsi
    layers:
    - state: base
    - state: glass
  - type: Icon
    sprite: _CE/Structures/Industrial/charger.rsi
    state: base
  - type: PointLight
    radius: 2
    energy: 2
    color: "#efedff"
    enabled: false
  - type: Clickable
  - type: PlaceableSurface
  - type: ApcPowerReceiver
    powerLoad: 3
  - type: Rotatable
  - type: Appearance
  - type: CEGuildLightAltar
