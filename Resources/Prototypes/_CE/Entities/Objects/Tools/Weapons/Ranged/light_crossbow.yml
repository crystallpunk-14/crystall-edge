- type: entity
  parent: BaseItem
  id: CEWeaponLightCrossbow
  name: light crossbow
  description: A small, compact crossbow that is comfortable to hold with one hand. Not too accurate on the reverse side.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Ranged/light_crossbow.rsi
    layers:
    - state: unwielded
      map: [ base ]
  - type: Item
    size: Normal
  - type: Clothing
    sprite: _CE/Objects/Tools/Weapons/Ranged/light_crossbow.rsi
    quickEquip: false
    equipWhileMoving: true
    equipDelay: 0.45
    unequipDelay: 0.45
    slots:
    - belt
  - type: UseDelay
    delay: 1
  - type: Gun
    fireRate: 1
    minAngle: 15
    maxAngle: 35
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: BulletMiss
    soundEmpty: null
  - type: StaticPrice
    price: 100
  - type: ItemSlots
    slots:
      projectiles:
        name: Projectiles
        startingItem: null
        insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
        whitelist:
          tags:
          - CECrossbowBolt
  - type: ContainerContainer
    containers:
      projectiles: !type:ContainerSlot
  - type: ContainerAmmoProvider
    container: projectiles
  - type: Appearance
  - type: ItemMapper
    mapLayers:
      unwielded-arrow:
        whitelist:
          tags:
          - CECrossbowBolt
  - type: PhysicalComposition
    materialComposition:
      CEIron: 40
      CECloth: 5
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 2 }
      Metal: { min: 1, max: 3 }
