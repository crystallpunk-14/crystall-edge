- type: demiplaneLocation
  id: SnowForest
  name: ce-demiplane-location-snow-forest
  difficulty:
    min: 0
    max: 2
  components:
  - type: Parallax
    parallax: CESky
  - type: MapLight
    ambientLightColor: "#75e3ff"
  generator: !type:LayeredWorldGenerator
    modifierBudget: 
      Light: 1
      Ore: 1
    layersByHeight:
    #MARK: 2 Hills top
      2:
      - !type:TileNoiseDistanceLayer
        size: &size 130, 130
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CESnow
          threshold: 0.7
          noise: &islandNoise
            frequency: 0.030
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 5
            lacunarity: 2
            gain: 0.5
      #Biome fill
      - !type:FillBiomeLayer
        biome: CESnowland
        seed: 6
        mask:
        - !type:TileMask
          tiles:
          - CESnow
    #MARK: 1 Hills
      1:
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CESnow
          threshold: 0.6
          noise: *islandNoise
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.7
          noise: *islandNoise
      #Biome fill
      - !type:FillBiomeLayer
        biome: CESnowland
        seed: 3
        mask:
        - !type:TileMask
          tiles:
          - CESnow
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 2
        mask:
        - !type:TileMask
          tiles:
          - CEStone
    #MARK: 0 Surface
      0:
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.95
        fill:
        - tile: CESnow
          threshold: 0.5
          noise: &shapeNoise
            seed: 1
            noiseType: OpenSimplex2
            frequency: 0.05
            lacunarity: 1.50
            fractalType: Ridged
            octaves: 1
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: Space
          threshold: 0.6
          noise:
            frequency: 0.04
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 5
            lacunarity: 2
            gain: 0.5
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.6
          noise: *islandNoise
      #Biome fill
      - !type:FillBiomeLayer
        biome: CESnowland
        mask:
        - !type:TileMask
          tiles:
          - CESnow
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 1
        mask:
        - !type:TileMask
          tiles:
          - CEStone
    #MARK: -1 Caves
      -1:
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.95
        fill:
        - tile: CEStone
          threshold: 0.45
          noise: *shapeNoise
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: CESnow
          threshold: 0.6
          noise: &caveHolesNoise
            frequency: 0.04
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 5
            lacunarity: 2
            gain: 0.5
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: Space
          threshold: 0.7
          noise: *caveHolesNoise
      #Biome fill
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 368
        mask:
        - !type:TileMask
          tiles:
          - CEStone
      - !type:FillBiomeLayer
        biome: CECavesFloor
        seed: 362
        mask:
        - !type:TileMask
          tiles:
          - CESnow
    #MARK: -2 Caves
      -2:
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.95
        fill:
        - tile: CEStone
          threshold: 0.4
          noise: *shapeNoise
      - !type:TileNoiseDistanceLayer
        size: *size
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: CESnow
          threshold: 0.7
          noise: *caveHolesNoise
      #Biome fill
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 87
        mask:
        - !type:TileMask
          tiles:
          - CEStone
      - !type:FillBiomeLayer
        biome: CECavesFloor
        seed: 362
        mask:
        - !type:TileMask
          tiles:
          - CESnow
