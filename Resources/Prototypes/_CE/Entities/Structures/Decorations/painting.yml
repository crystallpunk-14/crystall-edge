- type: entity
  id: CEBaseWallmountPainting
  parent: CEBaseWallmount
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 20
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: Sprite
    sprite: _CE/Structures/Decoration/wallmount_painting.rsi

- type: entity
  id: CEWallmountPaintingSkull
  name: skull painting
  parent: CEBaseWallmountPainting
  description: A bizarre skull painting. Depressing.
  components:
  - type: Construction
    graph: CEWallmountPaintingSkull
    node: placed
  - type: Sprite
    state: skull

- type: entity
  id: CEWallmountPaintingCandle
  name: candle painting
