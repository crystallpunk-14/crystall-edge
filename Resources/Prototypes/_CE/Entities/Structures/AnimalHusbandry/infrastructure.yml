    group: ceAnimalFeedTrough
    node: storage
  - type: NodeContainer
    nodes:
      storage:
        !type:AdjacentNode
        nodeGroupID: Default
  - type: Construction
    graph: CEAnimalFeedTrough
    node: complete

- type: entity
  id: CEAnimalWaterTrough
  parent: BaseStructure
  name: animal water trough
  description: A refillable iron-bound trough for drinking water.
  categories: [ ForkFiltered ]
  components:
  - type: InteractionOutline
  - type: Appearance
  - type: Sprite
    noRot: false
    sprite: _CE/Structures/AnimalHusbandry/water_trough.rsi
  - type: Icon
    sprite: _CE/Structures/AnimalHusbandry/water_trough.rsi
    state: water_icon
  - type: IconSmooth
    key: ceAnimalWaterTrough
    base: state_
    index: 0
  - type: CESolutionIconSmoothVisuals
    stateBases: [state_, water_1_state_, water_2_state_, water_3_state_, water_4_state_]
  - type: SolutionContainerVisuals
    solutionName: drink
    maxFillLevels: 4
    changeColor: false
  - type: Solution
    id: drink
    solution:
      maxVol: 100
  - type: MixableSolution
    solution: drink
  - type: RefillableSolution
    solution: drink
  - type: DrainableSolution
    solution: drink
  - type: ExaminableSolution
    solution: drink
    exactVolume: true
  - type: Edible
    edible: Drink
    solution: drink
    transferAmount: 5
    destroyOnEmpty: false
    utensil: None
  - type: Construction
    graph: CEAnimalWaterTrough
    node: complete

