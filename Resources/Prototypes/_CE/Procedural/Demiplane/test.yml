- type: demiplaneLocation
  id: CEDebugFlatCaves
  name: ce-demiplane-location-debug-flat-caves
  levels:
    min: 0
    max: 10
  generator: !type:CEDebugFlatWorldGenerator
    size: 60
    layers:
    - CEGrassFill
    - CESnowFill
    - CESnowFill
  components:
  - type: Parallax
    parallax: CESky
  - type: LightCycle #BEFORE Sun shadow cycle!
    offset: 100
    duration: 300
    originalColor: "#75e3ff"
  - type: SunShadowCycle
    offset: 100
    duration: 300
  - type: SunShadow
  - type: MapLight
    ambientLightColor: "#75e3ff"
  - type: CECloudsOverlay
    seed: 490
    frequency: 0.2
    octaves: 4
    lacunarity: 2.0
    gain: 0.5
    windVelocity: -1, 0.3
    evolutionSpeed: 0.1
    coverage: 0.6
    shadowStrength: 0.6
    shadowColor: "#000000"

- type: demiplaneLocation
  id: CEGreenIsland
  name: ce-demiplane-location-green-island
  levels:
    min: 0
    max: 2
  generator: !type:CELayeredWorldGenerator
    layersByHeight:
      2: # hills - forest in the center, meadow around the rim
      - !type:CETileNoiseDistanceLayer # whole island footprint
        size: 136, 136
        distanceConfig: !type:CEEuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: CEGrassTall
          threshold: 0.6
          noise: &islandNoise
            frequency: 0.030
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 5
            lacunarity: 2
            gain: 0.5
      - !type:CETileNoiseDistanceLayer # tighter center, overwrites the rim marker
        size: 135, 135
        distanceConfig: !type:CEEuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: CEStone
          threshold: 0.8
          noise: *islandNoise
      - !type:CEFillBiomeLayer # rim = meadow. Must run before the forest: it never outputs CEStone, so the forest mask stays clean.
        biome: CEGrassland
        mask:
        - !type:CETileMask
          tiles:
          - CEGrassTall
      - !type:CEFillBiomeLayer # center = forest
        biome: CEGrasslandForest
        seed: 2
        mask:
        - !type:CETileMask
          tiles:
          - CEStone
      1: # surface: grassy rim, cave mouth in the center
      - !type:CETileNoiseDistanceLayer
        size: 136, 136
        distanceConfig: !type:CEEuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEGrassTall
          threshold: 0.58
          noise: *islandNoise
      - !type:CETileNoiseDistanceLayer
        size: 135, 135
        distanceConfig: !type:CEEuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.6
          noise: *islandNoise
      - !type:CEFillBiomeLayer
        biome: CEGrasslandForest
        seed: 1
        mask:
        - !type:CETileMask
          tiles:
          - CEGrassTall
      - !type:CEFillBiomeLayer
        biome: CECavesGeneric
        seed: 1
        mask:
        - !type:CETileMask
          tiles:
          - CEStone
      0: # caves, narrower — same noise, higher threshold tapers it
      - !type:CETileNoiseDistanceLayer
        size: 130, 130
        distanceConfig: !type:CEEuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.62
          noise: *islandNoise
      - !type:CEFillBiomeLayer
        biome: CECavesGeneric
        seed: 2
        mask:
        - !type:CETileMask
          tiles:
          - CEStone
      -1: # caves, narrower — same noise, higher threshold tapers it
      - !type:CETileNoiseDistanceLayer
        size: 130, 130
        distanceConfig: !type:CEEuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.63
          noise: *islandNoise
      - !type:CEFillBiomeLayer
        biome: CECavesGeneric
        seed: 3
        mask:
        - !type:CETileMask
          tiles:
          - CEStone
      -2: # caves, narrower — same noise, higher threshold tapers it
      - !type:CETileNoiseDistanceLayer
        size: 130, 130
        distanceConfig: !type:CEEuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.65
          noise: *islandNoise
      - !type:CEFillBiomeLayer
        biome: CECavesGeneric
        seed: 4
        mask:
        - !type:CETileMask
          tiles:
          - CEStone
  components:
  - type: Parallax
    parallax: CESky
  - type: MapLight
    ambientLightColor: "#75e3ff"
