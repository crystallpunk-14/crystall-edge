- type: entity
  id: CEEffectAreaHealingTelegraphy
  categories: [ ForkFiltered ]
  name: area healing telegraphy
  suffix: VFX
  save: false
  components:
  - type: Sprite
    drawdepth: BelowMobs
    sprite: _CE/Effects/area_healing_telegraphy.rsi
    layers:
    - state: area
      shader: unshaded
  - type: PointLight
    color: "#8dd0e8"
    radius: 2.5
  - type: TimedDespawn
    lifetime: 2
  - type: LightBehaviour
    behaviours:
      - !type:PulseBehaviour
        interpolate: Linear
        maxDuration: 2
        startValue: 0
        endValue: 5.0
        property: Energy
        isLooped: false
        enabled: true
  - type: Tag
    tags:
      - HideContextMenu

- type: entity
  parent: CEEffectAreaHealingTelegraphy
  id: CEEffectAreaHealingEffect
  name: area healing impact
  components:
  - type: Sprite
    sprite: _CE/Effects/area_healing_effect.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    radius: 4

- type: entity
  parent: CEEffectAreaHealingTelegraphy
  id: CEEffectHealingGeneric
  name: healing impact
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: _CE/Effects/healing_generic.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    radius: 1.5
