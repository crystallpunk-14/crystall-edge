- type: entity
  id: CEPlantAgaric
  parent:
  - CEPlantBase
  - CEPlantBaseDarknessEnergy
  - CEPlantBaseSingleHarvest
  - CEPlantBaseFungalType
  - CEPlantBaseGrowingFast
  - CEPlantBaseMetabolizerFast
  - CEPlantBaseMetabolizerWater
  - CEPlantBaseSpreading
  name: fly agaric
  description: A bright red mushroom with white spots. Better not to eat it.
  components:
  - type: CEPlantVisuals
    growthSteps: 3
    readyVariations: 5
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/agaric.rsi
    layers:
    - state: liq-1
      sprite: _CE/Structures/Nature/Farm/watered.rsi
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      map: ["enum.PlantVisualLayers.Base"]
  - type: CEPlantAdditionalProduceOnInteract
    produce:
      CEFoodAgaric: 2
  - type: CEPlantKudzu
    proto: CEPlantAgaric
  - type: CEPlantFading # never withers, even off the mycelium
    damage:
      types:
        Cellular: 0

# Already grown agaric for mapping and world generation
- type: entity
  id: CEPlantAgaricGrown
  parent: CEPlantAgaric
  suffix: Grown
  components:
  - type: CEPlant
    growthLevel: 1
