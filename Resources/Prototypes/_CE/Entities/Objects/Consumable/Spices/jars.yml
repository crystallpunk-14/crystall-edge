- type: entity
  parent: BaseItem
  id: CESpiceJarBase
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 30
  - type: Item
    size: Small
  - type: Sprite
    noRot: true
    layers:
    - state: icon-back
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: icon
    - state: cap
      map: ["enum.OpenableVisuals.Layer"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {visible: false} # lid off
          False: {visible: true} # lid on
  - type: Openable
    sound:
      collection: bottleOpenSounds
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: SolutionContainerVisuals
    solutionName: food
    maxFillLevels: 6
    fillBaseName: fill-
  - type: Spillable
    solution: food
  - type: RefillableSolution
    solution: food
  - type: DrainableSolution
    solution: food
  - type: ExaminableSolution
    solution: food
    examinableWhileClosed: true
    heldOnly: false
  - type: SolutionItemStatus
    solution: food
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: CEWeatherRefillable
    solution: food
  - type: Damageable
    damageModifierSet: FlimsyGlass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior { }
      - !type:SpawnEntitiesBehavior
        spawn:
          CEGlassShard: { min: 1, max: 1 }
        transferForensics: true
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      CEGlass: 10

- type: entity
  parent: CESpiceJarBase
  id: CESpiceJarCinnamon
  name: cinnamon jar
  description: A small glass jar for ground cinnamon.
  suffix: Empty
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Spices/jar_cinnamon.rsi

- type: entity
  parent: CESpiceJarCinnamon
  id: CESpiceJarCinnamonFull
  suffix: Full
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: CECinnamon
        Quantity: 30

- type: entity
  parent: CESpiceJarBase
  id: CESpiceJarSpicyPepper
  name: spicy pepper jar
  description: A small glass jar for ground hot pepper.
  suffix: Empty
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Spices/jar_spicy_pepper.rsi

- type: entity
  parent: CESpiceJarSpicyPepper
  id: CESpiceJarSpicyPepperFull
  suffix: Full
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: CESpicyPepper
        Quantity: 30
