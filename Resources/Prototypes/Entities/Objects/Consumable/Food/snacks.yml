- type: entity
  parent: BaseItem
  id: FoodSnackNutribrick
  name: nutribrick
  description: A carefully synthesized brick designed to contain the highest ratio of nutriment to volume. Tastes like shit.
  components:
  - type: Item
    size: Small
    storedOffset: -1,0
    heldPrefix: nutribrick
  - type: Tag
    tags:
      - FoodSnack
  - type: Sprite
    sprite: Objects/Consumable/Food/snacks.rsi
    state: nutribrick
  - type: SpawnItemsOnUse
    items:
      - id: FoodPacketMRETrash
      - id: FoodSnackNutribrickOpen
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: FoodSnackBase
  id: FoodSnackNutribrickOpen
  name: nutribrick
  description: A carefully synthesized brick designed to contain the highest ratio of nutriment to volume. Tastes like shit.
  components:
  - type: FlavorProfile
    flavors:
      - nutribrick
  - type: Item
    size: Small
    storedOffset: -1,0
    heldPrefix: nutribrick-open
  - type: Tag
    tags:
      - ReptilianFood
  - type: Sprite
    state: nutribrick-open

- type: entity
  parent: FoodSnackBase
  id: FoodSnackSwirlLollipop
  name: swirl lollipop
  description: A swirly circle of pure concentrated sugar. Who's the biggest kid on the playground now?
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/candy.rsi
    state: swirl_lollipop
  - type: Item
    sprite: Objects/Consumable/Food/candy.rsi
    heldPrefix: swirl_lollipop
    size: Small
    storedRotation: -45
    storedOffset: 0,-1
  - type: Tag
    tags:
    - FoodSnack
    - ReptilianFood
  - type: Solution
    solution:
      reagents:
      - ReagentId: Sugar
        Quantity: 15
  - type: FlavorProfile
    flavors:
    - sweet
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 2
    soundHit:
      collection: WeakHit

# Trash

- type: entity
  categories: [ HideSpawnMenu ]
  parent: [SolutionFood, SolutionVeryTiny, BaseItem]
  id: FoodPacketTrash
  description: This is rubbish.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/snacks.rsi
  - type: Item
    sprite: Objects/Consumable/Food/snacks.rsi
    size: Tiny
  - type: Tag
    tags:
    - Trash
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: SpaceGarbage
  - type: StaticPrice
    price: 0
  - type: Solution
    solution:
      maxVol: 7.5
      reagents:
      - ReagentId: ToxinTrash
        Quantity: 7.5
  - type: Edible
    requiresSpecialDigestion: true

