- type: entity
  id: CEPlantSilverNeedle
  parent:
  - CEPlantBaseFrostType
  - CEPlantBase
  - CEPlantBaseSolarEnergy
  - CEPlantBaseSingleHarvest
  - CEPlantBaseGrowingMedium
  - CEPlantBaseMetabolizerMedium
  - CEPlantBaseMetabolizerWater
  - CEPlantBaseSpreading
  name: silver needle
  description: Blue sharp shoots breaking through the snow, with bright orange berries. The ability of this plant to survive even in regions with severe frosts is simply amazing.
  components:
  - type: CEPlantVisuals
    growthSteps: 2
    readyVariations: 3
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/silver_needle.rsi
    layers:
    - state: liq-1
      sprite: _CE/Structures/Nature/Farm/watered.rsi
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      map: ["enum.PlantVisualLayers.Base"]
  - type: CEPlantAdditionalProduceOnInteract
    produce:
      CEFoodSilverNeedle: 2
  - type: CEPlantKudzu
    proto: CEPlantSilverNeedle

# Already grown silver needle for mapping and world generation
- type: entity
  id: CEPlantSilverNeedleGrown
  parent: CEPlantSilverNeedle
  suffix: Grown
  components:
  - type: CEPlant
    growthLevel: 1
