              doAfter: 1

    # Wooden stairs

    - node: CEZLevelStairsWooden
      entity: CEZLevelStairsWooden
      edges:
        - to: CEZLevelStairsFrame
          completed:
            - !type:SpawnPrototype
              prototype: CEWoodenPlanks1
              amount: 1
          steps:
            - tool: Prying
              doAfter: 3

    - node: CEZLevelStairsWoodenCorner
      entity: CEZLevelStairsWoodenCorner
      edges:
        - to: CEZLevelStairsFrameCorner
          completed:
            - !type:SpawnPrototype
              prototype: CEWoodenPlanks1
              amount: 1
          steps:
            - tool: Prying
              doAfter: 3

    - node: CEZLevelStairsWoodenCornerInner
      entity: CEZLevelStairsWoodenCornerInner
      edges:
        - to: CEZLevelStairsFrameCornerInner
          completed:
            - !type:SpawnPrototype
              prototype: CEWoodenPlanks1
              amount: 1
          steps:
