- type: entity
  id: CEWildlandsModifierBrassRuins
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    effects:
    - !type:SpawnRooms
      rooms:
      - BrassRuins1
      - BrassRuins2
      - BrassRuins3
      count:
        min: 30
        max: 40
      mask: # only walls block a room; trees and other clutter get cleared
      - !type:WhitelistMask
        inverted: true
        whitelist:
          components:
          - Wall
