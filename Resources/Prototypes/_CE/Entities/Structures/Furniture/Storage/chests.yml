- type: entity
  parent:
  - CEChestGeneric
#  - CEBaseFlammable
  id: CEWoodenChest
  name: wooden chest
  description: A simple wooden chest for easy storage of junk.
  components:
  - type: Icon
    sprite: _CE/Structures/Furniture/Storage/Chests/wooden.rsi
    state: icon
  - type: Sprite
    sprite: _CE/Structures/Furniture/Storage/Chests/wooden.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: Damageable
    damageModifierSet: CEWoodStructural
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CEWoodenPlanks1:
            min: 3
            max: 5
          CEScrapIron1:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CEWoodenChest
    node: CEWoodenChest
    containers:
    - entity_storage

- type: entity
  parent: CEWoodenChest
  id: CEOldWoodenChest
  name: old wooden chest
  description: A worn, weathered wooden chest.
  components:
  - type: Icon
    sprite: _CE/Structures/Furniture/Storage/Chests/wooden_old.rsi
    state: icon
  - type: Sprite
    sprite: _CE/Structures/Furniture/Storage/Chests/wooden_old.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]

- type: entity
  parent: CEChestGeneric
  id: CEGoldChest
  name: golden chest
  description: An ornate chest gilded in gold.
  components:
  - type: Icon
    sprite: _CE/Structures/Furniture/Storage/Chests/gold.rsi
    state: icon
  - type: Sprite
    sprite: _CE/Structures/Furniture/Storage/Chests/gold.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: Damageable
    damageModifierSet: CEMetallicStructural
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CECoinGold1:
            min: 2
            max: 4
          CEScrapIron1:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
