- type: entity
  parent: BaseBoardEntity
  id: ChessBoard
  name: chessboard
  description: A chessboard. Pieces included!
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/chessboard.rsi
    state: chessboard
  - type: TabletopGame
    boardName: tabletop-chess-board-name
    size: 338, 274
    setup:
      !type:TabletopChessSetup
      boardPrototype: &ChessBoard ChessBoardTabletop

- type: entity
  parent: BaseBoardTabletop
  id: *ChessBoard
  name: chessboard
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/chessboard_tabletop.rsi
    state: chessboard_tabletop

- type: entity
  parent: BaseTabletopPiece
  id: WhiteQueen
  name: white queen
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/chess_pieces.rsi
    state: w_queen

- type: entity
  parent: BaseTabletopPiece
  id: BlackQueen
  name: black queen
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/chess_pieces.rsi
    state: b_queen
