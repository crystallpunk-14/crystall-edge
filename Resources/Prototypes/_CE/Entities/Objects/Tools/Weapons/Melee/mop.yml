- type: entity
  abstract: true
  id: CEBaseWeaponMop
  parent: BaseItem
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Ginormous
  - type: Wieldable
  - type: Clothing
    equipDelay: 1
    unequipDelay: 1
    equipWhileMoving: true
    slots:
    - neck
  - type: CEWeapon
    range: 0.75
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 2
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 2
    animations:
      Primary:
      - anim: StaffAttackLight1
      - anim: StaffAttackLight2
      Secondary:
      - anim: StaffAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 3
      Secondary: 5
  - type: CERotationForAnimation
    rotation: -0
  - type: Spillable
    solution: absorbed
  - type: Absorbent
  - type: DrainableSolution
    solution: absorbed
  - type: Solution
    id: absorbed
    solution:
      maxVol: 50
  - type: Tag
    tags:
    - Mop
  - type: PhysicalComposition
    materialComposition:
      CEWood: 20
      CECloth: 10
  - type: CEMagicEssenceStructure
    essences:
      Tree: { min: 1, max: 3 }
      Cloth: { min: 0, max: 2 }

- type: entity
  parent: CEBaseWeaponMop
  id: CEMop
  name: mop
  description: A simple mop for cleaning up spills and messes.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Mop/mop.rsi
    state: icon
  - type: StaticPrice
    price: 5
