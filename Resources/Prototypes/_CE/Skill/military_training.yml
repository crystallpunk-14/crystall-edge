- type: skill
  id: MilitaryTraining
  icon:
    sprite: _CE/Skills/Sheriff/military_training.rsi
    state: icon
  effect: !type:AddAction
    action: CEActionMilitaryTraining

- type: entity
  id: CEActionMilitaryTraining
  name: Military training
  description: Rigorous drilling has taught your body to push past exhaustion and fear. Catch your second wind to instantly restore your stamina and shake off primal terror.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 45 # Lurker fear cooldown x1.5
    checkCanInteract: false
  - type: Sprite
    sprite: _CE/Skills/Sheriff/military_training.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CEInstantActionAnimationEvent
      animation: MilitaryTraining

- type: entityEffectAnimation
  id: MilitaryTraining
  duration: 0.5
  lockRotation: false
  events:
    0:
    - !type:SpawnEntity
      effectTarget: User
      spawns:
      - CEEffectMilitaryTraining
    - !type:PlaySound
      sound:
        path: /Audio/_CE/Effects/heartbeat.ogg
    - !type:StaminaRestore
      effectTarget: User
      amount: 100
    - !type:RemoveStatusEffect
      effectTarget: User
      statusEffect: CEStatusEffectLurkerFear

- type: entity
  id: CEEffectMilitaryTraining
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CE/Effects/amplification.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: effect
  - type: TimedDespawn
    lifetime: 2.5
  - type: Tag
    tags:
      - HideContextMenu
