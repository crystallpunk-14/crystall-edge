- type: markingsGroup
  id: CEInfernal
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
      default: [ CEHumanHair_part ]
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      onlyGroupWhitelisted: true
      default: [ CEInfernalTail ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      onlyGroupWhitelisted: true
      default: [ CEInfernalHorns ]
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false
  appearances:
    enum.HumanoidVisualLayers.Tail:
      matchSkin: true

- type: entity
  parent: CEBaseSpeciesAppearance
  id: CEAppearanceInfernal
  categories: [ ForkFiltered, HideSpawnMenu ]
  components:
  - type: Inventory
    templateId: CEHuman
    displacements:
      neck:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: male_neck
          48:
            sprite: _CE/Mobs/Species/Human/displacement48.rsi
            state: male_neck
    femaleDisplacements:
      outerClothing:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_cloak
      cloak:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_cloak
      gloves:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_cloak #Its ok for gloves
      pants:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_pants
      shirt:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_shirt
      neck:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_neck
          48:
            sprite: _CE/Mobs/Species/Human/displacement48.rsi
            state: female_neck
  - type: InitialBody
    organs:
      Torso: CEOrganInfernalTorso
      Head: CEOrganInfernalHead
      ArmLeft: CEOrganInfernalArmLeft
      ArmRight: CEOrganInfernalArmRight
      HandRight: CEOrganInfernalHandRight
      HandLeft: CEOrganInfernalHandLeft
      LegLeft: CEOrganInfernalLegLeft
      LegRight: CEOrganInfernalLegRight
      FootLeft: CEOrganInfernalFootLeft
      FootRight: CEOrganInfernalFootRight
      Brain: OrganHumanBrain
      Eyes: CEOrganInfernalEyes
      Heart: OrganHumanHeart
      Lungs: OrganHumanLungs
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: CEInfernal

- type: entity
  parent:
  - CEAppearanceInfernal
  - CEBaseSpeciesMobOrganic
  id: CEMobInfernal
  name: Mr. Infernal
  components:
  - type: Icon
    sprite: _CE/Mobs/Species/Infernal/parts.rsi
    state: full
  - type: Wagging
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CEBloodInfernal
        Quantity: 300

- type: entity
  parent: OrganBase
  id: CEOrganInfernal
  categories: [ ForkFiltered ]
  abstract: true
  suffix: infernal

- type: entity
  parent: CEOrganInfernal
  id: CEOrganInfernalExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _CE/Mobs/Species/Infernal/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _CE/Mobs/Species/Infernal/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: CEInfernal

- type: entity
  parent: [ CEOrganBaseTorsoSexed, OrganBaseTorso, CEOrganInfernalExternal ]
  id: CEOrganInfernalTorso
  categories: [ HideSpawnMenu ]

