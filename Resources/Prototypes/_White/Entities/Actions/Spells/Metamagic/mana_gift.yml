- type: entity
  id: WhiteActionSpellManaGift
  parent: CEActionSpellBase
  name: Mana transfer
  description: You can transfer a small amount of your magical energy to a target entity or magical object.
  components:
  - type: CEActionManaCost
    manaCost: 10
    canModifyManacost: false
  - type: DoAfterArgs
    repeat: true
    breakOnMove: true
    delay: 1
    breakOnDamage: true
  - type: CEActionDoAfterVisuals
    proto: WhiteRuneManaGift
  - type: Action
    useDelay: 2
    icon:
      sprite: _White/Actions/Spells/metamagic.rsi
      state: mana_gift
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Battery
    canTargetSelf: true
    event: !type:CEEntityTargetModularEffectEvent
      telegraphyEffects:
      - !type:CESpellSpawnEntityOnTarget
        spawns:
        - WhiteImpactEffectManaGift
      effects:
      - !type:CESpellSpawnEntityOnTarget
        spawns:
        - WhiteImpactEffectManaGift
      - !type:CESpellApplyEntityEffect
        effects:
        - !type:WhiteChargeChange
          chargeDelta: 10

- type: entity
  id: WhiteActionSpellManaGiftElf
  parent: WhiteActionSpellManaGift
  name: Carefull mana transfer
  description: You transfer mana at a tremendous rate without dealing damage to the target.
  components:
  - type: CEActionManaCost
    manaCost: 20
  - type: EntityTargetAction
    event: !type:CEEntityTargetModularEffectEvent
      effects:
      - !type:CESpellSpawnEntityOnTarget
        spawns:
        - CEImpactEffectManaGift
      - !type:CESpellApplyEntityEffect
        effects:
        - !type:WhiteChargeChange
          chargeDelta: 20
          safe: true

- type: entity
  id: WhiteRuneManaGift
  parent: CEBaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#5096d4"
  - type: Sprite
    layers:
    - state: medium_line
      color: "#5096d4"
      shader: unshaded
    - state: double_outer
      color: "#5096d4"
      shader: unshaded

- type: entity
  id: WhiteImpactEffectManaGift
  parent: CEBaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#5096d4"
      shader: unshaded
