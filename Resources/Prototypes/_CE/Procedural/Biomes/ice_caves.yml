- type: biomeTemplate
  id: CEIceCavesFloor
  layers:
    - !type:BiomeMetaLayer
      template: CESnowland
    - !type:BiomeTileLayer
      tile: CEIce
      threshold: 0.0
      noise:
        seed: 14
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.1
    - !type:BiomeEntityLayer # Snowdrifts
      threshold: 0.4
      noise:
        seed: 1
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CESnowDeepDeep
      entities:
        - CESnowdrift

- type: biomeTemplate
  id: CEIceCavesGeneric
  layers:
    - !type:BiomeMetaLayer
      template: CEIceCavesFloor
    #Walls
    - !type:BiomeEntityLayer
      threshold: -0.5
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
        - CESnow
        - CESnowDeep
        - CESnowDeepDeep
      entities:
        - CEWallSnow
    - !type:BiomeEntityLayer
      threshold: -0.2
      invert: true
      noise:
        seed: 156
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
        - CESnow
        - CESnowDeep
        - CESnowDeepDeep
      entities:
        - CEWallStone
    - !type:BiomeEntityLayer
      threshold: -0.5
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
        - CEIce
      entities:
        - CEWindowIceBlock
