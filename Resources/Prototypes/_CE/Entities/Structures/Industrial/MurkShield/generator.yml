- type: entity
  parent:
  - CEConstructibleMachine
  - CEBaseMachinePowered
  - BaseMachine
  id: CEMurkShieldGenerator
  categories: [ ForkFiltered ]
  name: murk shield generator
  description: Kindles the murk shield at every dawn, if it has power. Only one shield burns at a time, no matter how many generators there are.
  components:
  - type: Machine
    board: CEMachineCoreMurkShieldGenerator
  - type: LitOnPowered
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite # TODO: placeholder sprite
    snapCardinals: true
    sprite: _CE/Structures/Industrial/charger.rsi
    layers:
    - state: base
    - state: glass
  - type: Icon
    sprite: _CE/Structures/Industrial/charger.rsi
    state: base
  - type: PointLight
    radius: 2
    energy: 2
    color: "#eef2f5"
    enabled: false
  - type: Clickable
  - type: PlaceableSurface
  - type: ApcPowerReceiver
    powerLoad: 3
  - type: Rotatable
  - type: Appearance
  - type: CEMurkShieldGenerator

- type: entity
  id: CEMurkShieldSpawnFailureVFX
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CE/Effects/essence_consume.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: effect
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: Tag
    tags:
      - HideContextMenu
  - type: TimedDespawn
    lifetime: 2
  - type: PointLight
    color: "#eef2f5"
    enabled: true
    radius: 4
    energy: 4
    netsync: false
  - type: LightFade
    duration: 1.5
