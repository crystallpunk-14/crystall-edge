# Example config, not used by any map. Copy it next to a map's gameMap prototype and set its center.
- type: wildlandsConfig
  id: GreenIsland
  wildlandsModifiers: !type:AllSelector
    children:
    - id: CEWildlandsModifierOreCoalNoise
      prob: 0.75
    - id: CEWildlandsModifierOreIronNoise
      prob: 0.75
    - id: CEWildlandsModifierOreCrystalNoise
      prob: 0.5
  layersByDepth:
  #MARK: 2 Hills top
    2:
    - !type:TileNoiseDistanceLayer # whole island footprint
      size: 136, 136
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.6
      fill:
      - tile: CEGrassTall
        threshold: 0.6
        noise: &islandNoise
          frequency: 0.030
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 5
          lacunarity: 2
          gain: 0.5
    - !type:TileNoiseDistanceLayer # tighter center, overwrites the rim marker
      size: 135, 135
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.5
      fill:
      - tile: CEStone
        threshold: 0.8
        noise: *islandNoise
    - !type:FillBiomeLayer # rim = meadow. Must run before the forest: it never outputs CEStone, so the forest mask stays clean.
      biome: CEGrassland
      mask:
      - !type:TileMask
        tiles:
        - CEGrassTall
    - !type:FillBiomeLayer # center = forest
      biome: CEGrasslandForest
      seed: 2
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: 1 Surface
    1:
    - !type:TileNoiseDistanceLayer
      size: 136, 136
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.8
      fill:
      - tile: CEGrassTall
        threshold: 0.7
        noise: *islandNoise
    - !type:TileNoiseDistanceLayer
      size: 135, 135
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.6
      fill:
      - tile: CEStone
        threshold: 0.6
        noise: *islandNoise
    - !type:FillBiomeLayer
      biome: CEGrasslandForest
      seed: 1
      mask:
      - !type:TileMask
        tiles:
        - CEGrassTall
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 1
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: 0 Caves
    0:
    - !type:TileNoiseDistanceLayer
      size: 130, 130
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.7
      fill:
      - tile: CEStone
        threshold: 0.62
        noise: *islandNoise
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 2
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: -1 Caves
    -1:
    - !type:TileNoiseDistanceLayer
      size: 130, 130
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.6
      fill:
      - tile: CEStone
        threshold: 0.63
        noise: *islandNoise
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 3
      mask:
      - !type:TileMask
        tiles:
        - CEStone
  #MARK: -2 Caves
    -2:
    - !type:TileNoiseDistanceLayer
      size: 130, 130
      distanceConfig: !type:EuclideanSquaredDistance
        blendWeight: 0.7
      fill:
      - tile: CEStone
        threshold: 0.65
        noise: *islandNoise
    - !type:FillBiomeLayer
      biome: CECavesGeneric
      seed: 4
      mask:
      - !type:TileMask
        tiles:
        - CEStone
