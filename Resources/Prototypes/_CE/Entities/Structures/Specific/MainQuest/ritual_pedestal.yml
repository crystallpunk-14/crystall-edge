- type: entity
  id: CERitualPedestal
  name: ritual pedestal
  description: A pedestal for a lightheart shard. When every shard lies near the Lucson Sphere, the Restoration Ritual can begin.
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: Objects
    noRot: true
    sprite: _CE/Structures/Specific/MainQuest/ritual_pedestal.rsi
    state: altar
  - type: Icon
    sprite: _CE/Structures/Specific/MainQuest/ritual_pedestal.rsi
    state: altar
  - type: Clickable
  - type: InteractionOutline
  - type: CERitualPedestal
    insertEffects:
    - !type:PlayFarSound
      sound:
        path: /Audio/_CE/Effects/ritual_insert_far.ogg
      minRange: 0
      maxRange: 60
    acceptEffects:
    - !type:SpawnEntity
      spawns:
      - CEShockWaveVFX
    rejectEffects:
    - !type:SpawnEntity
      spawns:
      - CEEffectBreakDivineShield
    - !type:PlaySound
      positional: true
      sound:
        path: /Audio/_CE/Effects/divine_shield_break.ogg
        params:
          variation: 0.1
  - type: ItemSlots
    slots:
      pedestal:
        name: ce-ritual-pedestal-slot-name
        whitelist:
          components:
          - CEQuestItem
  - type: ContainerContainer
    containers:
      pedestal: !type:ContainerSlot
        showEnts: true
        occludes: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 190
        mask:
        - TableMask
        layer:
        - TableLayer
