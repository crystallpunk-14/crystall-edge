# Vials filled with one alchemy reagent. The blank mixture and ingredients (carriers) come in medium vials,
# modifiers in small ones: they work per unit and are needed in smaller amounts.

- type: entity
  id: CEVialMediumAlchemyMixture
  parent: CEVialMedium
  suffix: Alchemy mixture
  components:
  - type: Solution
    id: vial
    solution:
      reagents:
      - ReagentId: CEAlchemyMixture
        Quantity: 50

