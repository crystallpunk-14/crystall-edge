- type: entity
  id: CEShadowRift
  name: shadow rift
  description: A tear in the world. Shadow traders come out of it at dawn and slip back in at nightfall.
  suffix: Traders
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _CE/Structures/Industrial/DimensionalLift/demiplan_rift.rsi
    layers:
    - state: anom
  - type: Icon
    sprite: _CE/Structures/Industrial/DimensionalLift/demiplan_rift.rsi
    state: anom
  - type: PointLight
    color: MediumPurple
    radius: 3
    energy: 2
  - type: CEShadowRift
    count: 3
    spawns:
    - CEMobShadowTraderCarcat
    - CEMobShadowTraderCarrin
    - CEMobShadowTraderDwarf
    - CEMobShadowTraderElf
    - CEMobShadowTraderGoblin
    - CEMobShadowTraderHuman
    - CEMobShadowTraderSilva
    - CEMobShadowTraderTiefling
  - type: CEMurkDissolvingStatus
    dissolved: 0.75
    overlayEnabled: false
    soundEnabled: false

- type: entity
  id: CEActionEnterShadowRift
  name: enter the rift
  description: Steps back into the shadow rift.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
  - type: TargetAction
    range: 2
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - CEShadowRift
    event: !type:CEEntityTargetActionAnimationEvent
      animation: CEAnimationEnterShadowRift

- type: entityEffectAnimation
  id: CEAnimationEnterShadowRift
  movementSpeed: 0
  duration: 1
  events:
    0:
    - !type:UserAnimation
      colorAnimation:
      - time: 0.0
        color: "#ffffff"
      - time: 0.9
        color: "#ffffff01"
    0.9:
    - !type:SpawnEntity
      effectTarget: User
      spawns:
      - CELurkerShadowStepEffect
    - !type:Delete
      effectTarget: User
