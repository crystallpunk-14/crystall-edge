- type: entity
  abstract: true
  id: CEMobGOAPBase
  categories: [ ForkFiltered ]
  components:
  - type: CEGOAP
  - type: CEGOAPEyesPerceptor
    visionRadius: 8
  - type: CEGOAPPainPerceptor
  - type: CEGOAPHasTargetSensor
    entries:
    - conditionKey: EnemyVisible
      selector: !type:CEGOAPSelectorNearestKnown
        conditions:
        - !type:InEnemyFaction
        - !type:Incapacitated
          inverted: true
  - type: CEGOAPRangeToTargetSensor
    entries:
    - conditionKey: EnemyInMeleeRange
      selector: !type:CEGOAPSelectorNearestKnown
        conditions:
        - !type:InEnemyFaction
        - !type:Incapacitated
          inverted: true
      range: 1
