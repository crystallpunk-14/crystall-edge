- type: entity
  parent: CEBaseSpeciesAppearance
  id: CEAppearanceSkeleton
  categories: [ ForkFiltered, HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
    # Own layer instead of the eyes organ: not tinted by eye color and not hidden by blinking
    - map: [ "skeleton_eyes" ]
      sprite: _CE/Mobs/Species/Skeleton/parts.rsi
      state: eyes
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LFoot" ]
    - map: [ "enum.HumanoidVisualLayers.RFoot" ]
    - map: [ "pants" ]
    - map: [ "shoes" ]
    - map: [ "shirt" ]
    - map: [ "enum.HumanoidVisualLayers.LHand" ]
    - map: [ "enum.HumanoidVisualLayers.RHand" ]
    - map: [ "gloves" ]
    - map: [ "ears" ]
    - map: [ "outerClothing" ]
    - map: [ "cloak" ]
    - map: [ "belt" ]
    - map: [ "belt2" ]
    - map: [ "neck" ]
    - map: [ "back" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "eyes" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
  - type: Inventory
    templateId: CEHuman
    displacements:
      neck:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: male_neck
          48:
            sprite: _CE/Mobs/Species/Human/displacement48.rsi
            state: male_neck
  - type: InitialBody
    organs:
      Torso: CEOrganSkeletonTorso
      Head: CEOrganSkeletonHead
      ArmLeft: CEOrganSkeletonArmLeft
      ArmRight: CEOrganSkeletonArmRight
      HandRight: CEOrganSkeletonHandRight
      HandLeft: CEOrganSkeletonHandLeft
      LegLeft: CEOrganSkeletonLegLeft
      LegRight: CEOrganSkeletonLegRight
      FootLeft: CEOrganSkeletonFootLeft
      FootRight: CEOrganSkeletonFootRight
  - type: HumanoidProfile
    species: CESkeleton

# No blood, breath, food or thermal regulation
- type: entity
  parent:
  - CEAppearanceSkeleton
  - CEBaseSpeciesMob
  id: CEMobSkeleton
  name: Mr. Skeleton
  components:
  - type: Icon
    sprite: _CE/Mobs/Species/Skeleton/parts.rsi
    state: full
  - type: Damageable
    damageModifierSet: CESkeleton
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#555555AA"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: SlowOnDamage
    speedModifierThresholds: {}
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:GibBehavior
      - !type:SpawnEntitiesBehavior
        spawn:
          CEBone1:
            min: 2
            max: 4
  - type: TransferMindOnGib
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 130
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Temperature
    temperature: 293.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 373.15
    coldDamageThreshold: 0
    heatDamage:
      types:
        Heat: 1.5
  - type: Speech
    speechVerb: Skeleton
  - type: CEBarkSpeech
    barkSpeech: Skeleton
  - type: Vocal
    emoteSounds: Skeleton
  - type: CEInnateSkills
    skills:
    - Murkwalker
    - NightVision
    descriptorName: ce-species-name-skeleton
    descriptorColor: "#e3dac9"

- type: entity
  parent: OrganBase
  id: CEOrganSkeleton
  categories: [ ForkFiltered ]
  abstract: true
  suffix: skeleton

- type: entity
  parent: CEOrganSkeleton
  id: CEOrganSkeletonExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _CE/Mobs/Species/Skeleton/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _CE/Mobs/Species/Skeleton/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: None

- type: entity
  parent: [ CEOrganBaseTorsoNonSexed, OrganBaseTorso, CEOrganSkeletonExternal ]
  id: CEOrganSkeletonTorso
  categories: [ HideSpawnMenu ]

# The mind moves here when the body is gibbed
- type: entity
  parent: [ CEOrganBaseHeadNonSexed, OrganBaseHead, CEOrganSkeletonExternal ]
  id: CEOrganSkeletonHead
  name: skull
  description: Alas poor Yorick...
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    layers:
    - state: head
    - state: eyes
      shader: unshaded
  - type: GibbableOrgan
  - type: Tag
    tags:
    - Head
    - MindTransferTarget
  - type: Speech
    speechVerb: Skeleton
  - type: CEBarkSpeech
    barkSpeech: Skeleton
  - type: Vocal
    emoteSounds: Skeleton
  - type: Emoting
  - type: Actions
  - type: Examiner
  - type: DoAfter
  - type: MobState
    allowedStates:
    - Alive
  - type: Grammar
    attributes:
      proper: true
  - type: Damageable
    damageModifierSet: CESkeleton
  - type: Injurable
    damageContainer: CEBiological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

