- type: entity
  id: CEBaseCurtains
  abstract: true
  categories: [ ForkFiltered ]
  parent:
  - BaseStructure
  #- CEBaseFlammableSpreadingStrong
  name: curtains
  description: Hides what others shouldn't see.
  placement:
    mode: SnapgridCenter
  components:
  - type: Occluder
    boundingBox: "-0.5,0.5,0.5,1.5"
    enabled: false
  - type: AnimationPlayer
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,0.3,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - Opaque
  - type: Door
    state: Open
    canCrush: false
    performCollisionCheck: false
    bumpOpen: false
    clickOpen: true
    closedDrawDepth: Mobs
    openDrawDepth: Mobs
    closeTimeOne: 0.5
    closeTimeTwo: 0.1
    openTimeOne: 0.5
    openTimeTwo: 0.1
    openSound:
      path: /Audio/Effects/curtain_openclose.ogg
    closeSound:
      path: /Audio/Effects/curtain_openclose.ogg
  - type: Appearance
  - type: Damageable
    damageModifierSet: CEWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          CECloth1:
            min: 1
            max: 2
  - type: Sprite
    sprite: _CE/Structures/Furniture/curtains.rsi
  - type: InteractionOutline
  - type: Physics
    canCollide: false
  - type: UserInterface
    interfaces:
      enum.CERadialConstructionUiKey.Key:
        type: CERadialConstructionMenuBoundUserInterface

#MARK: White

- type: entity
  id: CECurtainsWhiteBase
  abstract: true
  parent: CEBaseCurtains
  components:
  - type: Door
    openSpriteState: white_open
    closedSpriteState: white_closed
  - type: Sprite
    layers:
    - state: white_open
      map: ["enum.DoorVisualLayers.Base"]

- type: entity
  id: CECurtainsWhite
  parent: CECurtainsWhiteBase
  name: white curtains
  components:
  - type: CERadialConstruction
    availablePrototypes:
    - CECurtainsWhiteFlower
    - CECurtainsWhiteStar
    - CECurtainsWhiteGoldenline
    - CECurtainsWhiteGoldenline2
    - CECurtainsBlue
    - CECurtainsRed
    - CECurtainsPurple
    - CECurtainsGreen
  - type: Construction
    graph: CECurtainsWhite
    node: CECurtainsWhite

- type: entity
  id: CECurtainsWhiteFlower
  parent: CECurtainsWhiteBase
  name: white curtains, flower
  components:
  - type: Sprite
    layers:
    - state: white_open
      map: ["enum.DoorVisualLayers.Base"]
    - state: flower_open
      map: ["pattern"]
  - type: GenericVisualizer
    visuals:
      enum.DoorVisuals.State:
        pattern:
          Open: { state: flower_open }
          Closed: { state: flower_closed }

- type: entity
  id: CECurtainsWhiteStar
  parent: CECurtainsWhiteBase
  name: white curtains, star
  components:
  - type: Sprite
    layers:
    - state: white_open
      map: ["enum.DoorVisualLayers.Base"]
    - state: star_open
      map: ["pattern"]
  - type: GenericVisualizer
    visuals:
      enum.DoorVisuals.State:
        pattern:
          Open: { state: star_open }
          Closed: { state: star_closed }

- type: entity
  id: CECurtainsWhiteGoldenline
  parent: CECurtainsWhiteBase
  name: white curtains, golden line
  components:
  - type: Sprite
    layers:
    - state: white_open
      map: ["enum.DoorVisualLayers.Base"]
    - state: goldenline_open
      map: ["pattern"]
  - type: GenericVisualizer
    visuals:
      enum.DoorVisuals.State:
        pattern:
          Open: { state: goldenline_open }
          Closed: { state: goldenline_closed }

- type: entity
  id: CECurtainsWhiteGoldenline2
  parent: CECurtainsWhiteBase
  name: white curtains, two golden line
  components:
  - type: Sprite
    layers:
    - state: white_open
      map: ["enum.DoorVisualLayers.Base"]
    - state: goldenline2_open
      map: ["pattern"]
  - type: GenericVisualizer
    visuals:
      enum.DoorVisuals.State:
        pattern:
