- type: entity
  name: lightning
  id: BaseLightning
  abstract: true
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    layers:
    - state: "lightning_1"
      shader: unshaded
  - type: Physics
  - type: Electrified
    requirePower: false
  - type: Lightning
  - type: PointLight
    enabled: true
    color: "#4080FF"
    radius: 3.5
    softness: 1
    autoRot: true
    castShadows: false
  - type: Beam
    sound: /Audio/Effects/Lightning/lightningshock.ogg
  - type: TimedDespawn
    lifetime: 3
  - type: Tag
    tags:
      - HideContextMenu
  # At least one fixture is needed for the CanCollide field of the PhysicsComponent to not always be false.
  - type: Fixtures
    fixtures:
      fix1: {}

- type: entity
  name: lightning
  id: Lightning
  parent: BaseLightning
  categories: [ HideSpawnMenu ]
  components:
    - type: Lightning
      canArc: true

- type: entity
  name: spooky lightning
  id: LightningRevenant
  parent: BaseLightning
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: /Textures/Effects/lightning.rsi
      drawdepth: Effects
      layers:
        - state: "lightning_3"
          color: plum
          shader: unshaded
    - type: PointLight
      enabled: true
      color: plum
      radius: 3.5
      softness: 1
      autoRot: true
      castShadows: false
    - type: Lightning
      canArc: false
      shockDamage: 30

- type: entity
  name: lightning
  id: Spark
  parent: BaseLightning
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    layers:
    - state: "lightning_1"
      shader: unshaded
  - type: Electrified
    shockDamage: 0
  - type: Lightning
    lightningPrototype: Spark
  - type: PointLight
    radius: 0.2
    softness: .4
  - type: Beam
    sound: /Audio/Effects/sparks4.ogg
  - type: TimedDespawn
    lifetime: .3
  - type: Tag
    tags:
      - HideContextMenu
