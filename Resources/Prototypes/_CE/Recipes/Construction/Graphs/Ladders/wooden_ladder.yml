- type: constructionGraph
  id: CEWoodenLadderItem
  start: start
  graph:
    - node: start
      edges:
        - to: CEWoodenLadderItem
          steps:
            - material: CEWood
              amount: 2
              doAfter: 0.25
            - material: CENail
              amount: 1

    - node: CEWoodenLadderItem
      entity: CEWoodenLadderItem

# The mounted ladder is placed from the item, this graph only takes it back down.
- type: constructionGraph
  id: CEWoodenLadder
  start: start
  graph:
    - node: start

    - node: CEWoodenLadder
      entity: CEWoodenLadder
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CEWoodenLadderItem
              amount: 1
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 2
