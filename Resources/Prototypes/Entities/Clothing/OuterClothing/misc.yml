- type: entity
  parent: ClothingOuterJacketBase
  id: ClothingOuterFlannelRed
  name: red flannel jacket
  description: An old fashioned red flannel jacket for space autumn.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Misc/flannel_jacket.rsi
    layers:
    - state: icon
      color: "#670a09"
    - state: icon-lines
      color: "#000000"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#670a09"
      - state: inhand-left-lines
        color: "#000000"
      right:
      - state: inhand-right
        color: "#670a09"
      - state: inhand-right-lines
        color: "#000000"
  - type: Clothing
    sprite: Clothing/OuterClothing/Misc/flannel_jacket.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
        color: "#670a09"
      - state: equipped-OUTERCLOTHING-lines
        color: "#000000"

