- type: entity
  parent: BaseMentalAction
  id: CEActionGhostForfeitReturn
  name: Abandon return
  description: Give up any chance of returning to this round. In exchange, you will see secret roles and objectives of other players.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _CE/Mobs/ghost.rsi
    layers:
    - state: base
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CEGhostForfeitReturnActionEvent
  - type: ConfirmableAction
    popup: ce-ghost-forfeit-return-popup
    confirmDelay: 2
