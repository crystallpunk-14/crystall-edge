- type: entity
  id: CEGoldOre1
  parent: BaseItem
  name: gold ore
  suffix: 1
  description: "A chunk of ore veined with gold. Can be smelted down into gold bars."
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Materials/Metals/gold_ore.rsi
    layers:
      - state: ore1
        map: ["base"]
  - type: Appearance
  - type: Stack
    stackType: CEGoldOre
    count: 1
    baseLayer: base
    layerStates:
    - ore1
    - ore2
    - ore3
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CEGold: 1
  - type: CEMagicEssenceStructure
    essences:
      Metal: { min: 1, max: 3 }
      Earth: { min: 1, max: 4 }
  - type: CEShiny
    effect: CEEffectShinyGold
    radius: 0.2
    minFrequency: 3
    maxFrequency: 8

- type: entity
  id: CEGoldOre10
  parent: CEGoldOre1
  suffix: 10
  components:
  - type: Stack
    count: 10

- type: entity
  id: CEGoldOre30
  parent: CEGoldOre1
  suffix: 30
  components:
  - type: Stack
    count: 30

- type: entity
  id: CEGoldBar1
  parent: BaseItem
  name: gold bar
  suffix: 1
  description: A heavy, gleaming bar of refined gold
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Materials/Metals/gold_bar.rsi
    layers:
      - state: bar
        map: ["base"]
  - type: Appearance
  - type: Stack
    stackType: CEGoldBar
    count: 1
    baseLayer: base
    layerStates:
    - bar
    - bar_2
    - bar_3
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CEGold: 10
  - type: StackPrice
    price: 30
  - type: CEMagicEssenceStructure
    essences:
      Metal: { min: 3, max: 8 }
      Earth: { min: 0, max: 3 }
  - type: CEShiny
    effect: CEEffectShinyGold
    radius: 0.2
    minFrequency: 3
    maxFrequency: 8

