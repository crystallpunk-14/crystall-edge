- type: entity
  parent: CEBaseThinWindow
  id: CEThinWindowIron
  suffix: Iron
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/ThinWindows/iron.rsi
  - type: Icon
    sprite: _CE/Structures/Architecture/ThinWindows/iron.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CEIronScrap1:
            min: 1
            max: 1
      - !type:SpawnEntitiesBehavior
        spawn:
          CEGlassShard:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  #- type: Construction
  #  graph: CEThinWindowIron
  #  node: CEThinWindowIron

