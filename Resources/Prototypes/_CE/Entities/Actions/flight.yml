- type: entity
  id: CEActionZFlightUp
  name: Move up
  description: Move up one Z-Level
  components:
  - type: Action
    useDelay: 1.5
  - type: Sprite
    sprite: _CE/Actions/misc.rsi
    layers:
    - state: up
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CEZFlightActionUp

- type: entity
  id: CEActionZFlightDown
  name: Move down
  description: Move down one Z-Level
  components:
  - type: Action
    useDelay: 1.5
  - type: Sprite
    sprite: _CE/Actions/misc.rsi
    layers:
    - state: down
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CEZFlightActionDown

- type: entity
  parent: BaseToggleAction
  id: CEActionZFlightToggle
  name: Toggle flight mode
  description: Toggle flight mode on or off
  components:
  - type: Action
    useDelay: 1.5
  - type: Sprite
    sprite: _CE/Actions/misc.rsi
    layers:
    - state: toggle_flight
      map: ["enum.ActionVisuals.Icon"]
    - state: toggle_flight_on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
