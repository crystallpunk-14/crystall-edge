- type: entity
  parent: CEDrinkBaseMug
  id: CEDrinkBaseGoblet
  name: goblet
  description: A metal goblet for those who want to drink exquisitely.
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-

- type: entity
  parent: CEDrinkBaseGoblet
  id: CESteelGobletIron
  name: iron goblet
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Drinks/goblet.rsi
    layers:
      - state: iron_goblet
      - map: ["enum.SolutionContainerLayers.Fill"]
        state: fill-5
        visible: false
  - type: PhysicalComposition
    materialComposition:
      CEIron: 10
  - type: CEMagicEssenceStructure
    essences:
      Metal: { min: 1, max: 3 }
      Void: { min: 0, max: 2 }

- type: entity
  parent: CEDrinkBaseGoblet
  id: CESteelGobletCopper
  name: copper goblet
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Drinks/goblet.rsi
    layers:
      - state: copper_goblet
      - map: ["enum.SolutionContainerLayers.Fill"]
        state: fill-5
        visible: false
  - type: StaticPrice
    price: 15
  - type: CEMagicEssenceStructure
    essences:
      Metal: { min: 1, max: 3 }
      Void: { min: 0, max: 2 }

- type: entity
  parent: CEDrinkBaseGoblet
  id: CESteelGobletGold
  name: gold goblet
  description: A goblet made of solid gold to show how rich its owner is.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Drinks/goblet.rsi
    layers:
      - state: gold_goblet
      - map: ["enum.SolutionContainerLayers.Fill"]
        state: fill-5
        visible: false
  - type: StaticPrice
    price: 50
  - type: CEMagicEssenceStructure
    essences:
      Greed: { min: 1, max: 2 }
      Void: { min: 0, max: 2 }

- type: entity
  parent: CEDrinkBaseGoblet
  id: CESteelGobletBottomless
  name: bottomless goblet
  description: A jeweled goblet enchanted to have no bottom, fit for a never ending king's banquet.
  categories: [ DoNotMap ]
  suffix: Artifact
  components:
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: bottomless-fill-
  - type: Sprite
    sprite: _CE/Objects/Consumable/Drinks/goblet.rsi
    layers:
      - state: bottomless_goblet
      - map: [ "enum.SolutionContainerLayers.Fill" ]
        state: bottomless-fill-2
        visible: false
  - type: Solution
    solution:
      maxVol: 1000
  - type: StaticPrice
    price: 220
  - type: CEMagicEssenceStructure
    essences:
      Greed: { min: 3, max: 2 }
      Void: { min: 5, max: 6 }
      Magic: { min: 1, max: 3 }
