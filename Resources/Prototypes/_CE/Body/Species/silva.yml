- type: markingsGroup
  id: CESilva
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false

- type: entity
  parent: CEBaseSpeciesAppearance
  id: CEAppearanceSilva
  categories: [ ForkFiltered, HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      shader: unshaded # Gloving eyes
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - shader: StencilClear
      sprite: _CE/Mobs/Species/Human/parts.rsi
      state: l_leg_m
    - map: [ "enum.HumanoidVisualLayers.Tail" ] # Body Bark before clothing
    - shader: StencilMask
      map: [ "enum.HumanoidVisualLayers.StencilMask" ]
      sprite: Mobs/Customization/masking_helpers.rsi
      state: unisex_full
      visible: false
    - map: [ "enum.HumanoidVisualLayers.LFoot" ]
    - map: [ "enum.HumanoidVisualLayers.RFoot" ]
    - map: [ "pants" ]
    - map: [ "shoes" ]
    - map: [ "shirt" ]
    - map: [ "enum.HumanoidVisualLayers.LHand" ]
    - map: [ "enum.HumanoidVisualLayers.RHand" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ] # Bark Before clothing
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ] # Bark Before clothing
    - map: [ "gloves" ]
    - map: [ "ears" ]
    - map: [ "outerClothing" ]
    - map: [ "cloak" ]
    - map: [ "belt" ]
    - map: [ "belt2" ]
    - map: [ "neck" ]
    - map: [ "back" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "eyes" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
  - type: Inventory
    templateId: CEHuman
    displacements:
      shirt:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Elf/displacement.rsi
            state: male_shirt
      neck:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: male_neck
          48:
            sprite: _CE/Mobs/Species/Human/displacement48.rsi
            state: male_neck
    femaleDisplacements:
      outerClothing:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_cloak
      cloak:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_cloak
      pants:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_pants
      shirt:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Elf/displacement.rsi
            state: female_shirt
      neck:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_neck
          48:
            sprite: _CE/Mobs/Species/Human/displacement48.rsi
            state: female_neck
  - type: InitialBody
    organs:
      Torso: CEOrganSilvaTorso
      Head: CEOrganSilvaHead
      ArmLeft: CEOrganSilvaArmLeft
      ArmRight: CEOrganSilvaArmRight
      HandRight: CEOrganSilvaHandRight
      HandLeft: CEOrganSilvaHandLeft
      LegLeft: CEOrganSilvaLegLeft
      LegRight: CEOrganSilvaLegRight
      FootLeft: CEOrganSilvaFootLeft
      FootRight: CEOrganSilvaFootRight
      Brain: OrganHumanBrain
      Eyes: CEOrganSilvaEyes
      Heart: OrganHumanHeart
      Lungs: OrganHumanLungs
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: CESilva

- type: entity
  parent:
  - CEAppearanceSilva
  - CEBaseSpeciesMobOrganic
  id: CEMobSilva
  name: Mr. Silva
  components:
  - type: Icon
    sprite: _CE/Mobs/Species/Elf/parts.rsi #TODO
    state: full
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CEBloodSilva
        Quantity: 300

- type: entity
  parent: OrganBase
  id: CEOrganSilva
  categories: [ ForkFiltered ]
  abstract: true
  suffix: silva

- type: entity
  parent: CEOrganSilva
  id: CEOrganSilvaExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _CE/Mobs/Species/Silva/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _CE/Mobs/Species/Silva/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: CESilva
  - type: CEMagicEssenceStructure
    essences:
      Plant: { min: 1, max: 3 }
      Tree: { min: 0, max: 2 }

- type: entity
  parent: [ CEOrganBaseTorsoSexed, OrganBaseTorso, CEOrganSilvaExternal ]
  id: CEOrganSilvaTorso
  components:
