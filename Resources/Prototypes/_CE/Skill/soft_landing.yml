- type: skill
  id: SoftLanding
  icon:
    sprite: _CE/Actions/Spells/feather_fall.rsi
    state: icon
  effect: !type:AddStatusEffect
    effect: CEStatusEffectSoftLanding

- type: entity
  parent: StatusEffectBase
  id: CEStatusEffectSoftLanding
  name: Soft Landing
  description: Softens falls from a height, reducing damage and preventing you from being knocked down as long as the fall speed is not too high.
  components:
  - type: CESoftLandingStatusEffect
    maxSpeedLimit: 7 # 2 floors safe fall
