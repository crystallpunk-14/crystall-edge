- type: biomeTemplate
  id: CEWastelands
  layers:
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: CEStone
    - !type:BiomeTileLayer
      tile: CEDirt
      threshold: 0
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.05
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120
    - !type:BiomeEntityLayer # More Rocks
      threshold: 0.5
      noise:
        seed: 18
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 4
      allowedTiles:
        - CEStone
        - CEDirt
      entities:
        - CERockSmall
        - CERockBig
