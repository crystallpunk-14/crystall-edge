- type: entity
  abstract: true
  parent: BaseItem
  id: CEBaseWeaponBow
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Ranged/bow.rsi
  - type: Item
    size: Huge
    shape:
    - 0,0,1,3
  - type: Clothing
    sprite: _CE/Objects/Tools/Weapons/Ranged/bow.rsi
    quickEquip: false
    equipWhileMoving: true
    equipDelay: 0.45
    unequipDelay: 0.45
    slots:
    - neck
  - type: Wieldable
    wieldSound:
      path: /Audio/Items/bow_pull.ogg
  - type: UseDelay
    delay: 1
  - type: GunRequiresWield
  - type: Gun
    minAngle: 0
    maxAngle: 5
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: BulletMiss
    soundEmpty: null
  - type: ItemSlots
    slots:
      projectiles:
        name: Projectiles
        startingItem: null
        insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
        whitelist:
          tags:
          - CEArrow
  - type: ContainerContainer
    containers:
      projectiles: !type:ContainerSlot
  - type: ContainerAmmoProvider
    container: projectiles

- type: entity
  parent: CEBaseWeaponBow
  id: CEWeaponBowCombat
  name: combat bow
  description: A standard ranged weapon, and even without magic.
  components:
  - type: Sprite
    layers:
    - state: unwielded
      map: [ base ]
    - state: unwielded-arrow
      map: [ arrow ]
      visible: false
  - type: Appearance
  - type: ItemMapper
    spriteLayers:
    - arrow
    mapLayers:
      arrow:
        whitelist:
          tags:
          - CEArrow
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        arrow:
          True: { state: wielded-arrow }
          False: { state: unwielded-arrow }
        base:
          True: { state: wielded }
          False: { state: unwielded }
  - type: PhysicalComposition
    materialComposition:
      CEWood: 40
      CECloth: 5
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Tree: { min: 1, max: 3 }
