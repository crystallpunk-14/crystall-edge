- type: entity
  abstract: true
  id: CEBaseWeaponClub
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
  - type: CEWeapon
    range: 0.6
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 8
      - !type:ThrowFrom
        throwPower: 10
        distance: 1
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 14
    animations:
      Primary:
      - anim: WarAxeAttackLight
      - anim: WarAxeAttackLight2
      Secondary:
      - anim: SwordAttackHeavy1
        speed: 0.7
      - anim: SwordAttackHeavy2
        speed: 0.7
  - type: CEWeaponStaminaCost
    costs:
      Primary: 5
      Secondary: 5
  - type: CERotationForAnimation
    rotation: -90
  - type: Clothing
    slots:
    - neck
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Tree: { min: 0, max: 2 }

- type: entity
  parent: CEBaseWeaponClub
  id: CEWeaponClubWooden
  name: heavy club
  description: A heavy wooden club. Blunt, brutal, and effective.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Club/wooden.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 25
