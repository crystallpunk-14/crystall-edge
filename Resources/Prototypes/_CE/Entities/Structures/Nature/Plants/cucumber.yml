- type: entity
  id: CEPlantCucumber
  parent:
  - CEPlantBase
  - CEPlantBaseSolarEnergy
  - CEPlantBaseFloralDelicateType
  - CEPlantBaseGrowingMedium
  - CEPlantBaseMetabolizerMedium
  - CEPlantBaseMetabolizerWater
  name: cucumber
  description: Don't trust people who know how to turn into pickles.
  components:
  - type: CEPlantVisuals
    growthSteps: 5
    readyVariations: 2
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/cucumber.rsi
    layers:
    - state: liq-1
      sprite: _CE/Structures/Nature/Farm/watered.rsi
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      map: ["enum.PlantVisualLayers.Base"]
  - type: CEPlantProducing
    gatherKeys:
      cucumber:
        result: CEFoodCucumber
        maxProduce: 2
        growthPerUpdate: 0.25 # CrystallEdge: new cucumber batch every 4 minutes
  - type: CEPlantGatherOnInteract
    gatherKeys:
    - cucumber
    toolWhitelist:
      tags:
      - CESharp
