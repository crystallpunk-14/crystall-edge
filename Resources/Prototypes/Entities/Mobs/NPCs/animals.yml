        Asphyxiation: 0.5
    damageRecovery:
      types:
        Asphyxiation: -0.5
  - type: CombatMode
  - type: Solution
    solution:
      reagents:
      - ReagentId: Slime
        Quantity: 20
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatSlime
      amount: 2
  - type: Extractable
    grindableSolutionName: food
  - type: ReplacementAccent
    accent: mothroach
  - type: Vocal
    emoteSounds: UnisexMoth
    wilhelmProbability: 0.001
  - type: BodyEmotes
    soundsId: MothBodyEmotes
