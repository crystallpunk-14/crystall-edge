- type: entity
  id: CEWoodenLadderItem
  parent: BaseItem
  name: wooden ladder
  description: A folded wooden ladder. Use it on a wall to mount it, or on an open edge next to you to hang it down to the level below.
  categories: [ ForkFiltered ]
  suffix: 1
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Materials/ladder.rsi
    layers:
      - state: wooden1
        map: ["base"]
  - type: Appearance
  - type: Construction
    graph: CEWoodenLadderItem
    node: CEWoodenLadderItem
  - type: Stack
    stackType: CEWoodenLadder
    count: 1
    baseLayer: base
    layerStates:
    - wooden1
    - wooden2
    - wooden3
  - type: CEWallmountPlacer
    prototype: CEWoodenLadder
    allowPlaceBelow: true

- type: entity
  id: CEWoodenLadderItem10
  parent: CEWoodenLadderItem
  suffix: 10
  components:
  - type: Stack
    count: 10
