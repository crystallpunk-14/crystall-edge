- type: entity
  id: CEFryingPan
  parent: CECookerBase
  name: frying pan
  description: "You can always watch three things: how fire burns, how water flows, and how delicious meat is cooked."
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Food/Meals/frying_pan.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - map: ["ce_foodLayers"]
    - state: closed
      map: [ base ]
    - state: cooking
      visible: false
      map: [ cook ]
    - state: cooking
      visible: false
      color: "#38312e"
      map: [ burn ]
  - type: CEWeapon
    range: 0.7
    hitSound:
      path: "/Audio/Weapons/smash.ogg"
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 6
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 6
    animations:
      Primary:
      - anim: SwordAttackLight1
      - anim: SwordAttackLight2
      Secondary:
      - anim: SwordAttackHeavy1
      - anim: SwordAttackHeavy2
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 10
  - type: CERotationForAnimation
    rotation: 270
  - type: Storage
    storageOpenSound: /Audio/_CE/Effects/pan_open.ogg
    storageCloseSound: /Audio/_CE/Effects/pan_close.ogg
    storageInsertSound: /Audio/Items/toolbox_insert.ogg
    storageRemoveSound: /Audio/Items/toolbox_insert.ogg
  - type: Solution
    id: cooker
    solution:
      maxVol: 100
  - type: CEFoodHolder
    foodType: Meal
    solutionId: cooker
    displacementRsiPath: _CE/Objects/Consumable/Food/Meals/displacement_pan.rsi
    maxDisplacementFillLevels: 2
    canGiveFood: true
    autoRename: false
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: CEFoodCooker
    foodType: Meal
    solutionId: cooker
  - type: RefillableSolution
    solution: cooker
  - type: DrainableSolution
    solution: cooker
  - type: Spillable
    solution: cooker
  - type: AmbientSound
    sound:
      path: /Audio/_CE/Ambience/pan_frying.ogg
  - type: PhysicalComposition
    materialComposition:
      CEIron: 20
      CEWood: 10
  - type: CEMagicEssenceStructure
    essences:
      Metal:
        min: 1
        max: 4
      Fire:
        min: 0
        max: 2
      Tree:
        min: 0
        max: 1
