- type: entity
  parent: MobStatusEffectDebuff
  id: SpeechStatusEffectBase
  abstract: true
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - Speech
      requireAll: true

# Causes you to schlur your words schwhen talking.
- type: entity
  parent: SpeechStatusEffectBase
  id: StatusEffectSlurred
  name: slurred
  components:
  - type: SlurredAccent

# Causes words your be to scrambled. Who?
- type: entity
  parent: SpeechStatusEffectBase
  id: StatusEffectScrambled
  name: scrambled
  components:
  - type: ScrambledAccent

# Causes you to speak like a servant of Ratvar.
- type: entity
  parent: SpeechStatusEffectBase
  id: StatusEffectRatvarianLanguage
  name: ratvarian language patterns
  components:
  - type: RatvarianLanguage
