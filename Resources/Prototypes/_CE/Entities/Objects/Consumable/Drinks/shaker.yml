- type: entity
  parent: BaseItem
  id: CEDrinkShaker
  name: shaker
  description: The trusty mixing buddy of the bartender.
  categories: [ ForkFiltered ]
  components:
  - type: Solution
    id: drink
    solution:
      maxVol: 60
  - type: Sprite
    sprite: _CE/Objects/Consumable/Drinks/shaker.rsi
    state: icon
  - type: Item
    size: Small
    shape:
    - 0,0,0,2
  - type: Edible
    edible: Drink
    solution: drink
    destroyOnEmpty: false
    utensil: None # conflicts with bar spoon stirring
  - type: Spillable
    solution: drink
  - type: MixableSolution
    solution: drink
  - type: DrawableSolution
    solution: drink
  - type: RefillableSolution
    solution: drink
  - type: DrainableSolution
    solution: drink
  - type: InjectableSolution
    solution: drink
  - type: ExaminableSolution
    solution: drink
    heldOnly: true # opaque, can't see inside from a distance
  - type: SolutionItemStatus
    solution: drink
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: CEWeatherRefillable
    solution: drink
  - type: Shakeable
  - type: ReactionMixer
    mixerType: None
    reactionTypes:
    - Shake
  - type: DnaSubstanceTrace
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalCrunch
      - !type:SpillBehavior { }
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      CEIron: 10
