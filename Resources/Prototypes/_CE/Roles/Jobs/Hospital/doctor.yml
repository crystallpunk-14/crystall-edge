- type: job
  id: CEDoctor
  setPreference: true
  name: ce-job-name-doctor
  description: ce-job-desc-doctor
  playTimeTracker: CEJobDoctor
  startingGear: CEDoctorGear
  icon: CEJobIconDoctor
  supervisors: ce-job-supervisors-hospital-warden

- type: startingGear
  id: CEDoctorGear
  equipment:
    belt: CEKeyRingHospital
    pocket1: CEWalletFilledDoctor

- type: entity
  id: CEWalletFilledDoctor
  parent: CEWallet
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents: #100cp total
    - id: CECoinSilver5
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinSilver1
    - id: CECoinCopper10

- type: entity
  id: CEKeyRingHospital
  parent: CEBaseKeyRing
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents:
    - id: CEKeyHospitalHall
    - id: CEKeyHospitalStaff

- type: entity
  id: CEChestFilledDoctor
  parent: CEWoodenChest
  suffix: Filled, Doctor
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CEClothingEyesMedicalGlasses
        - id: CEGauze
        - id: CEGauze
        - id: CEGauze
        - id: CEHerbalOintment
        - id: CEHerbalOintment
        - id: CEBloodpack
        - id: CEBloodpack
        - id: CEHandLabeler

- type: entity
  id: CEBedsideTableFilledDoctor
  parent: CEBedsideTableWooden
  suffix: Filled, Doctor
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        rolls: !type:RangeNumberSelector
          range: 2, 3
        children:
        - id: CEClothingHeadBeretDoctor
        - id: CEClothingCloakRaincoatAlchemist
        - id: CEClothingCloakMantleAlchemist
        - id: CEClothingShirtDressWhiteTeal
        - id: CEClothingShirtDressOpenGreen
        - id: CEClothingShirtDressTealPanel
        - id: CEClothingShirtDressMedicalGreenBelt
        - id: CEClothingShirtDressTealCollar
        - id: CEClothingShirtMedicalWhite
        - id: CEClothingShirtMedicalGreenCollar
        - id: CEClothingShirtMedicalOpenTeal
        - id: CEClothingShirtMedicalOpenGreen
        - id: CEClothingShirtMedicalWhiteTeal
        - id: CEClothingPantsMedicalSkirt
        - id: CEClothingGlovesMedical
        - id: CEClothingShoesMedicalHeels
