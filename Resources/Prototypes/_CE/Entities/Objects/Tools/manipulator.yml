#MARK: Arm

- type: entity
  parent: BaseItem
  id: CEThirdArm
  categories: [ ForkFiltered ]
  name: manipulator arm
  description: The most important tool for an engineering mana technician. A modular, battery-powered robotic arm capable of performing a variety of functions, depending on the module attached to it.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: PhysicalComposition
    materialComposition:
      CEIron: 10
      CEBrass: 20
  - type: Sprite
    sprite: _CE/Objects/Tools/ThirdArm/third_arm.rsi
    state: icon
  - type: Clothing
    sprite: _CE/Objects/Tools/ThirdArm/third_arm.rsi
    quickEquip: true
    equipDelay: 1.5
    unequipDelay: 1.5
    slots:
    - Neck
  - type: Item
    sprite: _CE/Objects/Tools/ThirdArm/third_arm.rsi
    size: Large
  - type: CEMagicEssenceStructure
    essences:
      Tool: { min: 2, max: 8 }
      Metal: { min: 2, max: 4 }
      Energia: { min: 0, max: 4 }
  - type: Appearance
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: ExaminableBattery
  - type: StaticPrice
    price: 70
  - type: CEThirdArm
    moduleSlot:
      whitelist:
        components:
        - CEThirdArmModule
  - type: ContainerContainer
    containers:
      module_slot: !type:ContainerSlot
        showEnts: False
        occludes: False
        ent: null
  - type: ItemSlots

- type: entity
  parent: BaseItem
  id: CEThirdArmModuleBase
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Small
    shape:
    - 0, 0, 0, 0
  - type: CEThirdArmModule

#MARK: Light Module

- type: entity
  parent: CEThirdArmModuleBase
  id: CEThirdArmModuleLight
  categories: [ ForkFiltered ]
  name: manipulator light module
  description: Module for the manipulator arm. Provides a powerful light source.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/ThirdArm/module_light.rsi
    state: icon
  - type: Item
    sprite: _CE/Objects/Tools/ThirdArm/module_light.rsi
  - type: PointLight
    enabled: false
    mask: /Textures/_CE/Effects/LightMasks/crystal_cone.png
    autoRot: true
    energy: 9
    radius: 10
    color: "#9cc8e3"
    netsync: false
  - type: CEThirdArmLightModule
  - type: CEThirdArmModule
    passiveDrainRate: 0.15
    iconLayers:
    - sprite: _CE/Objects/Tools/ThirdArm/module_light.rsi
      state: module-icon
    equippedLayers:
    - sprite: _CE/Objects/Tools/ThirdArm/module_light.rsi
      state: equipped-NECK
  - type: StaticPrice
    price: 30
  - type: CEMagicEssenceStructure
    essences:
      Tool: { min: 1, max: 3 }
      Light: { min: 1, max: 3 }

#MARK: Tool Module

- type: entity
  parent: CEThirdArmModuleBase
  id: CEThirdArmModuleManipulation
  categories: [ ForkFiltered ]
  name: manipulator tool module
  description: Module for the manipulator arm. It allows you to build and take apart complex structures.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/ThirdArm/module_manipulation.rsi
    state: icon
  - type: Item
    sprite: _CE/Objects/Tools/ThirdArm/module_manipulation.rsi
  - type: CEThirdArmModule
    iconLayers:
    - sprite: _CE/Objects/Tools/ThirdArm/module_manipulation.rsi
      state: module-icon
    equippedLayers:
    - sprite: _CE/Objects/Tools/ThirdArm/module_manipulation.rsi
      state: equipped-NECK
  - type: CEThirdArmActionModule
    actions:
    - ActionCEThirdArmManipulation
  - type: StaticPrice
    price: 50
  - type: CEMagicEssenceStructure
    essences:
      Tool: { min: 4, max: 6 }

- type: entity
  parent: BaseAction
  id: ActionCEThirdArmManipulation
  name: matter manipulation
  description: Allows you to build and take apart complex structures.
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: Action
    useDelay: 1
    itemIconStyle: BigItem
    raiseOnUser: true
  - type: Sprite
    sprite: _CE/Objects/Tools/ThirdArm/module_manipulation.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    repeat: true
    range: 2
    checkCanAccess: false
  - type: CEThirdArmActionManaCost
    manaCost: 5
  - type: EntityTargetAction
  - type: WorldTargetAction
    event: !type:CEWorldTargetActionAnimationEvent
      animation: ThirdArmManipulationAttack

- type: entityEffectAnimation
  id: ThirdArmManipulationAttack
  movementSpeed: 0.3
  duration: 1.2
  events:
    0:
    - !type:ToolUse
      qualities:
      - CEMatterManipulation
    - !type:SpawnEntity
      spawns:
      - CEOverchargeVFX
    - !type:PlaySound
      sound:
        path: /Audio/Effects/sparks2.ogg
        params:
          pitch: 1.6
    0.2:
    - !type:PlaySound
      sound:
        path: /Audio/Effects/sparks2.ogg
        params:
          pitch: 1.3
    0.4:
    - !type:PlaySound
      sound:
        path: /Audio/Effects/sparks2.ogg
        params:
          pitch: 1.0
    1:
    - !type:SpawnEntity
      spawns:
      - CEOverchargeVFX

#MARK: Mining Module

- type: entity
  parent: CEThirdArmModuleBase
  id: CEThirdArmModuleMining
  categories: [ ForkFiltered, DoNotMap ]
  name: manipulator mining module
  description: Module for the manipulator arm. Equips the arm with a mining laser.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/ThirdArm/module_mining.rsi
    state: icon
  - type: Item
    sprite: _CE/Objects/Tools/ThirdArm/module_mining.rsi
  - type: CEThirdArmModule
    iconLayers:
    - sprite: _CE/Objects/Tools/ThirdArm/module_mining.rsi
      state: module-icon
    equippedLayers:
    - sprite: _CE/Objects/Tools/ThirdArm/module_mining.rsi
      state: equipped-NECK
  - type: CEThirdArmActionModule
    actions:
    - ActionCEThirdArmMiningLaser
  - type: StaticPrice
    price: 60
  - type: CEMagicEssenceStructure
    essences:
      Tool: { min: 1, max: 3 }
      Mining: { min: 1, max: 3 }

- type: entity
  parent: BaseAction
  id: ActionCEThirdArmMiningLaser
  name: mining laser
  description: Fire a series of precise laser beams capable of destroying structures.
  components:
  - type: CEVisualizeConeAction
    width: 10
    range: 15
  - type: Action
    icon:
      sprite: _CE/Effects/Hitscans/mana.rsi
      state: impact_blue
    useDelay: 1
    itemIconStyle: BigAction
    raiseOnUser: true
  - type: TargetAction
    repeat: true
    range: 10
    checkCanAccess: false
  - type: CEThirdArmActionManaCost
    manaCost: 5
  - type: WorldTargetAction
    event: !type:CEWorldTargetActionAnimationEvent
      animation: ManipulatorMiningModuleAttack

- type: entityEffectAnimation
  id: ManipulatorMiningModuleAttack
  movementSpeed: 0.3
  duration: 0.6
  events:
    0:
    - !type:PlaySound
      sound:
        path: /Audio/Effects/sparks1.ogg
        params:
          variation: 0.1
    - !type:Hitscan
      prototype: CEThirdArmMiningHitscan
      angle: -4
    0.1:
    - !type:PlaySound
      sound:
        path: /Audio/Effects/sparks1.ogg
        params:
          variation: 0.1
    - !type:Hitscan
      prototype: CEThirdArmMiningHitscan
      angle: -2
    0.2:
    - !type:PlaySound
      sound:
        path: /Audio/Effects/sparks1.ogg
        params:
          variation: 0.1
    - !type:Hitscan
      prototype: CEThirdArmMiningHitscan
      angle: 0
    0.3:
    - !type:PlaySound
      sound:
        path: /Audio/Effects/sparks1.ogg
        params:
          variation: 0.1
    - !type:Hitscan
      prototype: CEThirdArmMiningHitscan
      angle: 2
    0.5:
    - !type:PlaySound
      sound:
        path: /Audio/Effects/sparks1.ogg
        params:
          variation: 0.1
    - !type:Hitscan
      prototype: CEThirdArmMiningHitscan
      angle: 4

- type: entity
  parent: BasicHitscan
  id: CEThirdArmMiningHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Structural: 20
        Shock: 2
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _CE/Effects/Hitscans/mana_thin.rsi
      state: muzzle_blue
    travelFlash:
      sprite: _CE/Effects/Hitscans/mana_thin.rsi
      state: beam_blue
    impactFlash:
      sprite: _CE/Effects/Hitscans/mana_thin.rsi
      state: impact_blue
  - type: CEHitscanImpactVfx
    vfx: CEOverchargeSmallVFX
