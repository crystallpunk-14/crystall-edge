# Crystal ore: veins and cores shaped by noise over natural walls.

- type: entity
  id: CEWildlandsModifierOreCrystalNoise
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    effects:
    - !type:GenerationLayers
      layers:
      - !type:FillEntityLayer
        entity: CEFloorCrystal
        mask:
        - !type:NoiseMask
          threshold: 0.6
          noise:
            seed: 563
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.05
            octaves: 3
        - !type:NoEntityMask
