- type: entity
  parent: BaseItem
  id: CEHandTeleporterAdmin
  categories: [ ForkFiltered, DoNotMap ]
  name: divine teleporter
  description: Tears the fabric of the world. First use opens a rift, second use links it to a rift at your location, third closes both.
  suffix: Admin
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/admin_teleporter.rsi
    layers:
    - state: icon
    - state: cr
      shader: unshaded
  - type: Item
    sprite: _CE/Objects/Tools/admin_teleporter.rsi
  - type: HandTeleporter
    firstPortalPrototype: CEHandTeleporterAdminRift
    secondPortalPrototype: CEHandTeleporterAdminRift
    allowPortalsOnDifferentGrids: true
    allowPortalsOnDifferentMaps: true

- type: entity
  parent: BasePortal
  id: CEHandTeleporterAdminRift
  name: rift
  description: A tear in the world leading somewhere else.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    sprite: _CE/Structures/Industrial/DimensionalLift/demiplan_rift.rsi
    layers:
    - state: anom
  - type: PointLight
    color: MediumPurple
    radius: 3
    energy: 2
