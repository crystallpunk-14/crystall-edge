  #      !type:DamageTrigger
  #      damage: 300
  #    behaviors:
  #    - !type:DoActsBehavior
  #      acts: ["Breakage"]
  #    - !type:PlaySoundBehavior
  #      sound:
  #        collection: MetalBreak
