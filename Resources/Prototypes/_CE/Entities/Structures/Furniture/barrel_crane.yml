- type: entity
  id: CECraneBarrel
  parent:
  - BaseStructure
  #- CEBaseFlammable
  name: wooden crane barrel
  description: Large lying barrel with tap, for storing valuable liquids.
  suffix: Empty
  categories: [ ForkFiltered ]
  components:
  - type: InteractionOutline
  - type: Appearance
  - type: Solution
    id: barrel
    solution:
      maxVol: 500
  - type: MixableSolution
    solution: barrel
  - type: RefillableSolution
    solution: barrel
  - type: DrawableSolution
    solution: barrel
  - type: DrainableSolution
    solution: barrel
  - type: ExaminableSolution
    solution: barrel
  - type: Edible
    edible: Drink
    destroyOnEmpty: false
    utensil: None
    solution: barrel
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Structures/Furniture/Barrels/crane_barrel.rsi
    layers:
      - state: barrel
  - type: Damageable
    damageModifierSet: CEWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Physics
    bodyType: Static
  - type: Transform
  - type: Anchorable
    delay: 3
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:SpillBehavior
        solution: barrel
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: PhysicalComposition
    materialComposition:
      CEWood: 50

- type: entity
  parent: CECraneBarrel
  id: CECraneBarrelBeer
  suffix: Beer
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Beer
        Quantity: 500

- type: entity
  parent: CECraneBarrel
  id: CECraneBarrelAle
  suffix: Ale
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Ale
        Quantity: 500

- type: entity
  parent: CECraneBarrel
  id: CECraneBarrelWine
  suffix: Wine
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Wine
        Quantity: 500

- type: entity
  parent: CECraneBarrel
  id: CECraneBarrelWhiskey
  suffix: Whiskey
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Whiskey
        Quantity: 500

- type: entity
  parent: CECraneBarrel
  id: CECraneBarrelVodka
  suffix: Vodka
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Vodka
        Quantity: 500

- type: entity
  parent: CECraneBarrel
  id: CECraneBarrelRum
  suffix: Rum
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Rum
        Quantity: 500

# Small crane barrel

- type: entity
  id: CECraneBarrelSmall
  parent:
  - BaseStructureDynamic
  #- CEBaseFlammable
  name: wooden small crane barrel
  description: A small lying barrel with a tap to quickly pour liquid into mugs.
  suffix: Empty
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Appearance
  - type: Solution
    id: barrel
    solution:
      maxVol: 50
  - type: MixableSolution
    solution: barrel
  - type: RefillableSolution
    solution: barrel
  - type: DrawableSolution
    solution: barrel
  - type: DrainableSolution
    solution: barrel
  - type: ExaminableSolution
    solution: barrel
  - type: Edible
    edible: Drink
    destroyOnEmpty: false
    utensil: None
    solution: barrel
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Structures/Furniture/Barrels/crane_barrel_small.rsi
    layers:
      - state: barrel
  - type: Transform
    anchored: true
  - type: Pullable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 200
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: Damageable
    damageModifierSet: CEWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:SpillBehavior
        solution: barrel
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]

