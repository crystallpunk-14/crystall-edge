#Special
- type: entity
  abstract: true
  parent: ClothingBackpack
  id: ClothingBackpackHoldingBase
  components:
  - type: Item
    size: Colossal
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,11,7 # Same with all bags of holding

- type: entity
  parent: ClothingBackpackHoldingBase
  id: ClothingBackpackHolding
  name: backpack of holding
  description: A backpack that opens into a localized pocket of bluespace.
  components:
  - type: Clothing
    equippedPrefix: holding
  - type: Sprite
    sprite: Clothing/Back/Backpacks/holding.rsi
    state: holding
    layers:
    - state: holding
    - state: holding-unlit
      shader: unshaded

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackElectropack
  name: electropack
  suffix: SelfUnremovable
  description: Shocks on the signal. It is used to keep a particularly dangerous criminal under control.
  components:
  - type: Sprite
    sprite: Clothing/Back/Backpacks/electropack.rsi
    state: icon
  - type: Clothing
    stripDelay: 10
    equipDelay: 5 # to avoid accidentally falling into the trap associated with SelfUnremovableClothing
  - type: SelfUnremovableClothing
  - type: ShockOnTrigger
    targetContainer: true
    damage: 5
    duration: 3
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
      - Trigger
