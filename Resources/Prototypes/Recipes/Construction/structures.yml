# region Base
- type: construction
  abstract: true
  id: BaseStructure
  category: construction-category-structures
  placementMode: SnapgridCenter

- type: construction
  abstract: true
  parent: BaseStructure
  id: BaseStructureFullTile
  canRotate: false
  conditions:
  - !type:TileNotBlocked

- type: construction
  abstract: true
  parent: BaseStructure
  id: BaseWindow
  graph: Window
  canBuildInImpassable: true
  canRotate: false
  conditions:
  - !type:EmptyOrWindowValidInTile
  - !type:NoWindowsInTile

# region Walls
- type: construction
  parent: BaseStructureFullTile
  id: Girder
  graph: Girder
  targetNode: girder

- type: construction
  parent: Girder
  id: Wall
  targetNode: wall

# region Airlocks
- type: construction
  parent: BaseStructureFullTile
  id: Airlock
  graph: Airlock
  targetNode: airlock

- type: construction
  parent: Airlock
  id: AirlockGlass
  targetNode: glassAirlock
