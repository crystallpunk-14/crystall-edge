- type: entity
  id: CEBaseThinWindowIron
  abstract: true
  suffix: Iron
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/ThinWindows/iron.rsi
  - type: Icon
    sprite: _CE/Structures/Architecture/ThinWindows/iron.rsi

- type: entity
  parent:
  - CEBaseThinWindowIron
  - CEBaseThinWindow
  id: CEThinWindowIron
  components:
  - type: Sprite
    state: window
  - type: Icon
    state: window
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CEGlassShard:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: CEThinWindowFrameIron
  - type: Construction
    graph: CEThinWindowIron
    node: CEThinWindowIron

- type: entity
  parent:
  - CEBaseThinWindowIron
  - CEBaseThinWindowDoor
  id: CEThinWindowDoorIron
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CEGlassShard:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: CEThinWindowDoorFrameIron
  - type: Construction
    graph: CEThinWindowDoorIron
    node: CEThinWindowDoorIron

# Frames — the bare iron frame stage before glass panels are fitted.
# Reuses states already painted into iron.rsi (frame_window / frame_closed / frame_opened).

- type: entity
  parent: CEBaseThinWindowFrame
  id: CEThinWindowFrameIron
  suffix: Iron
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/ThinWindows/iron.rsi
    state: frame_window
  - type: Icon
    sprite: _CE/Structures/Architecture/ThinWindows/iron.rsi
    state: frame_window
  - type: Damageable
    damageModifierSet: CEMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CEThinWindowIron
    node: CEThinWindowFrameIron

# The hopper/door frame is already an operable flap (matches painted frame_closed/frame_opened
# states) — glazing it later just re-skins it to door_closed/door_opened, it keeps swinging the
# same way throughout construction.
- type: entity
  parent: CEBaseThinWindowDoorFrame
  id: CEThinWindowDoorFrameIron
  suffix: Iron
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/ThinWindows/iron.rsi
    layers:
    - state: frame_closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Icon
    sprite: _CE/Structures/Architecture/ThinWindows/iron.rsi
    state: frame_closed
  - type: Door
    openSpriteState: frame_opened
    closedSpriteState: frame_closed
  - type: Damageable
    damageModifierSet: CEMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CEThinWindowDoorIron
    node: CEThinWindowDoorFrameIron
