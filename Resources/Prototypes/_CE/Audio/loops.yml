- type: ambientLoop
  id: OpenWinds
  sound:
    params:
      volume: -6
    collection: CELoopWinds
  conditions:
    - !type:CEWeatherAffectCondition

- type: ambientLoop
  id: Water
  sound:
    params:
      volume: 18
    collection: CELoopWater
  conditions:
    - !type:NearbyEntitiesCondition
      count: 5
      whitelist:
        tags:
          - CEAmbientWater
      range: 4

- type: ambientLoop
  id: Cave
  sound:
    params:
      volume: 2
    collection: CELoopCave
  conditions:
    - !type:NearbyTilesPercentCondition
      ignoreAnchored: true
      percent: 0.5
      tiles:
      - CEStone
      range: 5

- type: ambientLoop
  id: NightGrass
  sound:
    params:
      volume: 2
    collection: CELoopNightGrass
  conditions:
    - !type:CEIsNightCondition
    - !type:NearbyTilesPercentCondition
      ignoreAnchored: true
      percent: 0.5
      tiles:
      - CEGrass
      - CEGrassLight
      - CEGrassTall
      range: 5

- type: ambientLoop
  id: ForestDay
  sound:
    params:
      volume: 2
    collection: CELoopForestDay
  conditions:
    - !type:CEIsNightCondition
      inverted: true
    - !type:NearbyEntitiesCondition
      count: 3
      whitelist:
        tags:
          - CEAmbientForest

# Sound collections
- type: soundCollection
  id: CELoopWinds
  files:
    - /Audio/_CE/Ambience/Loops/winds.ogg

- type: soundCollection
  id: CELoopWater
  files:
    - /Audio/_CE/Ambience/Loops/water.ogg

- type: soundCollection
  id: CELoopCave
  files:
    - /Audio/_CE/Ambience/Loops/cave.ogg

- type: soundCollection
  id: CELoopNightGrass
  files:
    - /Audio/_CE/Ambience/Loops/ambiforest_night.ogg

- type: soundCollection
  id: CELoopForestDay
  files:
    - /Audio/_CE/Ambience/Loops/ambiforest_day.ogg
