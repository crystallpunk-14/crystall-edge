- type: reagent
  id: CEAlchemyMixture
  name: ce-reagent-name-alchemy-mixture
  group: Medicine
  desc: ce-reagent-desc-alchemy-mixture
  physicalDesc: reagent-physical-desc-opaque
  color: "#7a5a9a"
  pricePerUnit: 0.5
  metabolisms:
    # Only the bloodstream works: a drunk mixture passes the digestion stage with losses and delay, the injected one acts at once
    Bloodstream:
      rate: 0.5 # multiplied by the tuning of the mixture, see CEAlchemyData.Multiplier
      ceEffects:
      - !type:CEAlchemyApply

- type: reagent
  id: CEAlchemySludge
  name: ce-reagent-name-alchemy-sludge
  group: Toxins
  desc: ce-reagent-desc-alchemy-sludge
  flavor: bitter
  physicalDesc: reagent-physical-desc-opaque
  color: "#3d3a2a"
  pricePerUnit: 0

- type: reagent
  id: CESilverNeedle
  name: ce-reagent-name-silver-needle
  group: Elements
  desc: ce-reagent-desc-silver-needle
  physicalDesc: reagent-physical-desc-opaque
  color: "#c7d1d9"
  alchemyEffects:
  - !type:CoordinatePoint
    pos: -0.45, -0.26
    stock: 1.5

- type: reagent
  id: CEStoneHeart
  name: ce-reagent-name-stone-heart
  group: Elements
  desc: ce-reagent-desc-stone-heart
  physicalDesc: reagent-physical-desc-opaque
  color: "#be368a"
  alchemyEffects:
  - !type:Scale
    perUnit: 0.2, 0.2

- type: reagent
  id: CEChromiumSlime
  name: ce-reagent-name-chromium-slime
  group: Elements
  desc: ce-reagent-desc-chromium-slime
  physicalDesc: reagent-physical-desc-opaque
  color: "#3b4872"
  alchemyEffects:
  - !type:Scale # 5 units fully invert the marker through the center of the map
    perUnit: -0.4, -0.4

- type: reagent
  id: CELumishroomSap
  parent: BaseAlcohol
  name: ce-reagent-name-lumishroom-sap
  desc: ce-reagent-desc-lumishroom-sap
  flavor: alcohol
  physicalDesc: reagent-physical-desc-opaque
  color: "#36c98f"
  metabolisms:
    Digestion:
      metabolites:
        Ethanol: 0.6 # the sap ferments: whoever drinks it gets drunk
  alchemyEffects:
  - !type:Rotate
    degreesPerUnit: -3
    maxDegrees: -30
