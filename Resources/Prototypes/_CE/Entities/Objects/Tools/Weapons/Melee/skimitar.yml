- type: entity
  abstract: true
  id: CEBaseWeaponSkimitar
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  - CEBaseWeaponSharp
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
  - type: Tag
    tags:
    - CEWeaponSkimitar
  - type: CEWeapon
    range: 0.6
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Slash: 8
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Slash: 12
    animations:
      Primary:
      - anim: SkimitarAttackLight1
      - anim: SkimitarAttackLight2
      Secondary:
      - anim: SkimitarAttackHeavy1
  - type: CEDualWield
    animationSets:
    - tag: CEWeaponSkimitar
      useType: Secondary
      animations:
      - anim: SkimitarAttackDualWield1
      - anim: SkimitarAttackDualWield2
      - anim: SkimitarAttackDualWield3
  - type: CEWeaponStaminaCost
    costs:
      Primary: 5
      Secondary: 5
  - type: CERotationForAnimation
    rotation: -90
  - type: Clothing
    slots:
    - neck
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Metal: { min: 1, max: 3 }
  - type: StaticPrice
    price: 50

- type: entity
  parent: CEBaseWeaponSkimitar
  id: CEWeaponSkimitarIron
  name: iron skimitar
  description: A curved iron blade, favored for its fast, sweeping strikes.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Skimitar/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 10
      CEIron: 10
