- type: entity
  parent: BaseItem
  id: CEGuardBola
  name: bola
  description: A tactical bola issued to guards, made of steel anchors linked by a strong rope. Reliable and reusable.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Tools/bola.rsi
    state: icon
  - type: EmitSoundOnThrow
    sound: /Audio/Weapons/bolathrow.ogg
  - type: EmitSoundOnLand
    sound: /Audio/Effects/snap.ogg
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    damage:
      types:
        Blunt: 0 # reusable, doesn't break on use
  - type: Ensnaring
    freeTime: 2.5
    breakoutTime: 4.0
    walkSpeed: 0.5
    sprintSpeed: 0.5
    staminaDamage: 0 # anything but this is gamebreaking
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
  - type: LandAtCursor
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.4
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: StaticPrice
    price: 40
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Trap: { min: 1, max: 3 }
