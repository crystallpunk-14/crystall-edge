- type: entity
  id: CEBucket
  parent:
  - BaseItem
  - DrinkBase
  - DrinkVisualsFill
  name: bucket
  description: It's a boring old bucket.
  categories: [ ForkFiltered ]
  components:
  - type: Edible
    utensil: Spoon
  - type: Sprite
    sprite: _CE/Objects/Tools/bucket.rsi
  - type: Item
    size: Normal
  - type: Clothing
    sprite: _CE/Objects/Tools/bucket.rsi
    equipDelay: 0.25
    unequipDelay: 0.25
    quickEquip: false
    equipWhileMoving: true
    slots:
    - HEAD
  - type: Solution
    id: drink
    solution:
      maxVol: 50
  - type: SolutionTransfer
    transferAmount: 50
    maxTransferAmount: 50
    minTransferAmount: 10
  - type: CEWeapon
    range: 0.4
    hitSound:
      path: "/Audio/Effects/Fluids/splat.ogg"
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 0
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 0
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
      Secondary:
      - anim: DaggerAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 20
  - type: SpillWhenWorn
    solution: drink
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    inHandsFillBaseName: null
  - type: Appearance
  - type: ExaminableSolution
    solution: drink
  - type: Tag
    tags:
      - Bucket
  - type: PhysicalComposition
    materialComposition:
      CEWood: 30
  - type: CEMagicEssenceStructure
    essences:
      Tree:
        min: 1
        max: 4
      Void:
        min: 0
        max: 2
