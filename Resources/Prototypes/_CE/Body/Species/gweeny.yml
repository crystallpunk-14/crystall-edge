- type: markingsGroup
  id: CEGweeny
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ CEGweenyBeak ]

# Visual alternative of Carrin: same mechanics, own body sprites
- type: entity
  parent: CEAppearanceCarrin
  id: CEAppearanceGweeny
  categories: [ ForkFiltered, HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - map: [ "wings" ] #Wings
      sprite: _CE/Mobs/Species/Gweeny/parts.rsi
      state: wings
      visible: false
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.HumanoidVisualLayers.Special" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - shader: StencilClear
      sprite: _CE/Mobs/Species/Gweeny/parts.rsi
      state: l_leg
    - shader: StencilMask
      map: [ "enum.HumanoidVisualLayers.StencilMask" ]
      sprite: Mobs/Customization/masking_helpers.rsi
      state: unisex_full
      visible: false
    - map: [ "enum.HumanoidVisualLayers.LFoot" ]
    - map: [ "enum.HumanoidVisualLayers.RFoot" ]
    - map: [ "pants" ]
    - map: [ "shoes" ]
    - map: [ "shirt" ]
    - map: [ "enum.HumanoidVisualLayers.LHand" ]
    - map: [ "enum.HumanoidVisualLayers.RHand" ]
    - map: [ "gloves" ]
    - map: [ "ears" ]
    - map: [ "outerClothing" ]
    - map: [ "cloak" ]
    - map: [ "belt" ]
    - map: [ "belt2" ]
    - map: [ "neck" ]
    - map: [ "back" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    - map: [ "eyes" ] # differen sequence of layers for correct display
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "mask" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ] # Snout under head
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
  - type: Inventory
    templateId: CECarrin # Cant wear shoes, mask and gloves
    speciesId: gweeny
    displacements:
      belt:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Gweeny/displacement.rsi
            state: cloak
      cloak:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Gweeny/displacement.rsi
            state: cloak
      back:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Gweeny/displacement.rsi
            state: cloak
      eyes:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Gweeny/displacement.rsi
            state: eyes
      head:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Gweeny/displacement48.rsi
            state: head
          48:
            sprite: _CE/Mobs/Species/Gweeny/displacement48.rsi
            state: head
      pants:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Gweeny/displacement.rsi
            state: pants
      shirt:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Gweeny/displacement.rsi
            state: shirt
      outerClothing:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Gweeny/displacement.rsi
            state: shirt
      neck:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Gweeny/displacement48.rsi
            state: neck
          48:
            sprite: _CE/Mobs/Species/Gweeny/displacement48.rsi
            state: neck
  - type: Hands
    leftHandDisplacement:
      sizeMaps:
        32:
          sprite: _CE/Mobs/Species/Gweeny/displacement.rsi
          state: hands
    rightHandDisplacement:
      sizeMaps:
        32:
          sprite: _CE/Mobs/Species/Gweeny/displacement.rsi
          state: hands
  - type: InitialBody
    organs:
      Torso: CEOrganGweenyTorso
      Head: CEOrganGweenyHead
      ArmLeft: CEOrganGweenyArmLeft
      ArmRight: CEOrganGweenyArmRight
      HandRight: CEOrganGweenyHandRight
      HandLeft: CEOrganGweenyHandLeft
      LegLeft: CEOrganGweenyLegLeft
      LegRight: CEOrganGweenyLegRight
      FootLeft: CEOrganGweenyFootLeft
      FootRight: CEOrganGweenyFootRight
      Brain: OrganHumanBrain
      Eyes: CEOrganGweenyEyes
      Heart: OrganAnimalHeart
      Lungs: OrganAnimalLungs
      Stomach: OrganAnimalStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganAnimalKidneys
  - type: HumanoidProfile
    species: CEGweeny

- type: entity
  parent:
  - CEAppearanceGweeny
  - CEMobCarrin
  id: CEMobGweeny
  name: Mr. Gweeny
  components:
  - type: Icon
    sprite: _CE/Mobs/Species/Gweeny/parts.rsi
    state: full
  - type: Vocal
    emoteSounds: CEUnisexGweeny
  - type: CEWalkingAnimation
    animation:
      scaleAnimation:
      - time: 0
        scale: 1.02, 0.98
      - time: 0.1
        scale: 0.98, 1.02
      - time: 0.2
        scale: 1.02, 0.98
      offsetAnimation:
      - time: 0
        offset: 0, 0
        easing: QuadOut
      - time: 0.1
        offset: 0, 0.1
      - time: 0.2
        offset: 0, 0
        easing: QuadIn

- type: entity
  parent: OrganBase
  id: CEOrganGweeny
  categories: [ ForkFiltered ]
  abstract: true
  suffix: gweeny

- type: entity
  parent: CEOrganGweeny
  id: CEOrganGweenyExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _CE/Mobs/Species/Gweeny/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _CE/Mobs/Species/Gweeny/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: CEGweeny

- type: entity
  parent: [ CEOrganBaseTorsoSexed, OrganBaseTorso, CEOrganGweenyExternal ]
  id: CEOrganGweenyTorso
  categories: [ HideSpawnMenu ]

- type: entity
