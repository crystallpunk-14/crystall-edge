- type: skill
  id: MagicVision
  name: ce-skill-magic-vision-name
  desc: ce-skill-magic-vision-desc
  icon:
    sprite: _CE/Actions/Spells/magic_vision.rsi
    state: icon
  effect: !type:AddAction
    action: CEActionToggleMagicVision

- type: entity
  parent: BaseAction
  id: CEActionToggleMagicVision
  name: Magical vision
  description: You focus on magical flows, perceiving the hidden world of magic.
  components:
  - type: Action
    useDelay: 3
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: true
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
  - type: Sprite
    sprite: _CE/Actions/Spells/magic_vision.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
    - state: toggled
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:CEToggleStatusEffectsActionEvent
      enabled: CEStatusEffectMagicVision

- type: entity
  parent: StatusEffectBase
  id: CEStatusEffectMagicVision
  name: magical vision
  description: You perceive the hidden world of magic.
  components:
  - type: CEMagicVisionStatusEffect
