# Constant: exactly N walls replaced at random. Ratio: about one in N matching walls replaced.

#MARK: Ore

- type: entity
  id: CEWildlandsModifierOreCoalRatio10
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    effects:
    - !type:ReplaceEntities
      whitelist:
        components:
        - CERockReplacementMarker
      replacement: CEWallStoneOreCoal
      entitiesPerReplacement: 10
      entitiesPerReplacementStdDev: 2

