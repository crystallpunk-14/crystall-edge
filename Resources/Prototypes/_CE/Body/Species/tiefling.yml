- type: markingsGroup
  id: CETiefling
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
      default: [ CEHumanHair_part ]
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      onlyGroupWhitelisted: true
      default: [ CETieflingTail ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      onlyGroupWhitelisted: true
      default: [ CETieflingHorns ]
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false
  appearances:
    enum.HumanoidVisualLayers.Tail:
      matchSkin: true
    enum.HumanoidVisualLayers.HeadTop:
      matchSkin: true

- type: entity
  parent: CEBaseSpeciesAppearance
  id: CEAppearanceTiefling
  categories: [ ForkFiltered, HideSpawnMenu ]
  components:
  - type: Inventory
    templateId: CEHuman
    displacements:
      neck:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: male_neck
          48:
            sprite: _CE/Mobs/Species/Human/displacement48.rsi
            state: male_neck
    femaleDisplacements:
      outerClothing:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_cloak
      cloak:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_cloak
      gloves:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_cloak #Its ok for gloves
      pants:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_pants
      shirt:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_shirt
      neck:
        sizeMaps:
          32:
            sprite: _CE/Mobs/Species/Human/displacement.rsi
            state: female_neck
          48:
            sprite: _CE/Mobs/Species/Human/displacement48.rsi
            state: female_neck
  - type: InitialBody
    organs:
      Torso: CEOrganTieflingTorso
      Head: CEOrganTieflingHead
      ArmLeft: CEOrganTieflingArmLeft
      ArmRight: CEOrganTieflingArmRight
      HandRight: CEOrganTieflingHandRight
      HandLeft: CEOrganTieflingHandLeft
      LegLeft: CEOrganTieflingLegLeft
      LegRight: CEOrganTieflingLegRight
      FootLeft: CEOrganTieflingFootLeft
      FootRight: CEOrganTieflingFootRight
      Brain: OrganHumanBrain
      Eyes: CEOrganTieflingEyes
      Heart: OrganHumanHeart
      Lungs: OrganHumanLungs
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: CETiefling

- type: entity
  parent:
  - CEAppearanceTiefling
  - CEBaseSpeciesMobOrganic
  id: CEMobTiefling
  name: Mr. Tiefling
  components:
  - type: Icon
    sprite: _CE/Mobs/Species/Tiefling/parts.rsi
    state: full
  - type: Wagging
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CEBloodTiefling
        Quantity: 300

- type: entity
  parent: OrganBase
  id: CEOrganTiefling
  categories: [ ForkFiltered ]
  abstract: true
  suffix: tiefling

- type: entity
  parent: CEOrganTiefling
  id: CEOrganTieflingExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _CE/Mobs/Species/Tiefling/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _CE/Mobs/Species/Tiefling/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: CETiefling
  - type: CEMagicEssenceStructure
    essences:
      Taint: { min: 1, max: 2 }
      Life: { min: 0, max: 2 }

- type: entity
  parent: [ CEOrganBaseTorsoSexed, OrganBaseTorso, CEOrganTieflingExternal ]
  id: CEOrganTieflingTorso
  categories: [ HideSpawnMenu ]

- type: entity
  parent: [ CEOrganBaseHeadSexed, OrganBaseHead, CEOrganTieflingExternal ]
  id: CEOrganTieflingHead
