- type: entity
  parent: BaseAction
  id: DndActionDruidBase
  abstract: true
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Staff/wooden.rsi
    layers:
    - state: icon
  - type: TargetAction
    checkCanAccess: true

- type: entity
  parent: DndActionDruidBase
  id: DndActionDruidcraft
  name: Druidcraft
  description: A brief wonder of nature.
  components:
  - type: Action
    useDelay: 6
  - type: TargetAction
    range: 1.5
  - type: EntityTargetAction
    canTargetSelf: true
    event: !type:DndCastSpellEvent
      spell: Druidcraft

- type: entity
  parent: DndActionDruidBase
  id: DndActionElementalism
  name: Elementalism
  description: A gust shoves a creature 5 feet.
  components:
  - type: Action
    useDelay: 6
  - type: TargetAction
    range: 6
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:DndCastSpellEvent
      spell: Elementalism

- type: entity
