# Every zone works by the length of the marker path inside its circle. dangerous: true paints it orange, false green.

# --- Medicine ---

- type: alchemyZone
  id: HealBrute
  name: ce-alchemy-zone-heal-brute
  color: "#d94f4f"
  position: -0.069, -0.485
  radius: 0.168
  gain: 0.9
  effects:
  - !type:Heal
    groups:
      Brute: 10
  - !type:ModifyBleeding
    amount: -2

- type: alchemyZone
  id: HealBurn
  name: ce-alchemy-zone-heal-burn
  color: "#e8913a"
  position: -0.531, 0.418
  radius: 0.14
  gain: 1.0
  effects:
  - !type:Heal
    groups:
      Burn: 10

- type: alchemyZone
  id: RestoreBlood
  name: ce-alchemy-zone-restore-blood
  color: "#9e1b32"
  position: 0.582, -0.546
  radius: 0.112
  gain: 1.6
  effects:
  - !type:ModifyBloodLevel
    amount: 15

