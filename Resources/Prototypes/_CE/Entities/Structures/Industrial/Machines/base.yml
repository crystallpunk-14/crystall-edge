- type: entity
  abstract: true
  id: CEConstructibleMachine
  components:
  - type: Animateable
  - type: Machine
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Construction
    graph: CEMachine
    node: machine
    containers:
    - machine_parts
    - machine_board
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  abstract: true
  id: CEBaseMachineEnergized
  components:
  - type: CEEnergizedInteraction
    effects:
    - !type:PlaySound
      effectTarget: User
      positional: true
      sound:
        collection: sparks
    - !type:SpawnEntity
      spawns:
      - CEOverchargeVFX
    - !type:AreaEffect
      range: 2.5
      whitelist:
        components:
        - MobState
      effects:
      - !type:ConditionalEffectGroup
        conditions:
        - !type:Insulated
          inverted: true
        effects:
        - !type:Damage
          damage:
            types:
              Shock: 10
        - !type:ThrowFrom
          throwPower: 15
          distance: 2
        - !type:Knockdown
          duration: 0.5
          dropItems: false
        - !type:StaminaDamage
          amount: 30

- type: entity
  abstract: true
  parent: BaseMachine
  id: CEBaseMachinePowered
  components:
  - type: ApcPowerReceiver
    powerLoad: 1
  - type: ExtensionCableReceiver
    receptionRange: 0

- type: entity
  abstract: true
  id: CEBaseMachineBigPipeConnectable
  components:
  - type: PlacementReplacement
    key: pipe_big
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      power:
        !type:CableNode
        nodeGroupID: HVPower