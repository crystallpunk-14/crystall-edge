- type: demiplaneLocation
  id: GreenIsland
  name: ce-demiplane-location-green-island
  difficulty:
    min: 0
    max: 2
  generator: !type:LayeredWorldGenerator
    layersByHeight:
      2: # hills - forest in the center, meadow around the rim
      - !type:TileNoiseDistanceLayer # whole island footprint
        size: 136, 136
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEGrassTall
          threshold: 0.6
          noise: &islandNoise
            frequency: 0.030
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 5
            lacunarity: 2
            gain: 0.5
      - !type:TileNoiseDistanceLayer # tighter center, overwrites the rim marker
        size: 135, 135
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: CEStone
          threshold: 0.8
          noise: *islandNoise
      - !type:FillBiomeLayer # rim = meadow. Must run before the forest: it never outputs CEStone, so the forest mask stays clean.
        biome: CEGrassland
        mask:
        - !type:TileMask
          tiles:
          - CEGrassTall
      - !type:FillBiomeLayer # center = forest
        biome: CEGrasslandForest
        seed: 2
        mask:
        - !type:TileMask
          tiles:
          - CEStone
      1: # surface: grassy rim, cave mouth in the center
      - !type:TileNoiseDistanceLayer
        size: 136, 136
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.8
        fill:
        - tile: CEGrassTall
          threshold: 0.7
          noise: *islandNoise
      - !type:TileNoiseDistanceLayer
        size: 135, 135
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.6
          noise: *islandNoise
      - !type:FillBiomeLayer
        biome: CEGrasslandForest
        seed: 1
        mask:
        - !type:TileMask
          tiles:
          - CEGrassTall
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 1
        mask:
        - !type:TileMask
          tiles:
          - CEStone
      0: # caves, narrower — same noise, higher threshold tapers it
      - !type:TileNoiseDistanceLayer
        size: 130, 130
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.7
        fill:
        - tile: CEStone
          threshold: 0.62
          noise: *islandNoise
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 2
        mask:
        - !type:TileMask
          tiles:
          - CEStone
      -1: # caves, narrower — same noise, higher threshold tapers it
      - !type:TileNoiseDistanceLayer
        size: 130, 130
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.63
          noise: *islandNoise
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 3
        mask:
        - !type:TileMask
          tiles:
          - CEStone
      -2: # caves, narrower — same noise, higher threshold tapers it
      - !type:TileNoiseDistanceLayer
        size: 130, 130
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.7
        fill:
        - tile: CEStone
          threshold: 0.65
          noise: *islandNoise
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 4
        mask:
        - !type:TileMask
          tiles:
          - CEStone
    modifierBudget:
      Light: 1
      Ore: 1
  components:
  - type: Parallax
    parallax: CESky
  - type: MapLight
    ambientLightColor: "#75e3ff"
