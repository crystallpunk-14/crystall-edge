- type: entity
  parent: [ClothingHeadBaseButcherable, BaseFoldable]
  id: ClothingHeadHeadHatBaseFlippable
  abstract: true
  components:
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-flip-verb
    foldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped
    foldedHeldPrefix: flipped
  - type: Sprite
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon_flipped
      map: ["foldedLayer"]
      visible: false

- type: entity
  parent: ClothingHeadHeadHatBaseFlippable
  id: ClothingHeadHatCargosoft
  name: cargo cap
  description: A baseball cap colored to match cargo's uniforms.
  components:
  - type: Sprite
    sprite: Clothing/Head/Soft/cargosoft.rsi
  - type: Clothing
    sprite: Clothing/Head/Soft/cargosoft.rsi
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - HamsterWearable
    - WhitelistChameleon

