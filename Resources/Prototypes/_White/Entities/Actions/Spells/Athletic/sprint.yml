- type: entity
  id: WhiteActionSpellSprint
  parent: CEActionSpellBase
  name: Sprint
  description: At the cost of heavy stamina expenditure, you accelerate significantly in movement.
  components:
  - type: CEActionDoAfterSlowdown
    speedMultiplier: 1.3
  - type: CEActionStaminaCost
    stamina: 2.0
  - type: DoAfterArgs
    hidden: true
    repeat: true
    delay: 0.25
  - type: Action
    useDelay: 2
    sound: null
    icon:
      sprite: _White/Actions/Spells/athletic.rsi
      state: sprint
  - type: InstantAction
    event: !type:CEInstantModularEffectEvent
      effects:
      - !type:CESpellSpawnEntityOnTarget
        spawns:
        - CEDustEffect
