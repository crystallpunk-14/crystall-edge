- type: entity
  abstract: true
  parent: BaseObjective
  id: CEBaseAmbitionObjective
  components:
  - type: Objective
    difficulty: 0
    issuer: ce-objective-issuer-ambition
    icon:
      sprite: Structures/Machines/server.rsi
      state: server
  - type: CEAmbitionObjective

- type: entity
  parent: CEBaseAmbitionObjective
  id: CEAmbitionStrongDiet
  components:
  - type: CEAmbitionObjective
    name: ce-ambition-strong-diet-name
    desc: ce-ambition-strong-diet-desc
    parsings:
      REASON: !type:RandomDataset
        dataset: CEAmbitionReason
      FOOD: !type:RandomFood

- type: entity
  parent: CEBaseAmbitionObjective
  id: CEAmbitionFoodConservatism
  components:
  - type: CEAmbitionObjective
    name: ce-ambition-cookism-name
    desc: ce-ambition-cookism-desc
    parsings:
      FOOD: !type:RandomFood

