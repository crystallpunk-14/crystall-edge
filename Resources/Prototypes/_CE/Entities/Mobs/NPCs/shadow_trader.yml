- type: entity
  parent: MarkerBase
  id: CEMobShadowTraderSpawner
  name: shadow trader spawner
  description: Spawns a shadow trader of a random race.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _CE/Mobs/ghost.rsi
      state: base
      color: "#1a1a1acc"
  - type: RandomSpawner
    offset: 0
    prototypes:
    - CEMobShadowTraderCarcat
    - CEMobShadowTraderCarrin
    - CEMobShadowTraderDwarf
    - CEMobShadowTraderElf
    - CEMobShadowTraderGoblin
    - CEMobShadowTraderHuman
    - CEMobShadowTraderSilva
    - CEMobShadowTraderTiefling

- type: entity
  parent:
  - BaseControllable
  - CEMobGOAPBase
  id: CEMobShadowTrader
  abstract: true
  name: shadow trader
  description: A silent shade that keeps the shop shelves stocked.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 185
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Physics
    bodyType: KinematicController
  - type: InputMover
  - type: MobMover
  - type: LagCompensation
  - type: CEZPhysics
  - type: MovementSpeedModifier
    baseSprintSpeed: 1
    baseAcceleration: 5
    baseFriction: 0.5
  - type: RandomHumanoidAppearance
  - type: CEMurkDissolvingStatus
    dissolved: 1
    overlayEnabled: false
    soundEnabled: false
  - type: CEGOAP
    behaviors:
    - ShadowTrader
    - MurkSoulChatter
    - Explorer
  - type: CEGOAPEyesPerceptor
    visionRadius: 8
    memoryDuration: 600
    whitelist:
      components:
      - CEShadowRift
      - CETradeTable
      - NpcFactionMember
      - CEMurkedSoulSpeech
  - type: CEGOAPSteering
    climb: false
    smash: false
    interact: true
  - type: Speech
    speechSounds: Alto
  - type: CEBarkSpeech
    barkSpeech: DarkSoul
  - type: ActiveListener
    range: 12
  - type: CEMurkedSoulSpeech
  - type: CEAnimationController
  - type: CEIdleAnimation
    animation:
      scaleAnimation:
      - time: 0
        scale: 1.01, 0.99
      - time: 2
        scale: 0.99, 1.01
      - time: 4
        scale: 1.01, 0.99
      offsetAnimation:
      - time: 0
        offset: 0, 0
      - time: 2
        offset: 0, 0.01
      - time: 4
        offset: 0, 0
  - type: CEWalkingAnimation
    animation:
      scaleAnimation:
      - time: 0
        scale: 1.02, 0.98
      - time: 1
        scale: 0.98, 1.02
      - time: 2
        scale: 1.02, 0.98
      offsetAnimation:
      - time: 0
        offset: 0, 0
      - time: 1
        offset: 0, 0.02
      - time: 2
        offset: 0, 0
  - type: CESpawnAnimation
    animation: CEAnimationShadowTraderSpawn

- type: entity
  parent:
  - CEAppearanceCarcat
  - CEMobShadowTrader
  id: CEMobShadowTraderCarcat
  categories: [ ForkFiltered, HideSpawnMenu ]

- type: entity
  parent:
  - CEAppearanceCarrin
  - CEMobShadowTrader
  id: CEMobShadowTraderCarrin
  categories: [ ForkFiltered, HideSpawnMenu ]

- type: entity
  parent:
  - CEAppearanceDwarf
  - CEMobShadowTrader
  id: CEMobShadowTraderDwarf
  categories: [ ForkFiltered, HideSpawnMenu ]

- type: entity
  parent:
  - CEAppearanceElf
  - CEMobShadowTrader
  id: CEMobShadowTraderElf
  categories: [ ForkFiltered, HideSpawnMenu ]

- type: entity
  parent:
  - CEAppearanceGoblin
  - CEMobShadowTrader
  id: CEMobShadowTraderGoblin
  categories: [ ForkFiltered, HideSpawnMenu ]

- type: entity
  parent:
  - CEAppearanceHuman
  - CEMobShadowTrader
  id: CEMobShadowTraderHuman
  categories: [ ForkFiltered, HideSpawnMenu ]

- type: entity
  parent:
  - CEAppearanceSilva
  - CEMobShadowTrader
  id: CEMobShadowTraderSilva
  categories: [ ForkFiltered, HideSpawnMenu ]

- type: entity
  parent:
  - CEAppearanceTiefling
  - CEMobShadowTrader
  id: CEMobShadowTraderTiefling
  categories: [ ForkFiltered, HideSpawnMenu ]

- type: entityEffectAnimation
  id: CEAnimationShadowTraderSpawn
  movementSpeed: 0
  duration: 1
  events:
    0:
    - !type:SpawnEntity
      effectTarget: User
      spawns:
      - CELurkerShadowStepEffect
    - !type:UserAnimation
      colorAnimation:
      - time: 0.0
        color: "#ffffff01"
      - time: 0.9
        color: "#ffffff"

- type: entity
  id: CEActionRestockTradeTable
  name: restock
  description: Lays out a new offer on an empty spot of a trade table.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.5
  - type: TargetAction
    range: 2
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - CETradeTable
    event: !type:CEEntityTargetActionAnimationEvent
      animation: CEAnimationRestockTradeTable
  - type: CEActionTargetConditions
    conditions:
    - !type:TradeTableHasFreeSlot

- type: entityEffectAnimation
  id: CEAnimationRestockTradeTable
  movementSpeed: 0
  duration: 0.5
  events:
    0:
    - !type:UserAnimation
      scaleAnimation:
      - time: 0
        scale: 1, 1
      - time: 0.4
        scale: 1.1, 0.9
      - time: 1.2
        scale: 1.1, 0.9
      - time: 1.5
        scale: 1, 1
    0.4:
    - !type:RaiseEvent
      event: !type:CERestockTradeTableEvent
    - !type:SpawnEntity
      spawns:
      - CELurkerShadowStepEffect

- type: entity
  id: CEActionClearTradeTable
  name: clear
  description: Takes an offer back off a trade table.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.5
  - type: TargetAction
    range: 2
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - CETradeTable
    event: !type:CEEntityTargetActionAnimationEvent
      animation: CEAnimationClearTradeTable
  - type: CEActionTargetConditions
    conditions:
    - !type:TradeTableHasOffer

- type: entityEffectAnimation
  id: CEAnimationClearTradeTable
  movementSpeed: 0
  duration: 0.5
  events:
    0:
    - !type:UserAnimation
      scaleAnimation:
      - time: 0
        scale: 1, 1
      - time: 0.4
        scale: 0.9, 1.1
      - time: 1.2
        scale: 0.9, 1.1
      - time: 1.5
        scale: 1, 1
    - !type:PlaySound
      positional: true
      sound:
        path: /Audio/_CE/Effects/coins2.ogg
        params:
          pitch: 0.6
          variation: 0.05
    0.4:
    - !type:RaiseEvent
      event: !type:CEClearTradeTableEvent
