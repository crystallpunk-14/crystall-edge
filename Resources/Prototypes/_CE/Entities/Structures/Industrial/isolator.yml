- type: entity
  id: CEIsolator
  name: insulator loop
  description: Prevents unwanted connections between pipes.
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _CE/Structures/Industrial/isolator.rsi
    state: base
    drawdepth: FloorObjects
  - type: Icon
    sprite: _CE/Structures/Industrial/isolator.rsi
    state: base
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Anchorable
    canAnchorOnOccupied: true
  - type: NodeContainer
    nodes:
      isolatorApc:
        !type:CableTerminalNode
        nodeGroupID: Apc
      isolatorMv:
        !type:CableTerminalNode
        nodeGroupID: MVPower
      isolatorHv:
        !type:CableTerminalNode
        nodeGroupID: HVPower
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CEIsolator
    node: CEIsolator
