- type: skill
  id: DarkSideBanishment
  icon:
    sprite: _CE/Actions/misc.rsi
    state: todo
  effect: !type:AddAction
    action: CEActionDarkSideBanishment

- type: entity
  id: CEActionDarkSideBanishment
  name: Banishment to the dark side
  description: With a touch, you cast a creature out of the material world for a minute. Only those who perceive magic can see it there.
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeAoEZoneAction
    radius: 0.5
  - type: CEActionManaCost
    manaCost: 50
  - type: Action
    useDelay: 300
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
  - type: Sprite
    sprite: _CE/Actions/misc.rsi
    layers:
    - state: todo
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - MobState
    event: !type:CEEntityTargetActionAnimationEvent
      animation: AnimationDarkSideBanishment

- type: skill
  id: DarkSideWalk
  icon:
    sprite: _CE/Actions/misc.rsi
    state: todo
  effect: !type:AddAction
    action: CEActionToggleDarkSideWalk

- type: entity
  id: CEActionToggleDarkSideWalk
  name: Walk on the dark side
  description: Step out of the material world, or return to it, at will.
  components:
  - type: Action
    itemIconStyle: BigAction
    checkCanInteract: false
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
  - type: Sprite
    sprite: _CE/Actions/misc.rsi
    layers:
    - state: todo
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CEToggleStatusEffectsActionEvent
      enabled: CEStatusEffectDarkSide

- type: entityEffectAnimation
  id: AnimationDarkSideBanishment
  movementSpeed: 0.6
  duration: 0.3
  events:
    0.25:
    - !type:ApplyStatusEffect
      effectTarget: Target
      statusEffect: CEStatusEffectDarkSide
      duration: 60

- type: entity
  parent: StatusEffectSlowdown
  id: CEStatusEffectDarkSide
  name: on the dark side
  description: You are outside the material world. Only those who perceive magic can see you.
  components:
  - type: CEVFXStatusEffect
    appliedVfx: CELurkerShadowStepEffect
    removedVfx: CELurkerShadowStepEffect
  - type: MovementModStatusEffect
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: StatusEffectAlert
    alert: CEDarkSide
  - type: CEPacifismStatusEffect
  - type: CEVisibilityLayerStatusEffect
    layers:
    - CEMagicVision
  - type: CEMagicVisionStatusEffect
    showOverlay: false
  - type: CEMurkShadowStatusEffect
  - type: CEDarkSideVisionStatusEffect

- type: alert
  id: CEDarkSide
  icons:
  - sprite: /Textures/_CE/Actions/misc.rsi
    state: todo
  name: ce-alerts-dark-side-name
  description: ce-alerts-dark-side-desc
