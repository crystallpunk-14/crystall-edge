# Base

- type: entity
  parent: [SolutionTiny, FoodInjectableBase]
  id: FoodDonkpocketBase
  abstract: true
  components:
  - type: Edible
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/donkpocket.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - DonkPocket
    - Meat

# Donkpocket

# Warm gives +5 nutriment.
# Warm ones contain a small amount of Omnizine.

- type: entity
  name: donk-pocket
  parent: FoodDonkpocketBase
  id: FoodDonkpocket
  description: The food of choice for the seasoned traitor.
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - meaty
      - cheap
  - type: Sprite
    state: plain

- type: entity
  parent: [SolutionFood, SolutionTiny]
  id: SolutionFoodDonkpocketWarm
  categories: [ HideSpawnMenu ] # Needed for a very specific lighter so can't be abstract
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 12
      - ReagentId: Omnizine
        Quantity: 3

- type: entity
  name: spicy-pocket
  parent: FoodDonkpocketBase
  id: FoodDonkpocketSpicy
  description: The classic snack food, now with a heat-activated spicy flair.
  components:
  - type: FlavorProfile
    flavors:
      - spicy
      - meaty
      - cheap
  - type: Sprite
    state: plain

- type: entity
  name: teriyaki-pocket
  parent: FoodDonkpocketBase
  id: FoodDonkpocketTeriyaki
  description: An East Asian take on the classic stationside snack.
  components:
  - type: FlavorProfile
    flavors:
      - meaty
      - sweet
      - cheap
  - type: Sprite
    state: teriyaki

- type: entity
  name: pizza-pocket
  parent: FoodDonkpocketBase
  id: FoodDonkpocketPizza
  description: Delicious, cheesy and surprisingly filling.
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - cheesy
      - tomato
      - cheap
  - type: Sprite
    state: pizza

- type: entity
  name: honk-pocket
  parent: FoodDonkpocketBase
  id: FoodDonkpocketHonk
  description: The award-winning donk-pocket that won the hearts of clowns and humans alike.
  components:
  - type: FlavorProfile
    flavors:
      - funny
      - cheap
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 8
      - ReagentId: Honk
        Quantity: 2
  - type: Sprite
    state: banana

- type: entity
  name: berry-pocket
  parent: FoodDonkpocketBase
  id: FoodDonkpocketBerry
  description: A relentlessly sweet donk-pocket. Made with 100% artificial flavoring.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - cheap
  - type: Sprite
    state: berry

- type: entity
  name: stonk-pocket
  parent: FoodDonkpocketBase
  id: FoodDonkpocketStonk
  description: Tasty, but a sad reminder of the great crash of '24.
  components:
  - type: FlavorProfile
    flavors:
      - profits
      - cheap
  - type: Sprite
    state: stonk

- type: entity
  name: carp-pocket
  parent: FoodDonkpocketBase
  id: FoodDonkpocketCarp
  description: A long-lost edition of donk pocket, made specifically for hard-working salvagers.
  components:
  - type: FlavorProfile
    flavors:
    - cheap
    - fishops
  - type: Sprite
    state: carp

- type: entity
  name: moth-pocket
  parent: FoodDonkpocketBase
  id: FoodDonkpocketMoth
  description: Buzzy edition of donk-pocket that was created during mass protests ab-... Actually who cares? Just donk-pockets for moths.
  components:
  - type: FlavorProfile
    flavors:
    - cotton
    - cheap
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Fiber
        Quantity: 5
  - type: Sprite
    state: moth
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - ClothMade
    - DonkPocket
