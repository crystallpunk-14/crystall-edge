- type: skill
  id: SoulGaze
  icon:
    sprite: _CE/Actions/misc.rsi
    state: todo
  effect: !type:AddAction
    action: CEActionSoulGaze

- type: entity
  parent: BaseAction
  id: CEActionSoulGaze
  name: Soul gaze
  description: Look into someone's soul and see their true nature. They will feel it.
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEActionRequireLineOfSight
  - type: CEActionTargetRequireMind
  - type: Action
    useDelay: 600
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _CE/Actions/misc.rsi
    layers:
    - state: todo
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 3
    checkCanAccess: false
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MindContainer
    event: !type:CESoulGazeActionEvent
      sound: !type:SoundPathSpecifier
        path: /Audio/_CE/Effects/heartbeat.ogg
        params:
          volume: -6
