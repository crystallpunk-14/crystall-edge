- type: entity
  id: CESaplingBase
  abstract: true
  parent: BaseItem
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: StaticPrice
    price: 15
  - type: CESeed
  - type: CEPlaceable
    delay: 4
    rotatable: false
    placeSound:
      collection: CEDigging
      params:
        variation: 0.03
        volume: 2
    conditions:
    - !type:PlantSoil
    - !type:PlantSpace

- type: entity
  id: CESeedAppleTree
  name: apple tree saplings
  description: Apple tree saplings. Plant them to grow apple trees.
  parent: CESaplingBase
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Food/apple.rsi
    state: seeds
  - type: CEPlaceable
    prototype: CEPlantAppleTree
