# Boneyard: a dragon skeleton, scattered spines and bone remains veins around one self-placed point.

- type: entity
  id: CEWildlandsModifierBoneyard
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    points:
    - id: boneyard
      minDistance: 0
      area: !type:RingArea
        minRadius: 50
        maxRadius: 110
    effects:
    # Big bones first, so the remains veins flow around them instead of taking their tiles.
    - !type:SpawnRooms
      room: DragonSkeleton
      mask:
      - &boneyardArea !type:RadiusMask
        point: boneyard
        radius: 40
        noiseAmplitude: 5
        noise:
          noiseType: OpenSimplex2
          fractalType: FBm
          frequency: 0.1
          octaves: 2
      - !type:WhitelistMask # only walls block the skeleton; trees and other clutter get cleared
        inverted: true
        whitelist:
          components:
          - Wall
    - !type:SpawnEntities
      entity: CEBoneSpine
      count:
        min: 5
        max: 10
      mask:
      - *boneyardArea
      - !type:NoEntityMask
    - !type:GenerationLayers
      layers:
      - !type:FillEntityLayer
        entity: CEBaseBoneRemains
        mask:
        - *boneyardArea
        - !type:NoiseMask
          threshold: 0.4
          noise:
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.08
            octaves: 3
        - !type:NoEntityMask
