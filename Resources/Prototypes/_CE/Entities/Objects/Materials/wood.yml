- type: entity
  id: CEWoodLog
  parent: [BaseItem, BaseSlicingRefinable]
  name: wooden log
  description: A piece of unprocessed wood. Good material for building, or starting a fire.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Materials/wood.rsi
    layers:
      - state: log
        map: ["random"]
  - type: RandomSprite
    available:
      - random:
          log: ""
          log_2: ""
          log_3: ""
  #- type: Tag
  #  tags:
  #  - CEFireplaceFuel
  #  - Wooden
  - type: ToolRefinable
    qualityNeeded: Slicing #TODO: add a dedicated saw tool with Sawing quality and switch to it
    refineResult:
    - id: CEWoodenPlanks1
      amount: 3
  - type: Appearance
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      CEWood: 30

- type: entity
  id: CEWoodenPlanks1
  parent: BaseItem
  name: wooden planks
  description: Treated and ready-to-use wood.
  categories: [ ForkFiltered ]
  suffix: 1
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE/Objects/Materials/wood.rsi
    layers:
      - state: planks
        map: ["base"]
  #- type: Tag
  #  tags:
  #  - CEFireplaceFuel
  #  - Wooden
  - type: Appearance
  - type: Stack
    stackType: CEWood
    count: 1
    baseLayer: base
    layerStates:
    - planks
    - planks_2
    - planks_3
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CEWood: 10
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: FloorTile
    placeTileSound:
      path: /Audio/Items/genhit.ogg
      params:
        variation: 0.03
        volume: 2
    outputs:
      - CEPlanks

- type: entity
  id: CEWoodenPlanks10
  parent: CEWoodenPlanks1
  suffix: 10
  components:
  - type: Stack
    count: 10

- type: entity
  id: CEWoodenPlanks20
  parent: CEWoodenPlanks1
  suffix: 20
  components:
  - type: Stack
    count: 20
