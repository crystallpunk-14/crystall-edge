# Baking

- type: entity
  abstract: true
  parent: FoodBaseTrash
  id: FoodBakingBase
  description: Used in various recipes.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/ingredients.rsi

# TODO Replace all nutriment in dough with something that is less metabolically efficient

- type: entity
  abstract: true
  parent: FoodBakingBase
  id: FoodBakingMixableBase
  description: Mixed into various recipes.
  components:
  - type: SolutionSpiker
    sourceSolution: food
    ignoreEmpty: true
    popup: spike-solution-mix

- type: entity
  abstract: true
  parent: [SolutionNormal, FoodBakingBase]
  id: FoodDoughBase
  components:
  - type: Item
    size: Normal
  - type: FlavorProfile
    flavors:
    - chalky
    - dough
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 60

- type: entity
  abstract: true
  parent: [SolutionVeryTiny, FoodBakingBase]
  id: FoodDoughSliceBase
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
    - chalky
    - dough
  - type: Sprite
    state: dough-slice
  - type: Tag
    tags:
    - Slice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 7.5

- type: entity
  abstract: true
  parent: FoodDoughSliceBase
  id: FoodDoughRopeBase
  components:
  - type: Item
    size: Small
    storedRotation: -45
  - type: Tag
    tags: []

- type: entity
  parent: [FoodDoughBase, BaseSlicingRefinableFood]
  id: FoodDough
  name: dough
  description: A piece of dough.
  components:
  - type: Sprite
    state: dough
  - type: ToolRefinable
    refineResult:
    - id: FoodDoughSlice
      amount: 8
  - type: Construction
    graph: Pizza
    node: start

- type: entity
  parent: FoodDoughSliceBase
  id: FoodDoughSlice
  name: dough slice
  description: A slice of dough. Can be cooked into a bun.
  components:
  - type: Sprite
    state: dough-slice
  - type: Construction
    graph: DoughRope
    node: start

- type: entity
  parent: FoodDoughRopeBase
  id: FoodDoughRope
  name: dough rope
  description: A thin noodle of dough. Can be cooked into a bagel.
  components:
  - type: Sprite
    state: dough-rope
  - type: Construction
    graph: DoughRope
    node: rolled

- type: entity
  parent: [FoodDough, BaseSlicingRefinableFood]
  id: FoodDoughFlat
  name: flat dough
  description: A flattened dough.
  components:
  - type: Item
    shape:
    - 0,0,2,1
  - type: Sprite
    state: dough-flat
  - type: Construction
    graph: Pizza
    node: flat
  - type: ToolRefinable
    refineResult:
    - id: FoodCroissantRaw
      amount: 4

- type: entity
  parent: [SolutionSmall, FoodBakingMixableBase, BaseSlicingRefinableFood]
  id: FoodButter
  name: stick of butter
  description: A stick of delicious, golden, fatty goodness.
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    state: butter
  - type: Slippery
  - type: StepTrigger
    intersectRatio: 0.2
  - type: CollisionWake
    enabled: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.2,0.3,0.2"
        layer:
        - SlipLayer
        hard: false
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.2,0.3,0.2"
        density: 10
        mask:
        - ItemMask
  - type: Solution
    solution:
      reagents:
      - ReagentId: Butter
        Quantity: 30
  - type: ToolRefinable
    refineResult:
    - id: FoodButterSlice
      amount: 12

- type: entity
  parent: [SolutionVeryTiny, FoodBakingMixableBase]
  id: FoodButterSlice
  name: butter slice
  description: A pat of delicious, golden, fatty goodness.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    state: butter-slice
  - type: Solution
    solution:
      maxVol: 5
      reagents:
      - ReagentId: Butter
        Quantity: 2.5
  - type: Tag
    tags:
    - Slice

- type: entity
  name: cheese wheel
  parent: [SolutionNormal, FoodBakingBase, BaseSlicingRefinableFood]
  id: FoodCheese
  description: A big wheel of delicious Cheddar.
  components:
  - type: Item
    size: Normal
  - type: FlavorProfile
    flavors:
      - cheesy
  - type: Sprite
    state: cheesewheel
  - type: ToolRefinable
    refineResult:
    - id: FoodCheeseSlice
      amount: 4
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 60

- type: entity
  parent: [SolutionTiny, FoodBakingBase]
  id: FoodCheeseSlice
  name: cheese wedge
  description: A wedge of delicious Cheddar. The cheese wheel it was cut from can't have gone far.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
  - type: Sprite
    state: cheesewedge
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 15
  - type: Tag
    tags:
    - Slice
  - type: FoodSequenceElement
    entries:
      Taco: CheeseTaco
      Burger: CheeseBurger
  - type: Item
    size: Tiny
    storedOffset: 0,-3
    inhandVisuals:
      left:
      - state: cheesewedge-inhand-left
      right:
      - state: cheesewedge-inhand-right

- type: entity
  name: burned mess
  parent: [SolutionSmall, FoodBakingBase]
  id: FoodBadRecipe
  description: Someone should be demoted from cook for this.
  components:
  - type: FlavorProfile
    flavors:
      - terrible
  - type: Sprite
    state: badrecipe
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: GastroToxin
        Quantity: 15
      - ReagentId: Carbon
        Quantity: 10
  - type: Tag
    tags:
    - Trash

- type: entity
  parent: [SolutionSmall, FoodBakingBase]
  id: FoodCroissantRaw
  name: raw croissant
  description: Buttery, flaky goodness waiting to happen.
  components:
  - type: Item
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: -2,-4
  - type: FlavorProfile
    flavors:
      - dough
  - type: Sprite
    state: croissant-raw
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 15
