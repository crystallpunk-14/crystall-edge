 #MARK: Lurker

- type: entity
  id: CEMobLurker
  parent:
  - CEMobSimple
  - CEMobCombat
  name: lurker
  description: The spirit of hunger and night. The Hunter of Lost Solitaries
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      sprite: _CE/Mobs/lurker.rsi
      state: live
  - type: DamageStateVisuals
    states:
      Alive:
        Base: live
      Dead:
        Base: dead
  - type: ReplacementAccent
    accent: xeno
  - type: Appearance
  - type: Body
  - type: Stamina
    baseCritThreshold: 200
  - type: Grammar
    attributes:
      gender: epicene
  - type: AmbientSound
    range: 5
    sound:
      path: /Audio/_CE/Effects/Lurker/ambient.ogg
  - type: SoundWhileAlive
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 500
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      50: 0.6
  - type: CEWeapon
    range: 0.7
    hitSound:
      collection: AlienClaw
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Slash: 4
            Piercing: 2
            Structural: 5
    animations:
      Primary:
      - anim: ClawBigAttack1
      - anim: ClawBigAttack2
      - anim: ClawBigAttack3
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 6
    acceleration: 16.0
  - type: Climbing
  - type: FloorOcclusion
  - type: GhostTakeoverAvailable
  - type: TypingIndicator
    proto: alien
  - type: NoSlip
  - type: Speech
    speechSounds: CECarcat
  - type: FootstepModifier
    footstepSoundCollection: null # Silent footstep
  - type: Stealth
    enabledOnDeath: false
    maxVisibility: 1.2
  - type: StealthOnMove
    passiveVisibilityRate: -0.15
    movementVisibilityRate: 0.15
  - type: ConditionalSpawner
    prototypes:
    - CELurkerRoarSound
  - type: CEInnateSkills
    skills:
    - SoftLanding
    - NightVision
    - LurkerJump
    - LurkerShadowStep
    - LurkerFear
    descriptorName: ce-innate-skill-source-lurker
    descriptorColor: "#2E3A4E"
  - type: CEMurkSphereChargingBlocker
    name: ce-innate-skill-source-lurker

#MARK: Spawners
- type: entity
  id: CELurkerRoarSound
  name: lurker roar
  categories: [ ForkFiltered ]
  components:
  - type: CEPvsOverride
  - type: CEEntityEffectSpawner
    firstDelay: 0.2
    frequency: 999
    effects:
    - !type:PlaySound
      positional: true
      sound:
        collection: CELurkerRoar
        params:
          variation: 0.2
          maxDistance: 20
          volume: 50
    - !type:PlayFarSound
      sound:
        collection: CELurkerRoar
        params:
          variation: 0.2
      minRange: 15
      maxRange: 60
  - type: TimedDespawn
    lifetime: 2

- type: entity
  id: CESpawnPointGhostMobLurker
  name: spawn point lurker
  description: Spawn point for the lurker ghost role
  categories: [ ForkFiltered ]
  parent: MarkerBase
  components:
  - type: GhostRole
    name: ce-ghost-role-information-lurker-name
    description: ce-ghost-role-information-lurker-description
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: CEMobLurker
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
      - sprite: _CE/Mobs/lurker.rsi
        state: live

