    sprite: _CE/Structures/AnimalHusbandry/feed_trough.rsi
    state: feed_empty
  - type: IconSmooth
    key: ceAnimalFeedTrough
    base: state_
    index: 0
  - type: ItemSlots
    slots:
      feed_0:
        whitelist: { components: [Edible] }
        swap: false
        priority: 0
        insertSound: null
        ejectSound: null
        ejectOnBreak: true
        ejectOnRemove: true
      feed_1:
        whitelist: { components: [Edible] }
        swap: false
        priority: 1
        insertSound: null
        ejectSound: null
        ejectOnBreak: true
        ejectOnRemove: true
      feed_2:
        whitelist: { components: [Edible] }
        swap: false
        priority: 2
        insertSound: null
        ejectSound: null
        ejectOnBreak: true
        ejectOnRemove: true
      feed_3:
        whitelist: { components: [Edible] }
        swap: false
        priority: 3
        insertSound: null
        ejectSound: null
        ejectOnBreak: true
        ejectOnRemove: true
      feed_4:
        whitelist: { components: [Edible] }
        swap: false
        priority: 4
        insertSound: null
        ejectSound: null
        ejectOnBreak: true
        ejectOnRemove: true
      feed_5:
        whitelist: { components: [Edible] }
        swap: false
        priority: 5
        insertSound: null
        ejectSound: null
        ejectOnBreak: true
        ejectOnRemove: true
      feed_6:
        whitelist: { components: [Edible] }
        swap: false
        priority: 6
        insertSound: null
        ejectSound: null
        ejectOnBreak: true
        ejectOnRemove: true
      feed_7:
        whitelist: { components: [Edible] }
        swap: false
        priority: 7
        insertSound: null
        ejectSound: null
        ejectOnBreak: true
        ejectOnRemove: true
  - type: CEOpenContainer
    containers: [feed_0, feed_1, feed_2, feed_3, feed_4, feed_5, feed_6, feed_7]
  - type: CEContainerSlotVisuals
    slots:
      feed_0: { offset: "-0.28125,0.09375", rotation: 350 }
      feed_1: { offset: "-0.09375,0.09375", rotation: 5 }
      feed_2: { offset: "0.09375,0.09375", rotation: 355 }
      feed_3: { offset: "0.28125,0.09375", rotation: 10 }
      feed_4: { offset: "-0.28125,-0.09375", rotation: 8 }
