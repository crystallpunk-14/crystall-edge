- type: secretDepartment
  id: Nightmares
  name: ce-secret-department-nightmares-name
  description: ce-secret-department-nightmares-description
  color: "#922525"
  weight: 0
  membersRecognizeEachOther: true
  roles:
  - Werewolf
  - Murkwalker
  objectives: !type:AllSelector
    children:
    - id: CEObjectiveNightmareSphereCollapse
    - id: CEObjectiveNightmareKillPriests

- type: entity
  id: CEObjectiveNightmareSphereCollapse
  name: Keep the Lucson Sphere from being restored
  description: The lucson sphere has cracked. Keep the city from restoring it until the murk consumes it.
  components:
  - type: Sprite
    sprite: _CE/Structures/LucsonSphere/core.rsi
    state: cracked
  - type: CEObjective
  - type: CEObjectiveMurkSphereCollapseCondition

- type: entity
  id: CEObjectiveNightmareKillPriests
  name: Kill every priest
  description: There are priests of light in this city whose very existence is repugnant to your nature. Find them out and kill them.
  components:
  - type: Sprite
    sprite: _CE/Interface/Skills/target.rsi
    state: target
  - type: CEObjective
  - type: CEObjectiveRoleSurviveCondition
    roles:
    - Priest
    invert: true
