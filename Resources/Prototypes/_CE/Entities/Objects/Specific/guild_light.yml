- type: entity
  id: CEGuildLight
  parent: BaseItem
  categories: [ ForkFiltered ]
  name: guild light
  description: A floating orb of light, kindled on the guild altar at dawn. Dispels the murk, but fades through the day and dies out at sunset.
  components:
  - type: Item
    size: Ginormous
    inhandVisuals: # no inhand sprites, the orb itself floats above the carrier's head
      left:
      - sprite: _CE/Effects/sphere_of_light.rsi
        state: effect
        shader: unshaded
        offset: 0, 0.8
      right:
      - sprite: _CE/Effects/sphere_of_light.rsi
        state: effect
        shader: unshaded
        offset: 0, 0.8
  - type: Sprite
    drawdepth: Effects
    sprite: _CE/Effects/sphere_of_light.rsi
    noRot: true
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    radius: 7.0
    energy: 1
    color: "#efedff"
  - type: CEMagicEssenceStructure
    essences:
      Light: { min: 4, max: 6 }
  - type: CEMurkSource
    intensity: -7
  - type: CEGuildLight
