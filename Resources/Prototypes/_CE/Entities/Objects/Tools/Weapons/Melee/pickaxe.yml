- type: entity
  abstract: true
  id: CEBaseWeaponPickaxe
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  components:
  - type: Item
    size: Ginormous
  - type: CEWeapon
    range: 0.84
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Piercing: 9
            Structural: 24
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Piercing: 9
            Structural: 24
    animations:
      Primary:
      - anim: WarAxeAttackLight
        speed: 0.6
      - anim: WarAxeAttackLight2
        speed: 0.6
      Secondary:
      - anim: WarAxeAttackHeavy1
        speed: 0.6
      - anim: WarAxeAttackHeavy2
        speed: 0.6
  - type: CEWieldedWeapon
    animations:
      Primary:
      - anim: WarAxeAttackLight
      - anim: WarAxeAttackLight2
      Secondary:
      - anim: WarAxeAttackHeavy1
      - anim: WarAxeAttackHeavy2
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 10
  - type: CERotationForAnimation
    rotation: -90
  - type: Wieldable
  - type: Clothing
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1
    slots:
    - neck
  - type: Tool
    qualities:
      - CEPickaxe
    useSound:
      path: /Audio/Effects/picaxe2.ogg
      params:
        variation: 0.03
        volume: 2
  - type: ToolTileCompatible
    delay: 5
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Metal: { min: 1, max: 4 }
      Mining: { min: 1, max: 3 }

- type: entity
  parent: CEBaseWeaponPickaxe
  id: CEWeaponPickaxeIron
  name: iron pickaxe
  description: A sturdy iron pickaxe, perfect for mining and not for combat.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Pickaxe/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 20
      CEIron: 20
