      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
  - type: InitialBody
    organs:
      Torso: CEOrganCarcatTorso
      Head: CEOrganCarcatHead
