# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_meal.yml
# A bunch of different meals. This stuff doesn't come off their plates because
# it's assembled on them. Or they just don't have plates.

# Base

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodMealBase
  description: A delicious meal, cooked with love.
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    sprite: Objects/Consumable/Food/meals.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 40 # Bonus for complete meal

# Meals

- type: entity
  parent: FoodMealBase
  id: FoodMealFries
  name: space fries
  description: AKA, French Fries, Freedom Fries, etc.
  components:
  - type: Item
    storedOffset: 0,-3
  - type: FlavorProfile
    flavors:
      - potatoes
      - salty
  - type: Sprite
    state: fries
# Tastes like fries, salt.

- type: entity
  parent: FoodMealBase
  id: FoodMealMemoryleek
  name: memory leek
  description: This should refresh your memory.
  components:
  - type: Item
    shape:
    - 0,0,0,1
  - type: FlavorProfile
    flavors:
      - memoryleek
  - type: Sprite
    state: memoryLeek
# Tastes like pain.
