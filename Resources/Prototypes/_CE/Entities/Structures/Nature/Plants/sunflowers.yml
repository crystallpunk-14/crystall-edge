- type: entity
  id: CEPlantSunflower
  parent: CEGatherablePlantSingleHarvestBase
  name: sunflower
  description: A tall, sun-loving plant that produces large, bright yellow flowers.
  components:
  - type: CEPlant
    updateFrequency: 1
  - type: CEPlantVisuals
    growthSteps: 2
    readyVariations: 3
  - type: Sprite
    noRot: true
    offset: 0, 0.6
    drawdepth: Mobs
    layers:
    - state: liq-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      sprite: _CE/Structures/Nature/Farm/sunflowers.rsi
      map: ["enum.PlantVisualLayers.Base"]
  #- type: CEPlantGatherable
  #  loot:
  #    All: !type:AllSelector
  #      children:
  #      - id: CE
  #        rolls: !type:RangeNumberSelector
  #          range: 4, 6
  - type: CEWaveShader
    speed: 3
    dis: 4

