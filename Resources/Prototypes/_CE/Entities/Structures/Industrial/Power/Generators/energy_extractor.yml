- type: entity
  id: CEEnergyExtractor
  categories: [ ForkFiltered ]
  parent:
  - CEConstructibleMachine
  - CEBaseMachinePowered
  - BaseMachine
  name: energy extractor
  description: Splits crystals and other unstable items fed into its hopper, dumping the released energy straight into the city grid. Attach a funnel and a conveyor belt to keep it stocked.
  placement:
    mode: SnapgridCenter
  components:
  - type: Machine
    board: CEMachineCoreEnergyExtractor
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    snapCardinals: true
    drawdepth: Mobs
    color: "#5ec8ff"
    sprite: _CE/Structures/Industrial/melting_furnace.rsi
    layers:
    - state: base
    - state: fire
      visible: false
      shader: unshaded
      map: [ "fire" ]
  - type: Icon
    sprite: _CE/Structures/Industrial/melting_furnace.rsi
    state: base
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        fire:
          True: { visible: true }
          False: { visible: false }
  - type: AmbientOnPowered
  - type: LitOnPowered
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 5
    sound:
      path: /Audio/Ambience/Objects/circular_saw.ogg
  - type: PointLight
    radius: 2
    energy: 4
    color: "#5ec8ff"
    enabled: false
  - type: Storage
    grid:
    - 0,0,7,7
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Fixtures
    fixtures:
      collision:
        density: 800
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: true
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      power:
        !type:CableNode
        nodeGroupID: HVPower
  - type: Battery
    # Disable networking so the battery is not dirtied every tick while it feeds the power network.
    netsync: false
    startingCharge: 0
    maxCharge: 5000
  - type: ExaminableBattery
  - type: BatteryDischarger
  - type: PowerNetworkBattery
    maxSupply: 100
    maxChargeRate: 100
    supplyRampTolerance: 50
    supplyRampRate: 10
  - type: CEPowerMonitoringDevice
    group: Generator
    loadNode: input
    sprite: _CE/Structures/Industrial/melting_furnace.rsi
    state: base
  - type: CEEnergyExtracter
