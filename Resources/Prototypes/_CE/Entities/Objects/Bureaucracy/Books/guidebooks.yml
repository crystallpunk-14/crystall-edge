- type: entity
  id: CEGuidebookFarmingGuide
  parent: CEGuidebookBase
  name: farmer's guide
  description: A guide to plant care and maintenance. The author is, of course, Silva.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#3d9cdb"
    - state: decor_frame
      color: "#90ee90"
    - state: bookmark_short
    - state: icon_magic
      color: "#19fe19"
  - type: GuideHelp
    guides:
    - CEFarmingGuideRU
    - CEFarmingGuideEN

- type: entity
  id: CEGuidebookCookingRecipes
  parent: CEGuidebookBase
  name: cookbook
  description: "1000 and 1 recipes - as written on the cover. This is a blatant lie."
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#ff8c00"
    - state: decor_frame
      color: "#ffa500"
    - state: icon_plate
      color: "#ff6347"
    - state: bookmark_short
    - state: icon_plate
    - state: icon_moon
      color: "#ff6347"
  - type: GuideHelp
    guides:
    - CECookingRecipesRU
    - CECookingRecipesEN

- type: entity
  id: CEGuidebookAlchemy
  parent: CEGuidebookBase
  name: young alchemist's guide
  description: A detailed guide on how to turn gold into beer, without losing your mind.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#7a3fb5"
    - state: decor_frame
      color: "#d9b8ff"
    - state: bookmark_short
    - state: icon_thaum
      color: "#7ad9c9"
  - type: GuideHelp
    guides:
    - CEAlchemyGuideRU
    - CEAlchemyGuideEN
