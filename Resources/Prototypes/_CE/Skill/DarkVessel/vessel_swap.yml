- type: skill
  id: VesselSwap
  icon:
    sprite: _CE/Actions/misc.rsi
    state: todo
  effect: !type:AddAction
    action: CEActionDarkVesselSwap

- type: entity
  id: CEActionDarkVesselSwap
  name: Change the vessel
  description: Leave this old body, this old vessel, and move into a new one, taking over all its objectives and abilities. Only works on the corpse of a player who held a secret role.
  categories: [ HideSpawnMenu ]
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeAoEZoneAction
    radius: 0.5
  - type: Action
    useDelay: 180
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _CE/Actions/misc.rsi
    layers:
    - state: todo
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:CEDarkVesselActionEvent
  - type: CEActionTargetConditions
    conditions:
    - !type:Revivable
  - type: CEDarkVesselAction
    keptSkills:
    - Murkwalker