- type: entity
  parent: BaseHandheldInstrument
  id: CEInstrumentFlute
  name: flute
  description: A compact musical wind instrument, popular in villages as well as with large musical troupes.
  categories: [ ForkFiltered ]
  components:
  - type: Instrument
    program: 75
  - type: Sprite
    sprite: _CE/Objects/Tools/Instruments/flute.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _CE/Objects/Tools/Instruments/flute.rsi
  - type: Tag
    tags:
    - WoodwindInstrument
  - type: PhysicalComposition
    materialComposition:
      CEWood: 10
  - type: CEMagicEssenceStructure
    essences:
      Air:
        min: 1
        max: 3
      Order:
        min: 0
        max: 1

- type: entity
  parent: BaseHandheldInstrument
  id: CEInstrumentLyra
  name: lyra
  description: A common stringed instrument throughout Sylate, popular with various bards and musical troupes.
  categories: [ ForkFiltered ]
  components:
  - type: Instrument
    program: 46
  - type: Sprite
    sprite: _CE/Objects/Tools/Instruments/lyra.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _CE/Objects/Tools/Instruments/lyra.rsi
  - type: Clothing
    equipDelay: 0.25
    unequipDelay: 0.25
    sprite: _CE/Objects/Tools/Instruments/lyra.rsi
    quickEquip: false
    equipWhileMoving: true
    slots:
    - belt
  - type: Tag
    tags:
    - StringInstrument
  - type: PhysicalComposition
    materialComposition:
      CEWood: 30
      CECloth: 10
  - type: CEMagicEssenceStructure
    essences:
      Order:
        min: 1
        max: 3
      Tree:
        min: 0
        max: 1

- type: entity
  parent: BaseHandheldInstrument
  id: CEInstrumentLute
  name: lute
  description: A legend among bards.
  categories: [ ForkFiltered ]
  components:
  - type: Instrument
    program: 24
  - type: Sprite
    sprite: _CE/Objects/Tools/Instruments/lute.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _CE/Objects/Tools/Instruments/lute.rsi
  - type: Clothing
    equipDelay: 0.25
    unequipDelay: 0.25
    sprite: _CE/Objects/Tools/Instruments/lute.rsi
    quickEquip: false
    equipWhileMoving: true
    slots:
    - neck
  - type: CEWeapon
    range: 0.7
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 5
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 5
    animations:
      Primary:
      - anim: SwordAttackLight1
      - anim: SwordAttackLight2
      Secondary:
      - anim: SwordAttackHeavy1
      - anim: SwordAttackHeavy2
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 10
  - type: CERotationForAnimation
    rotation: 45
  - type: Tag
    tags:
    - StringInstrument
  - type: PhysicalComposition
    materialComposition:
      CEWood: 40
      CECloth: 5
  - type: CEMagicEssenceStructure
    essences:
      Order:
        min: 1
        max: 3
      Tree:
        min: 0
        max: 1

