- type: entity
  parent: CEBaseAutoCrafter
  id: CEIndustrialPress
  name: industrial press
  description: A heavy powered press that automatically stamps metal into sheets.
  components:
  - type: Machine
    board: CEMachineCoreIndustrialPress
  - type: Sprite
    drawdepth: Mobs
    offset: 0, 0.45
    noRot: true
    sprite: _CE/Structures/Industrial/press.rsi
    layers:
    - state: platform
    - state: pipe
    - state: block
      map: [ "block" ]
  - type: Icon
    sprite: _CE/Structures/Industrial/press.rsi
    state: platform
  - type: CEWorkbench
    vfx: CEPressShockWaveVFX
    recipeTags:
    - CERecipePress
  - type: CEPressVisuals

- type: entity
  parent:
  - CEDustTileEffect
  id: CEPressShockWaveVFX
  categories: [ HideSpawnMenu ]
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_CE/Effects/hard_metal_hit.ogg
      params:
        variation: 0.1
  - type: CEShockWave
    falloffPower: 40
    sharpness: 10
    width: 0.1
    duration: 1
