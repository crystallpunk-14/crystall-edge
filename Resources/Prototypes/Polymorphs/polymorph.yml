- type: polymorph
  id: Mouse
  configuration:
    entity: MobMouse
    forced: true
    duration: 30

- type: polymorph
  id: TreeMorph
  configuration:
    entity: FloraTree
    forced: true
    transferName: true
    revertOnDeath: true
    inventory: Drop
    cooldown: 160

- type: polymorph
  id: ArtifactLizard
  configuration:
    entity: MobLizard
    forced: true
    transferName: true
    inventory: None
    revertOnDeath: true
    revertOnCrit: true
    duration: 20

# Temporary Jaunt
# Don't make permanent jaunts until action system can be reworked to allow do afters and cooldown pausing
- type: polymorph
  id: Jaunt
  configuration:
    entity: EtherealJaunt
    transferName: true
    inventory: None
    forced: true
    revertOnDeath: true
    revertOnCrit: true
    allowRepeatedMorphs: false
    polymorphSound: /Audio/Magic/ethereal_enter.ogg
    exitPolymorphSound: /Audio/Magic/ethereal_exit.ogg
    duration: 3

# Desynchronized / Void Pocket status
- type: polymorph
  id: VoidPocket
  configuration:
    entity: DesynchronizedPocket
    transferName: false
    inventory: None
    forced: false
    revertConfirmationPopup: false
    revertOnDeath: true
    allowRepeatedMorphs: false
    polymorphSound: /Audio/Magic/ethereal_enter.ogg
    exitPolymorphSound: /Audio/Magic/ethereal_exit.ogg
    duration: 120
    effectProto: EffectDesynchronizer
