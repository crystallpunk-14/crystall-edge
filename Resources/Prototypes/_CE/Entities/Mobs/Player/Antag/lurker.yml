- type: entity
  id: CEMobLurker
  parent: CESimpleMobBase
  name: lurker
  description: The spirit of hunger and night. Hunting lonely wanderers lost in the dark forest.
  categories: [ HideSpawnMenu ]
  components:
  - type: NpcFactionMember
    factions:
    - CEMonster
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      sprite: _CE/Mobs/Monster/lurker.rsi
      state: live
  - type: ReplacementAccent
    accent: xeno
  - type: Damageable
    damageContainer: CEBiological
    damageModifierSet: CEDinosaur
  - type: Appearance
  - type: Body
    prototype: Animal
  - type: CombatMode
  - type: Stamina
    baseCritThreshold: 200
  - type: Grammar
    attributes:
      gender: epicene
  - type: Bloodstream
    bloodReagent: CEBloodAnimal
  - type: Tag
    tags:
      - FootstepSound
      - HideContextMenu
      - CEAmbientLurker
  - type: DamageStateVisuals
    states:
      Alive:
        Base: live
      Dead:
        Base: dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 500
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: PassiveDamage # Slight passive regen. Assuming one damage type, comes out to about 2 damage a minute from base.yml.
    allowedStates:
    - Alive
    damageCap: 100
    damage:
      groups:
        Brute: -0.035
        Burn: -0.035
  - type: SlowOnDamage
    speedModifierThresholds:
      50: 0.6
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Piercing: 2
        Structural: 5
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 6
    acceleration: 16.0
  - type: Climbing
  - type: Butcherable
    spawned:
    - id: CEFoodMeatMonster
      amount: 4
    - id: CEClothingMaskBoneHornedMask
      amount: 1
  - type: FloorOcclusion
  - type: GhostTakeoverAvailable
  - type: TypingIndicator
    proto: alien
  - type: NoSlip
  - type: Speech
    speechSounds: CECarcat
  - type: CENightVision
  - type: FootstepModifier
    footstepSoundCollection: null # Silent footstep
  - type: CESkillStorage
    availableSkillTrees:
    - Lurker
    freeLearnedSkills:
    - Fear
    - Kick
    - Step
    skillPoints:
      Lurker:
       max: 0
  - type: Stealth
    enabledOnDeath: false
    maxVisibility: 1.2
  - type: StealthOnMove
    passiveVisibilityRate: -0.55
    movementVisibilityRate: 0.55
  - type: ConditionalSpawner
    prototypes:
    - CELurkerRitualSound

- type: entity
  id: CELurkerRitualSound
  name: lurker ritual far sound
  categories: [ ForkFiltered ]
  components:
  - type: CEPvsOverride
  - type: TriggerOnSpawn
  - type: CEFarSound
    closeSound:
      collection: CELurkerRitual
      params:
        variation: 0.2
        maxDistance: 20
        volume: 50
    farSound:
      collection: CELurkerRitual
      params:
        variation: 0.2
  - type: TimedDespawn
    lifetime: 2

- type: entity
  id: SpawnPointGhostDemiplaneLurker
  name: ghost role spawn point
  description: A ghost role for a lurker
  suffix: Lurker
  categories: [ ForkFiltered ]
  parent: MarkerBase
  components:
  - type: GhostRole
    name: ce-ghost-role-information-name-lurker
    allowMovement: true
    description: ce-ghost-role-information-description-lurker
    rules: ce-ghost-role-information-rules-demiplane
    mindRoles:
    - CEMindRoleDemiplaneAntag
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: CEMobLurker
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
      - sprite: _CE/Mobs/Monster/lurker.rsi
        state: live
