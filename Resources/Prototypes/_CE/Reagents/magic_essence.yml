# Thaumaturgical essence reagents.
# Each reagent mirrors one entry of Content.Shared/_CE/MagicEssence/Prototypes/CEMagicEssenceTypePrototype
# defined in Resources/Prototypes/_CE/MagicEssence/essence_types.yml.

- type: reagent
  id: CEEssenceBase
  abstract: true
  physicalDesc: reagent-physical-desc-enigmatic
  flavor: strange
  group: Thaumaturgy
  metabolisms:
    Digestion:
      effects:
      - !type:Vomit
        probability: 0.25
  pricePerUnit: 0.25

- type: reagent
  id: CEEssenceBaseT1
  parent: CEEssenceBase
  abstract: true
  pricePerUnit: 0.20

- type: reagent
