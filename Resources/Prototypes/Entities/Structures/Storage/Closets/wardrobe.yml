# Base
- type: entity
  id: WardrobeBase
  parent: ClosetSteelBase
  abstract: true
  description: It's a storage unit for standard-issue Nanotrasen attire.

# Colored

# Blue wardrobe
- type: entity
  id: WardrobeBlue
  parent: WardrobeBase
  name: blue wardrobe
  description: "A wardrobe packed with stylish blue clothing."
  components:
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: generic
    stateDoorOpen: generic_open
    stateDoorClosed: blue_door

# Black wardrobe
- type: entity
  id: WardrobeBlack
  parent: WardrobeBase
  name: black wardrobe
  description: "A wardrobe packed with stylish black clothing."
  components:
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: generic
    stateDoorOpen: generic_open
    stateDoorClosed: black_door

# Mixed wardrobe
- type: entity
  id: WardrobeMixed
  parent: WardrobeBase
  name: mixed wardrobe
  description: "A wardrobe packed with a mix of colorful clothing."
  components:
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: generic
    stateDoorOpen: generic_open
    stateDoorClosed: mixed_door

# Jobs

- type: entity
  id: ClosetJanitor
  parent: WardrobeMixed
  name: custodial closet
  description: It's a storage unit for janitorial clothes and gear.

- type: entity
  id: ClosetChef
  parent: WardrobeBlack
  name: chef's closet
  description: It's a storage unit for foodservice garments and mouse traps.

- type: entity
  id: ClosetLegal
  parent: WardrobeBlue
  name: legal closet
  description: It's a storage unit for courtroom apparel and items.
