- type: entity
  id: WhiteActionSpellDash
  parent: CEActionSpellBase
  name: Dash
  description: You make a quick dash to the chosen position to quickly close the distance or dodge danger.
  components:
  - type: CEActionStaminaCost
    stamina: 20
  - type: Action
    sound: null
    useDelay: 5
    icon:
      sprite: _White/Actions/Spells/athletic.rsi
      state: dash
  - type: TargetAction
    checkCanAccess: false
    range: 10 #Thats not dash range, thats interaction clickable zone range
  - type: WorldTargetAction
    event: !type:CEWorldTargetModularEffectEvent
      effects:
      - !type:WhiteSpellDash
        speed: 20
        range: 3.5
