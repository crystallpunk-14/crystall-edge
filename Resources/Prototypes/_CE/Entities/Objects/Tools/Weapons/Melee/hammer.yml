- type: entity
  abstract: true
  id: CEBaseWeaponHammer
  parent:
  - BaseItem
  - CEBaseWeaponThrowable
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
        Structural: 3
  - type: CEWeapon
    range: 0.7
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 5
            Structural: 3
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 5
            Structural: 3
    animations:
      Primary:
      - anim: SwordAttackLight1
      - anim: SwordAttackLight2
      Secondary:
      - anim: SwordAttackHeavy1
      - anim: SwordAttackHeavy2
  - type: CEWeaponStaminaCost
    costs:
      Primary: 5
      Secondary: 5
  - type: CERotationForAnimation
    rotation: -90
  - type: Clothing
    slots:
    - belt
    equipWhileMoving: true
    equipDelay: 0.5
    unequipDelay: 0.5
  - type: Tool
    qualities:
      - CEHammering
    useSound:
      collection: CEHammering
      params:
        variation: 0.03
        volume: 2

- type: entity
  parent: CEBaseWeaponHammer
  id: CEWeaponHammerIron
  name: iron hammer
  description: A standard hammer made of iron.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Hammer/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 10
      CEIron: 10
