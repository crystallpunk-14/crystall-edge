# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionNormal, FoodInjectableBase]
  id: FoodBreadBase
  components:
  - type: Item
    size: Normal
  - type: FlavorProfile
    flavors:
      - bread
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/bread.rsi
  - type: Tag
    tags:
    - Bread
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 80

- type: entity
  parent: [SolutionVeryTiny, FoodBreadBase]
  id: FoodBreadSliceBase
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - bread
  - type: Tag
    tags:
    - Bread
    - Slice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10 # 1/8 of a loaf of bread

# Custom Bread Example

- type: entity
  name: bread
  parent: [FoodBreadBase, BaseSlicingRefinableFood]
  id: FoodBreadPlain
  description: Some plain old earthen bread.
  components:
  - type: Sprite
    layers:
    - state: plain
  - type: ToolRefinable
    refineResult:
    - id: FoodBreadPlainSlice
      amount: 8

- type: entity
  name: bread slice
  parent: FoodBreadSliceBase
  id: FoodBreadPlainSlice
  description: A slice of home.
  components:
  - type: Sprite
    layers:
    - state: plain-slice

- type: entity
  parent: [FoodBreadBase, BaseSlicingRefinableFood]
  id: FoodBreadBaguette
  name: baguette
  description: Bon appétit!
  components:
  - type: Sprite
    state: baguette
  - type: ToolRefinable
    refineResult:
    - id: FoodBreadBaguetteSlice
      amount: 10
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 80
      - ReagentId: Vitamin
        Quantity: 4
      - ReagentId: TableSalt
        Quantity: 1
      - ReagentId: Blackpepper
        Quantity: 1
  - type: Clothing
    slots: [ BELT ]
    equippedPrefix: baguette
    quickEquip: false
  - type: Item
    shape:
    - 0,0,0,3
    storedRotation: -45
    inhandVisuals:
      left:
      - state: baguette-inhand-left
      right:
      - state: baguette-inhand-right
  - type: MeleeWeapon
    wideAnimationRotation: -120
    damage:
      types:
        Blunt: 1 # bonk
# Tastes like France.

- type: entity
  name: crostini
  parent: FoodBreadSliceBase
  id: FoodBreadBaguetteSlice
  description: Bon ap-pétite!
  components:
  - type: Sprite
    state: crostini
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 8
      - ReagentId: Vitamin
        Quantity: 0.4
      - ReagentId: TableSalt
        Quantity: 0.1
      - ReagentId: Blackpepper
        Quantity: 0.1
