# When adding new food also add to the appropriate random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\
# Base

- type: entity
  parent: [SolutionVeryTiny, FoodInjectableBase]
  id: FoodBakedBase
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/misc.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
  - type: Item
    size: Tiny

# Muffins

- type: entity
  name: hotcross bun
  parent: FoodBakedBase
  id: FoodBakedBunHotX
  description: A sticky pastry bun glazed with a distinct white cross.
  components:
  - type: Sprite
    state: bun-hotcross

- type: entity
  parent: [SolutionSmall, FoodBakedBase]
  id: FoodBakedCroissant
  name: croissant
  description: Buttery, flaky goodness.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: -2,-4
  - type: FlavorProfile
    flavors:
      - bread
      - butter
  - type: Sprite
    state: croissant
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 20
      - ReagentId: Butter
        Quantity: 2.5
