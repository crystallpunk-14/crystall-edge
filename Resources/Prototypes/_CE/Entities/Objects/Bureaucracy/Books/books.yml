- type: entity
  id: CEBookTieflingGambit
  parent: CEBookWriteableBase
  name: "Tiefling's Gambit"
  description: Rules for gambling with dice, created by Callista Zyanur.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#911c1c"
      map: [ "cover" ]
    - state: decor_frame
      color: "#e28f08"
      map: [ "decor" ]
    - state: icon_moon
      map: [ "icon" ]
    - state: bookmark_short
      map: [ "overlay" ]
  - type: Paper
    content: ce-book-text-tiefling-gambit
  - type: CEMagicEssenceStructure
    essences:
      Order:
        min: 2
        max: 6
      Chaos:
        min: 1
        max: 3

- type: entity
  id: CEBookPantheonGodsSileita
  parent: CEBookWriteableBase
  name: Pantheon of Gods of Sileita
  description: Description of the gods of our world, Sileita, may they bless our existence forever and ever.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: black
      map: [ "cover" ]
    - state: decor_frame
      color: "#e28f08"
      map: [ "decor" ]
    - state: icon_religion
      map: [ "icon" ]
    - state: bookmark_short
      map: [ "overlay" ]
  - type: Paper
    content: ce-book-text-pantheon-gods-sileita
  - type: CEMagicEssenceStructure
    essences:
      Order:
        min: 2
        max: 6
      Soul:
        min: 0
        max: 2

- type: entity
  id: CEBookPantheonGodsSileitaImitators
  parent: CEBookWriteableBase
  name: Pantheon of Gods of Sileita - Imitators of the Gods
  description: An addition to the main part of the book, which they did not wish to include in the general edition.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: black
      map: [ "cover" ]
    - state: decor_frame
      color: "#e28f08"
      map: [ "decor" ]
    - state: icon_religion
      map: [ "icon" ]
      color: red
    - state: bookmark_short
      map: [ "overlay" ]
  - type: Paper
    content: ce-book-text-pantheon-gods-sileita-imitators
  - type: CEMagicEssenceStructure
    essences:
      Order:
        min: 2
        max: 6
      Soul:
        min: 0
        max: 2
