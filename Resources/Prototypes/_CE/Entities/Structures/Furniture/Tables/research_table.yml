- type: entity
  parent:
  - BaseStructure
  id: CEResearchTable
  name: research table
  description: A table for conducting scientific research.
  categories: [ ForkFiltered ]
  components:
  - type: CEResearchTable
  - type: Sprite
    snapCardinals: true
    sprite: _CE/Structures/Furniture/Tables/workbench.rsi
    state: research_table
  - type: Icon
    sprite: _CE/Structures/Furniture/Tables/workbench.rsi
    state: research_table
  - type: ActivatableUI
    key: enum.CEResearchTableUiKey.Key
    requiresComplex: true
    singleUser: true
  - type: Climbable
  - type: Clickable
  - type: Anchorable
    delay: 2
  - type: Physics
    bodyType: Static
  - type: InteractionOutline
  - type: UserInterface
    interfaces:
      enum.CEResearchTableUiKey.Key:
        type: CEResearchTableBoundUserInterface
  - type: ItemSlots
    slots:
      paper:
        name: ce-research-table-paper-slot-name
        whitelist:
          components:
          - Paper
        ejectOnInteract: false
  - type: ContainerContainer
    containers:
      paper: !type:ContainerSlot
        showEnts: true
        occludes: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask: # tables should collide with other tables
        - TableMask
        layer:
        - TableLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood
  - type: Damageable
    damageModifierSet: CEWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CEWoodenPlanks1:
            min: 1
            max: 2
