- type: entity
  parent: CratePlastic
  id: CrateFunFoamGuns
  name: Foam Force crate
  description: Contains four Foam Force Battle Kits™. It's [REDACTED] or nothing!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: RandomFoamGunTable
          rolls: 4
        - id: GrenadeFoamDart
          amount: 4
