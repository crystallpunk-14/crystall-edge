- type: entity
  id: CEArmchairBase
  abstract: true
  categories: [ ForkFiltered ]
  parent:
  - SeatBase
  name: armchair
  description: A plush armchair, perfect for sinking into after a long day.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    noRot: false
    sprite: _CE/Structures/Furniture/armchair.rsi
    state: frame
  - type: Physics
    bodyType: Static

- type: entity
  id: CEArmchairWoodBase
  abstract: true
  parent: CEArmchairBase
  components:
  - type: Damageable
    damageModifierSet: CEWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CEWoodenPlanks1:
            min: 2
            max: 3

#MARK: Frame

- type: entity
  id: CEArmchairFrame
  name: armchair frame
  description: An armchair's wooden skeleton.
  parent: CEArmchairWoodBase
  components:
  - type: Construction
    graph: CEArmchairFrame
    node: CEArmchairFrame
  - type: CERadialConstruction
    variants:
    - trigger: !type:CERadialToolTrigger
        quality: CEHammering
      availablePrototypes:
      - CEArmchairWood
      - CEArmchairLight
      - CEArmchairDark
  - type: UserInterface
    interfaces:
      enum.CERadialConstructionUiKey.Key:
        type: CERadialConstructionMenuBoundUserInterface

#MARK: Wood

- type: entity
  id: CEArmchairWood
  name: wooden armchair
  parent: CEArmchairWoodBase
  components:
  - type: Sprite
    layers:
    - state: wood
  - type: CERadialConstruction
    variants:
    - trigger: !type:CERadialRequirementTrigger
        requirement: !type:StackResource
          stack: CECloth
          count: 1
      availablePrototypes:
      - CEArmchairWoodPillowBlue
      - CEArmchairWoodPillowGreen
      - CEArmchairWoodPillowOrange
      - CEArmchairWoodPillowPurple
      - CEArmchairWoodPillowRed
      - CEArmchairWoodPillowYellow
  - type: UserInterface
