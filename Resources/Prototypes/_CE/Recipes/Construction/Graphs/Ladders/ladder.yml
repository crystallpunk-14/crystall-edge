# One shared graph for the whole ladder/roof family. Every shape (straight/corner/inner corner)
# starts as the same wooden CEZLevelLadderFrame*, and branches into wood, stone, or a
# red/green/blue tile roof depending on what covering material gets nailed onto it.

- type: constructionGraph
  id: CEZLevelLadder
  start: start
  graph:
    - node: start
      edges:
        - to: CEZLevelLadderFrame
          completed:
            - !type:SnapToGrid
          steps:
            - material: CEWood
              amount: 2
              doAfter: 2

    - node: CEZLevelLadderFrame
      entity: CEZLevelLadderFrame
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CEWoodenPlanks1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 2
        - to: CEZLevelLadderFrameCorner
          steps:
            - tool: Screwing
              doAfter: 1
        - to: CEZLevelLadderWooden
          steps:
            - material: CEWood
              amount: 1
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelLadderStone
          steps:
            - material: CEStone
              amount: 1
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelsLadderRoofRed
          steps:
            - material: CEFloorTileRoofRed
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelsLadderRoofGreen
          steps:
            - material: CEFloorTileRoofGreen
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelsLadderRoofBlue
          steps:
            - material: CEFloorTileRoofBlue
              amount: 2
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1

    - node: CEZLevelLadderFrameCorner
      entity: CEZLevelLadderFrameCorner
      edges:
        - to: CEZLevelLadderFrame
          steps:
            - tool: Screwing
              doAfter: 1
        - to: CEZLevelLadderFrameCornerInner
          steps:
            - tool: Screwing
              doAfter: 1
        - to: CEZLevelLadderWoodenCorner
          steps:
            - material: CEWood
              amount: 1
              doAfter: 1.5
            - material: CENail
              amount: 1
              doAfter: 0.5
            - tool: CEHammering
              doAfter: 1
        - to: CEZLevelLadderStoneCorner
