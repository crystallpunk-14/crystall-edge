- type: entity
  id: CEPowerGridProjector
  parent:
  - CEConstructibleMachine
  - CEBaseMachinePowered
  - BaseMachine
  name: island power grid projector
  description: Projects a three-dimensional rotating model of the island with a detailed layout of all energy devices.
  categories: [ ForkFiltered ]
  components:
  - type: Machine
    board: CEMachineCoreGridProjector
  - type: PlacementReplacement
    key: walls
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    offset: 0, 0.3
    sprite: _CE/Structures/Industrial/map_projector_powernet.rsi
    layers:
    - state: base
    - state: holo
      shader: unshaded
      map: ["holo"]
    - state: island
      shader: unshaded
      map: ["island"]
  - type: Icon
    sprite: _CE/Structures/Industrial/map_projector_powernet.rsi
    state: base
  - type: CEPowerMonitoringConsole
  - type: CEPowerMonitoringCableNetworks
  - type: NodeContainer
    examinable: true
    nodes:
      hv:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: ActivatableUI
    key: enum.CEPowerMonitoringConsoleUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: Clickable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 0.1
  - type: UserInterface
    interfaces:
      enum.CEPowerMonitoringConsoleUiKey.Key:
        type: CEPowerMonitoringConsoleBoundUserInterface
  - type: ExtensionCableReceiver
    receptionRange: 0
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        holo:
          True: {visible: true}
          False: {visible: false}
        island:
          True: {visible: true}
          False: {visible: false}
  - type: AmbientOnPowered
  - type: LitOnPowered
  - type: PointLight
    radius: 2
    energy: 4
    color: "#e7bd61"
    enabled: false
