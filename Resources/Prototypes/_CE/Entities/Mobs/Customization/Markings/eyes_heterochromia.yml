# Heterochromia: recolours a single eye, like upstream TattooEyeRight/TattooEyeLeft.
# Sprites are the species eye sprite split into the right and left eye.

- type: marking
  id: CEEyeRight
  bodyPart: Eyes
  groupWhitelist: [ CEHuman, CEDwarf, CEElf, CEInfernal ]
  coloring:
    default:
      type:
        !type:EyeColoring
          negative: true
  sprites:
  - sprite: _CE/Mobs/Customization/eyes_heterochromia.rsi
    state: human_r

