      Water: { min: 1, max: 2 }
      Greed: { min: 3, max: 5 }
  - type: StaticPrice
    price: 100
  - type: CEShiny
    effect: CEEffectShinyGold

- type: entity
  parent: CEPlushieGoldenBase
