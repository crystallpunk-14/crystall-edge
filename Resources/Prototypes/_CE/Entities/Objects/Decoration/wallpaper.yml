- type: entity
  parent: BaseItem
  id: CEWallpaperItemBase
  name: wallpaper roll
  description: A roll of wallpaper. Glue it to a wall from whichever side you're standing on.
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Item
    size: Small
    storedRotation: -65
  - type: Stack
    count: 10
  - type: Sprite
    sprite: _CE/Structures/Wallpaper/icons.rsi
  - type: StackPrice
    price: 0.5
  - type: CEMagicEssenceStructure
    essences:
      Cloth: { min: 1, max: 1 }
  - type: CEEntityGroupMember
    groups:
      Wallpaper: 1

- type: entity
  parent: CEWallpaperItemBase
  id: CEWallpaperItemPurple
  suffix: Purple
  components:
  - type: Sprite
    state: purple
  - type: Stack
    stackType: CEWallpaperPurple
  - type: CEWallpaper
    proto: Purple

