- type: entity
  id: CEPlantLumishroom
  parent:
  - CEPlantBaseFungalType
  - CEPlantBase
  - CEPlantBaseDarknessEnergy
  - CEPlantBaseSingleHarvest
  - CEPlantBaseGrowingFast
  - CEPlantBaseMetabolizerFast
  - CEPlantBaseMetabolizerWater
  - CEPlantBaseSpreading
  name: lumishroom
  description: A cave mushroom with a softly glowing green cap. It smells of yeast and strong drink.
  components:
  - type: CEPlantVisuals
    growthSteps: 3
    readyVariations: 2
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/lumishroom.rsi
    layers:
    - state: liq-1
      sprite: _CE/Structures/Nature/Farm/watered.rsi
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      map: ["enum.PlantVisualLayers.Base"]
  - type: TileEmission
    color: "#30be81"
  - type: CEPlantAdditionalProduceOnInteract
    produce:
      CEFoodLumishroom: 2
  - type: CEPlantKudzu
    proto: CEPlantLumishroom
  - type: CEPlantDying
    deadEntity: CEPlantLumishroomDead

- type: entity
  parent: CEPlantDeadBase
  id: CEPlantLumishroomDead
  suffix: SPRITE TODO
  name: dead lumishroom
  components:
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/cabbage.rsi
    state: death
    color: green

# Already grown lumishroom for mapping and world generation
- type: entity
  id: CEPlantLumishroomGrown
  parent: CEPlantLumishroom
  suffix: Grown
  components:
  - type: CEPlant
    growthLevel: 1
