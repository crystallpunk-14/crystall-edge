# Donut

# There is a newer, better version of the donutbox from tgstation included in the
# donut.rsi. The reason it isn't implemented is it requires a StackVisuals offsetting
# the layer sprite by a couple pixels everytime a new donut is added. It also requires
# an alpha color which -Y- said he would implement.

- type: entity
  parent: BoxCardboard
  id: FoodBoxPizza
  name: pizza box
  description: A box for pizza. It keeps in the heat, the smell, and the memories of the best five minutes of your life.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pizza.rsi
    drawdepth: SmallObjects
    layers:
    - state: box
      map: ["enum.StorageVisualLayers.Base"]
    - state: box-open
      map: ["enum.StorageVisualLayers.Door"]
  # TODO make these entitystorage again + placeablesurface after entity storage ECS gets merged.
  - type: Storage
    grid:
    - 0,0,3,1
    maxItemSize: Normal
    whitelist:
      components:
      - Utensil
      tags:
      - Pizza
  - type: Item
    sprite: Objects/Consumable/Food/Baked/pizza.rsi
    heldPrefix: box
    shape:
    - 0,0,2,1
    storedOffset: 0,-6
  - type: Appearance
  - type: EntityStorageVisuals
    stateDoorOpen: box-open
    stateDoorClosed: box
  - type: StaticPrice
    price: 0

- type: entity
  parent: FoodBoxPizza
  id: FoodBoxPizzaFilled
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: KnifePlastic
        - !type:GroupSelector
          children:
          - id: FoodPizzaArnold
            weight: 1.5
          - id: FoodPizzaSassysage
            weight: 1.5
          - id: FoodPizzaMargherita
            weight: 1.5
          - id: FoodPizzaMeat
            weight: 1.5
          - id: FoodPizzaMushroom
            weight: 1.5
          - id: FoodPizzaPineapple
            weight: 1.5
          - id: FoodPizzaVegetable
            weight: 1.5
          - id: FoodPizzaDank
          - id: FoodPizzaDonkpocket
          - id: FoodPizzaCotton
          - id: FoodPizzaWorldpeas
            weight: 0.5

- type: entity
  parent: FoodBoxPizza
  id: FoodBoxPizzaCotton
  suffix: Cotton Pizza
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: FoodPizzaCotton
        - id: KnifePlastic

# Nugget

- type: entity
  parent: BoxCardboard
  id: FoodBoxDonkpocket
  name: box of donk-pockets
  description: 'Instructions: Heat in microwave. Product will cool if not eaten within seven minutes.'
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/donkpocket.rsi
    state: box
  - type: Storage
    grid:
    - 0,0,3,2
    whitelist:
      tags:
      - DonkPocket
  - type: Item
    sprite: Objects/Consumable/Food/Baked/donkpocket.rsi
    size: Normal
    shape:
    - 0,0,2,1
    storedOffset: -1,1
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: FoodDonkpocket
          amount: 6
        - id: DonkcoLighter
          prob: 0.10

- type: entity
