- type: skill
  id: LurkerFear
  icon:
    sprite: _CE/Actions/lurker.rsi
    state: fear
  effect: !type:AddAction
    action: CEActionLurkerFear

- type: entity
  id: CEActionLurkerFear
  name: Primal Terror
  description: You plunge the target into primal terror, crippling their ability to fight back.
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeAoEZoneAction
    radius: 0.5
  - type: Action
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
    useDelay: 30
  - type: Sprite
    sprite: _CE/Actions/lurker.rsi
    layers:
    - state: fear
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 5
    checkCanAccess: false
  - type: CEActionRequireLineOfSight
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:CEEntityTargetActionAnimationEvent
      animation: AnimationLurkerFear

- type: entityEffectAnimation
  id: AnimationLurkerFear
  movementSpeed: 0.25
  duration: 1
  events:
    0:
    - !type:SpawnEntity
      effectTarget: User
      spawns:
      - CELurkerFearScreamEffect
    - !type:ModifyStealthVisibility
      effectTarget: User
      amount: 5
    - !type:PlayFarSound
      sound:
        collection: CELurkerRoar
        params:
          variation: 0.2
      minRange: 15
      maxRange: 60
    - !type:PlaySound
      positional: true
      sound:
        path: /Audio/Effects/Screech/changeling_screech_weak.ogg
        params:
          variation: 0.2
          maxDistance: 20
          volume: 50
    - !type:Jitter
      effectTarget: Target
      duration: 15
      amplitude: 10
      frequency: 6
    - !type:ApplyStatusEffect
      effectTarget: Target
      statusEffect: CEStatusEffectLurkerFear
      duration: 15

- type: entity
  id: CEStatusEffectLurkerFear
  parent: StatusEffectSlowdown
  name: primal terror
  categories: [ HideSpawnMenu ]
  components:
  - type: MovementModStatusEffect
    walkSpeedModifier: 0.2
    sprintSpeedModifier: 0.2
  - type: CEPacifismStatusEffect

- type: entity
  id: CELurkerFearScreamEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CE/Effects/lurker_fear_scream.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: effect
      unshaded: true
  - type: TimedDespawn
    lifetime: 2
  - type: Tag
    tags:
      - HideContextMenu
  - type: PointLight
    color: "#697695"
    enabled: true
    radius: 8
    energy: 8
    netsync: false
  - type: LightFade
    duration: 1.5
