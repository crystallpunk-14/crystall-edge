- type: entity
  id: CERope
  parent: BaseItem
  name: rope
  description: Multifunctional rope. You can tie something with it. Or someone.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Small
    storedRotation: 90
  - type: Handcuff
    cuffedRSI: _CE/Objects/Tools/rope.rsi
    bodyIconState: body-overlay
    startCuffSound:
      path: /Audio/Items/Handcuffs/rope_start.ogg
    endCuffSound:
      path: /Audio/Items/Handcuffs/rope_end.ogg
    startUncuffSound:
      path: /Audio/Items/Handcuffs/rope_start.ogg
    endUncuffSound:
      path: /Audio/Items/Handcuffs/rope_breakout.ogg
    startBreakoutSound:
      path: /Audio/Items/Handcuffs/rope_takeoff.ogg
  - type: Sprite
    sprite: _CE/Objects/Tools/rope.rsi
    state: icon
  - type: CEWeapon
    range: 0.4
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 0
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 0
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
      Secondary:
      - anim: DaggerAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 20
  - type: CERotationForAnimation
    rotation: 90
  - type: UseDelay
    delay: 3
  - type: PhysicalComposition
    materialComposition:
      CECloth: 20
  - type: CEMagicEssenceStructure
    essences:
      Cloth:
        min: 1
        max: 3
      Trap:
        min: 0
        max: 2
