- type: entity
  abstract: true
  id: CEBaseWeaponRapier
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  - CEBaseWeaponSharp
  components:
  - type: Item
    size: Large
    shape:
    - 0,0,3,0
  - type: CEWeapon
    range: 0.9
    hitSound:
      path: /Audio/Weapons/bladeslice.ogg
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Piercing: 7
      OnHeavyHit:
      - !type:Damage
        ignoreResistances: true # the lunge slips through gaps in armor
        damage:
          types:
            Piercing: 14
    animations:
      Primary:
      - anim: RapierAttackLight
      Secondary:
      - anim: RapierAttackHeavy
  - type: CEWeaponStaminaCost
    costs:
      Primary: 6
      Secondary: 12
  - type: CERotationForAnimation
    rotation: -90
  - type: Clothing
    slots:
    - belt
    equipWhileMoving: true
    equipDelay: 0.5
    unequipDelay: 0.5

- type: entity
  parent: CEBaseWeaponRapier
  id: CEWeaponRapierIron
  name: rapier
  description: An elegant and finely balanced blade, favored by Zellasian officers for its reach and precision. Its craftsmanship reflects imperial tradition and deadly efficiency.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Rapier/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 10
      CEIron: 10
