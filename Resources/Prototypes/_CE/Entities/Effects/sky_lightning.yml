- type: entity
  id: CESkyLightning
  categories: [ ForkFiltered ]
  name: sky lightning
  save: false
  components:
  - type: Sprite
    sprite: _CE/Effects/sky_lightning.rsi
    drawdepth: Effects
    noRot: true
    offset: 0,2.5
    layers:
    - state: bombom
      shader: unshaded
  - type: TimedDespawn
    lifetime: 2
  - type: Tag
    tags:
    - HideContextMenu
  - type: PointLight
    color: "#73efff"
    enabled: true
    radius: 50
    energy: 8
    netsync: false
  - type: LightFade
    duration: 1
  - type: CEPvsOverride
  - type: CEEntityEffectSpawner
    firstDelay: 0.2
    frequency: 999
    effects:
    - !type:PlaySound
      positional: true
      sound:
        collection: CELightningStrikeClose
        params:
          variation: 0.05
          volume: 32
    - !type:PlayFarSound
      sound:
        collection: CELightningStrikeFar
        params:
          variation: 0.05
      minRange: 15
      maxRange: 60
    - !type:ShockWaveVFX
      sharpness: 10
      width: 0.8
      falloffPower: 40
    - !type:AreaEffect
      range: 1
      effects:
      - !type:Damage
        damage:
          types:
            Shock: 30
