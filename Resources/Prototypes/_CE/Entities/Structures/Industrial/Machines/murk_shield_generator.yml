- type: entity
  parent:
  - CEConstructibleMachine
  - CEBaseMachinePowered
  - CEBaseMachineEnergized
  - BaseMachine
  id: CEMurkShieldGenerator
  categories: [ ForkFiltered ]
  name: murk shield generator
  description: Kindles the murk shield at every dawn, if it has power. Only one shield burns at a time, no matter how many generators there are.
  components:
  - type: Machine
    board: CEMachineCoreMurkShieldGenerator
  - type: LitOnPowered
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.1,0.45,0.45"
        density: 55
        mask: # tables should collide with other tables
        - TableMask
        layer:
        - TableLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.0,0.3,0.35"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false
  - type: Climbable
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    snapCardinals: true
    sprite: _CE/Structures/Industrial/murk_shield_generator.rsi
    layers:
    - state: base
    - sprite: _CE/Structures/Specific/Thaumaturgy/Node/smol_node.rsi
      state: base
      shader: unshaded
      offset: -0.05, 0.4
      map: [ "powered" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        powered:
          True: {visible: true}
          False: {visible: false}
  - type: Icon
    sprite: _CE/Structures/Industrial/murk_shield_generator.rsi
    state: base
  - type: PointLight
    radius: 2
    energy: 2
    color: "#eef2f5"
    enabled: false
  - type: Clickable
  - type: PlaceableSurface
    placeCentered: true
  - type: ApcPowerReceiver
    powerLoad: 3
  - type: Rotatable
  - type: Appearance
  - type: CEMurkShieldGenerator

- type: entity
  id: CEMurkShieldSpawnFailureVFX
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CE/Effects/essence_consume.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: effect
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: Tag
    tags:
      - HideContextMenu
  - type: TimedDespawn
    lifetime: 2
  - type: PointLight
    color: "#eef2f5"
    enabled: true
    radius: 4
    energy: 4
    netsync: false
  - type: LightFade
    duration: 1.5
