- type: entity
  name: space bible
  description: New Interstellar Version 2340.
  parent: BaseStorageItem
  id: Bible
  components:
  - type: UseDelay
    delay: 10.0
  - type: Bible
    damage:
      types:
        Blunt: -5
        Piercing: -5
        Slash: -5
        Heat: -5
        Cold: -5
        Shock: -5
    damageOnFail:
      types:
        Blunt: 5
        Piercing: 5
        Slash: 5
        Asphyxiation: 15
    damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
      types:
        Heat: 10
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    damage:
      types:
        Holy: 25
        Blunt: 1
  - type: Prayable
    bibleUserOnly: true
  - type: Summonable
    summonEntity: SpawnPointGhostRemilia
  - type: ReactionMixer
    mixMessage: "bible-mixing-success"
    reactionTypes:
    - Holy
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Specific/Chapel/bible.rsi
  - type: Clothing
    slots:
    - Belt
  - type: Storage
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Tag
    tags:
    - Book
  - type: StealTarget
    stealGroup: Bible

- type: entity
  parent: BaseAction
  id: ActionBibleSummon
  name: Summon familiar
  description: Summon a familiar that will aid you and gain humanlike intelligence once inhabited by a soul.
  components:
  - type: Action
    useDelay: 1
  - type: Sprite
    sprite: Clothing/Head/Hats/witch.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:SummonActionEvent

- type: entity
  id: HolyLightEffect
  categories: [ HideSpawnMenu ]
  components:
    - type: PointLight
      enabled: true
      radius: 1.5
      energy: 20
      color: lightgoldenrodyellow
      netsync: false
    - type: LightFade
      duration: 0.7
    - type: TimedDespawn
      lifetime: 0.7
