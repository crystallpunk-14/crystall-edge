- type: entity
  id: CEPlantGarlic
  parent:
  - CEPlantBase
  - CEPlantBaseSolarEnergy
  - CEPlantBaseSingleHarvest
  - CEPlantBaseFloralDelicateType
  - CEPlantBaseGrowingMedium
  - CEPlantBaseMetabolizerMedium
  - CEPlantBaseMetabolizerWater
  name: garlic
  description: Only humans figured out how to take a sharp, unpalatable root vegetable and use it as a seasoning wherever possible.
  components:
  - type: CEPlantVisuals
    growthSteps: 4
    readyVariations: 1
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/garlic.rsi
    layers:
    - state: liq-1
      sprite: _CE/Structures/Nature/Farm/watered.rsi
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      map: ["enum.PlantVisualLayers.Base"]
  - type: CEPlantAdditionalProduceOnInteract
    produce:
      CEFoodGarlic: 4
  - type: CEPlantDying
    deadEntity: CEPlantGarlicDead

- type: entity
  parent: CEPlantDeadBase
  id: CEPlantGarlicDead
  suffix: SPRITE TODO
  name: dead garlic
  components:
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/cabbage.rsi
    state: death
    color: red
