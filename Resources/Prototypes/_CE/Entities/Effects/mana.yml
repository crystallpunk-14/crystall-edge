        startValue: 0
        endValue: 5.0
        property: Energy
        isLooped: false
        enabled: true
  - type: TimedDespawn
    lifetime: 2.5
  - type: CEEntityEffectSpawner
    firstDelay: 0.2
    frequency: 999
    effects:
    - !type:PlaySound
      sound:
        path: /Audio/Effects/teleport_arrival.ogg
        params:
          pitch: 0.6
          variation: 0.05
    - !type:AreaEffect
      range: 6
      checkLOS: false
      effects:
      - !type:ChangeMana
        amount: 20
