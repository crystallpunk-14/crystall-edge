- type: entity
  id: CEPlantCarrot
  parent:
  - CEPlantBase
  - CEPlantBaseSolarEnergy
  - CEPlantBaseSingleHarvest
  - CEPlantBaseFloralDelicateType
  - CEPlantBaseGrowingMedium
  - CEPlantBaseMetabolizerMedium
  - CEPlantBaseMetabolizerWater
  name: carrot
  description: In this world, they have not yet learned to use carrots as noses for snowmen.
  components:
  - type: CEPlantVisuals
    growthSteps: 4
    readyVariations: 1
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/carrot.rsi
    layers:
    - state: liq-1
      sprite: _CE/Structures/Nature/Farm/watered.rsi
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      map: ["enum.PlantVisualLayers.Base"]
  - type: CEPlantAdditionalProduceOnInteract
    produce:
      CEFoodCarrot: 3
  - type: CEPlantDying
    deadEntity: CEPlantCarrotDead

- type: entity
  parent: CEPlantDeadBase
  id: CEPlantCarrotDead
  suffix: SPRITE TODO
  name: dead carrot
  components:
  - type: Sprite
    sprite: _CE/Structures/Nature/Farm/cabbage.rsi
    state: death
    color: red
