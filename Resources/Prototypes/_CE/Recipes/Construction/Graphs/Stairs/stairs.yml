          completed:
            - !type:SpawnPrototype
              prototype: CEStoneBlock1
              amount: 2
          steps:
            - tool: CEMatterManipulation
              doAfter: 2

    - node: CEZLevelStairsStoneCorner
      entity: CEZLevelStairsStoneCorner
