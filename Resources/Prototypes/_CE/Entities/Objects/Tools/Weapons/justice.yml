- type: entity
  id: CEGunJustice
  parent:
  - BaseLaserRifle
  name: Justice Revolver
  description: TODO
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/justice.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-3
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _CE/Objects/Tools/Weapons/justice.rsi
    equipDelay: 0.5
    unequipDelay: 0.5
    equipWhileMoving: true
    slots:
    - belt
  - type: MagazineVisuals
    steps: 4
  - type: HitscanBatteryAmmoProvider
    proto: CEJusticeHitscan
    fireCost: 5
  - type: Battery
    maxCharge: 40
    startingCharge: 40
  - type: Gun
    angleIncrease: 5
    angleDecay: 20
    minAngle: 0
    maxAngle: 50
    cameraRecoilScalar: 0.2
    fireRate: 2.5
    resetOnHandSelected: false
    soundGunshot:
      path: /Audio/_CE/Effects/peacekeeper_laser.ogg
      params:
        variation: 0.2

- type: entity
  parent: BasicHitscan
  id: CEJusticeHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 10
  - type: CEHitscanSpellEffect
    effects:
    - !type:CESpellIrradiate
      charge: 5
    - !type:CESpellSpawnEntityOnUser
      spawns:
      - CEOverchargeVFX
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _CE/Objects/Tools/Weapons/justice.rsi
      state: muzzle_blue
    travelFlash:
      sprite: _CE/Objects/Tools/Weapons/justice.rsi
      state: beam_blue
    impactFlash:
      sprite: _CE/Objects/Tools/Weapons/justice.rsi
      state: impact_blue
