- type: entity
  id: CEBaseScienceBookUndefined
  parent: CEBookBase
  name: arcane engineering science book
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#977f92"
      map: [ "cover" ]
    - state: decor_line
      color: "#72a46f"
      map: [ "decor" ]
    - state: bookmark_short
      map: [ "overlay" ]
  - type: CEMagicEssenceStructure
    essences:
      Order: { min: 2, max: 6 }
      Mind: { min: 1, max: 3 }
      Magic: { min: 0, max: 2 }

