- type: entity
  name: ground tobacco
  parent: BaseItem
  id: CEGroundTobacco
  description: Grinded and dried tabac leaves, some like it is a cure.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Nicotine
        Quantity: 10
  - type: Sprite
    sprite: _CE/Objects/Misc/reagent_fillings.rsi
    state: tobacco_small
  - type: Tag
    tags:
      - Smokable
  - type: CEMagicEssenceStructure
    essences:
      Plant:
        min: 1
        max: 3
      Poison:
        min: 0
        max: 2

- type: entity
  name: ground sage
  parent: BaseItem
  id: CEGroundSage
  description: Ground and dried sage root as it turns out is an excellent substitute for tobacco.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: THC
        Quantity: 8
      - ReagentId: Happiness
        Quantity: 2
  - type: Sprite
    sprite: _CE/Objects/Misc/reagent_fillings.rsi
    state: sage_powder
  - type: Tag
    tags:
      - Smokable
  - type: CEMagicEssenceStructure
    essences:
      Plant:
        min: 1
        max: 3
      Life:
        min: 0
        max: 1
