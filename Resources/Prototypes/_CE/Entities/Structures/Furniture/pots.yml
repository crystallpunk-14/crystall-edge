- type: entity
  parent: BaseStructureDynamic
  id: CEPot
  categories: [ ForkFiltered ]
  name: clay pot
  description: A fragile clay pot. Who knows what is hidden inside?
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    offset: 0,0.3
    drawdepth: Mobs
    noRot: true
    sprite: _CE/Structures/Furniture/clay_pot.rsi
    layers:
    - state: pot1
      map: [ "random" ]
  - type: Appearance
  - type: RandomSprite
    available:
    - random:
        pot1: ""
        pot2: ""
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: CEPotBreak
      - !type:CEEntityTableSpawnBehavior
        table: !type:NestedSelector
          tableId: CEPotLoot
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask:
        - SmallMobMask
        layer:
        - MachineLayer
