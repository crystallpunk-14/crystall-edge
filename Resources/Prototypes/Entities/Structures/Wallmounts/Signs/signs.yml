- type: entity
  parent: BaseSign
  id: BaseSignDirectional
  abstract: true
  components:
    - type: Sprite
      snapCardinals: false
      # The way that Directonal Guide Signs are mapped are unaligned on the wall, making them anchored makes them all be placed in the middle of the wall
      # TODO: Combine all the directional guide signs in to some modular prototype so it's easier to map and remove the overlap when rotating the camera
    - type: Transform
      anchored: false

- type: entity
  parent: BaseSignDirectional
  id: SignDirectionalDorms
  name: dorms sign
  description: A direction sign, pointing out which way the Dorms are.
  components:
  - type: Sprite
    state: direction_dorms

- type: entity
  parent: BaseSignDirectional
  id: SignDirectionalSolar
  name: solars sign
  description: A direction sign, pointing out which way solars are.
  components:
  - type: Sprite
    state: direction_solar

- type: entity
  parent: BaseSign
  id: SignBridge
  name: bridge sign
  description: A sign indicating the bridge.
  components:
  - type: Sprite
    state: bridge

- type: entity
  parent: BaseSign
  id: SignExamroom
  name: examination room sign
  description: A sign indicating a medical examination room.
  components:
  - type: Sprite
    state: examroom

- type: entity
  parent: BaseSign
  id: SignHydro1
  name: hydro sign
  description: A sign indicating a hydroponics area.
  components:
  - type: Sprite
    state: hydro
