- type: constructionGraph
  id: CEArmchairFrame
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CEArmchairFrame
          steps:
            - material: CEWood
              amount: 3
            - material: CECloth
              amount: 2
              doAfter: 2

    # Bare wooden skeleton, before a stain/wood type is chosen.
    - node: CEArmchairFrame
      entity: CEArmchairFrame
      edges:
        - to: start
          steps:
            - tool: Prying
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: CEWoodenPlanks1
              amount: 3
            - !type:SpawnPrototype
              prototype: CECloth1
              amount: 2

    # Shared by CEArmchairWood/Light/Dark: same materials regardless of stain color.
    - node: CEArmchairColored
      entity: CEArmchairWood
      edges:
        - to: start
          steps:
            - tool: Prying
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: CEWoodenPlanks1
              amount: 3
            - !type:SpawnPrototype
              prototype: CECloth1
              amount: 1

    # Shared by all 18 Wood/Light/Dark pillow color variants: pillow color doesn't affect refund.
    - node: CEArmchairColoredPillow
      entity: CEArmchairWoodPillowBlue
      edges:
        - to: start
          steps:
            - tool: Prying
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: CEWoodenPlanks1
              amount: 3
            - !type:SpawnPrototype
              prototype: CECloth1
              amount: 1

- type: constructionGraph
  id: CEArmchairMetallic
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CEArmchairMetallic
          steps:
            - material: CEIronSheet
              amount: 2
              doAfter: 3

    - node: CEArmchairMetallic
      entity: CEArmchairMetallic
      edges:
        - to: start
          steps:
            - tool: Prying
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: CEIronSheet1
              amount: 2

    # Shared by all 6 Metallic pillow color variants.
    - node: CEArmchairMetallicPillow
      entity: CEArmchairMetallicPillowBlue
      edges:
        - to: start
          steps:
            - tool: Prying
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: CEIronSheet1
              amount: 2
            - !type:SpawnPrototype
              prototype: CECloth1
              amount: 1