- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialPlastic, SolutionNormal, DrinkBase, DrinkBaseOpenable ]
  id: DrinkBottlePlasticBase
  suffix:
  components:
  - type: Item
    size: Normal
  - type: Openable
    sound:
      collection: bottleOpenSounds
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: Sprite
    sprite: Objects/Consumable/Drinks/generic_jug.rsi # fallback to generic plastic jug
  - type: TrashOnSolutionEmpty
    solution: drink
  - type: Tag
    tags:
    - DrinkBottle # Needed to fit in the soda dispenser, needs a better name

# Empty

- type: entity
  parent: [DrinkVisualsOpenable, SolutionLarge, DrinkBottlePlasticBase]
  id: CustomDrinkJug
  name: beverage jug
  description: A jug for storing custom made drinks.
  components:
  - type: Item
    size: Large
    shape:
    - 0,0,1,3

- type: entity
  abstract: true
  parent: [SolutionSmall, DrinkBottlePlasticBase]
  id: DrinkBottlePlasticSmallBaseFull
  suffix: Full
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Consumable/Drinks/waterbottle.rsi # fallback
  - type: FitsInDispenser
    solution: drink

- type: entity
  parent: [DrinkVisualsAllFilled, DrinkBottlePlasticSmallBaseFull]
  id: DrinkWaterBottleFull
  name: water bottle
  description: Simple clean water of unknown origin. You think that maybe you dont want to know it.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 60
  - type: Sprite
    sprite: Objects/Consumable/Drinks/waterbottle.rsi
  - type: Label
    localizedLabel: reagent-name-water

