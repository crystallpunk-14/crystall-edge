- type: entity
  id: CEMapProjector
  parent:
  - CEConstructibleMachine
  - CEBaseMachinePowered
  - BaseMachine
  name: map projector
  description: Projects a three-dimensional rotating model of the island
  categories: [ ForkFiltered ]
  components:
  - type: Machine
    board: CEMapProjector
  - type: PlacementReplacement
    key: walls
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    offset: 0, 0.3
    sprite: _CE/Structures/Industrial/map_projector.rsi
    layers:
    - state: base
    - state: holo
      shader: unshaded
      map: ["holo"]
    - state: island
      shader: unshaded
      map: ["island"]
  - type: Icon
    sprite: _CE/Structures/Industrial/map_projector.rsi
    state: base
  - type: ActivatableUI
    key: enum.CEMapUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: Clickable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 0.1
  - type: UserInterface
    interfaces:
      enum.CEMapUiKey.Key:
        type: CEMapBoundUserInterface
  - type: ExtensionCableReceiver
    receptionRange: 0
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        holo:
          True: {visible: true}
          False: {visible: false}
        island:
          True: {visible: true}
          False: {visible: false}
  - type: AmbientOnPowered
  - type: LitOnPowered
  - type: PointLight
    radius: 2
    energy: 4
    color: "#1cd0dd"
    enabled: false
