- type: entity
  parent: CEBaseMachinePowered
  id: CERadioBooth
  name: radio booth
  description: A broadcasting console. When switched on, everything said next to it is repeated by loudspeakers on its frequencies.
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _CE/Structures/Industrial/Power/distribution_unit.rsi # TODO: CE sprite
    drawdepth: Mobs
    layers:
    - state: base
    - state: fill-9
      shader: unshaded
      map: ["enum.RadioDeviceVisualLayers.Broadcasting"]
      visible: false
    - state: glass
    - state: top
    - state: discharging1
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.RadioDeviceVisuals.Broadcasting:
        enum.RadioDeviceVisualLayers.Broadcasting:
          True: { visible: true }
          False: { visible: false }
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: ApcPowerReceiver
    powerLoad: 0.2
  - type: CERadioMicrophone
    frequencies:
    - CECommon
    radius: 30
  - type: StaticPrice
    price: 100
