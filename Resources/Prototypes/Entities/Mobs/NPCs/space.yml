- type: entity
  name: basic
  id: MobSpaceBasic
  parent: [ SimpleSpaceMobBase, MobNightVision ]
  abstract: true
  description: It looks friendly. Why don't you give it a hug?
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Animals/bear.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: bear
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: glow
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Dead
  - type: Stamina
    baseCritThreshold: 150
  - type: MovementAlwaysTouching
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Cryoxadone
        Quantity: 300
  - type: CombatMode
  - type: Temperature
  - type: TemperatureDamage
    heatDamageThreshold: 500
    coldDamageThreshold: 0
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Blunt: 5
        Slash: 10
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: Puller
    needsHands: false
  - type: PointLight
    radius: 1.2
    energy: 2
    color: "#4faffb"
  - type: GhostTakeoverAvailable
  - type: Speech
    speechVerb: LargeMob

- type: entity
  name: space cobra
  id: MobCobraSpace
  parent: [MobSpaceBasic, BaseSlicingRefinable, BaseMobDestructible]
  description: Long fangs and a glowing hood, and the alluring look begs to come closer.
  components:
    - type: Sprite
      drawdepth: Mobs
      sprite: Mobs/Animals/spacecobra.rsi
      layers:
        - map: [ "enum.DamageStateVisualLayers.Base" ]
          state: spacecobra
        - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
          state: glow
          shader: unshaded
    - type: FootstepModifier
      footstepSoundCollection:
        collection: FootstepSnake
    - type: MobThresholds
      thresholds:
        0: Alive
        45: Dead
    - type: Stamina
      baseCritThreshold: 150
    - type: DamageStateVisuals
      states:
        Alive:
          Base: spacecobra
          BaseUnshaded: glow
        Dead:
          Base: dead_spacecobra
    - type: ToolRefinable
      refineResult:
      - id: FoodMeatSnake
        amount: 2
      - id: UraniumOre1
        amount: 1
      - id: ClothingShoesSnakeskinBoots
        amount: 1
        prob: 0.3
    - type: Bloodstream
      bloodReferenceSolution:
        reagents:
        - ReagentId: Cryoxadone
          Quantity: 200
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.40
          density: 120
          mask:
          - MobMask
          layer:
          - MobLayer
    - type: MeleeWeapon
      hidden: true
      soundHit:
        path: /Audio/Effects/bite.ogg
      angle: 0
      animation: WeaponArcBite
      damage:
        types:
          Piercing: 6
          Poison: 4
    - type: SolutionManager
      solutions:
      - SolutionVenomCobraSpace
    - type: MeleeChemicalInjector
      solution: melee
      transferAmount: 6
    - type: ReplacementAccent
      accent: xeno
    - type: InteractionPopup
      successChance: 0.2
      interactSuccessString: petting-success-snake
      interactFailureString: petting-failure-generic
    - type: PointLight
      radius: 1.1
      energy: 2.7
      color: "#4faffb"
    - type: Stealth
      enabledOnDeath: false
      maxVisibility: 1.2
    - type: StealthOnMove
      passiveVisibilityRate: -0.25
      movementVisibilityRate: 0.25

- type: entity
  parent: [SolutionWeapon, SolutionTiny]
  id: SolutionVenomCobraSpace
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: NorepinephricAcid
        Quantity: 30

- type: entity
  parent: [SimpleSpaceMobBase, BaseMobAnimal, SolutionVermin, MobNightVision]
  id: MobSnail
  name: snail
  description: Revolting unless you're french.
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: false
    allowMovement: true
    name: ghost-role-information-snail-name
    description: ghost-role-information-snail-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgentHarmless
  - type: GhostTakeoverAvailable
  - type: Emoting
  - type: Sprite
    drawdepth: SmallMobs
    sprite: Mobs/Animals/snail.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: snail
  - type: Item
    size: Tiny
  - type: NpcFactionMember
    factions:
      - Mouse
  - type: HTN
    constantlyReplan: false
    rootTask:
      task: MouseCompound
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: Deathgasp
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: MobThresholds
    thresholds:
      0: Alive
      10: Critical
      20: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 40
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: MovementSpeedModifier
    baseWalkSpeed : 2
    baseSprintSpeed : 3
  - type: NameIdentifier
    group: AdjectivePrefix
  - type: DamageStateVisuals
    states:
      Alive:
        Base: snail
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Edible
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 8
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Water
        Quantity: 4 #It makes saline if you add salt!
  - type: Satiation
    satiations:
      Hunger:
        prototype: SnailHunger
      Thirst:
        prototype: MouseThirst
  - type: Extractable
    grindableSolutionName: food
  - type: Tag
    tags:
    - Trash
    - VimPilot
    - ChefPilot
    - Meat
  - type: CombatMode
    combatToggleAction: ActionCombatModeToggleOff
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Cryoxadone
        Quantity: 30
  - type: CanEscapeInventory
  - type: MobPrice
    price: 50
  - type: BadFood
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Mouse_burning
  - type: Temperature
  - type: TemperatureDamage
    heatDamageThreshold: 500
    coldDamageThreshold: 0
  - type: Reactive
    reactions:
    - reagents: [TableSalt, Saline]
      methods: [Touch, Ingestion, Injection]
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 1
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "snail-hurt-by-salt-popup" ]
        probability: 0.66

- type: entity
  parent: MobSnail
  id: MobSnailInstantDeath
  suffix: Smite
  components:
  - type: GhostRole
    mindRoles:
    - MindRoleGhostRoleFreeAgent
  - type: MobStateActions
    actions:
      Alive:
      - ActionSmiteNoReq
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: Godmode
  - type: MovementAlwaysTouching

- type: entity
  parent: MobSnail
  id: MobSnailSpeed
  suffix: Speed
  components:
  - type: GhostRole
    name: ghost-role-information-snailspeed-name
    description: ghost-role-information-snailspeed-description
    rules: ghost-role-information-freeagent-rules
  - type: Sprite
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: spacesnail
  - type: DamageStateVisuals
    states:
      Alive:
        Base: spacesnail
      Critical:
        Base: spacedead
      Dead:
        Base: spacedead
  - type: MovementSpeedModifier
    baseWalkSpeed : 5 #he go fast, also they cant slip so its probably fine.
    baseSprintSpeed : 7
#  - type: ActiveJetpack # I think this will need a custom component to not make tests angry.
  - type: MovementAlwaysTouching

- type: entity
  parent: [ BaseMobMothroach, MobSnail ]
  id: MobSnailMoth
  name: snoth
  components:
  - type: GhostRole
    name: ghost-role-information-snoth-name
    description: ghost-role-information-snoth-description
    rules: ghost-role-information-freeagent-rules
  - type: Sprite
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: snoth
  - type: DamageStateVisuals
    states:
      Alive:
        Base: snoth
      Critical:
        Base: snothdead
      Dead:
        Base: snothdead
