- type: demiplaneLocation
  id: SnowIsland
  name: ce-demiplane-location-snow-island
  difficulty:
    min: 0
    max: 2
  components:
  - type: Parallax
    parallax: CESky
  - type: MapLight
    ambientLightColor: "#75e3ff"
  generator: !type:LayeredWorldGenerator
    modifierBudget:
      Light: 1
      Ore: 1
    layersByHeight:
    #MARK: 2 Hills top
      2:
      - !type:TileNoiseDistanceLayer # whole island footprint
        size: 136, 136
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CESnow
          threshold: 0.6
          noise: &snowIslandNoise
            frequency: 0.030
            noiseType: OpenSimplex2
            fractalType: FBm
            octaves: 5
            lacunarity: 2
            gain: 0.5
      - !type:TileNoiseDistanceLayer # tighter center, overwrites the rim marker
        size: 135, 135
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.5
        fill:
        - tile: CEStone
          threshold: 0.8
          noise: *snowIslandNoise
      - !type:FillBiomeLayer # rim = meadow. Must run before the forest: it never outputs CEStone, so the forest mask stays clean.
        biome: CESnowland
        mask:
        - !type:TileMask
          tiles:
          - CESnow
      - !type:FillBiomeLayer # center = forest
        biome: CESnowlandForest
        seed: 2
        mask:
        - !type:TileMask
          tiles:
          - CEStone
    #MARK: 1 Surface
      1:
      - !type:TileNoiseDistanceLayer
        size: 136, 136
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.8
        fill:
        - tile: CESnow
          threshold: 0.7
          noise: *snowIslandNoise
      - !type:TileNoiseDistanceLayer
        size: 135, 135
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.6
          noise: *snowIslandNoise
      - !type:FillBiomeLayer
        biome: CESnowlandForest
        seed: 1
        mask:
        - !type:TileMask
          tiles:
          - CESnow
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 1
        mask:
        - !type:TileMask
          tiles:
          - CEStone
    #MARK: 0 Caves
      0:
      - !type:TileNoiseDistanceLayer
        size: 130, 130
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.7
        fill:
        - tile: CEStone
          threshold: 0.62
          noise: *snowIslandNoise
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 2
        mask:
        - !type:TileMask
          tiles:
          - CEStone
    #MARK: -1 Caves
      -1:
      - !type:TileNoiseDistanceLayer
        size: 130, 130
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.6
        fill:
        - tile: CEStone
          threshold: 0.63
          noise: *snowIslandNoise
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 3
        mask:
        - !type:TileMask
          tiles:
          - CEStone
    #MARK: -2 Caves
      -2:
      - !type:TileNoiseDistanceLayer
        size: 130, 130
        distanceConfig: !type:EuclideanSquaredDistance
          blendWeight: 0.7
        fill:
        - tile: CEStone
          threshold: 0.65
          noise: *snowIslandNoise
      - !type:FillBiomeLayer
        biome: CECavesGeneric
        seed: 4
        mask:
        - !type:TileMask
          tiles:
          - CEStone
