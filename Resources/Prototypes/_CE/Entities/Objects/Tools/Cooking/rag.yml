- type: entity
  parent: BaseItem
  id: CERag
  name: damp rag
  description: For cleaning up messes, you suppose.
  categories: [ ForkFiltered ]
  components:
  - type: Solution
    id: absorbed
    solution:
      maxVol: 30
  - type: Sprite
    sprite: _CE/Objects/Tools/rag.rsi
    layers:
    - state: icon
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-3
      visible: false
  - type: Item
    size: Small
  - type: Appearance
  - type: SolutionContainerVisuals
    solutionName: absorbed
    maxFillLevels: 3
    fillBaseName: fill-
  - type: Spillable
    solution: absorbed
    spillWhenThrown: false
  - type: DrainableSolution
    solution: absorbed
  - type: Absorbent
    pickupAmount: 15
    useAbsorberSolution: true
  - type: UseDelay
    delay: 1.5
  - type: Tag
    tags:
    - Mop
  - type: Fiber
    fiberColor: fibers-white
  - type: DnaSubstanceTrace
  - type: PhysicalComposition
    materialComposition:
      CECloth: 10
