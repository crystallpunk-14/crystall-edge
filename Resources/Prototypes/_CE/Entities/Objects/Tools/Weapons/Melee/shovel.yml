- type: entity
  abstract: true
  id: CEBaseWeaponShovel
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  components:
  - type: Item
    size: Ginormous
  - type: CEWeapon
    range: 0.84
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Slash: 8
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Slash: 8
    animations:
      Primary:
      - anim: WarAxeAttackLight
        speed: 0.6
      - anim: WarAxeAttackLight2
        speed: 0.6
      Secondary:
      - anim: WarAxeAttackHeavy1
        speed: 0.6
      - anim: WarAxeAttackHeavy2
        speed: 0.6
  - type: CEWieldedWeapon
    animations:
      Primary:
      - anim: WarAxeAttackLight
      - anim: WarAxeAttackLight2
      Secondary:
      - anim: WarAxeAttackHeavy1
      - anim: WarAxeAttackHeavy2
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 10
  - type: CERotationForAnimation
    rotation: -90
  - type: Wieldable
  - type: Clothing
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1
    slots:
    - neck
  - type: Shovel
  - type: ToolTileCompatible
  - type: Tool
    qualities:
      - CEShovel
    useSound:
      collection: CEDigging
      params:
        variation: 0.03
        volume: 2
  - type: CEMagicEssenceStructure
    essences:
      Weapon:
        min: 1
        max: 3
      Metal:
        min: 1
        max: 4
      Mining:
        min: 0
        max: 2

- type: entity
  parent: CEBaseWeaponShovel
  id: CEWeaponShovelIron
  name: iron shovel
  description: A sturdy iron shovel, perfect for digging and not for combat.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Shovel/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CEWood: 20
      CEIron: 10
