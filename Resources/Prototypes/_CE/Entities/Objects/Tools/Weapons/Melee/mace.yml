- type: entity
  abstract: true
  id: CEBaseWeaponMaceTwoHanded
  parent:
  - BaseItem
  - CEBaseWeaponChemical
  components:
  - type: Item
    size: Ginormous
    shape:
    - 0, 0, 4, 2 # 3x5
  - type: CEWeapon
    range: 0.84
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 20
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 20
    animations:
      Primary:
      - anim: WarAxeAttackLight
        speed: 0.6
      - anim: WarAxeAttackLight2
        speed: 0.6
      Secondary:
      - anim: WarAxeAttackHeavy1
        speed: 0.6
      - anim: WarAxeAttackHeavy2
        speed: 0.6
  - type: CEWieldedWeapon
    animations:
      Primary:
      - anim: WarAxeAttackLight
      - anim: WarAxeAttackLight2
      Secondary:
      - anim: WarAxeAttackHeavy1
      - anim: WarAxeAttackHeavy2
  - type: CEWeaponStaminaCost
    costs:
      Primary: 10
      Secondary: 10
  - type: CERotationForAnimation
    rotation: -90
  - type: Wieldable
  - type: Clothing
    slots:
    - neck
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1.5
  - type: CEMagicEssenceStructure
    essences:
      Weapon: { min: 1, max: 3 }
      Metal: { min: 1, max: 4 }
      Energia: { min: 0, max: 2 }

- type: entity
  parent: CEBaseWeaponMaceTwoHanded
  id: CEWeaponMaceTwoHandedGuardrail
  name: guardrail mace
  description: A mana-powered heavy mace used by guards. When activated, it delivers a powerful blow that knocks back targets and drains their stamina.
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Mace/guardrail.rsi
    layers:
    - state: icon
    - state: charge
      visible: false
      map: [ "charge" ]
    state: icon
  - type: CEWeapon
    effectSlots:
      OnHit:
      - !type:Damage
        damage:
          types:
            Blunt: 20
      OnHeavyHit:
      - !type:Damage
        damage:
          types:
            Blunt: 20
      OnChargedHit:
      - !type:ShootProjectile
        prototype: CEGuardMaceEnergyBall
        projectileSpeed: 10
  - type: CEToggledWeaponAnimation
    animations:
      Primary:
      - anim: CEGuardMaceChargedShot
      Secondary:
      - anim: CEGuardMaceChargedShot
  - type: Battery
    startingCharge: 100
    maxCharge: 100
  - type: ItemToggle
    onActivate: false
    onUse: false
    soundActivate:
      path: /Audio/Weapons/ebladeon.ogg
    soundDeactivate:
      path: /Audio/Weapons/ebladeoff.ogg
  - type: ToggleClothing
    action: ActionCEGuardMaceCharge
    mustEquip: false
  - type: ItemToggleRequiresCharge
    requiredCharge: 10
  - type: ComponentToggler
    components:
    - type: CEWeaponBatteryCost
      costs:
        Primary: 10
        Secondary: 10
  - type: ToggleableVisuals
    spriteLayer: charge
    inhandVisuals:
      left:
      - state: inhand-left-charge
        shader: unshaded
      right:
      - state: inhand-right-charge
        shader: unshaded
  - type: Clothing
    quickEquip: false
  - type: Appearance
  - type: StaticPrice
    price: 100

- type: entity
  parent: BaseBullet
  id: CEGuardMaceEnergyBall
  categories: [ HideSpawnMenu ]
  name: energy ball
  components:
  - type: Sprite
    noRot: true
    sprite: _CE/Objects/Tools/Weapons/Projectiles/energy_ball.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#87f3ff"
    enabled: true
    radius: 2
    energy: 3
    netsync: false
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        hard: false
        mask:
        - Opaque
        - Impassable
        - BulletImpassable
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: false
  - type: Projectile
    damage:
      types: { }
    soundHit:
      path: /Audio/_CE/Effects/energy_pulse.ogg
  - type: CEProjectile
    hitEffects:
    - !type:Damage
      damage:
        types:
          Shock: 5
    - !type:StaminaDamage
      amount: 20
    - !type:SpawnEntity
      effectTarget: Used
      spawns:
      - CEEffectEnergyBlast
    - !type:AreaEffect
      range: 1.5
      affectCaster: true
      effects:
      - !type:Damage
        damage:
          types:
            Shock: 5
      - !type:StaminaDamage
        amount: 20
      - !type:SpawnEntity
        effectTarget: Target
        spawns:
        - CEOverchargeVFX

- type: entity
  parent: BaseToggleAction
  id: ActionCEGuardMaceCharge
  name: activate energy core
  description: Toggles the guardrail mace's energy core, swapping its attack mode.
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: BigItem
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Melee/Mace/guardrail.rsi
    layers:
    - state: icon
      map: [ "enum.ActionVisuals.Icon" ]
    - state: charge
      map: [ "enum.ActionVisuals.IconToggled" ]
      visible: false

- type: entityEffectAnimation
  id: CEGuardMaceChargedShot
  movementSpeed: 0.3
  duration: 0.5
  events:
    0:
    - !type:UsedEntityAnimation
      offsetAnimation:
      - time: 0.0
        offset: 0, -0.2
        easing: QuadOut
      - time: 0.25
        offset: 0, -0.5
      - time: 0.5
        offset: 0, -0.2
        easing: QuadIn
      colorAnimation:
      - time: 0.0
        color: "#99e6ff"
      - time: 0.25
        color: "#99e6ff"
        easing: QuadOut
      - time: 0.5
        color: "#99e6ff00"
    0.25:
    - !type:PlaySound
      sound:
        path: /Audio/_CE/Effects/peacekeeper_laser.ogg
    - !type:WeaponEffectSlot
      slot: OnChargedHit

- type: entity
  id: CEEffectEnergyBlast
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CE/Objects/Tools/Weapons/Projectiles/energy_ball_blast.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#87f3ff"
    enabled: true
    radius: 5
    energy: 3
    netsync: false
  - type: LightFade
    duration: 1
  - type: TimedDespawn
    lifetime: 2.5
  - type: Tag
    tags:
      - HideContextMenu
