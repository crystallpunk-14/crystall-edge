- type: entity
  parent:
  - BaseItem
  - ItemHeftyBase
  id: CECrystalShardAir
  name: air crystal shard
  description: A fragment of an air crystal capable of floating freely in the air.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CE/Objects/Materials/shards_air.rsi
    layers:
    - state: core1
      shader: unshaded
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        core1: ""
        core2:  ""
        core3:  ""
        core4:  ""
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 8
  - type: CEZPhysics
    gravityMultiplier: 0.01
  - type: CEMagicEssenceStructure
    essences:
      Air:
        min: 2
        max: 6
      Crystal:
        min: 0
        max: 2
