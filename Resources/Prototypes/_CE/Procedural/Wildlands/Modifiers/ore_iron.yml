# Iron ore: veins and cores shaped by noise over natural walls.

- type: entity
  id: CEWildlandsModifierOreIronNoise
  parent: CEBaseWildlandsModifier
  categories: [ HideSpawnMenu ]
  components:
  - type: CEWildlandsModifier
    effects:
    - !type:GenerationLayers
      layers:
      - !type:FillEntityLayer
        entity: CEWallStoneOreIron
        mask:
        - !type:NoiseMask
          threshold: 0.4
          noise:
            seed: 512
            noiseType: OpenSimplex2
            fractalType: FBm
            frequency: 0.08
            octaves: 3
        - !type:EntityMask
          entities:
          - CEWallStone
          - CEWallDirt
          - CEWallSnow
