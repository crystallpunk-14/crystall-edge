# Reusable entity-level diet policy. Canonical ingestion remains authoritative;
# this component only narrows which otherwise digestible CE foods are selected.
- type: entity
  id: CEAnimalFodderDietBase
  abstract: true
  components:
  - type: CEAnimalDiet
    allowedFoodTags:
    - CEWheat
    - CECorn
    - CEVegetable
    forbiddenFoodTags:
    - CEMeat

# Shared biological and AI-capability base for prototype-authored livestock species.
- type: entity
  id: CEMobAnimalHusbandryBase
  abstract: true
  parent:
  - BaseSimpleMob
  - MobRespirator
  - MobAtmosStandard
  - MobBloodstream
  - MobFlammable
  - BaseMobAnimal
  categories: [ ForkFiltered ]
  components:
  - type: CEGOAPTargetBackoff
    duration: 5
    maxEntries: 32
  - type: CENPCMovement
  - type: Satiation
    satiations:
      Hunger: { prototype: NormalSatiationHunger }
      Thirst: { prototype: NormalSatiationThirst }
  - type: NpcFactionMember
    factions: [CEFarmAnimal]
  - type: CEGOAPEyesPerceptor
    visionRadius: 6
    updateInterval: 0.3
    crossZLevelVision: false
  - type: CEGOAPPainPerceptor
    retaliationDuration: 8
  - type: CEGOAPKnowledgeCache
  - type: CEGOAPHasEnemySensor
    entries:
    - conditionKey: CEAnimalThreatened
  - type: CEGOAP
    memoryDuration: 4
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-organic

# Reusable hunger plan. The source strategy owns diet/provider eligibility;
# existing GOAP systems own range sensing and movement.
- type: entity
  id: CEAnimalHungerGOAPBase
  abstract: true
  components:
  - type: CEGOAPSelectorProfiles
    profiles:
      animalFood: !type:CEGOAPSelectorConsumableProvider
        source: !type:CECompositeConsumableSource
          sources:
          - !type:CEFeedTroughConsumableSource
          - !type:CEWorldFoodConsumableSource
        range: 20
  - type: CEGOAPRangeToTargetSensor
    updateInterval: 0.2
    entries:
    - conditionKey: CEAnimalFoodSourceInRange
      range: 1
      selector: !type:CEGOAPSelectorProfile
        profile: animalFood
  - type: CEGOAP
    goals:
    - desiredState: { CEAnimalHungry: false }
      priority: 100
    actions:
    - !type:CEGOAPMoveToTargetAction
      selector: !type:CEGOAPSelectorProfile
        profile: animalFood
      range: 1
      reregisterThreshold: 1
      preconditions:
        CEAnimalHungry: true
        CEAnimalFoodSourceInRange: false
      effects: { CEAnimalFoodSourceInRange: true }
    - !type:CEGOAPConsumeAction
      retryDelay: 2
      selector: !type:CEGOAPSelectorProfile
        profile: animalFood
      preconditions:
        CEAnimalHungry: true
        CEAnimalFoodSourceInRange: true
      effects: { CEAnimalHungry: false }

# Reusable thirst plan, independently composable for species with different needs.
- type: entity
  id: CEAnimalThirstGOAPBase
  abstract: true
  components:
  - type: CEGOAPSelectorProfiles
    profiles:
      animalWater: !type:CEGOAPSelectorConsumableProvider
        source: !type:CECompositeConsumableSource
          sources:
          - !type:CEWorldDrinkConsumableSource
            conditions:
            - !type:CEReagentFractionCondition
              reagent: Water
              additionalReagents: [CEWater]
              minFraction: 0.5
          - !type:CEDrainableSolutionConsumableSource
            transferAmount: 5
            providerBlacklist:
              components:
              - ItemSlots
              - Storage
            conditions:
            - !type:CEReagentFractionCondition
              reagent: Water
              additionalReagents: [CEWater]
              minFraction: 0.5
        range: 20
  - type: CEGOAPRangeToTargetSensor
    updateInterval: 0.2
    entries:
    - conditionKey: CEAnimalWaterSourceInRange
      range: 1
      selector: !type:CEGOAPSelectorProfile
        profile: animalWater
  - type: CEGOAP
    goals:
    - desiredState: { CEAnimalThirsty: false }
      priority: 110
    actions:
    - !type:CEGOAPMoveToTargetAction
      selector: !type:CEGOAPSelectorProfile
        profile: animalWater
      range: 1
      reregisterThreshold: 1
      preconditions:
        CEAnimalThirsty: true
        CEAnimalWaterSourceInRange: false
      effects: { CEAnimalWaterSourceInRange: true }
    - !type:CEGOAPConsumeAction
      retryDelay: 2
      selector: !type:CEGOAPSelectorProfile
        profile: animalWater
      preconditions:
        CEAnimalThirsty: true
        CEAnimalWaterSourceInRange: true
      effects: { CEAnimalThirsty: false }

# Default composition for livestock that needs both food and water.
- type: entity
  id: CEAnimalNeedsGOAPBase
  abstract: true
  parent:
  - CEAnimalHungerGOAPBase
  - CEAnimalThirstGOAPBase

# Default adult idle behavior. Species may inherit only CEAnimalNeedsGOAPBase
# when they need a different exploration profile.
- type: entity
  id: CEAnimalAdultGOAPBase
  abstract: true
  parent: CEAnimalNeedsGOAPBase
  components:
  - type: CEGOAP
    goals:
    - desiredState: { CEAnimalIdle: true }
      priority: 1
    actions:
    - !type:CEGOAPExploreAction
      exploreRadius: 7
      sampleDirections: 12
      minIdleTime: 1
      maxIdleTime: 4
      preconditions: { CEAnimalIdle: false }
      effects: { CEAnimalIdle: true }

# Composable fear response; defensive species author a different threat goal.
- type: entity
  id: CEAnimalFearGOAPBase
  abstract: true
  components:
  - type: CEGOAP
    goals:
    - desiredState: { CEAnimalThreatened: false }
      priority: 1000
    actions:
    - !type:CEGOAPFleeAction
      selector: !type:CEGOAPSelectorNearestEnemy
      recalculateInterval: 1
      preconditions: { CEAnimalThreatened: true }
      effects: { CEAnimalThreatened: false }

# Child products compose standard trigger effects when incubation should run.
- type: entity
  id: CEAnimalIncubationProductBase
  abstract: true
  components:
  - type: CEAnimalIncubation
